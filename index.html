<style>:root {
  /* dark is the default theme */
  --bg: #0b1416;
  --card: #142226;
  --ink: #e7f1f0;
  --muted: #93aab0;
  --line: #234045;
  --line-soft: #1d3237;
  --soft: #18292e;
  --input-bg: #0f1e22;
  --ghost-bg: #1b3036;
  --ghost-hover: #223b42;
  --nav-bg: rgba(17, 30, 34, 0.86);
  --bar-bg: #1e3439;
  --exam-bg: #2e270f;
  --exam-line: #54481a;
  --warn-bg: linear-gradient(120deg, #2b1717, #2b1d12);
  --warn-line: #4d2622;
  --solve-bg: #0e2c3d;
  --solve-ink: #6cc4ec;
  --done-ink: #5f7d84;
  --primary: #0d9488;
  --primary-d: #0f766e;
  --primary-2: #0284c7;
  --teal-bg: #123f3a;
  --teal-ink: #4fd8c6;
  --amber-bg: #33280f;
  --amber-ink: #e8b954;
  --violet-bg: #241d3d;
  --violet-ink: #b7a3ee;
  --danger: #e06060;
  --danger-bg: #381c1c;
  --danger-ink: #f2a0a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px -14px rgba(0, 0, 0, 0.5);
  --radius: 16px;
}
[data-theme="light"] {
  --bg: #eef4f3;
  --card: #ffffff;
  --ink: #12262b;
  --muted: #5d7379;
  --line: #dce8e6;
  --line-soft: #eef3f2;
  --soft: #f6faf9;
  --input-bg: #fbfdfd;
  --ghost-bg: #eef4f3;
  --ghost-hover: #e3edeb;
  --nav-bg: rgba(255, 255, 255, 0.82);
  --bar-bg: #e4efed;
  --exam-bg: #fffaf0;
  --exam-line: #f5e3b3;
  --warn-bg: linear-gradient(120deg, #fdeeee, #fdf6f0);
  --warn-line: #f0c9c4;
  --solve-bg: #e0f2fe;
  --solve-ink: #075985;
  --done-ink: #8aa0a5;
  --teal-bg: #d7f3ee;
  --teal-ink: #0b6e62;
  --amber-bg: #fdf0d5;
  --amber-ink: #92600a;
  --violet-bg: #ece7fb;
  --violet-ink: #5b3fa8;
  --danger: #d64545;
  --danger-bg: #fdeaea;
  --danger-ink: #a52f2b;
  --shadow: 0 1px 2px rgba(13, 60, 56, 0.06), 0 10px 28px -14px rgba(13, 60, 56, 0.22);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(13, 148, 136, 0.16), transparent 60%),
    radial-gradient(900px 420px at 0% -10%, rgba(2, 132, 199, 0.10), transparent 55%),
    var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: linear-gradient(120deg, var(--primary-d), var(--primary) 55%, var(--primary-2));
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px -10px rgba(13, 60, 56, 0.5);
}
h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
h1 { display: flex; align-items: center; gap: 9px; }
.brand { width: 30px; height: 30px; flex: none; display: inline-flex; }
.brand svg { width: 100%; height: 100%; border-radius: 9px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
.hrow { display: flex; gap: 8px; align-items: center; }
#todayLbl {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#langBtn, #themeBtn, #profileBtn {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  padding: 5px 14px;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
#langBtn:hover, #themeBtn:hover, #profileBtn:hover { background: rgba(255, 255, 255, 0.28); }
#themeBtn { padding: 5px 10px; }
nav {
  display: flex;
  gap: 4px;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 6px;
}
nav button {
  flex: 1;
  padding: 9px 4px;
  border: 0;
  background: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-radius: 12px;
  transition: background 0.15s, color 0.15s;

      const acc = dayAcc[i] % 180;
      if (dayAcc[i] > 0 && (acc < 1e-6 || 180 - acc < SLOT * 60) && g[1] >= h + BREAK_M / 60) {
        g[0] += BREAK_M; g[1] -= BREAK_M / 60; dayAcc[i] = 0;
      }
      const left = dayAcc[i] % 180 < 1e-6 && dayAcc[i] > 0 ? 180 : 180 - (dayAcc[i] % 180);
      const take = Math.min(h, g[1], left / 60);
      if (take <= 1e-9) return { hours: 0, at: null };
      const at = g[0];
      dayAcc[i] += take * 60;
      // reserve the 30-minute break right after a full 3-hour stretch, when the
      // gap continues (at a gap's end the busy block or the night is the break)
      const rest = dayAcc[i] % 180 < 1e-6 && g[1] - take >= BREAK_M / 60 ? BREAK_M : 0;
      g[0] += take * 60 + rest;
      g[1] -= take + rest / 60;
      if (g[1] < SLOT - 1e-9) gaps[i].splice(best, 1);
      return { hours: take, at };
    };
    const push = (date, subjectId, lectureId, title, type, hours, startMin) => {
      const prev = sessions.find((x) => x.date === date && x.subjectId === subjectId && x.lectureId === lectureId && x.type === type &&
        (startMin == null ? x.startMin == null : x.endMin === startMin)); // merge only truly contiguous pieces
      if (prev) { prev.hours += hours; if (startMin != null) prev.endMin += hours * 60; }
      else sessions.push({ date, subjectId, lectureId, title, type, hours, startMin: startMin == null ? null : startMin, endMin: startMin == null ? null : startMin + hours * 60 });
    };

    // 1) reserve one review block on the last open day before each exam/quiz
    active.filter((s) => s.examDate && s.examDate > today)
      .sort((a, b) => a.examDate.localeCompare(b.examDate))
      .forEach((s) => {
        const want = reviewHours(s.covered);
        for (let d = addDays(s.examDate, -1); d >= today; d = addDays(d, -1)) {
          const i = idx[d];
          if (i == null || cap[i] < SLOT) continue;
          const take = Math.min(want, Math.floor(cap[i] / SLOT) * SLOT);
          if (take < SLOT) continue;
          const a = alloc(i, take);
          if (a.hours < SLOT) continue;
          push(d, s.id, null, '', 'examreview', a.hours, a.at);
          cap[i] -= a.hours;
          break;
        }
      });

    // 2) work items: lecture -> study then solving; clinic -> work; low confidence -> revision
    const items = {};
    active.forEach((s) => {
      const list = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) list.push({ t, rem: t.workH || 2, type: 'clinic', due: t.due || s.examDate || null });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) list.push({ t, rem: t.studyH, type: 'study', due: s.examDate });
          if (t.solveH > 0) list.push({ t, rem: t.solveH, type: 'solve', due: s.examDate });
        } else if (t.confidence && t.confidence <= 2) {
          list.push({ t, rem: (t.studyH || 1) * 0.5, type: 'revise', due: s.examDate });
        }
      });
      items[s.id] = list;
    });
    const remaining = (s) => items[s.id].reduce((a, i) => a + i.rem, 0);
    const deadlineOf = (s) => (s.examDate && s.examDate >= today ? s.examDate : last);
    const capBefore = (deadline, fromI) => {
      let c = 0;
      for (let i = fromI; i < days.length && days[i] < deadline; i++) c += cap[i];
      return c;
    };

    days.forEach((d, di) => {
      let slots = Math.round(Math.min(cap[di], gaps[di].reduce((a, g) => a + g[1], 0)) / SLOT);
      const todayH = {}; let lastPick = null;
      while (slots > 0) {
        const open = active.filter((s) => deadlineOf(s) > d);
        const needy = open.filter((s) => items[s.id].some((i) => i.rem > 1e-9 && (!i.due || i.due > d)));
        let pick = null, review = false, capped = false;
        if (needy.length) {
          const score = (s) => s.weight * remaining(s) / Math.max(capBefore(deadlineOf(s), di), SLOT);
          let pool = needy.filter((s) => (todayH[s.id] || 0) < MAX_PER_SUBJECT);
          if (!pool.length) { pool = needy; capped = true; } // everything hit the per-subject cap: keep filling the day
          const sticky = (s) => score(s) * (s.id === lastPick ? 1.25 : 1);
          pool.sort((a, b) => sticky(b) - sticky(a) || deadlineOf(a).localeCompare(deadlineOf(b)));
          pick = pool[0];
        } else if (open.some((s) => s.examDate && s.examDate > d)) {
          pick = open.filter((s) => s.examDate && s.examDate > d).sort((a, b) => a.examDate.localeCompare(b.examDate))[0];
          review = true; // spare time: general review of the nearest exam
        } else break;
        if (!review) {
          const it = items[pick.id].find((i) => i.rem > 1e-9 && (!i.due || i.due > d));
          // one task piece is placed contiguously; a short piece (e.g. 10 min solving) keeps its real length
          const room = Math.min(it.rem, (capped ? it.rem : MAX_PER_SUBJECT - (todayH[pick.id] || 0)), slots * SLOT);
          if (room <= 1e-9) { slots = 0; break; }
          let take = it.rem <= room + 1e-9 ? it.rem : Math.floor(room / SLOT) * SLOT;
          if (take < SLOT) take = Math.min(it.rem, room); // never drop a sub-slot piece
          const a = alloc(di, take);
          if (a.hours <= 1e-9) { slots = 0; break; } // no gap left that fits work + break
          const placed = Math.min(take, a.hours);
          it.rem -= placed;
          push(d, pick.id, it.t.id, it.t.title, it.type, placed, a.at);
          todayH[pick.id] = (todayH[pick.id] || 0) + placed;
          slots -= Math.ceil(placed / SLOT - 1e-9);
        } else {
          // spare-time review: one contiguous chunk so the day view stays readable
          const take = Math.min(slots * SLOT, 4);
          const a = alloc(di, take);
          if (a.hours < SLOT - 1e-9) { slots = 0; break; }
          push(d, pick.id, null, '', 'review', a.hours, a.at);
          slots -= Math.ceil(a.hours / SLOT - 1e-9);
        }
        lastPick = pick.id;
      }
    });

    sessions.sort((a, b) => a.date.localeCompare(b.date) || (a.startMin == null ? 1e9 : a.startMin) - (b.startMin == null ? 1e9 : b.startMin));
    const deficits = active
      .map((s) => ({ subjectId: s.id, hours: Math.max(0, +remaining(s).toFixed(2)) }))
      .filter((x) => x.hours > 1e-9);
    return { sessions, deficits };
  }

  /**
   * Smart overload warnings: for every subject whose work does not fit before its
   * deadline, name the exam date and the specific open tasks in priority order
   * (biggest remaining block first), so the student knows exactly what to start with.
   * Returns [{subjectId, name, examDate, hoursShort, openCount, tasks:[{id,title,hours,type}]}].
   */
  function warnings(state, today) {
    const r = generate(state, today);
    if (!r.deficits.length) return [];
    const byId = {};
    (state.subjects || []).map(normSubject).forEach((s) => { byId[s.id] = s; });
    return r.deficits.map((d) => {
      const s = byId[d.subjectId];
      if (!s) return null;
      const open = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) open.push({ id: t.id, title: t.title, hours: t.workH || 2, type: 'clinic' });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) open.push({ id: t.id, title: t.title, hours: t.studyH, type: 'study' });
          if (t.solveH > 0) open.push({ id: t.id, title: t.title, hours: t.solveH, type: 'solve' });
        } else if (t.confidence && t.confidence <= 2) {
          open.push({ id: t.id, title: t.title, hours: (t.studyH || 1) * 0.5, type: 'revise' });
        }
      });
      open.sort((a, b) => b.hours - a.hours);
      return {
        subjectId: s.id, name: s.name, examDate: s.examDate,
        hoursShort: d.hours, openCount: open.length, tasks: open.slice(0, 5),
      };
    }).filter(Boolean);
  }

  function progress(state, today) {
    return (state.subjects || []).map((raw) => {
      const s = normSubject(raw);
      const total = s.tasks.length;
      const done = s.tasks.filter((t) => t.done).length;
      return {
        subjectId: s.id, name: s.name, total, done,
        pct: total ? Math.round((done / total) * 100) : 0,
        daysLeft: s.examDate ? diffDays(today, s.examDate) : null,
      };
    });
  }


  /* ---------------- v6: focus mode, stats, revision planner ---------------- */

  // Pomodoro presets the student picks from: 25/5 or 50/10 minutes.
  const FOCUS_PRESETS = [
    { focusMin: 25, breakMin: 5 },
    { focusMin: 50, breakMin: 10 },
  ];

  // Remaining work on a task, in minutes (study + solving, or clinic work).
  function taskRemainingMin(task) {
    if (!task) return 0;
    if (task.kind === 'clinic') return Math.max(0, Math.round((Number(task.workH) || 0) * 60));
    return Math.max(0, Math.round(((Number(task.studyH) || 0) + (Number(task.solveH) || 0)) * 60));
  }

  // Deduct focused minutes from a task's remaining hours. Lecture tasks lose study
  // time first, then solving; clinic tasks lose work hours. Never goes below zero.
  // Returns the minutes actually deducted (can be less when the task runs out).
  function deductFromTask(task, minutes) {
    let rem = Math.max(0, Math.round(Number(minutes) || 0));
    const start = rem;
    const take = (field) => {
      if (rem <= 0) return;
      const cur = Math.max(0, Math.round((Number(task[field]) || 0) * 60));
      const use = Math.min(cur, rem);
      task[field] = Math.round((cur - use) * 10) / 600; // back to hours, minute precision
      rem -= use;
    };
    if (task && task.kind === 'clinic') take('workH');
    else if (task) { take('studyH'); take('solveH'); }
    return start - rem;
  }

  // Aggregate the focus log for the My Day stats card.
  // log: [{date:'YYYY-MM-DD', minutes:N}] -> today/week totals + a 7-day series.
  function focusStats(log, today) {
    const days = [];
    for (let i = 6; i >= 0; i--) days.push({ date: addDays(today, -i), minutes: 0 });
    const idx = {};
    days.forEach((d, i) => { idx[d.date] = i; });
    let todayMin = 0, weekMin = 0, sessions = 0;
    (log || []).forEach((e) => {
      const m = Math.max(0, Math.round(Number(e && e.minutes) || 0));
      if (!m || !e || typeof e.date !== 'string') return;
      sessions++;
      if (idx[e.date] != null) { days[idx[e.date]].minutes += m; weekMin += m; }
      if (e.date === today) todayMin += m;
    });
    return { todayMin, weekMin, days, sessions };
  }

  // The nearest upcoming exam/quiz (date + time), or null.
  function nextExam(state, today) {
    let best = null;
    (state.subjects || []).forEach((raw) => {
      const ex = raw && raw.exam && raw.exam.date ? raw.exam : null;
      if (!ex || ex.date < today) return;
      if (!best || ex.date < best.date || (ex.date === best.date && String(ex.time || '99') < String(best.time || '99'))) {
        best = { subjectId: raw.id, name: raw.name, kind: ex.kind, date: ex.date, time: ex.time || '', nature: ex.nature || 'theory' };
      }
    });
    return best;
  }

  // Countdown parts to a target timestamp. past=true once it has passed.
  function countdownParts(targetMs, nowMs) {
    let d = Math.max(0, Math.floor((targetMs - nowMs) / 1000));
    const past = targetMs <= nowMs;
    const days = Math.floor(d / 86400); d -= days * 86400;
    const hours = Math.floor(d / 3600); d -= hours * 3600;
    const minutes = Math.floor(d / 60); d -= minutes * 60;
    return { days, hours, minutes, seconds: d, past };
  }

  // Revision planner: one entry per upcoming exam with the remaining work
  // (open tasks + low-confidence re-revision + the pre-exam review block), the
  // days with free capacity before it, the needed daily pace and feasibility.
  function revisionPlan(state, today) {
    return (state.subjects || []).map(normSubject)
      .filter((s) => s.examDate && s.examDate >= today)
      .map((s) => {
        const items = [];
        s.tasks.forEach((t) => {
          if (t.kind === 'clinic') {
            if (!t.done) items.push({ id: t.id, title: t.title, hours: t.workH || 2, type: 'clinic' });
            return;
          }
          if (!t.done) {
            if (t.studyH > 0) items.push({ id: t.id, title: t.title, hours: t.studyH, type: 'study' });
            if (t.solveH > 0) items.push({ id: t.id, title: t.title, hours: t.solveH, type: 'solve' });
          } else if (t.confidence && t.confidence <= 2) {
            items.push({ id: t.id, title: t.title, hours: (t.studyH || 1) * 0.5, type: 'revise' });
          }
        });
        items.sort((a, b) => b.hours - a.hours);
        const reviewH = reviewHours(s.covered);
        const hoursNeeded = Math.round((items.reduce((a, i) => a + i.hours, 0) + reviewH) * 2) / 2;
        let cap = 0, daysAvail = 0;
        for (let d = today; d < s.examDate; d = addDays(d, 1)) {
          const c = capacityOn(state, d);
          if (c > 1e-9) daysAvail++;
          cap += c;
        }
        return {
          subjectId: s.id, name: s.name, examDate: s.examDate,
          daysLeft: diffDays(today, s.examDate),
          items, reviewH, hoursNeeded, daysAvail,
          perDay: daysAvail ? Math.round((hoursNeeded / daysAvail) * 2) / 2 : hoursNeeded,
          feasible: hoursNeeded <= cap + 1e-9,
        };
      })
      .sort((a, b) => a.examDate.localeCompare(b.examDate));
  }

  return {
    generate, progress, warnings, addDays, weekday, diffDays, capacityOn,
    estimate, estimateDifficulty, reviewHours, normSubject, SLOT,
    STUDY_H, SOLVE_H, CLINIC_H,
    hmToMin, fmtMin, normBlock, busyOn, freeWindowsOn, gapsOn, overlapOn, blockClashes,
    sleepBlock, blocksForWd, SLEEP_MIN, SLEEP_DEFAULT,
    BREAK_M, DAY_MIN,
    FOCUS_PRESETS, taskRemainingMin, deductFromTask, focusStats, nextExam,
    countdownParts, revisionPlan,
  };
});

  const PALETTE = ['#0d9488', '#7c3aed', '#ea580c', '#0284c7', '#db2777', '#65a30d', '#d97706', '#dc2626'];
  const colorOf = (id) => {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const $ = (id) => document.getElementById(id);

  const empty = () => ({
    version: 3, lang: 'ar',
    profile: { name: '', year: null, onboarded: false },
    busy: {},        // weekly busy blocks per weekday 0..6: [{id,label,kind,start,end}]
    busyOnce: {},    // one-date busy blocks: {date: [{id,label,kind,start,end}]}
    sleep: {},       // fixed 6h sleep start per weekday 0..6 ('HH:MM'); missing = default
    blocked: [],     // dates switched fully off (day off): no study is planned
    subjects: [], savedAt: 0,
    focusLog: [],    // [{id, taskId, subjectId, date:'YYYY-MM-DD', minutes, at}]
    theme: 'dark',   // 'dark' (default) or 'light'
    pace: { study: 60, solve: 20 }, // v13: the student's own minutes per lecture study / per question set
    motivIdx: -1, motivDate: '', // v13: which encouragement line showed, and on which day
    batchSync: { lastSync: 0, total: 0, added: 0, updated: 0, removed: 0, unmatched: 0, error: '' }, // lectures-N.csv read status
  });

  function migrate(old) {
    const st = empty();
    st.lang = old.lang === 'en' ? 'en' : 'ar';
    st.overrides = old.overrides || {};
    st.blocked = old.blocked || [];
    st.subjects = (old.subjects || []).map((s) => ({
      id: s.id || uid(), name: s.name || '?',

  // Official curriculum entries for the student's year that are not added yet.
  const curForYear = () => (yearNum() >= 1 && yearNum() <= 5 ? Curriculum.subjectsForYear(yearNum()) : []);
  const curMissing = () => curForYear().filter((c) => !state.subjects.some((s) => (s.code && s.code === c.code) || Curriculum.find(s.name, s.code) === c));
  const curName = (c) => (state.lang === 'en' ? c.en : c.ar);

  function addFromCur(code) {
    const c = curForYear().find((x) => x.code === code);
    if (!c || state.subjects.some((s) => s.code === code)) return;
    state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    save(); render();
  }

  function loadCur() {
    curMissing().forEach((c) => {
      state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    });
    save(); render();
  }

  // Estimated topic suggestions for a subject: topics not already among its tasks.
  function topicSugg(sj) {
    const tps = Curriculum.topicsFor(sj.name, sj.code);
    return tps.map((tp, i) => Object.assign({ _i: i }, tp))
      .filter((tp) => !sj.tasks.some((t) => {
        const n = Curriculum.norm(t.title);
        return n === Curriculum.norm(tp.ar) || n === Curriculum.norm(tp.en);
      }));
  }

  const dayLabel = (d, today) => {
    const diff = Scheduler.diffDays(today, d);
    return (diff === 0 ? L().today : diff === 1 ? L().tomorrow : L().days[Scheduler.weekday(d)]) + ' ' + d.slice(5).replace('-', '/');
  };

  function toast(msg) {
    let el = $('toast');
    el.textContent = msg; el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2200);
  }

  const sessionTag = (s) =>
    s.type === 'solve' ? `<span class="tag solve">${esc(L().tagSolve)}</span>`
    : s.type === 'revise' ? `<span class="tag revise">${esc(L().tagRevise)}</span>`
    : s.type === 'review' ? `<span class="tag review">${esc(L().tagReview)}</span>`
    : s.type === 'examreview' ? `<span class="tag review">${esc(L().tagExamReview)}</span>`
    : s.type === 'clinic' ? `<span class="tag clinic">${esc(L().tagClinic)}</span>` : '';

  function sessionRow(s, sj) {
    const title = s.type === 'review' ? L().generalReview : s.type === 'examreview' ? L().examReviewTitle : s.title;
    const doneable = s.lectureId && (s.type === 'study' || s.type === 'solve' || s.type === 'clinic');
    const time = s.startMin != null ? `<span class="muted hrs" dir="ltr">${fmtClockRange(s.startMin, s.endMin)}</span>` : '';
    return `<div class="sess subjline" style="border-inline-start-color:${colorOfS(sj)}"><span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span><div class="grow"><b>${esc(sj.name)}</b> - ${esc(title)} ${sessionTag(s)}</div>${time}<span class="muted hrs">${fmtHTxt(s.hours)}</span>` +
      (doneable ? `<button class="btn ghost" data-act="done" data-s="${sj.id}" data-l="${s.lectureId}">${esc(L().doneBtn)}</button>` : '') + '</div>';
  }

  function busyRow(b) {
    return `<div class="sess busyrow"><span class="sicon" style="background:#64748b22">${KIND_ICON[b.kind] || KIND_ICON.other}</span><div class="grow muted">${esc(b.label || L().kindWord[b.kind] || '')}</div><span class="muted hrs" dir="ltr">${fmtClockRange(b.s, b.e)}</span></div>`;
  }

  /* ---------------- views ---------------- */

  const cdText = (targetMs) => {
    const c = Scheduler.countdownParts(targetMs, Date.now());
    return c.past ? L().cdNow : L().cdText(c.days, c.hours, c.minutes);
  };

  function warnCards(today) {
    let h = '';
    Scheduler.warnings(state, today).forEach((w) => {
      const head = w.examDate && w.examDate >= today
        ? L().warnExam(w.name, w.examDate, Scheduler.diffDays(today, w.examDate), fmtHTxt(w.hoursShort))
        : L().warnNoDate(w.name, fmtHTxt(w.hoursShort));
      h += `<div class="card warn"><div>${esc(head)}</div><ol class="warnlist">` +
        w.tasks.slice(0, 3).map((t, i) => `<li>${esc(L().warnTask(i + 1, t.title, fmtHTxt(t.hours)))}</li>`).join('') +
        (w.openCount > 3 ? `<li class="muted">${esc(L().warnMore(w.openCount - 3))}</li>` : '') + '</ol></div>';
    });
    return h;
  }

  function examRowFor(s, ex, today) {
    return `<div class="sess examrow"><div class="grow">📝 <b>${esc(s.name)}</b> - ${esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature))}</div></div>`;
  }

  function viewDay() {
    const today = todayStr();
    const now = new Date();
    const name = (state.profile.name || '').trim().split(/\s+/)[0];
    // morning greeting from 5 AM to noon, evening greeting the rest of the day
    const greet = (now.getHours() >= 5 && now.getHours() < 12 ? L().greetingAm : L().greetingPm)(name);
    // v13: a random encouragement line each day (not a fixed rotation)
    const motivLines = L().motiv || [];
    if (motivLines.length && state.motivDate !== today) {
      let i = Math.floor(Math.random() * motivLines.length);
      if (motivLines.length > 1 && i === state.motivIdx) i = (i + 1) % motivLines.length;
      state.motivDate = today; state.motivIdx = i; save();
    }
    const motiv = motivLines.length && state.motivIdx >= 0 ? motivLines[state.motivIdx % motivLines.length] : '';
    let h = `<div class="hero"><div class="grow"><b class="hero-title">${esc(greet)}</b>` +
      (motiv ? `<div><span class="motiv">${esc(motiv)}</span></div>` : '') +
      `<div class="muted" style="margin-top:6px">${esc(L().myDaySub)}</div></div></div>`;
    if (!state.subjects.length) {
      h += `<div class="card empty"><div class="big">🦷</div><p>${esc(L().noPlan)}</p></div>`;
      if (curMissing().length) h += `<div class="card"><button class="btn" data-act="loadCur" style="width:100%">${esc(L().loadCurBtn)}</button></div>`;
      return h;
    }
    h += warnCards(today);

    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const stats = Scheduler.focusStats(state.focusLog, today);
    const plannedMin = Math.round(r.sessions.filter((x) => x.date === today).reduce((a, x) => a + x.hours, 0) * 60);
    const doneTasksMin = Math.round(state.subjects.reduce((a, s) => a + s.tasks.reduce((a2, t) =>
      a2 + (t.done && t.doneAt === today ? (t.kind === 'clinic' ? (t.workH || 0) : (t.studyH || 0) + (t.solveH || 0)) : 0), 0), 0) * 60);
    const doneMin = stats.todayMin + doneTasksMin;
    const pct = plannedMin > 0 ? Math.min(100, Math.round(doneMin / plannedMin * 100)) : (doneMin > 0 ? 100 : 0);
    // stats row: three simple mini cards (progress %, studied today, this week)
    h += `<div class="statrow">
      <div class="statcard"><div class="sc-label">${esc(L().statTodayShort)}</div><div class="sc-num">${pct}%</div><div class="bar slim"><i style="width:${pct}%"></i></div></div>
      <div class="statcard"><div class="sc-label">${esc(L().statStudiedShort)}</div><div class="sc-num">${esc(fmtDur(doneMin))}</div><div class="sc-sub muted">${plannedMin > 0 ? esc(L().planOf(fmtDur(plannedMin))) : ''}</div></div>
      <div class="statcard"><div class="sc-label">${esc(L().statWeekShort)}</div><div class="sc-num">${esc(fmtDur(stats.weekMin))}</div><div class="sc-sub muted">${esc(L().statSessions(stats.sessions))}</div></div>
    </div>`;
    if ((state.blocked || []).includes(today)) h += `<div class="card offday">${esc(L().dayOffToday)}</div>`;

    // dark focus card with the start button (like the reference's focus card, simplified)
    h += `<div class="card focuscard"><div class="row"><div class="grow"><div class="fc-title">\uD83C\uDFAF ${esc(L().focusCardTitle)}</div><div class="fc-sub">${esc(L().focusCardSub)}</div></div>
      <button class="btn fcbtn" data-act="focusOpen">${esc(L().startStudying)}</button></div></div>`;

    // today's schedule: commitments and study sessions in one chronological timeline
    const items = [];
    blocksForDate(today).forEach((b) => items.push({ m: b.s, html: busyRow(b) }));
    r.sessions.filter((x) => x.date === today).forEach((x) => {
      const sj = subj(x.subjectId);
      if (sj) items.push({ m: x.startMin == null ? 1e9 : x.startMin, html: sessionRow(x, sj) });
    });
    items.sort((a, b) => a.m - b.m);
    h += `<div class="day today">${esc(L().todaySchedule)}</div><div class="card">`;
    if (!items.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().emptyToday)}</div>`;
    items.forEach((it) => { h += it.html; });
    h += '</div>';

    // v14: tasks finished today stay visible with a check and can be un-done
    const doneToday = [];
    state.subjects.forEach((s) => s.tasks.forEach((t) => { if (t.done && t.doneAt === today) doneToday.push({ s, t }); }));
    if (doneToday.length) {
      h += `<div class="day">${esc(L().doneTodayTitle)}</div><div class="card">`;
      doneToday.forEach(({ s, t }) => {
        h += `<div class="lec done"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
          <span class="t grow">✔ ${esc(t.title)}<br><span class="muted">${esc(s.name)} · ${esc(L().diff[t.difficulty - 1] || '')}</span></span>
          <button class="btn ghost sm" data-act="undone" data-s="${s.id}" data-l="${t.id}">${esc(L().undoBtn)}</button></div>`;
      });
      h += '</div>';
    }

    // required tasks
    const open = [];
    state.subjects.forEach((s) => s.tasks.forEach((t) => { if (!t.done) open.push({ s, t, rem: Scheduler.taskRemainingMin(t) }); }));
    open.sort((a, b) => {
      const ea = examOf(a.s), eb = examOf(b.s);
      const da = a.t.due || (ea && ea.date) || '9999', db = b.t.due || (eb && eb.date) || '9999';
      return da.localeCompare(db) || b.rem - a.rem;
    });
    h += `<div class="day">${esc(L().requiredTasks)}</div><div class="card">`;
    if (!open.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noOpenTasks)}</div>`;
    open.slice(0, 6).forEach(({ s, t, rem }) => {
      h += `<div class="lec"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
        <span class="t grow">${esc(t.title)}<br><span class="muted">${esc(s.name)} · ${fmtDur(rem)}</span></span>
        <button class="btn ghost sm" data-act="focusTask" data-s="${s.id}" data-l="${t.id}" title="${esc(L().focusTitle)}">▶</button></div>`;
    });
    h += '</div>';

    // deadlines & exams
    h += `<div class="day">${esc(L().deadlinesTitle)}</div><div class="card">`;
    const dl = [];
    state.subjects.forEach((s) => {
      const ex = examOf(s);
      if (ex && ex.date >= today) dl.push({ d: ex.date, html: `<div class="sess"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span><div class="grow"><b>${esc(s.name)}</b> - ${esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature))}</div><span class="tag">${esc(L().daysLeft(Scheduler.diffDays(today, ex.date)))}</span></div>` });
    });
    state.subjects.forEach((s) => s.tasks.forEach((t) => {
      if (!t.done && t.due && t.due >= today) dl.push({ d: t.due, html: `<div class="sess"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span><div class="grow">${esc(t.title)} <span class="muted">${esc(s.name)}</span></div><span class="tag clinic">${esc(L().dueOn(t.due.slice(5).replace('-', '/')))}</span></div>` });
    }));
    dl.sort((a, b) => a.d.localeCompare(b.d));
    if (!dl.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noDeadlines)}</div>`;
    dl.slice(0, 5).forEach((x) => { h += x.html; });
    h += '</div>';

    // study stats
    const max = Math.max(1, ...stats.days.map((d) => d.minutes));
    h += `<div class="day">${esc(L().statsTitle)}</div><div class="card"><div class="stats7">` +
      stats.days.map((d) => `<div class="stcol${d.date === today ? ' now' : ''}"><span class="stmin">${d.minutes || ''}</span><div class="stbar"><i style="height:${Math.round(d.minutes / max * 100)}%"></i></div><span class="std">${esc(L().daysShort[Scheduler.weekday(d.date)])}</span></div>`).join('') +
      `</div><div class="row" style="margin-top:10px"><span class="tag">${esc(L().statToday(fmtDur(stats.todayMin)))}</span><span class="tag">${esc(L().statWeek(fmtDur(stats.weekMin)))}</span><span class="tag">${esc(L().statSessions(stats.sessions))}</span></div></div>`;
    return h;
  }

  function viewSchedule() {
    const today = todayStr();
    if (!state.subjects.length) return `<div class="card empty"><div class="big">🦷</div><p>${esc(L().noPlan)}</p></div>`;
    const now = new Date();
    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const byDay = {};
    r.sessions.forEach((s) => (byDay[s.date] = byDay[s.date] || []).push(s));
    const examsByDay = {};
    state.subjects.forEach((s) => { const ex = examOf(s); if (ex) examsByDay[ex.date] = { subject: s, exam: ex }; });
    let h = '';
    const end = Scheduler.addDays(today, 14);
    for (let d = today; d < end; d = Scheduler.addDays(d, 1)) {
      const sess = byDay[d] || [];
      const tot = sess.reduce((a, s) => a + s.hours, 0);
      const off = (state.blocked || []).includes(d);
      h += `<div class="day ${d === today ? 'today' : ''}">${dayLabel(d, today)}${tot ? ` <span class="tag free">${fmtHTxt(tot)}</span>` : ''}${off ? ` <span class="tag revise">${esc(L().dayOffTag)}</span>` : ''}</div><div class="card">`;
      const items = [];
      if (examsByDay[d]) {
        const e = examsByDay[d];
        const tm = Scheduler.hmToMin(e.exam.time);
        items.push({ m: tm == null ? 0 : tm, html: examRowFor(e.subject, e.exam, today) });
      }
      blocksForDate(d).forEach((b) => items.push({ m: b.s, html: busyRow(b) }));
      sess.forEach((s2) => { const sj = subj(s2.subjectId); if (sj) items.push({ m: s2.startMin == null ? 1e9 : s2.startMin, html: sessionRow(s2, sj) }); });
      items.sort((a, b) => a.m - b.m);
      if (!items.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noSessDay)}</div>`;
      items.forEach((it) => { h += it.html; });
      h += '</div>';
    }
    return h;
  }

  function viewExams() {
    const today = todayStr();
    const ups = state.subjects.filter((s) => examOf(s) && s.exam.date >= today).sort((a, b) => a.exam.date.localeCompare(b.exam.date));
    const nx = Scheduler.nextExam(state, today);
    let h = '';
    if (!ups.length) h += `<div class="card empty"><div class="big">📝</div><p>${esc(L().noExamsCenter)}</p></div>`;
    if (nx) {
      const target = new Date(nx.date + 'T' + (Scheduler.hmToMin(nx.time) != null ? nx.time : '09:00') + ':00').getTime();
      const sj = subj(nx.subjectId);
      const col = sj ? colorOfS(sj) : 'var(--primary)';
      h += `<div class="card pcard" style="border-inline-start-color:${col}"><div class="muted">${esc(L().nextExamTitle)}</div>
        <div class="row" style="margin-top:6px"><span class="sicon" style="background:${col}22">${sj ? iconOf(sj) : '📝'}</span>
        <b class="grow">${esc(nx.name)}</b><span class="muted">${esc(L().examLine(nx.kind, nx.date, fmtClock(nx.time), L().natureWord[nx.nature] || nx.nature))}</span></div>
        <div class="cdnum" data-cd="${target}" dir="auto">${esc(cdText(target))}</div></div>`;
    }
    if (ups.length) {
      h += `<div class="day">${esc(L().examTableTitle)}</div>`;
      ups.forEach((s) => {
      const ex = s.exam, dleft = Scheduler.diffDays(today, ex.date);
      h += `<div class="card pcard" style="border-inline-start-color:${colorOfS(s)}"><div class="row"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
        <div class="grow"><b>${esc(s.name)}</b><div class="muted">${esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature))}${ex.covered ? ' · ' + esc(L().coveredShort(ex.covered)) : ''}</div></div>
        <span class="tag">${esc(L().daysLeft(dleft))}</span></div></div>`;
      });
    }
    return h;
  }

  function examForm(s, prefix) {
    const ex = examOf(s) || { kind: 'exam', date: '', time: '', nature: 'theory', covered: (s.tasks || []).filter((t) => t.kind === 'lecture').length };
    return `<div class="examform">
      <div class="row"><select id="${prefix}Kind">
        <option value="exam" ${ex.kind === 'exam' ? 'selected' : ''}>${esc(L().kindExam)}</option>
        <option value="quiz" ${ex.kind === 'quiz' ? 'selected' : ''}>${esc(L().kindQuiz)}</option></select>
      <select id="${prefix}Nature">
        <option value="theory" ${ex.nature === 'theory' ? 'selected' : ''}>${esc(L().natureTheory)}</option>
        <option value="practical" ${ex.nature === 'practical' ? 'selected' : ''}>${esc(L().naturePractical)}</option></select>
      <input id="${prefix}Cov" type="number" min="1" max="60" placeholder="${esc(L().coveredPh)}" value="${ex.covered || ''}" style="width:110px"></div>
      <div class="row" style="margin-top:8px"><input id="${prefix}Date" type="date" value="${esc(ex.date || '')}" class="grow">${tpHTML(prefix + 'Time', ex.time, true)}
      <button class="btn" data-act="saveExam" data-s="${s.id}">${esc(L().saveBtn)}</button></div></div>`;
  }

  function viewSubjects() {
    let h = '';
    const missing = curMissing();

    if (curForYear().length) {
      h += `<div class="card"><b>${esc(L().curTitle)}</b><div class="muted" style="margin-top:4px">${esc(L().curSub)}</div>`;
      if (!missing.length) h += `<div class="muted" style="margin-top:8px">${esc(L().curAllAdded)}</div>`;
      missing.forEach((c) => {
        h += `<div class="row" style="margin-top:8px"><span class="sicon" style="background:${colorOf(c.code)}22">${c.icon || '📖'}</span>
          <span class="grow"><b>${esc(curName(c))}</b> <span class="muted">${esc(L().diff[c.diff - 1])} · ${esc(L().estBadge)}</span></span>
          <button class="btn sm" data-act="addCur" data-code="${esc(c.code)}">${esc(L().addCurBtn)}</button></div>`;
      });
      if (missing.length > 1) h += `<div style="margin-top:10px"><button class="btn ghost" data-act="loadCur">${esc(L().loadCurBtn)}</button></div>`;
      h += '</div>';
    }

    // v14: subjects show as big square cards side by side; a tap opens the full panel below
    h += `<div class="subjgrid">`;
    state.subjects.forEach((s) => {
      const ex = examOf(s);
      const doneN = s.tasks.filter((t) => t.done).length;
      const pctS = s.tasks.length ? Math.round(doneN / s.tasks.length * 100) : 0;
      h += `<div class="subjcard${openSubject === s.id ? ' on' : ''}" data-act="toggle" data-s="${s.id}">
        <span class="sicon big" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
        <b class="subjname">${esc(s.name)}</b>
        <div class="muted sml">${ex ? esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature)) : esc(L().noExamYet)}</div>
        ${s.tasks.length ? `<div class="bar" style="margin:8px 0 4px"><i style="width:${pctS}%"></i></div><div class="muted sml">${esc(L().taskCount(doneN, s.tasks.length, pctS))}</div>` : ''}
      </div>`;
    });
    h += '</div>';

    const sd = state.subjects.find((x) => x.id === openSubject);
    if (sd) {
      const s = sd;
      const exOpen = openExam === s.id, ex = examOf(s);
      h += `<div class="card pcard bigsub" style="border-inline-start-color:${colorOfS(s)}">
        <div class="row subj-head">
          <span class="sicon big" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
          <div class="grow"><b class="subjname">${esc(s.name)}</b>
            <div class="muted">${ex ? esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature)) + (ex.covered ? ' \u00b7 ' + esc(L().coveredShort(ex.covered)) : '') : esc(L().noExamYet)}${ex && ex.src === 'batch' ? ' \u00b7 ' + esc(L().batchFromTag) : ''}</div></div>
          <button class="btn ghost sm" data-act="delSubject" data-s="${s.id}" title="${esc(L().delBtn)}">\u2715</button>
        </div>
        <div class="row subj-actions">
          <button class="btn ghost grow${exOpen ? ' on' : ''}" data-act="toggleExam" data-s="${s.id}">\uD83D\uDCC5 ${exOpen ? esc(L().closeBtn) : ex ? esc(L().editExam) : esc(L().addExamBtn)}</button>
        </div>`;
      if (exOpen) {
        h += examForm(s, 'e-' + s.id + '-');
        if (ex) h += `<button class="btn ghost" data-act="clearExam" data-s="${s.id}" style="margin-top:6px">${esc(L().clearExam)}</button>`;
      }
      {
        const k = taskKind[s.id] || 'lecture';
        h += `<div class="addtask"><b>${esc(L().addTaskTitle)}</b>
          <div class="pick" style="margin:8px 0">
            <button class="${k === 'lecture' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="lecture">📖 ${esc(L().kindLecture)}</button>
            ${clinicAllowed()
              ? `<button class="${k === 'clinic' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="clinic">🦷 ${esc(L().kindClinic)}</button>`
              : `<button disabled title="${esc(L().clinicLocked)}">🔒 ${esc(L().kindClinic)}</button>`}
          </div>
          ${clinicAllowed() ? '' : `<div class="muted" style="margin-bottom:6px">${esc(L().clinicLocked)}</div>`}
          <input id="tt-${s.id}" placeholder="${esc(L().taskTitlePh)}" data-est="${s.id}">
          <div class="row" style="margin-top:8px">
            <span id="est-${s.id}" class="estchip"></span>
            <select id="td-${s.id}" data-act="tdiff" data-s="${s.id}"><option value="0">${esc(L().estAuto)}</option>

  // v14: progress dashboard - every number comes from data the app really has
  // (tasks done + focus log); nothing here is estimated or faked.
  function dashHTML() {
    if (!state.subjects.length) return '';
    const today = todayStr();
    // minutes per day = focus sessions + hours of tasks finished that day
    const perDay = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDay[f.date] = (perDay[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s) => s.tasks.forEach((t) => {
      if (t.done && t.doneAt) perDay[t.doneAt] = (perDay[t.doneAt] || 0) + Math.round(((t.studyH || 0) + (t.solveH || 0) + (t.workH || 0)) * 60);
    }));
    const last7 = [];
    for (let i = 6; i >= 0; i--) { const d = Scheduler.addDays(today, -i); last7.push({ d, m: perDay[d] || 0 }); }
    const weekMin = last7.reduce((a, x) => a + x.m, 0);
    // planned minutes for the same 7 days, from the generated schedule
    const now = new Date();
    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const in7 = {};
    last7.forEach((x) => { in7[x.d] = 1; });
    const planMin = Math.round(r.sessions.filter((x) => in7[x.date]).reduce((a, x) => a + x.hours, 0) * 60);
    const weekPct = planMin > 0 ? Math.min(100, Math.round(weekMin / planMin * 100)) : (weekMin > 0 ? 100 : 0);
    // readiness: share of all tasks done, and days to the nearest exam
    const totT = state.subjects.reduce((a, s) => a + s.tasks.length, 0);
    const doneT = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done).length, 0);
    const readyPct = totT ? Math.round(doneT / totT * 100) : 0;
    const nx = Scheduler.nextExam(state, today);
    // streak: consecutive studied days, not breaking on a still-young today
    let streak = 0;
    for (let d = today; ; d = Scheduler.addDays(d, -1)) {
      if (perDay[d]) streak++;
      else if (d === today) continue;
      else break;
    }
    const lecDone = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done && t.kind === 'lecture').length, 0);
    const focusMin = (state.focusLog || []).reduce((a, f) => a + (f.minutes || 0), 0);
    // ring geometry
    const RR = 26, CC = 2 * Math.PI * RR;
    const ringOff = (CC * (1 - readyPct / 100)).toFixed(1);
    // last-7-days area chart
    const W = 300, H = 84, maxM = Math.max(30, ...last7.map((x) => x.m));
    const pts = last7.map((x, i) => [Math.round(i * (W / 6)), Math.round(H - 8 - (x.m / maxM) * (H - 20))]);
    const line = pts.map((p) => p.join(',')).join(' ');
    const area = `0,${H} ` + line + ` ${W},${H}`;
    // heatmap: last 12 weeks x 7 weekdays
    const todayW = Scheduler.weekday(today);
    let heat = '';
    for (let col = 11; col >= 0; col--) {
      heat += '<div class="hcol">';
      for (let row = 0; row < 7; row++) {
        const d = Scheduler.addDays(today, -(col * 7 + (todayW - row)));
        const future = d > today;
        const m = future ? -1 : (perDay[d] || 0);
        const lv = m < 0 ? 'hx' : m === 0 ? 'h0' : m < 30 ? 'h1' : m < 90 ? 'h2' : 'h3';
        heat += `<i class="hcell ${lv}" title="${d}"></i>`;
      }
      heat += '</div>';
    }
    let h = `<div class="day">${esc(L().dashTitle)}</div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashWeek)}</div>
      <div class="row" style="margin-top:6px;align-items:baseline"><b style="font-size:22px">${weekPct}%</b>
      <span class="muted grow" dir="auto">${esc(fmtDur(weekMin))}${planMin ? ' / ' + esc(fmtDur(planMin)) + ' ' + esc(L().dashPlan) : ''}</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${weekPct}%"></i></div></div>`;
    h += `<div class="dashrow">
      <div class="card dashcard"><div class="muted">${esc(L().dashReady)}</div>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${RR}" class="ringbg"/><circle cx="32" cy="32" r="${RR}" class="ringfg" style="stroke-dasharray:${CC.toFixed(1)};stroke-dashoffset:${ringOff}"/><text x="32" y="37" text-anchor="middle" class="ringtxt">${readyPct}%</text></svg>
        <div class="muted sml" style="text-align:center">${doneT}/${totT} ${esc(L().dashTasksDone)}${nx ? ' · ' + esc(L().daysLeft(Scheduler.diffDays(today, nx.date))) : ' · ' + esc(L().dashNoExam)}</div></div>
      <div class="card dashcard"><div class="tile"><div class="tnum">${lecDone}</div><div class="muted sml">${esc(L().dashDoneLec)}</div></div>
        <div class="tile"><div class="tnum">${focusMin}</div><div class="muted sml">${esc(L().dashFocusMin)}</div></div>
        <div class="tile"><div class="tnum">${streak}</div><div class="muted sml">${esc(L().dashStreak)}</div></div></div>
    </div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashLast7)}</div>
      <svg class="area" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon class="areafill" points="${area}"/><polyline class="arealine" points="${line}"/>${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" class="areadot"/>`).join('')}</svg>
      <div class="row" style="justify-content:space-between">${last7.map((x) => `<span class="muted sml">${esc(L().daysShort[Scheduler.weekday(x.d)])}</span>`).join('')}</div></div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashHeat)}</div>
      <div class="heat" dir="ltr">${heat}</div>
      <div class="row" style="justify-content:flex-end;gap:4px;align-items:center;margin-top:6px"><span class="muted sml">${esc(L().dashLess)}</span><i class="hcell h0"></i><i class="hcell h1"></i><i class="hcell h2"></i><i class="hcell h3"></i><span class="muted sml">${esc(L().dashMore)}</span></div></div>`;
    return h;
  }

  /* ---------------- focus mode (pomodoro) ---------------- */

  function logFocus(sid, tid, minutes) {
    const t = taskOf(sid, tid);
    if (t) {
      Scheduler.deductFromTask(t, minutes);
      if (Scheduler.taskRemainingMin(t) <= 0) setTimeout(() => toast(L().focusTaskDone), 2400);
    }
    (state.focusLog = state.focusLog || []).push({ id: uid(), taskId: tid, subjectId: sid, date: todayStr(), minutes, at: Date.now() });
    save();
    toast(L().focusLogged(minutes));
  }

  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      beepCtx = beepCtx || new AC();
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.connect(g); g.connect(beepCtx.destination);
      o.frequency.value = 880; g.gain.value = 0.07;
      o.start(); o.stop(beepCtx.currentTime + 0.35);
    } catch (e) {}
  }

  const mmss = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

  function updateFocusText() {
    const el = $('focusTimer');
    if (el && focusRun) {
      const remain = focusRun.paused ? focusRun.remainMs : (focusRun.endsAt ? focusRun.endsAt - Date.now() : 0);
      el.textContent = focusRun.phase === 'ready' ? '✓' : mmss(remain);
    }
  }

  function tick() {
    const now = Date.now();
    // keep the header clock fresh and roll the app over to the new day at midnight
    const clk = $('clockLbl');
    if (clk) { const c = clockNow(); if (clk.textContent !== c) clk.textContent = c; }
    if (todayStr() !== lastTickDay) { lastTickDay = todayStr(); render(); return; }
    if (focusRun && !focusRun.paused && (focusRun.phase === 'focus' || focusRun.phase === 'break') && focusRun.endsAt && now >= focusRun.endsAt) {
      const p = Scheduler.FOCUS_PRESETS[focusRun.preset];
      if (focusRun.phase === 'focus') {
        logFocus(focusRun.subjectId, focusRun.taskId, p.focusMin);
        focusRun.cycles = (focusRun.cycles || 0) + 1;
        focusRun.phase = 'break';
        focusRun.endsAt = now + p.breakMin * 60000;
        beep();
      } else {
        focusRun.phase = 'ready';
        focusRun.endsAt = 0;
        beep();
      }
      persistFocus();
      render();
    } else {
      if (focusRun) updateFocusText();
      document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = cdText(+el.dataset.cd); });
    }
  }

        <div class="yeargrid">`;
      L().years.forEach((y, i) => {
        const locked = OPEN_YEARS.indexOf(i + 1) === -1;
        h += `<button class="ypick ${state.profile.year === i + 1 ? 'on' : ''}${locked ? ' locked' : ''}" data-act="pickYear" data-y="${i + 1}"${locked ? ' disabled' : ''}>${locked ? '🔒 ' : ''}${esc(y)}</button>`;
      });
      h += `</div>${OPEN_YEARS.length < L().years.length ? `<div class="muted" style="margin-top:6px">${esc(L().yearLockNote)}</div>` : ''}<div class="muted" style="margin-top:10px">${esc(L().uniLbl)}: <b>${esc(UNI[state.lang === 'en' ? 'en' : 'ar'])}</b></div>
        <div style="margin-top:12px"><button class="btn" data-act="onboardStart" style="width:100%">${esc(L().startBtn)}</button></div></div></div>`;
      return h;
    }
    if (focusRun) {
      const t = taskOf(focusRun.subjectId, focusRun.taskId);
      const sj = subj(focusRun.subjectId);
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>
        <div class="muted" style="margin-top:4px">${sj ? esc(sj.name) + (t ? ' - ' : '') : ''}${t ? esc(t.title) : ''}</div>
        <div class="fphase"><span class="tag" id="focusPhase">${esc(focusRun.phase === 'focus' ? L().focusPhaseFocus : focusRun.phase === 'break' ? L().focusPhaseBreak : L().focusPhaseReady)}</span>
        <span class="muted">${esc(L().focusCycles(focusRun.cycles || 0))}</span></div>
        <div class="ftimer" id="focusTimer" dir="ltr">--:--</div>
        <div class="row" style="margin-top:12px">`;
      if (focusRun.phase === 'ready') h += `<button class="btn grow" data-act="focusNext">${esc(L().focusNext)}</button>`;
      else if (focusRun.paused) h += `<button class="btn grow" data-act="focusResume">${esc(L().focusResume)}</button>`;
      else h += `<button class="btn ghost grow" data-act="focusPause">${esc(L().focusPause)}</button>`;
      h += `<button class="btn danger" data-act="focusStop">${esc(L().focusStop)}</button></div></div></div>`;
    } else if (focusOpen) {
      const open = [];
      state.subjects.forEach((sj) => sj.tasks.forEach((t) => { if (!t.done) open.push({ sj, t, rem: Scheduler.taskRemainingMin(t) }); }));
      open.sort((a, b) => {
        const ea = examOf(a.sj), eb = examOf(b.sj);
        const da = a.t.due || (ea && ea.date) || '9999', db = b.t.due || (eb && eb.date) || '9999';
        return da.localeCompare(db) || b.rem - a.rem;
      });
      if (open.length && !(focusSel && taskOf(focusSel.s, focusSel.l) && !taskOf(focusSel.s, focusSel.l).done)) focusSel = { s: open[0].sj.id, l: open[0].t.id };
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>`;
      if (!open.length) {
        h += `<p class="muted">${esc(L().focusNoTasks)}</p><div style="margin-top:12px"><button class="btn ghost" data-act="focusClose" style="width:100%">${esc(L().focusCancel)}</button></div>`;
      } else {
        h += `<div class="muted" style="margin:8px 0 6px">${esc(L().focusPickTask)}</div><div class="ftasks">` +
          open.slice(0, 8).map(({ sj, t, rem }) => `<button class="ftask ${focusSel && focusSel.l === t.id ? 'on' : ''}" data-act="pickFTask" data-s="${sj.id}" data-l="${t.id}">
            <span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span>
            <span class="grow"><b>${esc(t.title)}</b><br><span class="muted">${esc(sj.name)} · ${fmtDur(rem)}</span></span></button>`).join('') + '</div>';
        h += `<div class="muted" style="margin:10px 0 6px">${esc(L().focusPickPreset)}</div><div class="pick">` +
          Scheduler.FOCUS_PRESETS.map((pr, i) => `<button class="${focusPreset === i ? 'on' : ''}" data-act="pickFPreset" data-i="${i}">🍅 ${esc(L().presetLabel(pr.focusMin, pr.breakMin))}</button>`).join('') + '</div>';
        h += `<div class="row" style="margin-top:12px"><button class="btn grow" data-act="focusBegin">${esc(L().focusBegin)}</button>
          <button class="btn ghost" data-act="focusClose">${esc(L().focusCancel)}</button></div>`;
      }
      h += '</div></div>';
    }
    return h;
  }

  /* ---------------- chrome / render ---------------- */

  function applyChrome() {
    const l = L();
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'ar';
    document.documentElement.dir = l.dir;
    document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : '';
    $('appTitle').textContent = l.appTitle;
    $('langBtn').textContent = l.langBtn;
    $('themeBtn').textContent = state.theme === 'light' ? '☾' : '☀';
    document.querySelectorAll('#tabs button').forEach((b) => { b.textContent = l.tabs[b.dataset.tab]; });
  }

  function render() {
    if (focusRun && !taskOf(focusRun.subjectId, focusRun.taskId)) { focusRun = null; persistFocus(); }
    applyChrome();
    const nowD = new Date();
    const hd = state.lang === 'en'
      ? L().days[nowD.getDay()] + ', ' + L().months[nowD.getMonth()] + ' ' + nowD.getDate()
      : L().days[nowD.getDay()] + '\u060c ' + nowD.getDate() + ' ' + L().months[nowD.getMonth()];
    $('todayLbl').innerHTML = `<span>${esc(hd)}</span> \u00b7 <span id="clockLbl" dir="ltr">${esc(clockNow())}</span>`;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    $('view').innerHTML = { day: viewDay, schedule: viewSchedule, exams: viewExams, subjects: viewSubjects, profile: viewProfile }[tab]() + footerHtml();
    $('overlays').innerHTML = overlays();
    if (focusRun) updateFocusText();
  }

  // v16: every tab ends with the unofficial-site note; the suggestions button
  // shows only once FEEDBACK_URL is filled in.
  function footerHtml() {
    const link = FEEDBACK_URL ? ` <a class="btn ghost sm" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">${esc(L().footSuggest)}</a>` : '';
    return `<div class="foot"><div class="muted">${esc(L().footNote)}</div>${link}</div>`;
  }

  function estChipText(sid) {
    const title = ($('tt-' + sid) || {}).value || '';
    const k = taskKind[sid] || 'lecture';
    if (!title.trim()) return '';
    const sel = $('td-' + sid);
    const d = sel && +sel.value ? +sel.value : Scheduler.estimateDifficulty(title);
    if (k === 'clinic') return L().estClinic(L().diff[d - 1], fmtHTxt(Scheduler.CLINIC_H[d - 1]));
    return L().estLec(L().diff[d - 1], fmtHTxt(paceStudyH(d)), L().fmtM(Math.round(paceSolveH(d) * 60)));
  }

  /* ---------------- events ---------------- */

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.est) { const el = $('est-' + t.dataset.est); if (el) el.textContent = estChipText(t.dataset.est); }
  });

  document.addEventListener('change', (e) => {
    const t = e.target, a = t.dataset && t.dataset.act;
    const mSl = /^sl(\d)(H|M)$/.exec(t.id || '');
    if (mSl) { commitSleep(+mSl[1]); return; }
    if (!a) return;
    if (a === 'check') { const x = taskOf(t.dataset.s, t.dataset.l); x.done = t.checked; if (t.checked) x.doneAt = todayStr(); else { x.confidence = 0; delete x.doneAt; } }
    else if (a === 'conf') taskOf(t.dataset.s, t.dataset.l).confidence = +t.value;
    else if (a === 'tdiff') { /* difficulty select re-renders chip */ const el = $('est-' + t.dataset.s); if (el) el.textContent = estChipText(t.dataset.s); return; }
    else return;
    save(); render();
  });

  document.addEventListener('click', (e) => {
    const apb = e.target.closest('.apseg button');
    if (apb) {
      apb.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === apb));
      const mAp = /^sl(\d)AP$/.exec(apb.parentElement.id || '');
      if (mAp) commitSleep(+mAp[1]);
      return;
    }
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    const a = t.dataset.act, s = t.dataset.s, l = t.dataset.l;

    if (a === 'lang') { state.lang = state.lang === 'en' ? 'ar' : 'en'; save(); return render(); }
    if (a === 'theme') { state.theme = state.theme === 'light' ? 'dark' : 'light'; save(); return render(); }
    if (a === 'openProfile') { prevTab = tab === 'profile' ? prevTab : tab; tab = 'profile'; return render(); }
    if (a === 'backFromProfile') { tab = prevTab || 'day'; return render(); }
    if (a === 'focusOpen') { focusOpen = true; return render(); }
    if (a === 'focusTask') { focusSel = { s, l }; focusOpen = true; return render(); }
    if (a === 'focusClose') { focusOpen = false; return render(); }
    if (a === 'pickFTask') { focusSel = { s, l }; return render(); }
    if (a === 'pickFPreset') { focusPreset = +t.dataset.i || 0; return render(); }
    if (a === 'focusBegin') {
      if (!focusSel || !taskOf(focusSel.s, focusSel.l)) return render();
      focusRun = { subjectId: focusSel.s, taskId: focusSel.l, preset: focusPreset, phase: 'focus', endsAt: Date.now() + Scheduler.FOCUS_PRESETS[focusPreset].focusMin * 60000, remainMs: 0, paused: false, cycles: 0 };
      focusOpen = false; persistFocus(); beep(); return render();
    }
    if (a === 'focusNext') {
      if (!focusRun) return render();
      focusRun.phase = 'focus'; focusRun.endsAt = Date.now() + Scheduler.FOCUS_PRESETS[focusRun.preset].focusMin * 60000; focusRun.paused = false;
      persistFocus(); return render();
    }
    if (a === 'focusPause') { if (focusRun && !focusRun.paused) { focusRun.remainMs = Math.max(0, focusRun.endsAt - Date.now()); focusRun.paused = true; persistFocus(); } return render(); }
    if (a === 'focusResume') { if (focusRun && focusRun.paused) { focusRun.endsAt = Date.now() + focusRun.remainMs; focusRun.paused = false; persistFocus(); } return render(); }
    if (a === 'focusStop') {
      if (focusRun && focusRun.phase === 'focus') {
        const remain = focusRun.paused ? focusRun.remainMs : Math.max(0, focusRun.endsAt - Date.now());
        const elapsed = Math.floor((Scheduler.FOCUS_PRESETS[focusRun.preset].focusMin * 60000 - remain) / 60000);
        if (elapsed >= 1) logFocus(focusRun.subjectId, focusRun.taskId, elapsed);
      }
      focusRun = null; focusOpen = false; persistFocus(); return render();
    }
    if (a === 'addCur') { addFromCur(t.dataset.code); return; }
    if (a === 'loadCur') { loadCur(); return; }
    if (a === 'toggleDay') { timeDay = timeDay === +t.dataset.i ? null : +t.dataset.i; return render(); }
    if (a === 'addBlock') {
      const i = +t.dataset.i;
      const kind = $('bk').value, label = $('bl').value.trim();
      const s = tpRead('bs'), e = tpRead('be');
      if (s == null || e == null || s === e) return alert(L().errTime);
      const sm = Scheduler.hmToMin(s), em = Scheduler.hmToMin(e);
      // stage the block: it only counts after "Save day"
      const clashList = Scheduler.blocksForWd(state, i).concat(draftBusy[i] || []);
      if (Scheduler.blockClashes(clashList, sm, em)) return alert(L().errOverlap);
      (draftBusy[i] = draftBusy[i] || []).push({ id: uid(), label, kind, start: s, end: e });
      return render();
    }
    if (a === 'delDraft') { const i = +t.dataset.i; (draftBusy[i] || []).splice(+t.dataset.d, 1); return render(); }
    if (a === 'saveDay') {
      const i = +t.dataset.i;
      if ((draftBusy[i] || []).length) {
        state.busy[i] = (state.busy[i] || []).concat(draftBusy[i]);
        draftBusy[i] = [];
        save(); toast(L().savedOk);
      }
      return render();
    }
    if (a === 'addOff') { const d = $('offDate').value; if (!d) return; if (!(state.blocked || []).includes(d)) { state.blocked.push(d); save(); } return render(); }
    if (a === 'delOff') { state.blocked = (state.blocked || []).filter((d) => d !== t.dataset.d); save(); return render(); }
    if (a === 'delBlock') { const i = +t.dataset.i; state.busy[i] = (state.busy[i] || []).filter((b) => b.id !== t.dataset.b); save(); return render(); }
    if (a === 'addBusyOnce') {
      const d = $('o1Date').value, label = $('o1Label').value.trim();
      const s = tpRead('o1s'), e = tpRead('o1e');
      if (!d) return;
      const sm = Scheduler.hmToMin(s), em = Scheduler.hmToMin(e);
      if (sm == null || em == null || sm === em) return alert(L().errTime);
      if (Scheduler.blockClashes(state.busyOnce[d], sm, em)) return alert(L().errOverlap);
      (state.busyOnce[d] = state.busyOnce[d] || []).push({ id: uid(), label, kind: 'other', start: s, end: e });
      save(); return render();
    }
    if (a === 'delBusyOnce') { const d = t.dataset.d; state.busyOnce[d] = (state.busyOnce[d] || []).filter((b) => b.id !== t.dataset.b); if (!state.busyOnce[d].length) delete state.busyOnce[d]; save(); return render(); }
    if (a === 'addTopic') {
      const sj = subj(s);
      if (!sj) return;
      const tp = Curriculum.topicsFor(sj.name, sj.code)[+t.dataset.i];
      if (!tp) return;
      const task = mkTask(state.lang === 'en' ? tp.en : tp.ar, 'lecture', tp.d, 'est');
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'pickYear') {
      if (OPEN_YEARS.indexOf(+t.dataset.y) === -1) return render(); // locked year
      const nEl = $('oName') || $('pName');
      if (nEl) state.profile.name = nEl.value.trim(); // re-render wipes the input
      state.profile.year = +t.dataset.y; save(); return render();
    }
    if (a === 'onboardStart') {
      const name = ($('oName') || {}).value || '';
      if (!name.trim() || !state.profile.year) return alert(L().needProfile);
      state.profile.name = name.trim();
      onboardStep = 2; timeDay = null;
      save(); return render();
    }
    if (a === 'paceStudy') { state.pace.study = +t.dataset.v; save(); return render(); }
    if (a === 'paceSolve') { state.pace.solve = +t.dataset.v; save(); return render(); }
    if (a === 'paceDone') { onboardStep = 3; return render(); }
    if (a === 'onboardDaysDone') {
      // commit any staged blocks, then finish: official year subjects load themselves
      Object.keys(draftBusy).forEach((i) => { if (draftBusy[i].length) state.busy[i] = (state.busy[i] || []).concat(draftBusy[i]); });
      draftBusy = {};
      state.profile.onboarded = true;
      if (!state.subjects.length) {
        curMissing().forEach((c) => {
          state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
        });
      }
      save(); render();
      return syncLecturesFile(false); // pull the year's lectures file right away
    }
    if (a === 'saveProfile') {
      state.profile.name = ($('pName').value || '').trim();
      state.profile.onboarded = true;
      save(); toast(L().savedOk); return render();
    }
    if (a === 'authLogin') return doAuth('in');
    if (a === 'authSignup') return doAuth('up');
    if (a === 'authSkip') { authSkipped = true; return render(); }
    if (a === 'showAuth') { authSkipped = false; return render(); }
    if (a === 'logout') return doLogout();
    if (a === 'batchSync') return syncLecturesFile(true);

    if (a === 'toggle') { openSubject = openSubject === s ? null : s; return render(); }
    if (a === 'toggleExam') { openExam = openExam === s ? null : s; return render(); }
    if (a === 'delSubject') { if (!confirm(L().delConfirm)) return; state.subjects = state.subjects.filter((x) => x.id !== s); save(); return render(); }
    if (a === 'saveExam') {
      const p = 'e-' + s + '-';
      const date = $(p + 'Date').value;
      if (!date) return alert(L().needExam);
      const time = tpRead(p + 'Time', true) || '';
      if (examInPast(date, time)) return alert(L().examPastErr);
      subj(s).exam = { kind: $(p + 'Kind').value, date, time, nature: $(p + 'Nature').value, covered: +$(p + 'Cov').value || 0, src: '' };
      save(); return render();
    }
    if (a === 'clearExam') { subj(s).exam = null; save(); return render(); }
    if (a === 'pickKind') { taskKind[s] = t.dataset.k; return render(); }
    if (a === 'addTask') {
      const sj = subj(s), title = $('tt-' + s).value.trim();
      if (!title) return alert(L().needTask);
      const k = taskKind[s] || 'lecture';
      const d = +$('td-' + s).value || 0;
      const task = mkTask(title, k, d || null);
      if (k === 'clinic') task.due = ($('tdue-' + s) || {}).value || null;
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'delTask') { const sj = subj(s); sj.tasks = sj.tasks.filter((x) => x.id !== l); save(); return render(); }
    if (a === 'done') { const x = taskOf(s, l); if (x) { x.done = true; x.doneAt = todayStr(); } save(); return render(); }
    if (a === 'undone') { const x = taskOf(s, l); if (x) { x.done = false; delete x.doneAt; delete x.confidence; } save(); return render(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && session && Date.now() - lastPull > 30000) loadCloud().then(render);
    if (!document.hidden && canSyncLectures() && Date.now() - (state.batchSync.lastSync || 0) > 30 * 60000) syncLecturesFile(false);
  });

  window.__planner = { get state() { return state; }, loadCur, render, tick, get focusRun() { return focusRun; }, get session() { return session; }, batchIdle: () => batchPromise || Promise.resolve() };
  render();
  initCloud();
  if (canSyncLectures()) syncLecturesFile(false);
  setInterval(tick, 500);
})();
</script>
</body>
</html>
