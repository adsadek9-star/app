<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental Exam Planner</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f7fb;color:#1c2733}
header{background:#0b6e8a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}nav{display:flex;background:#fff;border-bottom:1px solid #d9e2ec;position:sticky;top:0}
nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:#0b6e8a;color:#0b6e8a;font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
input,select,textarea{font:inherit;padding:8px;border:1px solid #c5d0dc;border-radius:6px;max-width:100%}
textarea{width:100%;min-height:70px}button.btn{background:#0b6e8a;color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost{background:#e8eef4;color:#1c2733}button.danger{background:#c0392b}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#e1f0f5;color:#0b6e8a}
.tag.revise{background:#fff1d6;color:#8a5a00}.tag.review{background:#ece6f7;color:#5b3f9b}
.warn{background:#fdecea;border:1px solid #e6a7a0;color:#8c2a20}.muted{color:#6b7a89;font-size:13px}
.bar{height:10px;background:#e3eaf1;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#2e9e6b}
.day{font-weight:700;margin:14px 0 6px}.today{color:#0b6e8a}
.sess{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #eef2f6}.sess:first-of-type{border-top:0}
.lec{display:flex;gap:6px;align-items:center;padding:4px 0}.lec.done span.t{text-decoration:line-through;color:#8795a3}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
</style>
</head>
<body>
<header><h1>🦷 Dental Exam Planner</h1><div id="todayLbl"></div></header>
<nav id="tabs">
  <button data-tab="schedule" class="on">الجدول</button>
  <button data-tab="subjects">المواد</button>
  <button data-tab="time">الوقت المتاح</button>
  <button data-tab="progress">التقدم</button>
</nav>
<main id="view"></main>
<script>(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Scheduler = factory();
})(this, function () {
  const SLOT = 0.5;          // scheduling granularity in hours
  const MAX_PER_SUBJECT = 3; // max hours of one subject per day while others still need time

  const parse = (d) => { const [y, m, x] = d.split('-').map(Number); return Date.UTC(y, m - 1, x); };
  const fmt = (ms) => new Date(ms).toISOString().slice(0, 10);
  const addDays = (d, n) => fmt(parse(d) + n * 864e5);
  const weekday = (d) => new Date(parse(d)).getUTCDay(); // 0 = Sunday
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);

  // Remaining work (hours) for one lecture. Done lectures with low confidence need a half-length revision.
  function lectureWork(l) {
    const h = Number(l.hours) || 1;
    if (!l.done) return { hours: h, type: 'study' };
    if (l.confidence && l.confidence <= 2) return { hours: h * 0.5, type: 'revise' };
    return { hours: 0, type: 'none' };
  }

  function capacityOn(state, d) {
    if ((state.blocked || []).includes(d)) return 0;
    if (state.overrides && state.overrides[d] != null) return Math.max(0, Number(state.overrides[d]));
    return Math.max(0, Number((state.availability || [])[weekday(d)]) || 0);
  }

  /**
   * state: { subjects:[{id,name,examDate,weight,lectures:[{id,title,hours,done,confidence}]}],
   *          availability:[7 numbers Sun..Sat], overrides:{date:hours}, blocked:[dates] }
   * returns { sessions:[{date,subjectId,lectureId,title,type,hours}], deficits:[{subjectId,hours}] }
   */
  function generate(state, today) {
    const subjects = (state.subjects || []).filter((s) => s.examDate && s.examDate >= today);
    if (!subjects.length) return { sessions: [], deficits: [] };
    const last = subjects.reduce((m, s) => (s.examDate > m ? s.examDate : m), today);
    const days = [];
    for (let d = today; d < last; d = addDays(d, 1)) days.push(d);
    const cap = days.map((d) => capacityOn(state, d));

    const items = {}; // subjectId -> work items
    subjects.forEach((s) => {
      items[s.id] = [];
      const lecs = s.lectures || [];
      lecs.forEach((l) => { const w = lectureWork(l); if (w.type === 'study') items[s.id].push({ l, rem: w.hours, type: 'study' }); });
      lecs.forEach((l) => { const w = lectureWork(l); if (w.type === 'revise') items[s.id].push({ l, rem: w.hours, type: 'revise' }); });
    });
    const remaining = (s) => items[s.id].reduce((a, i) => a + i.rem, 0);
    const examIdx = (s) => days.indexOf(s.examDate) >= 0 ? days.indexOf(s.examDate) : days.length;

    const sessions = [];
    days.forEach((d, di) => {
      let slots = Math.round(cap[di] / SLOT);
      const today_h = {}; let lastPick = null;
      while (slots > 0) {
        const open = subjects.filter((s) => s.examDate > d);
        const needy = open.filter((s) => remaining(s) > 1e-9);
        let pick = null, review = false;
        if (needy.length) {
          const score = (s) => {
            let c = slots * SLOT; // capacity left today
            for (let i = di + 1; i < Math.min(examIdx(s), days.length); i++) c += cap[i];
            return (Number(s.weight) || 2) * remaining(s) / Math.max(c, SLOT);
          };
          let pool = needy.filter((s) => (today_h[s.id] || 0) < MAX_PER_SUBJECT);
          if (!pool.length) pool = needy;
          const sticky = (s) => score(s) * (s.id === lastPick ? 1.25 : 1); // keep working on the same subject to avoid hopping
          pool.sort((a, b) => sticky(b) - sticky(a) || a.examDate.localeCompare(b.examDate));
          pick = pool[0];
        } else if (open.length) {
          open.sort((a, b) => a.examDate.localeCompare(b.examDate));
          pick = open[0]; review = true; // all work done: spend spare time on general review of the nearest exam
        } else break;
        let lectureId = null, title = 'مراجعة عامة', type = 'review';
        if (!review) {
          const it = items[pick.id].find((i) => i.rem > 1e-9);
          it.rem -= SLOT; lectureId = it.l.id; title = it.l.title; type = it.type;
        }
        const prev = sessions.find((x) => x.date === d && x.subjectId === pick.id && x.lectureId === lectureId && x.type === type);
        if (prev) prev.hours += SLOT;
        else sessions.push({ date: d, subjectId: pick.id, lectureId, title, type, hours: SLOT });
        lastPick = pick.id;
        today_h[pick.id] = (today_h[pick.id] || 0) + SLOT;
        slots--;
      }
    });
    const deficits = subjects.map((s) => ({ subjectId: s.id, hours: Math.max(0, +remaining(s).toFixed(2)) })).filter((x) => x.hours > 1e-9);
    return { sessions, deficits };
  }

  function progress(state, today) {
    return (state.subjects || []).map((s) => {
      const lecs = s.lectures || [];
      const done = lecs.filter((l) => l.done).length;
      return { subjectId: s.id, name: s.name, total: lecs.length, done,
        pct: lecs.length ? Math.round((done / lecs.length) * 100) : 0,
        daysLeft: s.examDate ? diffDays(today, s.examDate) : null };
    });
  }

  return { generate, progress, addDays, weekday, diffDays, capacityOn, SLOT };
});

(function () {
  const KEY = 'dental-exam-planner.v1';
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const empty = () => ({ subjects: [], availability: [2, 2, 2, 2, 2, 2, 2], overrides: {}, blocked: [] });
  let state; try { state = JSON.parse(localStorage.getItem(KEY)) || empty(); } catch (e) { state = empty(); }
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let tab = 'schedule', openSubject = null;

  function seed() {
    const mk = (name, examDate, weight, n) => ({ id: uid(), name, examDate, weight, lectures: Array.from({ length: n }, (_, i) => ({ id: uid(), title: 'Lecture ' + (i + 1), hours: 1.5, done: false, confidence: 0 })) });
    state.subjects = [mk('Oral Histology', '2027-01-09', 2, 8), mk('Pharmacology', '2027-01-10', 3, 12), mk('Biomaterials', '2027-01-11', 2, 8),
      mk('Microbiology', '2027-01-13', 2, 10), mk('Entrepreneurship', '2027-01-17', 1, 6), mk('Pathology', '2027-01-18', 2, 10), mk('Medicine', '2027-01-20', 3, 12)];
    state.availability = [2, 2, 4, 5, 2.5, 3.5, 1]; // Sun..Sat
    save(); render();
  }

  const subj = (id) => state.subjects.find((s) => s.id === id);
  const fmtH = (h) => (h % 1 ? h.toFixed(1) : h) + ' س';
  const dayLabel = (d, today) => {
    const diff = Scheduler.diffDays(today, d);
    return (diff === 0 ? 'النهارده' : diff === 1 ? 'بكرة' : DAYS[Scheduler.weekday(d)]) + ' ' + d.slice(5).replace('-', '/');
  };

  function viewSchedule() {
    const today = todayStr();
    document.getElementById('todayLbl').textContent = today;
    if (!state.subjects.length) return '<div class="card">لسه مفيش مواد. روح تاب "المواد" وضيف مادة، أو حمّل مثال امتحانات يناير.<br><br><button class="btn" data-act="seed">حمّل مثال يناير</button></div>';
    const r = Scheduler.generate(state, today);
    let h = '';
    r.deficits.forEach((d) => { h += `<div class="card warn">⚠️ ${esc(subj(d.subjectId).name)}: ناقصك ${fmtH(d.hours)} قبل الامتحان. زوّد الوقت المتاح أو شيل محاضرات.</div>`; });
    const byDay = {}; r.sessions.forEach((s) => (byDay[s.date] = byDay[s.date] || []).push(s));
    const dates = Object.keys(byDay).sort().slice(0, 14);
    if (!dates.length) h += '<div class="card">مفيش جلسات مذاكرة. اتأكد من الوقت المتاح ومن إن تواريخ الامتحانات لسه جاية.</div>';
    dates.forEach((d) => {
      const tot = byDay[d].reduce((a, s) => a + s.hours, 0);
      h += `<div class="day ${d === today ? 'today' : ''}">${dayLabel(d, today)} <span class="muted">(${fmtH(tot)})</span></div><div class="card">`;
      byDay[d].forEach((s) => {
        const sj = subj(s.subjectId);
        const tag = s.type === 'revise' ? '<span class="tag revise">مراجعة تانية</span>' : s.type === 'review' ? '<span class="tag review">مراجعة</span>' : '';
        h += `<div class="sess"><div class="grow"><b>${esc(sj.name)}</b> - ${esc(s.title)} ${tag}</div><span class="muted">${fmtH(s.hours)}</span>` +
          (s.lectureId && s.type === 'study' ? `<button class="btn ghost" data-act="done" data-s="${sj.id}" data-l="${s.lectureId}">خلصت</button>` : '') + '</div>';
      });
      h += '</div>';
    });
    if (Object.keys(byDay).length > 14) h += '<div class="muted">بيظهر أول 14 يوم بس. الباقي بيتحدث مع تقدمك.</div>';
    return h;
  }

  function viewSubjects() {
    let h = `<div class="card"><b>إضافة مادة</b><div class="row" style="margin-top:8px">
      <input id="nName" placeholder="اسم المادة" class="grow"><input id="nDate" type="date">
      <select id="nW"><option value="1">سهلة</option><option value="2" selected>عادية</option><option value="3">صعبة</option></select></div>
      <textarea id="nLecs" placeholder="المحاضرات، واحدة في كل سطر (اختياري). ممكن تكتب الساعات بعد علامة | مثل: Lecture 1 | 2"></textarea>
      <button class="btn" data-act="addSubject">إضافة</button> <button class="btn ghost" data-act="seed">مثال يناير</button></div>`;
    state.subjects.forEach((s) => {
      const open = openSubject === s.id;
      h += `<div class="card"><div class="row"><b class="grow">${esc(s.name)}</b><span class="muted">${esc(s.examDate)}</span>
        <button class="btn ghost" data-act="toggle" data-s="${s.id}">${open ? 'اقفل' : 'المحاضرات (' + s.lectures.length + ')'}</button>
        <button class="btn danger" data-act="delSubject" data-s="${s.id}">حذف</button></div>`;
      if (open) {
        s.lectures.forEach((l) => {
          h += `<div class="lec ${l.done ? 'done' : ''}"><input type="checkbox" data-act="check" data-s="${s.id}" data-l="${l.id}" ${l.done ? 'checked' : ''}>
            <span class="t grow">${esc(l.title)} <span class="muted">${l.hours} س</span></span>
            ${l.done ? `<select data-act="conf" data-s="${s.id}" data-l="${l.id}"><option value="0">ثقتي؟</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${l.confidence === n ? 'selected' : ''}>${n}/5</option>`).join('')}</select>` : ''}
            <button class="btn ghost" data-act="delLec" data-s="${s.id}" data-l="${l.id}">x</button></div>`;
        });
        h += `<div class="row"><input id="al-${s.id}" placeholder="محاضرة جديدة" class="grow"><input id="ah-${s.id}" type="number" step="0.5" min="0.5" value="1" style="width:70px"><button class="btn" data-act="addLec" data-s="${s.id}">+</button></div>`;
      }
      h += '</div>';
    });
    return h;
  }

  function viewTime() {
    let h = '<div class="card"><b>ساعات المذاكرة المتاحة في كل يوم</b><div class="grid7" style="margin-top:8px">';
    DAYS.forEach((n, i) => { h += `<label>${n}<br><input type="number" min="0" max="16" step="0.5" style="width:90px" data-act="avail" data-i="${i}" value="${state.availability[i]}"></label>`; });
    h += '</div></div><div class="card"><b>يوم مختلف أو مقفول</b><div class="row" style="margin-top:8px"><input id="oDate" type="date"><input id="oHours" type="number" min="0" step="0.5" placeholder="ساعات (0 = مقفول)" style="width:150px"><button class="btn" data-act="addOverride">حفظ</button></div>';
    const ov = Object.keys(state.overrides).sort();
    ov.forEach((d) => { h += `<div class="row" style="margin-top:6px"><span class="grow">${d}: ${fmtH(state.overrides[d])}</span><button class="btn ghost" data-act="delOverride" data-d="${d}">x</button></div>`; });
    return h + '</div>';
  }

  function viewProgress() {
    const today = todayStr();
    if (!state.subjects.length) return '<div class="card">ضيف مواد الأول.</div>';
    return Scheduler.progress(state, today).sort((a, b) => (a.daysLeft ?? 9e9) - (b.daysLeft ?? 9e9)).map((p) =>
      `<div class="card"><div class="row"><b class="grow">${esc(p.name)}</b><span class="muted">${p.daysLeft < 0 ? 'الامتحان عدّى' : 'فاضل ' + p.daysLeft + ' يوم'}</span></div>
      <div class="bar"><i style="width:${p.pct}%"></i></div><div class="muted">${p.done}/${p.total} محاضرة (${p.pct}%)</div></div>`).join('');
  }

  function render() {
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    document.getElementById('view').innerHTML = { schedule: viewSchedule, subjects: viewSubjects, time: viewTime, progress: viewProgress }[tab]();
  }

  const lecOf = (sid, lid) => subj(sid).lectures.find((l) => l.id === lid);
  const $ = (id) => document.getElementById(id);
  function parseLecs(text) {
    return text.split('\n').map((x) => x.trim()).filter(Boolean).map((line) => {
      const [t, h] = line.split('|'); const hrs = parseFloat(h);
      return { id: uid(), title: t.trim(), hours: hrs > 0 ? hrs : 1, done: false, confidence: 0 };
    });
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    const a = t.dataset.act, s = t.dataset.s, l = t.dataset.l;
    if (a === 'seed') { if (!state.subjects.length || confirm('ده هيستبدل المواد الحالية. تكمل؟')) seed(); return; }
    if (a === 'addSubject') {
      const name = $('nName').value.trim(), date = $('nDate').value;
      if (!name || !date) return alert('اكتب اسم المادة وتاريخ الامتحان');
      state.subjects.push({ id: uid(), name, examDate: date, weight: +$('nW').value, lectures: parseLecs($('nLecs').value) });
    } else if (a === 'toggle') openSubject = openSubject === s ? null : s;
    else if (a === 'delSubject') { if (!confirm('تحذف المادة؟')) return; state.subjects = state.subjects.filter((x) => x.id !== s); }
    else if (a === 'done') { const x = lecOf(s, l); x.done = true; }
    else if (a === 'delLec') subj(s).lectures = subj(s).lectures.filter((x) => x.id !== l);
    else if (a === 'addLec') { const n = $('al-' + s).value.trim(); if (!n) return; subj(s).lectures.push({ id: uid(), title: n, hours: parseFloat($('ah-' + s).value) || 1, done: false, confidence: 0 }); }
    else if (a === 'addOverride') { const d = $('oDate').value, hv = $('oHours').value; if (!d || hv === '') return; state.overrides[d] = Math.max(0, +hv); }
    else if (a === 'delOverride') delete state.overrides[t.dataset.d];
    else return;
    save(); render();
  });
  document.addEventListener('change', (e) => {
    const t = e.target, a = t.dataset.act; if (!a) return;
    if (a === 'check') { const x = lecOf(t.dataset.s, t.dataset.l); x.done = t.checked; if (!t.checked) x.confidence = 0; }
    else if (a === 'conf') lecOf(t.dataset.s, t.dataset.l).confidence = +t.value;
    else if (a === 'avail') { const v = parseFloat(t.value); state.availability[+t.dataset.i] = v >= 0 ? v : 0; }
    else return;
    save(); render();
  });
  window.__planner = { get state() { return state; }, seed, render };
  render();
})();
</script>
</body>
</html>
