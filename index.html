<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dental Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root {
  /* dark is the default theme */
  --bg: #0b1416;
  --card: #142226;
  --ink: #e7f1f0;
  --muted: #93aab0;
  --line: #234045;
  --line-soft: #1d3237;
  --soft: #18292e;
  --input-bg: #0f1e22;
  --ghost-bg: #1b3036;
  --ghost-hover: #223b42;
  --nav-bg: rgba(17, 30, 34, 0.86);
  --bar-bg: #1e3439;
  --exam-bg: #2e270f;
  --exam-line: #54481a;
  --warn-bg: linear-gradient(120deg, #2b1717, #2b1d12);
  --warn-line: #4d2622;
  --solve-bg: #0e2c3d;
  --solve-ink: #6cc4ec;
  --done-ink: #5f7d84;
  --primary: #0d9488;
  --primary-d: #0f766e;
  --primary-2: #0284c7;
  --teal-bg: #123f3a;
  --teal-ink: #4fd8c6;
  --amber-bg: #33280f;
  --amber-ink: #e8b954;
  --violet-bg: #241d3d;
  --violet-ink: #b7a3ee;
  --danger: #e06060;
  --danger-bg: #381c1c;
  --danger-ink: #f2a0a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px -14px rgba(0, 0, 0, 0.5);
  --radius: 16px;
}
[data-theme="light"] {
  --bg: #eef4f3;
  --card: #ffffff;
  --ink: #12262b;
  --muted: #5d7379;
  --line: #dce8e6;
  --line-soft: #eef3f2;
  --soft: #f6faf9;
  --input-bg: #fbfdfd;
  --ghost-bg: #eef4f3;
  --ghost-hover: #e3edeb;
  --nav-bg: rgba(255, 255, 255, 0.82);
  --bar-bg: #e4efed;
  --exam-bg: #fffaf0;
  --exam-line: #f5e3b3;
  --warn-bg: linear-gradient(120deg, #fdeeee, #fdf6f0);
  --warn-line: #f0c9c4;
  --solve-bg: #e0f2fe;
  --solve-ink: #075985;
  --done-ink: #8aa0a5;
  --teal-bg: #d7f3ee;
  --teal-ink: #0b6e62;
  --amber-bg: #fdf0d5;
  --amber-ink: #92600a;
  --violet-bg: #ece7fb;
  --violet-ink: #5b3fa8;
  --danger: #d64545;
  --danger-bg: #fdeaea;
  --danger-ink: #a52f2b;
  --shadow: 0 1px 2px rgba(13, 60, 56, 0.06), 0 10px 28px -14px rgba(13, 60, 56, 0.22);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(13, 148, 136, 0.16), transparent 60%),
    radial-gradient(900px 420px at 0% -10%, rgba(2, 132, 199, 0.10), transparent 55%),
    var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: linear-gradient(120deg, var(--primary-d), var(--primary) 55%, var(--primary-2));
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px -10px rgba(13, 60, 56, 0.5);
}
h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
h1 { display: flex; align-items: center; gap: 9px; }
.brand { width: 30px; height: 30px; flex: none; display: inline-flex; }
.brand svg { width: 100%; height: 100%; border-radius: 9px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
.hrow { display: flex; gap: 8px; align-items: center; }
#todayLbl {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#langBtn, #themeBtn, #profileBtn {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  padding: 5px 14px;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
#langBtn:hover, #themeBtn:hover, #profileBtn:hover { background: rgba(255, 255, 255, 0.28); }
#themeBtn { padding: 5px 10px; }
nav {
  display: flex;
  gap: 4px;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 22px;
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  max-width: 540px;
  margin: 0 auto;
  z-index: 30;
  padding: 6px;
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.55);
}
nav button {
  flex: 1;
  padding: 7px 4px;
  border: 0;
  background: none;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 3px;
  transition: background 0.15s, color 0.15s;
}
nav button svg { width: 20px; height: 20px; flex: none; }
main { padding-bottom: 104px; }
#fab {
  position: fixed; bottom: 92px; inset-inline-end: 16px; z-index: 29;
  width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer;
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 22px -8px rgba(13, 148, 136, 0.65);
}
#fab svg { width: 26px; height: 26px; }
.wkstrip { display: flex; gap: 6px; margin: 10px 0 2px; }
.wkcell { flex: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font: inherit; cursor: pointer; }
.wkcell .wkname { font-size: 11px; }
.wkcell .wknum { font-size: 15px; color: var(--text); }
.wkcell.now .wknum { color: var(--primary); }
.wkcell.sel { border-color: var(--primary); background: var(--ghost-bg); }
.wkdot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
.wkdot.off { background: transparent; }
.notebox { width: 100%; min-height: 64px; margin: 4px 0 10px; resize: vertical; }
.noteview { font-size: 13px; margin: -2px 0 10px; padding-inline-start: 34px; white-space: pre-wrap; }
.streakcard .sknum { font-size: 22px; font-weight: 800; }
nav button:hover { background: var(--ghost-bg); color: var(--ink); }
nav button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  font-weight: 700;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
/* v21: the floating tab bar sits ~76px tall at the bottom, so the page has to
   end above it or the footer (note + feedback button) hides behind it. */
main { max-width: 780px; margin: 0 auto; padding: 16px 14px 132px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  animation: fadeUp 0.25s ease both;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
input, select, textarea {
  font: inherit;
  padding: 9px 11px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  max-width: 100%;
  background: var(--input-bg);
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.16);
}
textarea { width: 100%; min-height: 74px; resize: vertical; margin: 10px 0; }
input[type="checkbox"] { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }
input[type="date"] { font-variant-numeric: tabular-nums; }
.btn {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 9px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px -5px rgba(13, 148, 136, 0.6);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:active { transform: none; }
.ghost {
  background: var(--ghost-bg);
  color: var(--ink);
  box-shadow: none;
  border: 1px solid var(--line);
  font-weight: 600;
}
.ghost:hover { background: var(--ghost-hover); filter: none; }
button.danger {
  background: var(--danger-bg);
  color: var(--danger-ink);
  box-shadow: none;
  font-weight: 700;
}
button.danger:hover { background: #fbdcdc; filter: none; }
.tag {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--teal-bg);
  color: var(--teal-ink);
  white-space: nowrap;
}
.tag.revise { background: var(--amber-bg); color: var(--amber-ink); }
.tag.review { background: var(--violet-bg); color: var(--violet-ink); }
.warn {
  background: var(--warn-bg);
  border: 1px solid var(--warn-line);
  border-inline-start: 4px solid var(--danger);
  color: var(--danger-ink);
  font-weight: 600;
}
.muted { color: var(--muted); font-size: 13px; }
.bar { height: 9px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #34d399, var(--primary));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.day { font-weight: 800; font-size: 15px; margin: 18px 2px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .muted { font-weight: 600; }
.today { color: var(--primary-d); }
.today::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); align-self: center; }
.sess { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.sess:first-of-type { border-top: 0; }
.sess .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sess b { font-weight: 700; }
.sess .hrs { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lec { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); }
.lec:first-of-type { border-top: 0; }
.lec.done span.t { text-decoration: line-through; color: var(--done-ink); }
.grid7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.grid7 label { font-size: 13px; font-weight: 700; color: var(--muted); }
.grid7 input { margin-top: 5px; width: 100%; }
.empty { text-align: center; padding: 34px 18px; }
.empty .big { font-size: 42px; margin-bottom: 10px; }
.empty p { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
.subj-head b { font-size: 15px; }
.datechip {
  background: var(--ghost-bg);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pcard { border-inline-start: 4px solid var(--primary); }
@media (min-width: 640px) {
  main { padding: 22px 20px 132px; }
  nav { justify-content: center; }
  nav button { flex: 0 1 150px; }
  h1 { font-size: 21px; }
}

/* ---- v3 additions ---- */
.sync { font-size: 12px; font-weight: 700; color: #d7f3ee; min-width: 0; }
.sync.synced { color: #bbf7d0; }
.sync.error { color: #fecaca; }
.batchstatus { font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
.batchstatus.err { color: #fecaca; font-weight: 700; }
.hidden { display: none; }
.checkline { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-weight: 600; font-size: 14px; }
.checkline input { width: 18px; height: 18px; }

.tag.solve { background: var(--solve-bg); color: var(--solve-ink); }
.tag.clinic { background: var(--amber-bg); color: var(--amber-ink); }

.examform { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
.addtask { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin: 10px 0; }
.addtask input { width: 100%; }
.pick { display: flex; gap: 8px; }
.pick button {
  flex: 1; padding: 9px 6px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.pick button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
.pick button:disabled { opacity: 0.55; cursor: not-allowed; }
.estchip {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--teal-bg); color: var(--teal-ink); min-height: 14px;
}
.estchip:empty { display: none; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cell {
  min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--input-bg); padding: 4px 5px; cursor: pointer; position: relative;
  display: flex; flex-direction: column; gap: 2px; transition: border-color 0.12s, background 0.12s;
}
.cell:hover { border-color: var(--primary); }
.cell.out { background: transparent; border: 0; cursor: default; }
.cell.past { opacity: 0.45; }
.cell.sel { border-color: var(--primary); background: var(--teal-bg); box-shadow: 0 0 0 2px rgba(13,148,136,0.25); }
.cell.now .dnum {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff;
  border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
}
.cell.examday { border-color: #f0b429; background: var(--exam-bg); }
.cell .dnum { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cell .exdot { font-size: 10px; line-height: 1; }
.cell .dots { display: flex; gap: 2px; flex-wrap: wrap; }
.cell .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cell .chrs { font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

button.sm { padding: 5px 12px; font-size: 13px; }
.examrow { background: var(--exam-bg); border-radius: 10px; padding: 9px 10px !important; border: 1px solid var(--exam-line) !important; }

.overlay {
  position: fixed; inset: 0; background: rgba(10, 30, 32, 0.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.sheet {
  background: var(--card); border-radius: 20px; padding: 22px 18px; width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px -18px rgba(13, 60, 56, 0.45); animation: fadeUp 0.25s ease both;
}
.sheet input { width: 100%; margin-top: 8px; }
.linklike { background: none; border: 0; color: var(--primary-d); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: underline; }

.yeargrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ypick {
  padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
  font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.ypick.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
.ypick.locked { opacity: 0.45; cursor: not-allowed; }

#toast {
  position: fixed; bottom: 170px; inset-inline: 0; margin: 0 auto; width: fit-content; max-width: 90%;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  transform: translateY(8px); z-index: 60;
}
#toast.show { opacity: 1; transform: none; }

/* subject card header: keep the name on its own line at narrow widths */
.subj-head b { flex: 1 1 100%; margin-bottom: 4px; }
.subj-head .btn { padding: 7px 13px; font-size: 12.5px; }
@media (min-width: 640px) { .subj-head b { flex: 1 1 auto; margin-bottom: 0; } }

/* v5: busy timeline + subject icons */
.sicon {
  width: 30px; height: 30px; border-radius: 10px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; vertical-align: middle;
}
b.subj-head .sicon, .subj-head .sicon { width: 26px; height: 26px; font-size: 15px; margin-inline-end: 2px; }
.sess.busyrow { opacity: 0.85; }
.sess.busyrow .sicon { width: 26px; height: 26px; font-size: 14px; }
.tag.free { background: #e0f2fe; color: #075985; }
.dayhead b { font-size: 15px; }
.addblock { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
.addblock input[type="time"] { padding: 7px 9px; }

/* v4: curriculum + smart warnings */
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: all 0.15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary-d); }
.chip .chipd { color: var(--muted); font-size: 11px; margin-inline-start: 4px; }
.warnlist { margin: 8px 0 0; padding-inline-start: 20px; }
.warnlist li { margin-top: 3px; font-size: 13.5px; }

    for (let d = today; d < last; d = addDays(d, 1)) days.push(d);
    const cap = days.map((d) => capacityOn(state, d));
    const gaps = days.map((d) => gapsOn(state, d).map((g) => g.slice()));
    // today: nothing is booked in time that has already passed
    if (nowMin != null && gaps.length && gaps[0].length) {
      const start = Math.max(DAY_MIN, Math.ceil(nowMin / BREAK_M) * BREAK_M);
      gaps[0].forEach((g) => {
        const end = g[0] + g[1] * 60;
        if (start <= g[0]) return;
        if (start >= end) { g[1] = 0; return; }
        g[1] = (end - start) / 60; g[0] = start;
      });
      gaps[0] = gaps[0].filter((g) => g[1] * 60 >= 60);
      cap[0] = Math.min(cap[0], gaps[0].reduce((a, g) => a + g[1], 0));
    }
    const idx = {}; days.forEach((d, i) => (idx[d] = i));

    const sessions = [];
    const dayAcc = days.map(() => 0); // v16: minutes of work placed on each day since its last break
    // Allocate up to h hours inside ONE gap of day i (a session never spans a busy
    // block): the earliest gap that fits the whole block, else the biggest gap.
    // A 30-minute break is reserved after every 3 hours of work in the day; a
    // piece starting within one slot of the 3-hour mark takes its break first.
    const alloc = (i, h) => {
      let best = -1;
      gaps[i].forEach((g, gi) => {
        if (g[1] < SLOT - 1e-9) return;
        if (best < 0) { best = gi; return; }
        const fits = g[1] >= h - 1e-9, bestFits = gaps[i][best][1] >= h - 1e-9;
        if ((fits && (!bestFits || g[0] < gaps[i][best][0])) || (!fits && !bestFits && g[1] > gaps[i][best][1])) best = gi;
      });
      if (best < 0) return { hours: 0, at: null };
      const g = gaps[i][best];
      // break first when the 3-hour mark is reached or less than one slot away
      const acc = dayAcc[i] % 180;
      if (dayAcc[i] > 0 && (acc < 1e-6 || 180 - acc < SLOT * 60) && g[1] >= h + BREAK_M / 60) {
        g[0] += BREAK_M; g[1] -= BREAK_M / 60; dayAcc[i] = 0;
      }
      const left = dayAcc[i] % 180 < 1e-6 && dayAcc[i] > 0 ? 180 : 180 - (dayAcc[i] % 180);
      const take = Math.min(h, g[1], left / 60);
      if (take <= 1e-9) return { hours: 0, at: null };
      const at = g[0];
      dayAcc[i] += take * 60;
      // reserve the 30-minute break right after a full 3-hour stretch, when the
      // gap continues (at a gap's end the busy block or the night is the break)
      const rest = dayAcc[i] % 180 < 1e-6 && g[1] - take >= BREAK_M / 60 ? BREAK_M : 0;
      g[0] += take * 60 + rest;
      g[1] -= take + rest / 60;
      if (g[1] < SLOT - 1e-9) gaps[i].splice(best, 1);
      return { hours: take, at };
    };
    const push = (date, subjectId, lectureId, title, type, hours, startMin) => {
      const prev = sessions.find((x) => x.date === date && x.subjectId === subjectId && x.lectureId === lectureId && x.type === type &&
        (startMin == null ? x.startMin == null : x.endMin === startMin)); // merge only truly contiguous pieces
      if (prev) { prev.hours += hours; if (startMin != null) prev.endMin += hours * 60; }
      else sessions.push({ date, subjectId, lectureId, title, type, hours, startMin: startMin == null ? null : startMin, endMin: startMin == null ? null : startMin + hours * 60 });
    };

    // 1) reserve one review block on the last open day before each exam/quiz
    active.filter((s) => s.examDate && s.examDate > today)
      .sort((a, b) => a.examDate.localeCompare(b.examDate))
      .forEach((s) => {
        const want = reviewHours(s.covered);
        for (let d = addDays(s.examDate, -1); d >= today; d = addDays(d, -1)) {
          const i = idx[d];
          if (i == null || cap[i] < SLOT) continue;
          const take = Math.min(want, Math.floor(cap[i] / SLOT) * SLOT);
          if (take < SLOT) continue;
          const a = alloc(i, take);
          if (a.hours < SLOT) continue;
          push(d, s.id, null, '', 'examreview', a.hours, a.at);
          cap[i] -= a.hours;
          break;
        }
      });

    // 2) work items: lecture -> study then solving; clinic -> work; low confidence -> revision
    const items = {};
    active.forEach((s) => {
      const list = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) list.push({ t, rem: t.workH || 2, type: 'clinic', due: t.due || s.examDate || null });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) list.push({ t, rem: t.studyH, type: 'study', due: s.examDate });
          if (t.solveH > 0) list.push({ t, rem: t.solveH, type: 'solve', due: s.examDate });
        } else if (t.confidence && t.confidence <= 2) {
          list.push({ t, rem: (t.studyH || 1) * 0.5, type: 'revise', due: s.examDate });
        }
      });
      items[s.id] = list;
    });
    const remaining = (s) => items[s.id].reduce((a, i) => a + i.rem, 0);
    const deadlineOf = (s) => (s.examDate && s.examDate >= today ? s.examDate : last);
    const capBefore = (deadline, fromI) => {
      let c = 0;
      for (let i = fromI; i < days.length && days[i] < deadline; i++) c += cap[i];
      return c;
    };

    days.forEach((d, di) => {
      let slots = Math.round(Math.min(cap[di], gaps[di].reduce((a, g) => a + g[1], 0)) / SLOT);
      const todayH = {}; let lastPick = null;
      while (slots > 0) {
        const open = active.filter((s) => deadlineOf(s) > d);
        const needy = open.filter((s) => items[s.id].some((i) => i.rem > 1e-9 && (!i.due || i.due > d)));
        let pick = null, review = false, capped = false;
        if (needy.length) {
          const score = (s) => s.weight * remaining(s) / Math.max(capBefore(deadlineOf(s), di), SLOT);
          let pool = needy.filter((s) => (todayH[s.id] || 0) < MAX_PER_SUBJECT);
          if (!pool.length) { pool = needy; capped = true; } // everything hit the per-subject cap: keep filling the day
          const sticky = (s) => score(s) * (s.id === lastPick ? 1.25 : 1);
          pool.sort((a, b) => sticky(b) - sticky(a) || deadlineOf(a).localeCompare(deadlineOf(b)));
          pick = pool[0];
        } else if (open.some((s) => s.examDate && s.examDate > d)) {
          pick = open.filter((s) => s.examDate && s.examDate > d).sort((a, b) => a.examDate.localeCompare(b.examDate))[0];
          review = true; // spare time: general review of the nearest exam
        } else break;
        if (!review) {
          const it = items[pick.id].find((i) => i.rem > 1e-9 && (!i.due || i.due > d));
          // one task piece is placed contiguously; a short piece (e.g. 10 min solving) keeps its real length
          const room = Math.min(it.rem, (capped ? it.rem : MAX_PER_SUBJECT - (todayH[pick.id] || 0)), slots * SLOT);
          if (room <= 1e-9) { slots = 0; break; }
          let take = it.rem <= room + 1e-9 ? it.rem : Math.floor(room / SLOT) * SLOT;
          if (take < SLOT) take = Math.min(it.rem, room); // never drop a sub-slot piece
          const a = alloc(di, take);
          if (a.hours <= 1e-9) { slots = 0; break; } // no gap left that fits work + break
          const placed = Math.min(take, a.hours);
          it.rem -= placed;
          push(d, pick.id, it.t.id, it.t.title, it.type, placed, a.at);
          todayH[pick.id] = (todayH[pick.id] || 0) + placed;
          slots -= Math.ceil(placed / SLOT - 1e-9);
        } else {
          // spare-time review: one contiguous chunk so the day view stays readable
          const take = Math.min(slots * SLOT, 4);
          const a = alloc(di, take);
          if (a.hours < SLOT - 1e-9) { slots = 0; break; }
          push(d, pick.id, null, '', 'review', a.hours, a.at);
          slots -= Math.ceil(a.hours / SLOT - 1e-9);
        }
        lastPick = pick.id;
      }
    });

    sessions.sort((a, b) => a.date.localeCompare(b.date) || (a.startMin == null ? 1e9 : a.startMin) - (b.startMin == null ? 1e9 : b.startMin));
    const deficits = active
      .map((s) => ({ subjectId: s.id, hours: Math.max(0, +remaining(s).toFixed(2)) }))
      .filter((x) => x.hours > 1e-9);
    return { sessions, deficits };
  }

  /**
   * Smart overload warnings: for every subject whose work does not fit before its
   * deadline, name the exam date and the specific open tasks in priority order
   * (biggest remaining block first), so the student knows exactly what to start with.
   * Returns [{subjectId, name, examDate, hoursShort, openCount, tasks:[{id,title,hours,type}]}].
   */
  function warnings(state, today) {
    const r = generate(state, today);
    if (!r.deficits.length) return [];
    const byId = {};
    (state.subjects || []).map(normSubject).forEach((s) => { byId[s.id] = s; });
    return r.deficits.map((d) => {
      const s = byId[d.subjectId];
      if (!s) return null;
      const open = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) open.push({ id: t.id, title: t.title, hours: t.workH || 2, type: 'clinic' });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) open.push({ id: t.id, title: t.title, hours: t.studyH, type: 'study' });
          if (t.solveH > 0) open.push({ id: t.id, title: t.title, hours: t.solveH, type: 'solve' });
        } else if (t.confidence && t.confidence <= 2) {
          open.push({ id: t.id, title: t.title, hours: (t.studyH || 1) * 0.5, type: 'revise' });
        }
      });
      open.sort((a, b) => b.hours - a.hours);
      return {
        subjectId: s.id, name: s.name, examDate: s.examDate,
        hoursShort: d.hours, openCount: open.length, tasks: open.slice(0, 5),
      };
    }).filter(Boolean);
  }

  function progress(state, today) {
    return (state.subjects || []).map((raw) => {
      const s = normSubject(raw);
      const total = s.tasks.length;
      const done = s.tasks.filter((t) => t.done).length;
      return {
        subjectId: s.id, name: s.name, total, done,
        pct: total ? Math.round((done / total) * 100) : 0,
        daysLeft: s.examDate ? diffDays(today, s.examDate) : null,
      };
    });
  }


  /* ---------------- v6: focus mode, stats, revision planner ---------------- */

  // Pomodoro presets the student picks from: 25/5 or 50/10 minutes.
  const FOCUS_PRESETS = [
    { focusMin: 25, breakMin: 5 },
    { focusMin: 50, breakMin: 10 },
  ];

  // Remaining work on a task, in minutes (study + solving, or clinic work).
  function taskRemainingMin(task) {
    if (!task) return 0;
    if (task.kind === 'clinic') return Math.max(0, Math.round((Number(task.workH) || 0) * 60));
    return Math.max(0, Math.round(((Number(task.studyH) || 0) + (Number(task.solveH) || 0)) * 60));
  }

  // Deduct focused minutes from a task's remaining hours. Lecture tasks lose study
  // time first, then solving; clinic tasks lose work hours. Never goes below zero.
  // Returns the minutes actually deducted (can be less when the task runs out).
  function deductFromTask(task, minutes) {
    let rem = Math.max(0, Math.round(Number(minutes) || 0));
    const start = rem;
    const take = (field) => {
      if (rem <= 0) return;
      const cur = Math.max(0, Math.round((Number(task[field]) || 0) * 60));
      const use = Math.min(cur, rem);
      task[field] = Math.round((cur - use) * 10) / 600; // back to hours, minute precision
      rem -= use;
    };
    if (task && task.kind === 'clinic') take('workH');
    else if (task) { take('studyH'); take('solveH'); }
    return start - rem;
  }

  // Aggregate the focus log for the My Day stats card.
  // log: [{date:'YYYY-MM-DD', minutes:N}] -> today/week totals + a 7-day series.
  function focusStats(log, today) {
    const days = [];
    for (let i = 6; i >= 0; i--) days.push({ date: addDays(today, -i), minutes: 0 });
    const idx = {};
    days.forEach((d, i) => { idx[d.date] = i; });
    let todayMin = 0, weekMin = 0, sessions = 0;
    (log || []).forEach((e) => {
      const m = Math.max(0, Math.round(Number(e && e.minutes) || 0));
      if (!m || !e || typeof e.date !== 'string') return;
      sessions++;
      if (idx[e.date] != null) { days[idx[e.date]].minutes += m; weekMin += m; }
      if (e.date === today) todayMin += m;
    });
    return { todayMin, weekMin, days, sessions };
  }

  /* ---------------- v17: anonymous weekly leaderboard ---------------- */

  // ISO week key ('2026-W48'), Monday is the week's first day.
  function weekKey(d) {
    const ms = parse(d);
    const wd = (new Date(ms).getUTCDay() + 6) % 7; // 0 = Monday
    const thursday = ms - wd * 864e5 + 3 * 864e5;
    const year = new Date(thursday).getUTCFullYear();
    const week = Math.floor((thursday - Date.UTC(year, 0, 1)) / 6048e5) + 1;
    return year + '-W' + String(week).padStart(2, '0');
  }

  // Weekly score from real data only (no estimates of skill, just work done):
  //   10 points per lecture/clinic finished this week
  //   + 10 points per study hour (focus log + the hours of tasks finished that day,
  //     the same minutes the dashboard shows)
  //   + 5 points per active day, so consistency counts too.
  // A very heavy real week lands around 600-800 points; the Firebase rules cap
  // writes well above that.
  function weekScore(state, today) {
    const key = weekKey(today);
    let lectures = 0, minutes = 0;
    const days = {};
    (state.focusLog || []).forEach((f) => {
      if (f && f.date && weekKey(f.date) === key) { minutes += Math.max(0, Number(f.minutes) || 0); days[f.date] = 1; }
    });
    (state.subjects || []).forEach((s) => (s.tasks || []).forEach((t) => {
      if (t.done && t.doneAt && weekKey(t.doneAt) === key) {
        if (t.kind === 'lecture' || t.kind === 'clinic') lectures++;
        minutes += Math.round(((t.studyH || 0) + (t.solveH || 0) + (t.workH || 0)) * 60);
        days[t.doneAt] = 1;
      }
    }));
    const activeDays = Object.keys(days).length;
    return { week: key, score: lectures * 10 + Math.floor(minutes / 6) + activeDays * 5, lectures, minutes: Math.round(minutes), days: activeDays };
  }

  // The nearest upcoming exam/quiz (date + time), or null.
  function nextExam(state, today) {
    let best = null;
    (state.subjects || []).forEach((raw) => {
      const ex = raw && raw.exam && raw.exam.date ? raw.exam : null;
      if (!ex || ex.date < today) return;
      if (!best || ex.date < best.date || (ex.date === best.date && String(ex.time || '99') < String(best.time || '99'))) {
        best = { subjectId: raw.id, name: raw.name, kind: ex.kind, date: ex.date, time: ex.time || '', nature: ex.nature || 'theory' };
      }
    });
    return best;
  }

  // Countdown parts to a target timestamp. past=true once it has passed.
  function countdownParts(targetMs, nowMs) {
    let d = Math.max(0, Math.floor((targetMs - nowMs) / 1000));
    const past = targetMs <= nowMs;
    const days = Math.floor(d / 86400); d -= days * 86400;
    const hours = Math.floor(d / 3600); d -= hours * 3600;
    const minutes = Math.floor(d / 60); d -= minutes * 60;
    return { days, hours, minutes, seconds: d, past };
  }

  // Revision planner: one entry per upcoming exam with the remaining work
  // (open tasks + low-confidence re-revision + the pre-exam review block), the
  // days with free capacity before it, the needed daily pace and feasibility.
  function revisionPlan(state, today) {
    return (state.subjects || []).map(normSubject)
      .filter((s) => s.examDate && s.examDate >= today)
      .map((s) => {
        const items = [];
        s.tasks.forEach((t) => {
          if (t.kind === 'clinic') {
            if (!t.done) items.push({ id: t.id, title: t.title, hours: t.workH || 2, type: 'clinic' });
            return;
          }
          if (!t.done) {
            if (t.studyH > 0) items.push({ id: t.id, title: t.title, hours: t.studyH, type: 'study' });
            if (t.solveH > 0) items.push({ id: t.id, title: t.title, hours: t.solveH, type: 'solve' });
          } else if (t.confidence && t.confidence <= 2) {
            items.push({ id: t.id, title: t.title, hours: (t.studyH || 1) * 0.5, type: 'revise' });
          }
        });
        items.sort((a, b) => b.hours - a.hours);
        const reviewH = reviewHours(s.covered);
        const hoursNeeded = Math.round((items.reduce((a, i) => a + i.hours, 0) + reviewH) * 2) / 2;
        let cap = 0, daysAvail = 0;
        for (let d = today; d < s.examDate; d = addDays(d, 1)) {
          const c = capacityOn(state, d);
          if (c > 1e-9) daysAvail++;
          cap += c;
        }
        return {
          subjectId: s.id, name: s.name, examDate: s.examDate,
          daysLeft: diffDays(today, s.examDate),
          items, reviewH, hoursNeeded, daysAvail,
          perDay: daysAvail ? Math.round((hoursNeeded / daysAvail) * 2) / 2 : hoursNeeded,
          feasible: hoursNeeded <= cap + 1e-9,
        };
      })
      .sort((a, b) => a.examDate.localeCompare(b.examDate));
  }

  /* ---------------- v20: workout days ---------------- */

  // Workout days are weekday numbers (0 = Sunday). Default: Sat, Mon, Wed, Fri.
  const WORKOUT_DEFAULT = [1, 3, 5, 6]; // sorted: Mon, Wed, Fri, Sat

  function workoutDays(state) {
    const w = state && state.workout;
    const d = w && Array.isArray(w.days) ? w.days.filter((x) => x >= 0 && x <= 6) : WORKOUT_DEFAULT.slice();
    return (d.length ? d : WORKOUT_DEFAULT.slice()).slice().sort((a, b) => a - b);
  }
  function isWorkoutDay(state, d) { return workoutDays(state).indexOf(weekday(d)) !== -1; }
  function workoutDone(state, d) { return !!(((state.workout || {}).log || {})[d]); }
  // Workouts finished so far in the week that contains d (Saturday start).
  function workoutWeek(state, d) {
    const wd = weekday(d);
    const start = addDays(d, -((wd + 1) % 7));
    const log = (state.workout || {}).log || {};
    let done = 0;
    for (let i = 0; i < 7; i++) { const x = addDays(start, i); if (x > d) break; if (log[x]) done++; }
    return { done, target: workoutDays(state).length, start };
  }

  /* ---------------- v20: per-subject stats ---------------- */

  // Minutes per subject from real data only: focus sessions plus the hours of
  // tasks finished (the same numbers the dashboard shows).
  function subjectMinutes(state, from) {
    const out = {};
    (state.focusLog || []).forEach((f) => {
      if (!f || !f.subjectId) return;
      if (from && (!f.date || f.date < from)) return;
      out[f.subjectId] = (out[f.subjectId] || 0) + (Number(f.minutes) || 0);
    });
    (state.subjects || []).forEach((s) => (s.tasks || []).forEach((t) => {
      if (!t.done || !t.doneAt) return;
      if (from && t.doneAt < from) return;
      const m = Math.round(((Number(t.studyH) || 0) + (Number(t.solveH) || 0) + (Number(t.workH) || 0)) * 60);
      out[s.id] = (out[s.id] || 0) + m;
    }));
    return out;
  }

  function subjectStats(state, today) {
    const w = subjectMinutes(state, addDays(today, -6));
    const all = subjectMinutes(state, null);
    const rows = (state.subjects || []).map((s) => {
      const ex = (s.exam && s.exam.date) || null;
      return {
        id: s.id, name: s.name, week: w[s.id] || 0, total: all[s.id] || 0,
        open: (s.tasks || []).filter((t) => !t.done).length,
        examIn: ex && ex >= today ? diffDays(today, ex) : null,
      };
    });
    const byWeek = rows.slice().sort((a, b) => b.week - a.week);
    const top = byWeek.length && byWeek[0].week > 0 ? byWeek[0] : null;
    const low = byWeek.length ? byWeek[byWeek.length - 1] : null;
    const neglected = rows.filter((r) => r.week === 0 && r.examIn != null && r.examIn <= 45 && r.open > 0)
      .sort((a, b) => a.examIn - b.examIn);
    return { rows: byWeek, top, low, neglected, totalWeek: rows.reduce((a, r) => a + r.week, 0) };
  }

  /* ---------------- v20: the day's suggested plan ---------------- */

  // An ordered suggestion list for today: nearest exam first, overdue clinics
  // next, a subject that has had no time this week gets a nudge, and a heavy
  // college day or a workout day gets a shorter list. Nothing here is invented:
  // the minutes come from the tasks themselves and the day's real free time.
  function autoPlan(state, today, opts) {
    const cap = capacityOn(state, today);
    const capMin = Math.round(cap * 60);
    const blocks = busyOn(state, today);
    const busyMin = blocks.reduce((a, b) => a + Math.max(0, Math.min(b[1], 1440) - b[0]), 0);
    const heavy = busyMin >= 240;
    const wo = isWorkoutDay(state, today);
    const perSubj = subjectMinutes(state, addDays(today, -6));
    const cands = [];
    (state.subjects || []).forEach((s) => {
      const ex = (s.exam && s.exam.date) || null;
      const exDays = ex && ex >= today ? diffDays(today, ex) : null;
      (s.tasks || []).forEach((t) => {
        if (!t || t.done) return;
        const rem = taskRemainingMin(t);
        if (rem <= 0) return;
        const diff = Number(t.difficulty) || 2;
        let score = 0; const why = [];
        if (exDays != null) { score += Math.max(0, 45 - exDays) * 1.2; why.push(exDays <= 14 ? 'exam' : 'soon'); }
        if (t.due && t.due <= addDays(today, 3)) { score += 25; why.push('due'); }
        if (!(perSubj[s.id] > 0)) { score += 12; why.push('neglect'); }
        score += diff * 4;
        if (diff >= 3) why.push('hard');
        score += Math.min(18, rem / 5);
        cands.push({ subjectId: s.id, subject: s.name, taskId: t.id, title: t.title, minutes: Math.min(rem, 60), rem, why, score });
      });
    });
    cands.sort((a, b) => b.score - a.score || b.rem - a.rem);
    const maxItems = heavy ? 2 : (wo ? 3 : 4);
    const budget = Math.max(30, Math.round(capMin * (wo ? 0.6 : heavy ? 0.7 : 0.85)));
    const items = []; const perSubject = {};
    let used = 0;
    cands.forEach((c) => {
      if (items.length >= maxItems) return;
      if ((perSubject[c.subjectId] || 0) >= 2) return;
      if (items.length && used + c.minutes > budget) return;
      perSubject[c.subjectId] = (perSubject[c.subjectId] || 0) + 1;
      used += c.minutes;
      items.push({ subjectId: c.subjectId, subject: c.subject, taskId: c.taskId, title: c.title, minutes: c.minutes, why: c.why.slice(0, 2) });
    });
    return { items, heavy, workout: wo, workoutDone: workoutDone(state, today), capMin, targetMin: used, busyMin };
  }

  return {
    generate, progress, warnings, addDays, weekday, diffDays, capacityOn,

     was picked by state.savedAt - and every app open bumps savedAt (the daily
     motivation line, the streak best, the reminder stamp). So the second device
     always "won" with its older copy and wiped the newer one. Now every item
     carries its own change stamp (task.m, subject.m) and the two copies are
     merged item by item instead of one replacing the other. Deletions are kept
     as tombstones (gone / goneS) so a merge never resurrects something the
     student removed on the other device. */

    return JSON.stringify(o);
  }

  // Change-detection map for a state, without touching it.
  function snapshot(state) {
    const m = {};
    (state.subjects || []).forEach((s) => {
      m['s:' + s.id] = subjSig(s);
      (s.tasks || []).forEach((t) => { m['t:' + t.id] = taskSig(t); });

  // task/subject with m = now, and remember removed ids as tombstones.
  function stamp(state, prev, now) {
    const next = {};
    (state.subjects || []).forEach((s) => {
      const ss = subjSig(s);
      next['s:' + s.id] = ss;
      if (!prev || prev['s:' + s.id] === undefined || prev['s:' + s.id] !== ss) s.m = now;
      (s.tasks || []).forEach((t) => {
        const ts = taskSig(t);
        next['t:' + t.id] = ts;
        if (!prev || prev['t:' + t.id] === undefined || prev['t:' + t.id] !== ts) t.m = now;
      });
    });

      Object.keys(prev).forEach((k) => {
        if (next[k] !== undefined) return;
        if (k.charAt(0) === 't') { state.gone = state.gone || {}; state.gone[k.slice(2)] = now; }

  // actually produced something the cloud copy does not have yet.

    if (Array.isArray(x)) return '[' + x.map(stable).join(',') + ']';
    return '{' + Object.keys(x).sort().map((k) => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}';

    out.blocked = Array.from(new Set([].concat(local.blocked || [], cloud.blocked || []))).sort();

    out.subjects = mergeSubjects(cloud.subjects, local.subjects);
    const gone = out.gone, goneS = out.goneS;

    out.subjects.forEach((s) => {

  const PALETTE = ['#0d9488', '#7c3aed', '#ea580c', '#0284c7', '#db2777', '#65a30d', '#d97706', '#dc2626'];
  const colorOf = (id) => {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  // v17: the student's tooth avatar (one of the 15 in avatars.js)
  const avatarById = (id) => (typeof AVATARS !== 'undefined' && (AVATARS.find((a) => a.id === id) || AVATARS[0])) || null;
  const avatarSvg = (id) => { const a = avatarById(id); return a ? a.svg : ''; };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const $ = (id) => document.getElementById(id);

  const empty = () => ({
    version: 3, lang: 'ar',
    profile: { name: '', year: null, onboarded: false, avatar: '' }, // v17: avatar = one of the 15 AVATARS ids
    busy: {},        // weekly busy blocks per weekday 0..6: [{id,label,kind,start,end}]
    busyOnce: {},    // one-date busy blocks: {date: [{id,label,kind,start,end}]}
    sleep: {},       // fixed 6h sleep start per weekday 0..6 ('HH:MM'); missing = default
    blocked: [],     // dates switched fully off (day off): no study is planned
    subjects: [], savedAt: 0,
    focusLog: [],    // [{id, taskId, subjectId, date:'YYYY-MM-DD', minutes, at}]
    theme: 'dark',   // 'dark' (default) or 'light'
    pace: { study: 60, solve: 20 }, // v13: the student's own minutes per lecture study / per question set
    motivIdx: -1, motivDate: '', // v13: which encouragement line showed, and on which day
    leaderboard: { on: false, showName: false }, // v17: opt-in weekly leaderboard; v20: showName
    workout: { days: [1, 3, 5, 6], log: {} }, // v20: workout weekdays (0=Sun, sorted) + days finished
    reviewLog: {},   // v20: taskId -> date of the last 10-minute review
    challenge: { code: '' }, // v20: weekly challenge room code
    gone: {}, goneS: {}, // v20: tombstones so a merge never resurrects deleted work
    remind: { on: false, time: '20:00', last: '' }, // v19: in-app study reminder
    streak: { best: 0, fills: [], month: '', used: 0 }, // v19: flame streak with 3 monthly restores
    batchSync: { lastSync: 0, total: 0, added: 0, updated: 0, removed: 0, unmatched: 0, error: '' }, // lectures-N.csv read status
  });

  function migrate(old) {
    const st = empty();
    st.lang = old.lang === 'en' ? 'en' : 'ar';
    st.overrides = old.overrides || {};
    st.blocked = old.blocked || [];
    st.subjects = (old.subjects || []).map((s) => ({
      id: s.id || uid(), name: s.name || '?',
      exam: s.examDate ? { kind: 'exam', date: s.examDate, time: '', nature: 'theory', covered: (s.lectures || []).length } : null,
      tasks: (s.lectures || []).map((l) => ({
        id: l.id || uid(), kind: 'lecture', title: l.title || '?', difficulty: 2,
        studyH: Number(l.hours) || 1, solveH: 0.5, workH: 0,
        due: null, done: !!l.done, confidence: l.confidence || 0,
      })),
    }));
    return st;
  }

  let state;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(empty(), JSON.parse(raw));
    else {
      state = empty();
      for (const k of OLD_KEYS) {
        const o = localStorage.getItem(k);
        if (o) { try { state = migrate(JSON.parse(o)); } catch (e) {} break; }
      }
    }
  } catch (e) { state = empty(); }
  function normalizeState() {
    if (!state.profile) state.profile = { name: '', year: null, onboarded: false };
    if (!state.busy || typeof state.busy !== 'object') state.busy = {};
    if (!state.busyOnce || typeof state.busyOnce !== 'object') state.busyOnce = {};
    if (!Array.isArray(state.focusLog)) state.focusLog = [];
    if (!Array.isArray(state.blocked)) state.blocked = [];
    if (!state.sleep || typeof state.sleep !== 'object') state.sleep = {};
    // Fold old editable sleep blocks into the fixed 6-hour sleep setting.
    for (let wd = 0; wd < 7; wd++) {
      const list = state.busy[wd] || [];
      const sl = list.find((b) => b && b.kind === 'sleep' && Scheduler.hmToMin(b.start) != null);
      if (sl && Scheduler.hmToMin(state.sleep[wd]) == null) state.sleep[wd] = sl.start;
      state.busy[wd] = list.filter((b) => b && b.kind !== 'sleep');
      if (!state.busy[wd].length) delete state.busy[wd];
    }
    Object.keys(state.busyOnce).forEach((d) => {
      state.busyOnce[d] = (state.busyOnce[d] || []).filter((b) => b && b.kind !== 'sleep');
      if (!state.busyOnce[d].length) delete state.busyOnce[d];
    });
    if (state.overrides) delete state.overrides; // the manual per-date cap was removed
    if (state.theme !== 'light') state.theme = 'dark';
    // v10 -> v11: the per-student Google Sheet link was replaced by the
    // lectures-N.csv file shipped with the app; keep the old counters.
    if (state.batchSheet && typeof state.batchSheet === 'object') {
      const old = state.batchSheet;
      if (!state.batchSync || typeof state.batchSync !== 'object') {
        state.batchSync = { lastSync: old.lastSync || 0, total: old.total || 0, added: old.added || 0, updated: 0, removed: 0, unmatched: old.unmatched || 0, error: '' };
      }
      delete state.batchSheet;
    }
    if (!state.batchSync || typeof state.batchSync !== 'object') state.batchSync = { lastSync: 0, total: 0, added: 0, updated: 0, removed: 0, unmatched: 0, error: '' };
    if (!state.pace || typeof state.pace !== 'object') state.pace = { study: 60, solve: 20 };
    if (!state.profile || typeof state.profile !== 'object') state.profile = { name: '', year: null, onboarded: false, avatar: '' };
    if (typeof state.profile.avatar !== 'string') state.profile.avatar = ''; // v17
    if (!state.leaderboard || typeof state.leaderboard !== 'object') state.leaderboard = { on: false, showName: false }; // v17
    if (typeof state.leaderboard.showName !== 'boolean') state.leaderboard.showName = false; // v20
    if (!state.workout || typeof state.workout !== 'object') state.workout = { days: [1, 3, 5, 6], log: {} }; // v20
    if (!Array.isArray(state.workout.days) || !state.workout.days.length) state.workout.days = [1, 3, 5, 6];
    if (!state.workout.log || typeof state.workout.log !== 'object') state.workout.log = {};
    if (!state.reviewLog || typeof state.reviewLog !== 'object') state.reviewLog = {}; // v20
    if (!state.challenge || typeof state.challenge !== 'object') state.challenge = { code: '' }; // v20
    if (!state.gone || typeof state.gone !== 'object') state.gone = {}; // v20
    if (!state.goneS || typeof state.goneS !== 'object') state.goneS = {}; // v20
    // v20: tombstones only matter while the other device may still hold the old
    // copy, so anything older than 90 days is dropped.
    const tombCut = Date.now() - 90 * 864e5;
    Object.keys(state.gone).forEach((k) => { if ((Number(state.gone[k]) || 0) < tombCut) delete state.gone[k]; });
    Object.keys(state.goneS).forEach((k) => { if ((Number(state.goneS[k]) || 0) < tombCut) delete state.goneS[k]; });
    if (!state.remind || typeof state.remind !== 'object') state.remind = { on: false, time: '20:00', last: '' }; // v19
    if (!state.streak || typeof state.streak !== 'object') state.streak = { best: 0, fills: [], month: '', used: 0 }; // v19
    if (!Array.isArray(state.streak.fills)) state.streak.fills = [];
    (state.subjects || []).forEach((s) => {
      delete s.quizzes; // v16: quizzes (student-added and sheet-sourced) were removed from the app
      if (s.exam && typeof s.exam.src === 'undefined') s.exam.src = ''; // '' = set by the student, 'batch' = from the sheet
      // v16: Oral Biology was renamed Oral Histology; refresh the stored display name
      if (s.code === 'OBID-2' && typeof Curriculum !== 'undefined') {
        const c = Curriculum.find(s.name, s.code);
        if (c) s.name = state.lang === 'en' ? c.en : c.ar;
      }
    });
    // v13: a student on a locked year goes back to onboarding; his subjects,
    // tasks, busy days and progress stay untouched for when his year opens.
    if (state.profile && state.profile.year && OPEN_YEARS.indexOf(state.profile.year) === -1) {
      state.profile.year = null;
      state.profile.onboarded = false;
    }
  }
  normalizeState();
  const saveLocal = () => localStorage.setItem(KEY, JSON.stringify(state));
  saveLocal(); // persist any migration / v13 year-lock reset right away

  // first so an email account keeps them; an anonymous device loses what was never
  // linked to an email, which the confirm card says out loud.
  async function doLogout() {
    try {
      if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
      if (session && fbDb && session.email) { try { await pushCloud(); } catch (e) { /* ignore */ } }
    } catch (e) { /* ignore */ }
    try { if (fbAuth) await fbAuth.signOut(); } catch (e) { /* ignore */ }
    await wipeLocal();
    session = null; authSkipped = false; setSync('');
    tab = 'day'; prevTab = 'day'; openSubject = null; fabOpen = false; focusRun = null;
    try { localStorage.removeItem(FKEY); } catch (e) { /* ignore */ }
    attMeta = {}; attOpen = null; attPlay = null; attUsage = null;
    tourDone = false; tourStep = null;
    render();
    toast(L().outDone);
  }

  // Everything this device holds: the saved state, its keys, and the uploaded files.
  async function wipeLocal() {
    try {
      Object.keys(localStorage).forEach((k) => { if (k.indexOf(KEY) === 0) localStorage.removeItem(k); });
      localStorage.removeItem(FKEY);
    } catch (e) { /* ignore */ }
    try {
      if (attDB) { attDB.close(); attDB = null; }
      await new Promise((res) => {
        const rq = indexedDB.deleteDatabase('dental-planner-files');
        rq.onsuccess = res; rq.onerror = res; rq.onblocked = res;
        setTimeout(res, 1500);
      });
    } catch (e) { /* ignore */ }
    state = empty();
    normalizeState();
    try { saveLocal(); } catch (e) { /* ignore */ }
    if (typeof SyncMerge !== 'undefined') stateSnap = SyncMerge.snapshot(state);
  }

  /* ---------------- batch lectures from the year's lectures file ---------------- */
  // Each study year (1..5) has one Google Sheet edited by that year's rep in
  // the normal Sheets grid. A tiny sheets.json shipped next to the app (repo
  // root) maps year -> sheet link or id, so students never paste anything.
  // The app reads the sheet that matches the student's year on every open, on
  // return after 30+ minutes and via the manual button, and runs a FULL sync:
  // new rows are added, changed rows update the task in place (progress kept),
  // rows removed from the sheet delete only the tasks that came from the
  // sheet - the student's own tasks are never touched.
  let batchPromise = null;

  function lecturesYear() {
    const y = state.profile && state.profile.year;
    return y >= 1 && y <= 5 ? y : 0;
  }
  const canSyncLectures = () => !!(state.profile && state.profile.onboarded && lecturesYear() && typeof BatchSync !== 'undefined');

  function batchStatusText() {
    const bs = state.batchSync || {};
    if (bs.error) return bs.error;
    if (!lecturesYear()) return L().batchNoYear;
    if (bs.noSheet) return L().batchNoSheet;
    if (!bs.lastSync) return L().batchNever;
    const d = new Date(bs.lastSync);
    return L().batchLast(fmtClock(d.getHours() * 60 + d.getMinutes())) + ' · ' + L().batchStat(bs.added || 0, bs.updated || 0, bs.removed || 0, bs.total || 0, bs.unmatched || 0);
  }

  function applyLectures(entries) {
    const plan = BatchSync.planFullSync(state.subjects, entries);
    plan.updates.forEach(({ task, entry, key }) => {
      task.batchId = key;
      task.src = 'batch';
      task.title = entry.lecture;
      if (entry.week) task.week = entry.week; else delete task.week;
      if (entry.difficulty && entry.difficulty !== task.difficulty) {
        // Recount hours from the new difficulty only while the task is
        // untouched; once the student put time into it, his hours stay.
        const od = task.difficulty;
        const fresh = !task.done && task.kind !== 'clinic'
          && task.studyH === paceStudyH(od) && task.solveH === paceSolveH(od);
        task.difficulty = entry.difficulty;
        if (fresh) { task.studyH = paceStudyH(entry.difficulty); task.solveH = paceSolveH(entry.difficulty); }
      }
    });
    plan.removals.forEach(({ subjectId, task }) => {
      const sj = subj(subjectId);
      if (sj) sj.tasks = sj.tasks.filter((x) => x.id !== task.id);
    });
    plan.adds.forEach(({ subjectId, key, entry }) => {
      const sj = subj(subjectId);
      if (!sj) return;
      const t = mkTask(entry.lecture, 'lecture', entry.difficulty || null, 'batch');
      t.batchId = key;
      if (entry.week) t.week = entry.week;
      sj.tasks.push(t);
    });
    return plan;
  }

  // v14: sheet-sourced exam dates. A hand-set exam (src '') always wins;
  // a sheet row removed from the tab removes only a sheet-sourced exam.
  function applyExamRows(rows) {
    const today = todayStr();
    const byId = {};
    (rows || []).forEach((r) => {
      const hit = BatchSync.matchSubject(state.subjects, r.subject);
      if (hit) (byId[hit.id] = byId[hit.id] || []).push(r);
    });
    Object.keys(byId).forEach((id) => {
      const sj = subj(id);
      if (!sj || (sj.exam && sj.exam.src !== 'batch')) return;
      const list = byId[id];
      const upcoming = list.filter((r) => r.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
      const pick = upcoming || list.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
      sj.exam = { kind: 'exam', date: pick.date, time: pick.time || '', nature: pick.nature, covered: pick.covered || (sj.exam && sj.exam.covered) || 0, src: 'batch' };
    });
    state.subjects.forEach((sj) => {
      if (sj.exam && sj.exam.src === 'batch' && !byId[sj.id]) sj.exam = null;
    });
  }

  async function fetchText(url, ms) {
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const killer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, ms || 12000) : null;
    let res;
    // no-cache: always revalidate so the rep's edits show up within minutes
    try { res = await fetch(url, ctrl ? { signal: ctrl.signal, cache: 'no-cache' } : { cache: 'no-cache' }); }
    finally { if (killer) clearTimeout(killer); }
    if (!res || !res.ok) { const err = new Error('http'); err.status = res && res.status; throw err; }
    return res.text();
  }

  function syncLecturesFile(manual) {
    if (batchPromise) return batchPromise;
    const bs = state.batchSync;
    const year = lecturesYear();
    if (!year || typeof fetch !== 'function') return Promise.resolve();
    batchPromise = (async () => {
      try {
        // step 1: which sheet belongs to this year (owner keeps sheets.json)
        let manifest = null;
        try { manifest = JSON.parse(await fetchText('sheets.json', 8000)); }
        catch (e) {
          if (e && e.name === 'SyntaxError') { /* broken sheets.json: treat as not set up */ }
          else if (!e || e.status !== 404) throw e; // offline/server trouble is an error, not "no sheet"
        }
        const ref = manifest && typeof manifest === 'object' && (manifest[year] || manifest[String(year)]);
        if (!ref) {
          bs.noSheet = true; bs.error = ''; save();
          if (manual) toast(L().batchNoSheet);
          return;
        }
        const url = BatchSync.normalizeSheetUrl(ref);
        if (!url) { bs.noSheet = false; bs.error = L().batchErrUrl; save(); return; }
        // step 2: the sheet itself as CSV
        const text = await fetchText(url, 12000);
        if (/^\s*<(!doctype|html)/i.test(text.slice(0, 300))) {
          // Google answered with a sign-in page: the sheet is not shared
          bs.noSheet = false; bs.error = L().batchErrShare; save();
          if (manual) toast(L().batchErrShare);
          return;
        }
        const entries = BatchSync.parseSheetRows(BatchSync.parseCSV(text));
        const plan = applyLectures(entries);
        // step 3 (v14, optional tab in the same sheet): exam dates.
        // A missing tab just 404s; that is normal and leaves exams alone.
        try {
          const exText = await fetchText(url + '&sheet=exams', 8000);
          if (!/^\s*<(!doctype|html)/i.test(exText.slice(0, 300))) applyExamRows(BatchSync.parseExamsRows(BatchSync.parseCSV(exText)));
        } catch (e) { /* no exams tab yet */ }
        bs.error = '';
        bs.noSheet = false;
        bs.lastSync = Date.now();
        bs.total = entries.length;
        bs.added = plan.adds.length;
        bs.updated = plan.updates.length;
        bs.removed = plan.removals.length;
        bs.unmatched = plan.unmatched.length;
        save();
        if (manual) toast(L().batchToast(plan.adds.length, plan.updates.length, plan.removals.length));
      } catch (e) {
        bs.noSheet = false;
        bs.error = L().batchErrFetch;
        save();
      }
    })().then(() => { batchPromise = null; render(); });
    return batchPromise;
  }

  /* ---------------- tasks / curriculum ---------------- */
  // v13: task hours come from the student's own pace, not padded defaults.
  // The pace he picks on signup is his average for a typical (medium) lecture;
  // easy tasks scale down a bit and hard ones scale up.
  const PACE_SCALE = [0.75, 1, 1.5]; // by difficulty 1..3
  const paceStudyMin = () => (state.pace && +state.pace.study) || 60;
  const paceSolveMin = () => (state.pace && +state.pace.solve) || 20;
  const paceStudyH = (d) => Math.round(paceStudyMin() * PACE_SCALE[d - 1] / 60 * 4) / 4;
  const paceSolveH = (d) => Math.round(paceSolveMin() * PACE_SCALE[d - 1] / 60 * 4) / 4;

  function mkTask(title, kind, diff, src) {
    const est = Scheduler.estimate(title, kind);
    const d = diff || est.difficulty;
    return {
      id: uid(), kind, title, difficulty: d,
      studyH: kind === 'clinic' ? 0 : paceStudyH(d),
      solveH: kind === 'clinic' ? 0 : paceSolveH(d),
      workH: kind === 'clinic' ? Scheduler.CLINIC_H[d - 1] : 0,
      due: null, done: false, confidence: 0, src: src || '',
    };
  }

  // Official curriculum entries for the student's year that are not added yet.
  const curForYear = () => (yearNum() >= 1 && yearNum() <= 5 ? Curriculum.subjectsForYear(yearNum()) : []);
  const curMissing = () => curForYear().filter((c) => !state.subjects.some((s) => (s.code && s.code === c.code) || Curriculum.find(s.name, s.code) === c));
  const curName = (c) => (state.lang === 'en' ? c.en : c.ar);

  function addFromCur(code) {
    const c = curForYear().find((x) => x.code === code);
    if (!c || state.subjects.some((s) => s.code === code)) return;
    state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    save(); render();
  }

  function loadCur() {
    curMissing().forEach((c) => {
      state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    });
    save(); render();
  }

  // Estimated topic suggestions for a subject: topics not already among its tasks.
  function topicSugg(sj) {
    const tps = Curriculum.topicsFor(sj.name, sj.code);
    return tps.map((tp, i) => Object.assign({ _i: i }, tp))
      .filter((tp) => !sj.tasks.some((t) => {
        const n = Curriculum.norm(t.title);
        return n === Curriculum.norm(tp.ar) || n === Curriculum.norm(tp.en);
      }));
  }

  const dayLabel = (d, today) => {
    const diff = Scheduler.diffDays(today, d);
    return (diff === 0 ? L().today : diff === 1 ? L().tomorrow : L().days[Scheduler.weekday(d)]) + ' ' + d.slice(5).replace('-', '/');
  };

  function toast(msg) {
    let el = $('toast');
    el.textContent = msg; el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2200);
  }

  const sessionTag = (s) =>
    s.type === 'solve' ? `<span class="tag solve">${esc(L().tagSolve)}</span>`
    : s.type === 'revise' ? `<span class="tag revise">${esc(L().tagRevise)}</span>`
    : s.type === 'review' ? `<span class="tag review">${esc(L().tagReview)}</span>`
    : s.type === 'examreview' ? `<span class="tag review">${esc(L().tagExamReview)}</span>`
    : s.type === 'clinic' ? `<span class="tag clinic">${esc(L().tagClinic)}</span>` : '';

  function sessionRow(s, sj) {
    const title = s.type === 'review' ? L().generalReview : s.type === 'examreview' ? L().examReviewTitle : s.title;
    const doneable = s.lectureId && (s.type === 'study' || s.type === 'solve' || s.type === 'clinic');
    const time = s.startMin != null ? `<span class="muted hrs" dir="ltr">${fmtClockRange(s.startMin, s.endMin)}</span>` : '';
    return `<div class="sess subjline" style="border-inline-start-color:${colorOfS(sj)}"><span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span><div class="grow"><b>${esc(sj.name)}</b> - ${esc(title)} ${sessionTag(s)}</div>${time}<span class="muted hrs">${fmtHTxt(s.hours)}</span>` +
      (doneable ? `<button class="btn ghost" data-act="done" data-s="${sj.id}" data-l="${s.lectureId}">${esc(L().doneBtn)}</button>` : '') + '</div>';
  }

  function busyRow(b) {
    return `<div class="sess busyrow"><span class="sicon" style="background:#64748b22">${KIND_ICON[b.kind] || KIND_ICON.other}</span><div class="grow muted">${esc(b.label || L().kindWord[b.kind] || '')}</div><span class="muted hrs" dir="ltr">${fmtClockRange(b.s, b.e)}</span></div>`;
  }

  /* ---------------- views ---------------- */

  const cdText = (targetMs) => {
    const c = Scheduler.countdownParts(targetMs, Date.now());
    return c.past ? L().cdNow : L().cdText(c.days, c.hours, c.minutes);
  };

  function warnCards(today) {
    let h = '';
    Scheduler.warnings(state, today).forEach((w) => {
      const head = w.examDate && w.examDate >= today
        ? L().warnExam(w.name, w.examDate, Scheduler.diffDays(today, w.examDate), fmtHTxt(w.hoursShort))
        : L().warnNoDate(w.name, fmtHTxt(w.hoursShort));
      h += `<div class="card warn"><div>${esc(head)}</div><ol class="warnlist">` +
        w.tasks.slice(0, 3).map((t, i) => `<li>${esc(L().warnTask(i + 1, t.title, fmtHTxt(t.hours)))}</li>`).join('') +
        (w.openCount > 3 ? `<li class="muted">${esc(L().warnMore(w.openCount - 3))}</li>` : '') + '</ol></div>';
    });
    return h;
  }

  function examRowFor(s, ex, today) {
    return `<div class="sess examrow"><div class="grow">📝 <b>${esc(s.name)}</b> - ${esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature))}</div></div>`;
  }

  function viewDay() {
    const today = todayStr();
    const now = new Date();
    const name = (state.profile.name || '').trim().split(/\s+/)[0];
    // morning greeting from 5 AM to noon, evening greeting the rest of the day
    const greet = (now.getHours() >= 5 && now.getHours() < 12 ? L().greetingAm : L().greetingPm)(name);
    // v13: a random encouragement line each day (not a fixed rotation)
    const motivLines = L().motiv || [];
    if (motivLines.length && state.motivDate !== today) {
      let i = Math.floor(Math.random() * motivLines.length);
      if (motivLines.length > 1 && i === state.motivIdx) i = (i + 1) % motivLines.length;
      state.motivDate = today; state.motivIdx = i; save();
    }
    const motiv = motivLines.length && state.motivIdx >= 0 ? motivLines[state.motivIdx % motivLines.length] : '';
    let h = `<div class="hero"><div class="grow"><b class="hero-title">${esc(greet)}</b>` +
      (motiv ? `<div><span class="motiv">${esc(motiv)}</span></div>` : '') +
      `<div class="muted" style="margin-top:6px">${esc(L().myDaySub)}</div></div></div>`;
    if (!state.subjects.length) {
      h += `<div class="card empty"><div class="big">🦷</div><p>${esc(L().noPlan)}</p></div>`;
      if (curMissing().length) h += `<div class="card"><button class="btn" data-act="loadCur" style="width:100%">${esc(L().loadCurBtn)}</button></div>`;
      return h;
    }
    // v19: week strip (Saturday-start week), tap a day to see its plan
    const viewDate = (dayViewDate && dayViewDate !== today) ? dayViewDate : null;
    const schedDate = viewDate || today;
    const perDayD = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDayD[f.date] = (perDayD[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s2) => s2.tasks.forEach((tk) => { if (tk.done && tk.doneAt) perDayD[tk.doneAt] = perDayD[tk.doneAt] || 1; }));
    const wd0 = Scheduler.weekday(today); // 0 = Sunday
    const weekStart = Scheduler.addDays(today, -((wd0 + 1) % 7)); // back to Saturday
    h += '<div class="wkstrip">' + [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const d = Scheduler.addDays(weekStart, i);
      const sel = schedDate === d;
      return `<button class="wkcell${d === today ? ' now' : ''}${sel ? ' sel' : ''}" data-act="pickDay" data-d="${d}"><span class="wkname">${esc(L().daysShort[Scheduler.weekday(d)])}</span><b class="wknum">${+d.slice(8)}</b>${perDayD[d] ? '<i class="wkdot"></i>' : '<i class="wkdot off"></i>'}</button>`;
    }).join('') + '</div>';

    h += warnCards(today);
    // v20: the day's suggested plan (today only, not while previewing another day)
    if (!viewDate) h += planCard(today, now.getHours() * 60 + now.getMinutes());
    if (!viewDate) h += reviewCard(today); // v20: lectures finished a while ago

    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const stats = Scheduler.focusStats(state.focusLog, today);
    const plannedMin = Math.round(r.sessions.filter((x) => x.date === today).reduce((a, x) => a + x.hours, 0) * 60);
    const doneTasksMin = Math.round(state.subjects.reduce((a, s) => a + s.tasks.reduce((a2, t) =>
      a2 + (t.done && t.doneAt === today ? (t.kind === 'clinic' ? (t.workH || 0) : (t.studyH || 0) + (t.solveH || 0)) : 0), 0), 0) * 60);
    const doneMin = stats.todayMin + doneTasksMin;
    const pct = plannedMin > 0 ? Math.min(100, Math.round(doneMin / plannedMin * 100)) : (doneMin > 0 ? 100 : 0);
    // stats row: three simple mini cards (progress %, studied today, this week)
    h += `<div class="statrow">
      <div class="statcard"><div class="sc-label">${esc(L().statTodayShort)}</div><div class="sc-num">${pct}%</div><div class="bar slim"><i style="width:${pct}%"></i></div></div>
      <div class="statcard"><div class="sc-label">${esc(L().statStudiedShort)}</div><div class="sc-num">${esc(fmtDur(doneMin))}</div><div class="sc-sub muted">${plannedMin > 0 ? esc(L().planOf(fmtDur(plannedMin))) : ''}</div></div>
      <div class="statcard"><div class="sc-label">${esc(L().statWeekShort)}</div><div class="sc-num">${esc(fmtDur(stats.weekMin))}</div><div class="sc-sub muted">${esc(L().statSessions(stats.sessions))}</div></div>
    </div>`;
    if ((state.blocked || []).includes(today)) h += `<div class="card offday">${esc(L().dayOffToday)}</div>`;

    // dark focus card with the start button (like the reference's focus card, simplified)
    h += `<div class="card focuscard"><div class="row"><div class="grow"><div class="fc-title">\uD83C\uDFAF ${esc(L().focusCardTitle)}</div><div class="fc-sub">${esc(L().focusCardSub)}</div></div>
      <button class="btn fcbtn" data-act="focusOpen">${esc(L().startStudying)}</button></div></div>`;
    if (!viewDate) h += workoutCard(today); // v20

    // the selected day's schedule: commitments and study sessions in one chronological timeline
    const items = [];
    blocksForDate(schedDate).forEach((b) => items.push({ m: b.s, html: busyRow(b) }));
    r.sessions.filter((x) => x.date === schedDate).forEach((x) => {
      const sj = subj(x.subjectId);
      if (sj) items.push({ m: x.startMin == null ? 1e9 : x.startMin, html: sessionRow(x, sj) });
    });
    items.sort((a, b) => a.m - b.m);
    const schedTitle = viewDate ? `${esc(L().daysShort[Scheduler.weekday(viewDate)])} ${+viewDate.slice(8)}/${+viewDate.slice(5, 7)}` : esc(L().todaySchedule);
    h += `<div class="day today">${schedTitle}</div>`;
    if (viewDate) h += `<div style="margin:0 0 8px"><button class="btn ghost sm" data-act="pickDay" data-d="${today}">${esc(L().backToday)}</button></div>`;
    h += '<div class="card">';
    if (!items.length) h += `<div class="muted" style="padding:6px 2px">${esc(viewDate ? L().emptyDay : L().emptyToday)}</div>`;
    items.forEach((it) => { h += it.html; });
    h += '</div>';
    if (!viewDate) h += `<div class="row" style="margin:-4px 0 12px"><button class="btn ghost sm grow" data-act="shareSchedImg">📤 ${esc(L().shareSchedImg)}</button><button class="btn ghost sm grow" data-act="shareSchedLink">🔗 ${esc(L().shareSchedLink)}</button></div>`;

    // v14: tasks finished today stay visible with a check and can be un-done
    const doneToday = [];
    state.subjects.forEach((s) => s.tasks.forEach((t) => { if (t.done && t.doneAt === today) doneToday.push({ s, t }); }));
    if (doneToday.length) {
      h += `<div class="day">${esc(L().doneTodayTitle)}</div><div class="card">`;
      doneToday.forEach(({ s, t }) => {
        h += `<div class="lec done"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
          <span class="t grow">✔ ${esc(t.title)}<br><span class="muted">${esc(s.name)} · ${esc(L().diff[t.difficulty - 1] || '')}</span></span>
          <button class="btn ghost sm" data-act="undone" data-s="${s.id}" data-l="${t.id}">${esc(L().undoBtn)}</button></div>`;
      });
      h += '</div>';
    }

    // required tasks
    const open = [];
    state.subjects.forEach((s) => s.tasks.forEach((t) => { if (!t.done) open.push({ s, t, rem: Scheduler.taskRemainingMin(t) }); }));
    open.sort((a, b) => {
      const ea = examOf(a.s), eb = examOf(b.s);
      const da = a.t.due || (ea && ea.date) || '9999', db = b.t.due || (eb && eb.date) || '9999';
      return da.localeCompare(db) || b.rem - a.rem;
    });
    h += `<div class="day">${esc(L().requiredTasks)}</div><div class="card">`;
    if (!open.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noOpenTasks)}</div>`;
    open.slice(0, 6).forEach(({ s, t, rem }) => {
      h += `<div class="lec"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>
        <span class="t grow">${esc(t.title)}<br><span class="muted">${esc(s.name)} · ${fmtDur(rem)}</span></span>
        <button class="btn ghost sm" data-act="focusTask" data-s="${s.id}" data-l="${t.id}" title="${esc(L().focusTitle)}">▶</button></div>`;
    });
    h += '</div>';

    // deadlines & exams
    h += `<div class="day">${esc(L().deadlinesTitle)}</div><div class="card">`;
    const dl = [];
    state.subjects.forEach((s) => {
      const ex = examOf(s);
      if (ex && ex.date >= today) dl.push({ d: ex.date, html: `<div class="sess"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span><div class="grow"><b>${esc(s.name)}</b> - ${esc(L().examLine(ex.kind, ex.date, fmtClock(ex.time), L().natureWord[ex.nature] || ex.nature))}</div><span class="tag">${esc(L().daysLeft(Scheduler.diffDays(today, ex.date)))}</span></div>` });
    });
    state.subjects.forEach((s) => s.tasks.forEach((t) => {
      if (!t.done && t.due && t.due >= today) dl.push({ d: t.due, html: `<div class="sess"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span><div class="grow">${esc(t.title)} <span class="muted">${esc(s.name)}</span></div><span class="tag clinic">${esc(L().dueOn(t.due.slice(5).replace('-', '/')))}</span></div>` });
    }));
    dl.sort((a, b) => a.d.localeCompare(b.d));
    if (!dl.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noDeadlines)}</div>`;
    dl.slice(0, 5).forEach((x) => { h += x.html; });
    h += '</div>';

    // study stats
    const max = Math.max(1, ...stats.days.map((d) => d.minutes));
    h += `<div class="day">${esc(L().statsTitle)}</div><div class="card"><div class="stats7">` +
      stats.days.map((d) => `<div class="stcol${d.date === today ? ' now' : ''}"><span class="stmin">${d.minutes || ''}</span><div class="stbar"><i style="height:${Math.round(d.minutes / max * 100)}%"></i></div><span class="std">${esc(L().daysShort[Scheduler.weekday(d.date)])}</span></div>`).join('') +
      `</div><div class="row" style="margin-top:10px"><span class="tag">${esc(L().statToday(fmtDur(stats.todayMin)))}</span><span class="tag">${esc(L().statWeek(fmtDur(stats.weekMin)))}</span><span class="tag">${esc(L().statSessions(stats.sessions))}</span></div></div>`;
    return h;
  }

  function viewSchedule() {
    const today = todayStr();
    if (!state.subjects.length) return `<div class="card empty"><div class="big">🦷</div><p>${esc(L().noPlan)}</p></div>`;
    const now = new Date();
    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const byDay = {};
    r.sessions.forEach((s) => (byDay[s.date] = byDay[s.date] || []).push(s));
    const examsByDay = {};
    state.subjects.forEach((s) => { const ex = examOf(s); if (ex) examsByDay[ex.date] = { subject: s, exam: ex }; });
    let h = '';
    const end = Scheduler.addDays(today, 14);
    for (let d = today; d < end; d = Scheduler.addDays(d, 1)) {
      const sess = byDay[d] || [];
      const tot = sess.reduce((a, s) => a + s.hours, 0);
      const off = (state.blocked || []).includes(d);
      h += `<div class="day ${d === today ? 'today' : ''}">${dayLabel(d, today)}${tot ? ` <span class="tag free">${fmtHTxt(tot)}</span>` : ''}${off ? ` <span class="tag revise">${esc(L().dayOffTag)}</span>` : ''}</div><div class="card">`;
      const items = [];
      if (examsByDay[d]) {
        const e = examsByDay[d];
        const tm = Scheduler.hmToMin(e.exam.time);
        items.push({ m: tm == null ? 0 : tm, html: examRowFor(e.subject, e.exam, today) });
      }
      blocksForDate(d).forEach((b) => items.push({ m: b.s, html: busyRow(b) }));
      sess.forEach((s2) => { const sj = subj(s2.subjectId); if (sj) items.push({ m: s2.startMin == null ? 1e9 : s2.startMin, html: sessionRow(s2, sj) }); });
      items.sort((a, b) => a.m - b.m);
      if (!items.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noSessDay)}</div>`;
      items.forEach((it) => { h += it.html; });
      h += '</div>';
    }
    return h;
  }

  function viewExams() {
    const today = todayStr();
    const ups = state.subjects.filter((s) => examOf(s) && s.exam.date >= today).sort((a, b) => a.exam.date.localeCompare(b.exam.date));
    const nx = Scheduler.nextExam(state, today);
    let h = '';
    if (!ups.length) h += `<div class="card empty"><div class="big">📝</div><p>${esc(L().noExamsCenter)}</p></div>`;
    if (nx) {
      const target = new Date(nx.date + 'T' + (Scheduler.hmToMin(nx.time) != null ? nx.time : '09:00') + ':00').getTime();
      const sj = subj(nx.subjectId);
      const col = sj ? colorOfS(sj) : 'var(--primary)';
      h += `<div class="card pcard" style="border-inline-start-color:${col}"><div class="muted">${esc(L().nextExamTitle)}</div>
        <div class="row" style="margin-top:6px"><span class="sicon" style="background:${col}22">${sj ? iconOf(sj) : '📝'}</span>
        <b class="grow">${esc(nx.name)}</b><span class="muted">${esc(L().examLine(nx.kind, nx.date, fmtClock(nx.time), L().natureWord[nx.nature] || nx.nature))}</span></div>
        <div class="cdnum" data-cd="${target}" dir="auto">${esc(cdText(target))}</div></div>`;
    }
    if (ups.length) {
      h += `<div class="day">${esc(L().examTableTitle)}</div>`;
      ups.forEach((s) => {
      const ex = s.exam, dleft = Scheduler.diffDays(today, ex.date);
      h += `<div class="card pcard" style="border-inline-start-color:${colorOfS(s)}"><div class="row"><span class="sicon" style="background:${colorOfS(s)}22">${iconOf(s)}</span>

  }

        </div>`;
      if (exOpen) {

        if (ex) h += `<button class="btn ghost" data-act="clearExam" data-s="${s.id}" style="margin-top:6px">${esc(L().clearExam)}</button>`;
      }
      {
        const k = taskKind[s.id] || 'lecture';

            <button class="${k === 'lecture' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="lecture">📖 ${esc(L().kindLecture)}</button>
            ${clinicAllowed()
              ? `<button class="${k === 'clinic' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="clinic">🦷 ${esc(L().kindClinic)}</button>`
              : `<button disabled title="${esc(L().clinicLocked)}">🔒 ${esc(L().kindClinic)}</button>`}
          </div>
          ${clinicAllowed() ? '' : `<div class="muted" style="margin-bottom:6px">${esc(L().clinicLocked)}</div>`}

          <div class="row" style="margin-top:8px">

            <select id="td-${s.id}" data-act="tdiff" data-s="${s.id}"><option value="0">${esc(L().estAuto)}</option>
              <option value="1">${esc(L().diff[0])}</option><option value="2">${esc(L().diff[1])}</option><option value="3">${esc(L().diff[2])}</option></select>
            ${k === 'clinic' ? `<input id="tdue-${s.id}" type="date" title="${esc(L().duePh)}">` : ''}
            <button class="btn" data-act="addTask" data-s="${s.id}">${esc(L().addTaskBtn)}</button></div>`;
        const sugg = k === 'lecture' ? topicSugg(s).slice(0, 8) : [];
        if (sugg.length) {

            '</div>';

        h += '</div>';
