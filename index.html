            (t.src === 'est' ? ' · ' + L().estBadge : '');
          if (t.src === 'batch') estTxt += ' · ' + L().batchFromTag;
          if (t.week) estTxt += ' · ' + L().weekShort(t.week);
          h += `<div class="lec ${t.done ? 'done' : ''}"><input type="checkbox" data-act="check" data-s="${s.id}" data-l="${t.id}" ${t.done ? 'checked' : ''}>
            <span class="t grow">${t.kind === 'clinic' ? '🦷 ' : '📖 '}${esc(t.title)}<br><span class="muted">${esc(estTxt)}</span></span>
            ${t.done && t.kind === 'lecture' ? `<select data-act="conf" data-s="${s.id}" data-l="${t.id}"><option value="0">${esc(L().confPh)}</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${t.confidence === n ? 'selected' : ''}>${n}/5</option>`).join('')}</select>` : ''}
            <button class="btn ghost sm" data-act="noteT" data-s="${s.id}" data-l="${t.id}" title="${esc(L().noteBtn)}">🗒</button>
            <button class="btn ghost sm" data-act="aiT" data-l="${t.id}" title="${esc(L().aiBtn)}">✨</button>
            <button class="btn ghost sm" data-act="attT" data-l="${t.id}" title="${esc(L().attBtn)}">📎${(attMeta[t.id] || []).length ? ' ' + (attMeta[t.id] || []).length : ''}</button>
            <button class="btn ghost" data-act="delTask" data-s="${s.id}" data-l="${t.id}">x</button></div>` +
            (aiOpen === t.id ? aiPanel(s, t) : '') +
            (attOpen === t.id ? attPanel(s, t) : '') +
            (noteOpen === t.id
              ? `<textarea class="notebox" data-act="note" data-s="${s.id}" data-l="${t.id}" placeholder="${esc(L().notePh)}">${esc(t.note || '')}</textarea>`
              : (t.note ? `<div class="noteview muted">${esc(t.note)}</div>` : ''));
        });
      }
      h += '</div>';
    }
    return h;
  }

  function daysEditorHTML() {
    const today = todayStr();
    const wdToday = Scheduler.weekday(today);
    if (timeDay == null) timeDay = wdToday;
    let h = `<div class="card"><b>${esc(L().busyTitle)}</b><div class="muted" style="margin-top:4px">${esc(L().busySub)}</div></div>`;
    L().days.forEach((name, i) => {
      const blocks = (state.busy[i] || []).map(Scheduler.normBlock)
        .filter((b) => b.start != null && b.end != null && b.start !== b.end && b.kind !== 'sleep')
        .sort((a, b) => a.start - b.start);
      const draft = draftBusy[i] || [];
      const ref = Scheduler.addDays(today, (i - wdToday + 7) % 7);
      const free = Scheduler.capacityOn({ busy: state.busy, sleep: state.sleep, blocked: [] }, ref);
      const open = timeDay === i;
      h += `<div class="card"><div class="row dayhead" data-act="toggleDay" data-i="${i}" style="cursor:pointer">
        <b class="grow">${esc(name)}${i === wdToday ? ' <span class="tag">' + esc(L().today) + '</span>' : ''}</b>
        <span class="tag free">${esc(L().dayFree(fmtHTxt(free)))}</span>
        <span class="muted" style="font-weight:800">${open ? '\u2212' : '+'}</span></div>`;
      if (open) {
        const sb = Scheduler.sleepBlock(state, i);
        const sbEnd = fmtClock(Scheduler.hmToMin(sb.start) + Scheduler.SLEEP_MIN);
        h += `<div class="lec sleepfix"><span class="sicon" style="background:#64748b22">${KIND_ICON.sleep}</span>

        blocks.forEach((b) => {
          h += `<div class="lec"><span class="sicon" style="background:#64748b22">${KIND_ICON[b.kind]}</span>

        });
        draft.forEach((b, di) => {
          h += `<div class="lec draftrow"><span class="sicon" style="background:#64748b22">${KIND_ICON[b.kind]}</span>
            <span class="t grow">${esc(b.label || L().kindWord[b.kind])} <span class="tag revise">${esc(L().draftTag)}</span><br><span class="muted" dir="ltr">${fmtClockRange(b.start, b.end)}</span></span>
            <button class="btn ghost" data-act="delDraft" data-i="${i}" data-d="${di}">x</button></div>`;

        <button class="btn ghost" data-act="delOff" data-d="${d}">x</button></div>`;

    h += `</div><div class="card"><b>${esc(L().onceTitle)}</b>
      <div class="row" style="margin-top:10px"><input id="o1Date" type="date"><input id="o1Label" class="grow" placeholder="${esc(L().busyOncePh)}"></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><span class="muted">${esc(L().fromPh)}</span>${tpHTML('o1s', '09:00')}
      <span class="muted">${esc(L().toPh)}</span>${tpHTML('o1e', '17:00')}</div>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="addBusyOnce">${esc(L().addBtn)}</button></div>`;

  // v14: progress dashboard - every number comes from data the app really has
  // (tasks done + focus log); nothing here is estimated or faked.
  // v19: flame streak - a day counts with >=1 lecture done or >=60 study minutes
  function streakCalc(today) {
    const st = state.streak;
    const perDayM = {}, lecDay = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDayM[f.date] = (perDayM[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s2) => s2.tasks.forEach((tk) => {
      if (tk.done && tk.doneAt) {
        perDayM[tk.doneAt] = (perDayM[tk.doneAt] || 0) + Math.round(((tk.studyH || 0) + (tk.solveH || 0) + (tk.workH || 0)) * 60);
        if (tk.kind === 'lecture') lecDay[tk.doneAt] = (lecDay[tk.doneAt] || 0) + 1;
      }
    }));
    const counted = (d) => (lecDay[d] || 0) >= 1 || (perDayM[d] || 0) >= 60 || st.fills.indexOf(d) !== -1;
    let cur = 0;
    for (let d = today; ; d = Scheduler.addDays(d, -1)) {
      if (counted(d)) cur++;
      else if (d === today) continue;
      else break;
    }
    if (cur > (st.best || 0)) st.best = cur;
    const mk = today.slice(0, 7);
    if (st.month !== mk) { st.month = mk; st.used = 0; }
    const left = Math.max(0, 3 - (st.used || 0));
    const y = Scheduler.addDays(today, -1), y2 = Scheduler.addDays(today, -2);
    const canRestore = left > 0 && !counted(y) && counted(y2);
    return { cur, best: st.best || 0, canRestore, left };
  }

  /* ---------------- v20: review queue, workout, subject stats, challenge ---------------- */

  // Lectures finished 3+ days ago (and a week ago) that have not been looked at
  // since. Clinics are not in here, only lecture material.
  function reviewQueue(today) {
    const out = [];
    state.subjects.forEach((s) => (s.tasks || []).forEach((t) => {
      if (!t.done || !t.doneAt || t.kind === 'clinic') return;
      const age = Scheduler.diffDays(t.doneAt, today);
      if (age < 3) return;
      const last = (state.reviewLog || {})[t.id];
      if (last && Scheduler.diffDays(last, today) < 4) return;
      out.push({ s, t, label: age >= 7 ? L().rev7 : L().rev3, age });
    }));
    out.sort((a, b) => b.age - a.age);
    return out.slice(0, 3);
  }

    const q = reviewQueue(today);
    if (!q.length) return '';

  function dashHTML() {
    if (!state.subjects.length) return '';
    const today = todayStr();
    // minutes per day = focus sessions + hours of tasks finished that day
    const perDay = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDay[f.date] = (perDay[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s) => s.tasks.forEach((t) => {
      if (t.done && t.doneAt) perDay[t.doneAt] = (perDay[t.doneAt] || 0) + Math.round(((t.studyH || 0) + (t.solveH || 0) + (t.workH || 0)) * 60);
    }));
    const last7 = [];
    for (let i = 6; i >= 0; i--) { const d = Scheduler.addDays(today, -i); last7.push({ d, m: perDay[d] || 0 }); }
    const weekMin = last7.reduce((a, x) => a + x.m, 0);
    // planned minutes for the same 7 days, from the generated schedule
    const now = new Date();
    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const in7 = {};
    last7.forEach((x) => { in7[x.d] = 1; });
    const planMin = Math.round(r.sessions.filter((x) => in7[x.date]).reduce((a, x) => a + x.hours, 0) * 60);
    const weekPct = planMin > 0 ? Math.min(100, Math.round(weekMin / planMin * 100)) : (weekMin > 0 ? 100 : 0);
    // readiness: share of all tasks done, and days to the nearest exam
    const totT = state.subjects.reduce((a, s) => a + s.tasks.length, 0);
    const doneT = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done).length, 0);
    const readyPct = totT ? Math.round(doneT / totT * 100) : 0;
    const nx = Scheduler.nextExam(state, today);
    // streak: consecutive studied days, not breaking on a still-young today
    let streak = 0;
    for (let d = today; ; d = Scheduler.addDays(d, -1)) {
      if (perDay[d]) streak++;
      else if (d === today) continue;
      else break;
    }
    const lecDone = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done && t.kind === 'lecture').length, 0);
    const focusMin = (state.focusLog || []).reduce((a, f) => a + (f.minutes || 0), 0);
    // ring geometry
    const RR = 26, CC = 2 * Math.PI * RR;
    const ringOff = (CC * (1 - readyPct / 100)).toFixed(1);
    // last-7-days bar chart (v18: simple bars, today highlighted)
    const W = 300, H = 84, maxM = Math.max(30, ...last7.map((x) => x.m));
    const bw = 26, bgap = (W - 7 * bw) / 6;
    const bars = last7.map((x, i) => {
      const bh = Math.max(3, Math.round((x.m / maxM) * (H - 12)));
      return `<rect x="${Math.round(i * (bw + bgap))}" y="${H - bh}" width="${bw}" height="${bh}" rx="6"${x.d === today ? '' : ' class="dim"'}><title>${x.m}</title></rect>`;
    }).join('');
    // heatmap: last 12 weeks x 7 weekdays
    const todayW = Scheduler.weekday(today);
    let heat = '';
    for (let col = 11; col >= 0; col--) {
      heat += '<div class="hcol">';
      for (let row = 0; row < 7; row++) {
        const d = Scheduler.addDays(today, -(col * 7 + (todayW - row)));
        const future = d > today;
        const m = future ? -1 : (perDay[d] || 0);
        const lv = m < 0 ? 'hx' : m === 0 ? 'h0' : m < 30 ? 'h1' : m < 90 ? 'h2' : 'h3';
        heat += `<i class="hcell ${lv}" title="${d}"></i>`;
      }
      heat += '</div>';
    }
    const ringOffW = (CC * (1 - weekPct / 100)).toFixed(1);
    let h = `<div class="day">${esc(L().dashTitle)}</div>`;
    h += `<div class="dashrow">
      <div class="card dashcard"><div class="muted">${esc(L().dashWeek)}</div>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${RR}" class="ringbg"/><circle cx="32" cy="32" r="${RR}" class="ringfg" style="stroke-dasharray:${CC.toFixed(1)};stroke-dashoffset:${ringOffW}"/><text x="32" y="37" text-anchor="middle" class="ringtxt">${weekPct}%</text></svg>
        <div class="muted sml" style="text-align:center">${esc(fmtDur(weekMin))}${planMin ? ' / ' + esc(fmtDur(planMin)) + ' ' + esc(L().dashPlan) : ''}</div></div>
      <div class="card dashcard"><div class="muted">${esc(L().dashReady)}</div>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${RR}" class="ringbg"/><circle cx="32" cy="32" r="${RR}" class="ringfg" style="stroke-dasharray:${CC.toFixed(1)};stroke-dashoffset:${ringOff}"/><text x="32" y="37" text-anchor="middle" class="ringtxt">${readyPct}%</text></svg>
        <div class="muted sml" style="text-align:center">${doneT}/${totT} ${esc(L().dashTasksDone)}${nx ? ' · ' + esc(L().daysLeft(Scheduler.diffDays(today, nx.date))) : ' · ' + esc(L().dashNoExam)}</div></div>
    </div>`;
    const sk = streakCalc(today);
    h += `<div class="card streakcard"><div class="row"><div class="grow"><span class="sknum">🔥 ${sk.cur}</span> <span class="muted sml">${esc(L().streakDays)} · ${esc(L().streakBest)}: ${sk.best}</span></div>
      ${sk.canRestore
        ? `<div style="text-align:center"><button class="btn sm" data-act="streakRestore">${esc(L().streakRestore)}</button><div class="muted sml" style="margin-top:4px">${esc(L().streakLeft(sk.left))}</div></div>`
        : (sk.left < 3 ? `<span class="muted sml">${esc(L().streakLeft(sk.left))}</span>` : '')}</div></div>`;
    h += `<div class="card tilesrow"><div class="tile"><div class="tnum">${lecDone}</div><div class="muted sml">${esc(L().dashDoneLec)}</div></div>
      <div class="tile"><div class="tnum">${focusMin}</div><div class="muted sml">${esc(L().dashFocusMin)}</div></div>
      <div class="tile"><div class="tnum">${sk.cur}</div><div class="muted sml">${esc(L().dashStreak)}</div></div></div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashLast7)}</div>
      <svg class="barch" viewBox="0 0 ${W} ${H}">${bars}</svg>
      <div class="row" style="justify-content:space-between">${last7.map((x) => `<span class="muted sml">${esc(L().daysShort[Scheduler.weekday(x.d)])}</span>`).join('')}</div></div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashHeat)}</div>
      <div class="heat" dir="ltr">${heat}</div>
      <div class="row" style="justify-content:flex-end;gap:4px;align-items:center;margin-top:6px"><span class="muted sml">${esc(L().dashLess)}</span><i class="hcell h0"></i><i class="hcell h1"></i><i class="hcell h2"></i><i class="hcell h3"></i><span class="muted sml">${esc(L().dashMore)}</span></div></div>`;
    return h;
  }

  /* ---------------- focus mode (pomodoro) ---------------- */

  function logFocus(sid, tid, minutes) {
    const t = taskOf(sid, tid);
    if (t) {
      Scheduler.deductFromTask(t, minutes);
      if (Scheduler.taskRemainingMin(t) <= 0) setTimeout(() => toast(L().focusTaskDone), 2400);
    }
    (state.focusLog = state.focusLog || []).push({ id: uid(), taskId: tid, subjectId: sid, date: todayStr(), minutes, at: Date.now() });
    save();
    toast(L().focusLogged(minutes));
  }

  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      beepCtx = beepCtx || new AC();
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.connect(g); g.connect(beepCtx.destination);
      o.frequency.value = 880; g.gain.value = 0.07;
      o.start(); o.stop(beepCtx.currentTime + 0.35);
    } catch (e) {}
  }

  const mmss = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

  function updateFocusText() {
    const el = $('focusTimer');
    if (el && focusRun) {
      const remain = focusRun.paused ? focusRun.remainMs : (focusRun.endsAt ? focusRun.endsAt - Date.now() : 0);
      el.textContent = focusRun.phase === 'ready' ? '✓' : mmss(remain);
    }
  }

  // v19: fires a local notification once a day, at the chosen time, if the
  // day's goal is not done yet. Works only while the app is open (no server).
  function checkReminder() {
    const rm = state.remind;
    if (!rm || !rm.on) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const key = todayStr();
    if (rm.last === key) return;
    const parts = (rm.time || '20:00').split(':');
    const tMin = (+parts[0]) * 60 + (+parts[1] || 0);
    const nw = new Date();
    if (nw.getHours() * 60 + nw.getMinutes() < tMin) return;
    const r = Scheduler.generate(state, key, {});
    const planned = Math.round(r.sessions.filter((x) => x.date === key).reduce((a, x) => a + x.hours, 0) * 60);
    const stats = Scheduler.focusStats(state.focusLog, key);
    const doneT = Math.round(state.subjects.reduce((a, s2) => a + s2.tasks.reduce((a2, tk) =>
      a2 + (tk.done && tk.doneAt === key ? (tk.kind === 'clinic' ? (tk.workH || 0) : (tk.studyH || 0) + (tk.solveH || 0)) : 0), 0), 0) * 60);
    if (planned > 0 && stats.todayMin + doneT >= planned) { rm.last = key; save(); return; }
    rm.last = key; save();
    try { new Notification(L().remNotifTitle, { body: L().remNotifBody, icon: 'icon-192.png' }); } catch (e) { /* ignored */ }
  }

  function tick() {
    const now = Date.now();
    if (!tick.lastRem || now - tick.lastRem > 30000) { tick.lastRem = now; try { checkReminder(); } catch (e) { /* ignored */ } }
    // keep the header clock fresh and roll the app over to the new day at midnight
    const clk = $('clockLbl');
    if (clk) { const c = clockNow(); if (clk.textContent !== c) clk.textContent = c; }
    if (todayStr() !== lastTickDay) { lastTickDay = todayStr(); render(); return; }
    if (focusRun && !focusRun.paused && (focusRun.phase === 'focus' || focusRun.phase === 'break') && focusRun.endsAt && now >= focusRun.endsAt) {
      const p = Scheduler.FOCUS_PRESETS[focusRun.preset] || Scheduler.FOCUS_PRESETS[0];
      if (focusRun.phase === 'focus') {
        logFocus(focusRun.subjectId, focusRun.taskId, focusMinOf(focusRun));
        if (focusRun.review) { (state.reviewLog = state.reviewLog || {})[focusRun.taskId] = todayStr(); save(); }
        focusRun.cycles = (focusRun.cycles || 0) + 1;
        focusRun.phase = 'break';
        focusRun.endsAt = now + p.breakMin * 60000;
        beep();
      } else {
        focusRun.phase = 'ready';
        focusRun.endsAt = 0;
        beep();
      }
      persistFocus();
      render();
    } else {
      if (focusRun) updateFocusText();
      document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = cdText(+el.dataset.cd); });
    }
  }

  /* ---------------- v21: lecture attachments (files stay on this device, in IndexedDB) ---------------- */
  const ATT_MAX = 50 * 1024 * 1024; // per file
  let attOpen = null, attPlay = null, attMeta = {}, attDB = null, attBusy = false, attUsage = null;
  function attOpenDB() {
    return new Promise((resolve, reject) => {
      if (attDB) return resolve(attDB);
      if (!window.indexedDB) return reject(new Error('no-idb'));
      const rq = indexedDB.open('dental-planner-files', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        const m = db.createObjectStore('meta', { keyPath: 'id' }); m.createIndex('task', 'taskId');
        db.createObjectStore('blobs');
      };
      rq.onsuccess = () => { attDB = rq.result; resolve(attDB); };
      rq.onerror = () => reject(rq.error);
    });
  }
  const idbReq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function attLoadMeta() {
    try {
      const db = await attOpenDB();
      const all = await idbReq(db.transaction('meta').objectStore('meta').getAll());
      attMeta = {};
      all.forEach((m) => (attMeta[m.taskId] = attMeta[m.taskId] || []).push(m));
      render();
    } catch (e) { /* storage unavailable: the button just shows an error when used */ }
  }
  async function attAdd(taskId, subjectId, files) {
    attBusy = true;
    const db = await attOpenDB();
    let tooBig = 0, failed = 0, added = 0;
    for (const f of files) {
      if (f.size > ATT_MAX) { tooBig++; continue; }
      const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const meta = { id, taskId, subjectId, name: f.name || 'file', type: f.type || '', size: f.size, added: Date.now() };
      try {
        await new Promise((res, rej) => {
          const tx = db.transaction(['meta', 'blobs'], 'readwrite');
          tx.objectStore('meta').put(meta); tx.objectStore('blobs').put(f, id);
          tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort'));
        });
        (attMeta[taskId] = attMeta[taskId] || []).push(meta); added++;
      } catch (e) { failed++; }
    }
    attBusy = false;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
    if (tooBig) toast(L().attTooBig(Math.round(ATT_MAX / 1048576)));
    else if (failed) toast(L().attFull);
    attRefreshUsage(); render();
  }
  async function attDelete(id, taskId) {
    try {
      const db = await attOpenDB();
      await new Promise((res, rej) => { const tx = db.transaction(['meta', 'blobs'], 'readwrite'); tx.objectStore('meta').delete(id); tx.objectStore('blobs').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { /* ignore */ }
    attMeta[taskId] = (attMeta[taskId] || []).filter((m) => m.id !== id);
    if (attPlay && attPlay.id === id) { try { URL.revokeObjectURL(attPlay.url); } catch (e) { /* ignore */ } attPlay = null; }
    attRefreshUsage(); render();
  }
  async function attDeleteMany(pred) { // when a lecture or a subject is removed
    const ids = [];
    Object.keys(attMeta).forEach((k) => (attMeta[k] || []).forEach((m) => { if (pred(m)) ids.push(m); }));
    for (const m of ids) await attDelete(m.id, m.taskId);
  }
  async function attOpenFile(id, taskId) {
    const m = (attMeta[taskId] || []).find((x) => x.id === id); if (!m) return;
    let w = null;
    const isMedia = /^(audio|video|image)\//.test(m.type);
    if (!isMedia) { try { w = window.open('', '_blank'); } catch (e) { w = null; } } // opened first so the browser allows it
    try {
      const db = await attOpenDB();
      const blob = await idbReq(db.transaction('blobs').objectStore('blobs').get(id));
      if (!blob) { if (w) w.close(); return toast(L().attMissing); }
      const url = URL.createObjectURL(blob.type ? blob : new Blob([blob], { type: m.type || 'application/octet-stream' }));
      if (isMedia) {
        if (attPlay) { try { URL.revokeObjectURL(attPlay.url); } catch (e) { /* ignore */ } }
        attPlay = { id, url, kind: m.type.split('/')[0] }; return render();
      }
      if (m.type === 'application/pdf' && w) { w.location = url; return; }
      if (w) w.close();
      const a = document.createElement('a'); a.href = url; a.download = m.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { if (w) w.close(); toast(L().attMissing); }
  }
  async function attRefreshUsage() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        const own = Object.keys(attMeta).reduce((a, k) => a + (attMeta[k] || []).reduce((x, m) => x + m.size, 0), 0);
        attUsage = { own, usage: e.usage || 0, quota: e.quota || 0 };
      } else {
        attUsage = { own: Object.keys(attMeta).reduce((a, k) => a + (attMeta[k] || []).reduce((x, m) => x + m.size, 0), 0), usage: 0, quota: 0 };
      }
      const el = document.getElementById('attUsage'); if (el) el.innerHTML = attUsageHtml();
    } catch (e) { /* ignore */ }
  }
  const fmtBytes = (n) => '\u2066' + (n >= 1048576 ? (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB') + '\u2069'; // LTR isolate so the unit stays after the number in Arabic text
  function attUsageHtml() {
    if (!attUsage) return '';
    const u = attUsage;
    const ratio = u.quota ? u.usage / u.quota : 0;
    let h = `<span class="muted sml">${esc(L().attUsage(fmtBytes(u.own)))}${u.quota ? ' · ' + esc(L().attQuota(fmtBytes(Math.max(0, u.quota - u.usage)))) : ''}</span>`;
    if (ratio > 0.8) h += `<div class="warnline">${esc(L().attNearFull)}</div>`;
    return h;
  }
  function attPanel(s, t) {
    const list = attMeta[t.id] || [];
    let h = `<div class="attbox"><div class="muted sml">${esc(L().attHint(Math.round(ATT_MAX / 1048576)))}</div>`;
    h += `<label class="btn ghost sm attpick">${esc(L().attAdd)}<input type="file" multiple hidden data-act="attFile" data-s="${s.id}" data-l="${t.id}"></label>`;
    if (!list.length) h += `<div class="muted sml" style="margin-top:6px">${esc(L().attNone)}</div>`;
    list.forEach((m) => {
      const icon = /^audio\//.test(m.type) ? '🎧' : /^image\//.test(m.type) ? '🖼' : m.type === 'application/pdf' ? '📄' : /^video\//.test(m.type) ? '🎬' : '📎';
      h += `<div class="attrow"><span class="grow" dir="auto">${icon} ${esc(m.name)} <span class="muted sml" dir="ltr">${esc(fmtBytes(m.size))}</span></span>
        <button class="btn ghost sm" data-act="attOpenF" data-l="${t.id}" data-f="${m.id}">${esc(/^(audio|video)\//.test(m.type) ? L().attPlayBtn : L().attOpenBtn)}</button>
        <button class="btn ghost sm" data-act="attDel" data-l="${t.id}" data-f="${m.id}">${esc(L().attDelBtn)}</button></div>`;
      if (attPlay && attPlay.id === m.id) {
        h += attPlay.kind === 'audio' ? `<audio controls src="${attPlay.url}" style="width:100%;margin:4px 0"></audio>`
          : attPlay.kind === 'video' ? `<video controls playsinline src="${attPlay.url}" style="width:100%;margin:4px 0;border-radius:10px"></video>`
          : `<img src="${attPlay.url}" alt="" style="max-width:100%;margin:4px 0;border-radius:10px">`;
      }
    });
    h += `<div id="attUsage">${attUsageHtml()}</div><div class="muted sml" style="margin-top:4px">${esc(L().attLocalNote)}</div></div>`;
    return h;
  }

  function copyText(txt) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).catch(() => {}); return true; }
    } catch (e) { /* fall through */ }
    try {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';

  // v21: hand a generated image to the share sheet, or download it when sharing is unavailable.
  async function sendBlob(blob, filename, okMsg) {
    if (!blob) return;
    const file = new File([blob], filename, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* the student cancelled */ }

  // Everything on a day's timeline, in the order it happens.
  function schedItems(date) {
    const out = [];
    blocksForDate(date).forEach((b) => out.push({ m: b.s, time: fmtClockRange(b.s, b.e), subject: b.label || L().kindWord[b.kind] || '', title: '' }));
    let r = { sessions: [] };
    try { r = Scheduler.generate(state, date, {}); } catch (e) { r = { sessions: [] }; }
    r.sessions.filter((x) => x.date === date).forEach((x) => {
      const sj = subj(x.subjectId);
      if (!sj) return;
      const title = x.type === 'review' ? L().generalReview : x.type === 'examreview' ? L().examReviewTitle : x.title;
      out.push({ m: x.startMin == null ? 1e9 : x.startMin, time: x.startMin != null ? fmtClockRange(x.startMin, x.endMin) : '', subject: sj.name, title: title || '' });
    });
    out.sort((a, b) => a.m - b.m);
    return out.slice(0, 12);
  }

  function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(str) { return decodeURIComponent(escape(atob(String(str).replace(/-/g, '+').replace(/_/g, '/')))); }

    if (navigator.share) { navigator.share({ title: L().shareSchedTitle, url }).catch(() => {}); return; }
    try {

        <div class="row" style="margin-top:8px"><button class="btn grow" data-act="authLogin">${esc(L().loginBtn)}</button>
        <button class="btn ghost grow" data-act="authSignup">${esc(L().signupBtn)}</button></div>
        <div style="text-align:center;margin-top:10px"><button class="linklike" data-act="authSkip">${esc(L().skipBtn)}</button></div></div></div>`;
      return h;
    }
    if (outAsk) {
      const anon = !(session && session.email);
      const hasFiles = Object.keys(attMeta).some((k) => (attMeta[k] || []).length);
      return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().outConfirmTitle)}</b>
        <p class="muted" style="margin-top:8px">${esc(anon ? L().outConfirmAnon : L().outConfirmAcc)}</p>
        ${anon && hasFiles ? `<p class="muted err">${esc(L().outConfirmFiles)}</p>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn grow danger" data-act="outYes">${esc(L().outConfirm)}</button>
        <button class="btn ghost grow" data-act="outNo">${esc(L().outCancel)}</button></div></div></div>`;
    }
    if (linkOpen) return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().linkTitle)}</b>
      <p class="muted">${esc(L().linkSub)}</p>
      <input id="lkEmail" type="email" placeholder="${esc(L().emailPh)}" dir="ltr">
      <input id="lkPass" type="password" placeholder="${esc(L().passPh)}" dir="ltr">
      <div id="lkMsg" class="muted" style="min-height:18px;margin-top:6px"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" data-act="linkDo">${esc(L().linkDo)}</button>
      <button class="btn ghost" data-act="linkClose">${esc(L().closeBtn)}</button></div></div></div>`;
    if (tourStep != null) return tourHtml();
    if (fabOpen) {
      const opts = state.subjects.map((s2) => `<option value="${s2.id}">${esc(s2.name)}</option>`).join('');
      return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().addTaskTitle)}</b>
        <div class="muted" style="margin:10px 0 4px">${esc(L().pickSubject)}</div>
        <select id="fabS">${opts}</select>
        <div class="pick" style="margin:8px 0">
          <button class="${fabKind === 'lecture' ? 'on' : ''}" data-act="fabKind" data-k="lecture">📖 ${esc(L().kindLecture)}</button>
          ${clinicAllowed()
            ? `<button class="${fabKind === 'clinic' ? 'on' : ''}" data-act="fabKind" data-k="clinic">🦷 ${esc(L().kindClinic)}</button>`
            : `<button disabled title="${esc(L().clinicLocked)}">🔒 ${esc(L().kindClinic)}</button>`}
        </div>
        <input id="fabT" placeholder="${esc(L().taskTitlePh)}">
        <div class="row" style="margin-top:8px">
          <select id="fabD"><option value="0">${esc(L().estAuto)}</option>
            <option value="1">${esc(L().diff[0])}</option><option value="2">${esc(L().diff[1])}</option><option value="3">${esc(L().diff[2])}</option></select>
          ${fabKind === 'clinic' ? `<input id="fabDue" type="date" title="${esc(L().duePh)}">` : ''}
        </div>
        <div class="row" style="margin-top:12px"><button class="btn grow" data-act="fabAddDo">${esc(L().addTaskBtn)}</button>
        <button class="btn ghost" data-act="fabClose">${esc(L().closeBtn)}</button></div></div></div>`;
    }
    if (!state.profile.onboarded) {
      if (onboardStep === 3) {
        return `<div class="overlay"><div class="sheet wide"><b style="font-size:17px">${esc(L().onboardDaysTitle)}</b>
          <p class="muted">${esc(L().onboardDaysSub)}</p>` + daysEditorHTML() +
          `<div style="margin-top:12px"><button class="btn" data-act="onboardDaysDone" style="width:100%">${esc(L().onboardDaysBtn)}</button></div>
          <div style="text-align:center;margin-top:8px"><button class="linklike" data-act="onboardDaysDone">${esc(L().onboardDaysSkip)}</button></div></div></div>`;
      }
      if (onboardStep === 2) {
        return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().onboardPaceTitle)}</b>
          <p class="muted">${esc(L().onboardPaceSub)}</p>` + paceChipsHTML() +
          `<div style="margin-top:12px"><button class="btn" data-act="paceDone" style="width:100%">${esc(L().paceBtn)}</button></div>
          <div style="text-align:center;margin-top:8px"><button class="linklike" data-act="paceDone">${esc(L().paceSkip)}</button></div></div></div>`;
      }
      h += `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().welcomeTitle)}</b>
        <p class="muted">${esc(L().welcomeSub)}</p>
        <input id="oName" placeholder="${esc(L().yourNamePh)}" value="${esc(state.profile.name || '')}">
        <div class="muted" style="margin:10px 0 6px">${esc(L().pickYear)}</div>
        <div class="yeargrid">`;
      L().years.forEach((y, i) => {
        const locked = OPEN_YEARS.indexOf(i + 1) === -1;
        h += `<button class="ypick ${state.profile.year === i + 1 ? 'on' : ''}${locked ? ' locked' : ''}" data-act="pickYear" data-y="${i + 1}"${locked ? ' disabled' : ''}>${locked ? '🔒 ' : ''}${esc(y)}</button>`;
      });
      h += `</div>${OPEN_YEARS.length < L().years.length ? `<div class="muted" style="margin-top:6px">${esc(L().yearLockNote)}</div>` : ''}<div class="muted" style="margin-top:10px">${esc(L().uniLbl)}: <b>${esc(UNI[state.lang === 'en' ? 'en' : 'ar'])}</b></div>
        <div style="margin-top:12px"><button class="btn" data-act="onboardStart" style="width:100%">${esc(L().startBtn)}</button></div></div></div>`;
      return h;
    }
    if (focusRun) {
      const t = taskOf(focusRun.subjectId, focusRun.taskId);
      const sj = subj(focusRun.subjectId);
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>
        <div class="muted" style="margin-top:4px">${sj ? esc(sj.name) + (t ? ' - ' : '') : ''}${t ? esc(t.title) : ''}</div>
        <div class="fphase"><span class="tag" id="focusPhase">${esc(focusRun.phase === 'focus' ? L().focusPhaseFocus : focusRun.phase === 'break' ? L().focusPhaseBreak : L().focusPhaseReady)}</span>
        <span class="muted">${esc(L().focusCycles(focusRun.cycles || 0))}</span></div>
        <div class="ftimer" id="focusTimer" dir="ltr">--:--</div>
        <div class="row" style="margin-top:12px">`;
      if (focusRun.phase === 'ready') h += `<button class="btn grow" data-act="focusNext">${esc(L().focusNext)}</button>`;
      else if (focusRun.paused) h += `<button class="btn grow" data-act="focusResume">${esc(L().focusResume)}</button>`;
      else h += `<button class="btn ghost grow" data-act="focusPause">${esc(L().focusPause)}</button>`;
      h += `<button class="btn danger" data-act="focusStop">${esc(L().focusStop)}</button></div></div></div>`;
    } else if (focusOpen) {
      const open = [];
      state.subjects.forEach((sj) => sj.tasks.forEach((t) => { if (!t.done) open.push({ sj, t, rem: Scheduler.taskRemainingMin(t) }); }));
      open.sort((a, b) => {
        const ea = examOf(a.sj), eb = examOf(b.sj);
        const da = a.t.due || (ea && ea.date) || '9999', db = b.t.due || (eb && eb.date) || '9999';
        return da.localeCompare(db) || b.rem - a.rem;
      });
      if (open.length && !(focusSel && taskOf(focusSel.s, focusSel.l) && !taskOf(focusSel.s, focusSel.l).done)) focusSel = { s: open[0].sj.id, l: open[0].t.id };
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>`;
      if (!open.length) {
        h += `<p class="muted">${esc(L().focusNoTasks)}</p><div style="margin-top:12px"><button class="btn ghost" data-act="focusClose" style="width:100%">${esc(L().focusCancel)}</button></div>`;
      } else {
        h += `<div class="muted" style="margin:8px 0 6px">${esc(L().focusPickTask)}</div><div class="ftasks">` +
          open.slice(0, 8).map(({ sj, t, rem }) => `<button class="ftask ${focusSel && focusSel.l === t.id ? 'on' : ''}" data-act="pickFTask" data-s="${sj.id}" data-l="${t.id}">
            <span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span>
            <span class="grow"><b>${esc(t.title)}</b><br><span class="muted">${esc(sj.name)} · ${fmtDur(rem)}</span></span></button>`).join('') + '</div>';
        h += `<div class="muted" style="margin:10px 0 6px">${esc(L().focusPickPreset)}</div><div class="pick">` +
          Scheduler.FOCUS_PRESETS.map((pr, i) => `<button class="${focusPreset === i ? 'on' : ''}" data-act="pickFPreset" data-i="${i}">🍅 ${esc(L().presetLabel(pr.focusMin, pr.breakMin))}</button>`).join('') + '</div>';
        h += `<div class="row" style="margin-top:12px"><button class="btn grow" data-act="focusBegin">${esc(L().focusBegin)}</button>
          <button class="btn ghost" data-act="focusClose">${esc(L().focusCancel)}</button></div>`;
      }
      h += '</div></div>';
    }
    return h;
  }

  /* ---------------- chrome / render ---------------- */

  function applyChrome() {
    const l = L();
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'ar';
    document.documentElement.dir = l.dir;
    document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : '';
    $('appTitle').textContent = l.appTitle;
    $('langBtn').textContent = l.langBtn;
    $('themeBtn').textContent = state.theme === 'light' ? '☾' : '☀';
    const TAB_ICON = {
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/></svg>',
      schedule: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      exams: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.2V2.8h6v1.4M9 13l2.3 2.3L15.8 10.8"/></svg>',
      subjects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2C6.7 4.1 9.3 4.1 12 5.7c2.7-1.6 5.3-1.6 8-.5v13c-2.7-1.1-5.3-1.1-8 .5-2.7-1.6-5.3-1.6-8-.5z"/><path d="M12 5.7v13"/></svg>',
    };
    document.querySelectorAll('#tabs button').forEach((b) => { b.innerHTML = (TAB_ICON[b.dataset.tab] || '') + '<span>' + esc(l.tabs[b.dataset.tab]) + '</span>'; });
  }

  function render() {
    if (tourStep == null && state.profile.onboarded && !tourDone && !sharedData && !(cloudEnabled() && !session && !authSkipped)) tourStep = 0; // v21 first-run tour
    if (tourStep != null) tab = TOUR_TABS[tourStep];
    if (focusRun && !taskOf(focusRun.subjectId, focusRun.taskId)) { focusRun = null; persistFocus(); }
    applyChrome();
    const nowD = new Date();
    const hd = state.lang === 'en'
      ? L().days[nowD.getDay()] + ', ' + L().months[nowD.getMonth()] + ' ' + nowD.getDate()
      : L().days[nowD.getDay()] + '\u060c ' + nowD.getDate() + ' ' + L().months[nowD.getMonth()];
    $('todayLbl').innerHTML = `<span>${esc(hd)}</span> \u00b7 <span id="clockLbl" dir="ltr">${esc(clockNow())}</span>`;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    const fab = $('fab'); if (fab) fab.style.display = sharedData ? 'none' : ((tab === 'day' || tab === 'subjects') && state.profile.onboarded && state.subjects.length) ? 'flex' : 'none';
    const pb = $('profileBtn'); if (pb) pb.innerHTML = avatarSvg(state.profile.avatar) || '👤'; // v17: the chosen avatar rides in the header
    $('view').innerHTML = sharedData ? sharedView() : { day: viewDay, schedule: viewSchedule, exams: viewExams, subjects: viewSubjects, profile: viewProfile }[tab]() + footerHtml();
    $('overlays').innerHTML = sharedData ? '' : overlays();
    if (focusRun) updateFocusText();
    // v17/v20: refresh the board and the challenge whenever the profile shows and they are stale
    if (tab === 'profile' && fbDb) {
      if (state.leaderboard && state.leaderboard.on && Date.now() - lbFetchedAt > 300000) fetchLbTop(); // v21.1: was 60s
      if (chCode() && Date.now() - chFetchedAt > 300000) fetchCh(); // v21.1: was 60s
    }
  }

  // v16: every tab ends with the unofficial-site note; the suggestions button
  // shows only once FEEDBACK_URL is filled in.
  function footerHtml() {
    const link = FEEDBACK_URL ? ` <a class="btn ghost sm" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">${esc(L().footSuggest)}</a>` : '';
    return `<div class="foot"><div class="muted">${esc(L().footNote)}</div>${link}</div>`;
  }

  function estChipText(sid) {
    const title = ($('tt-' + sid) || {}).value || '';
    const k = taskKind[sid] || 'lecture';
    if (!title.trim()) return '';
    const sel = $('td-' + sid);
    const d = sel && +sel.value ? +sel.value : Scheduler.estimateDifficulty(title);
    if (k === 'clinic') return L().estClinic(L().diff[d - 1], fmtHTxt(Scheduler.CLINIC_H[d - 1]));
    return L().estLec(L().diff[d - 1], fmtHTxt(paceStudyH(d)), L().fmtM(Math.round(paceSolveH(d) * 60)));
  }

  /* ---------------- events ---------------- */

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.est) { const el = $('est-' + t.dataset.est); if (el) el.textContent = estChipText(t.dataset.est); }
  });

  document.addEventListener('change', (e) => {
    const t = e.target, a = t.dataset && t.dataset.act;
    const mSl = /^sl(\d)(H|M)$/.exec(t.id || '');
    if (mSl) { commitSleep(+mSl[1]); return; }
    if (a === 'attFile') { const fl = Array.from(t.files || []); t.value = ''; if (fl.length) attAdd(t.dataset.l, t.dataset.s, fl).catch(() => toast(L().attFull)); return; }
    if (!a) return;
    if (a === 'check') { const x = taskOf(t.dataset.s, t.dataset.l); x.done = t.checked; if (t.checked) x.doneAt = todayStr(); else { x.confidence = 0; delete x.doneAt; } }
    else if (a === 'conf') taskOf(t.dataset.s, t.dataset.l).confidence = +t.value;
    else if (a === 'tdiff') { /* difficulty select re-renders chip */ const el = $('est-' + t.dataset.s); if (el) el.textContent = estChipText(t.dataset.s); return; }
    else if (a === 'note') { const tk = taskOf(t.dataset.s, t.dataset.l); if (tk) tk.note = t.value; }
    else if (a === 'remTime') { state.remind.time = t.value || '20:00'; state.remind.last = ''; }
    else return;
    save(); render();
  });

  document.addEventListener('click', (e) => {
    const apb = e.target.closest('.apseg button');
    if (apb) {
      apb.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === apb));
      const mAp = /^sl(\d)AP$/.exec(apb.parentElement.id || '');
      if (mAp) commitSleep(+mAp[1]);
      return;
    }
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    const a = t.dataset.act, s = t.dataset.s, l = t.dataset.l;

    if (a === 'lang') { state.lang = state.lang === 'en' ? 'ar' : 'en'; save({ local: true }); return render(); }
    if (a === 'theme') { state.theme = state.theme === 'light' ? 'dark' : 'light'; save({ local: true }); return render(); }
    if (a === 'openProfile') { prevTab = tab === 'profile' ? prevTab : tab; tab = 'profile'; return render(); }
    if (a === 'backFromProfile') { tab = prevTab || 'day'; return render(); }
    if (a === 'focusOpen') { focusOpen = true; return render(); }
    if (a === 'focusTask') { focusSel = { s, l }; focusOpen = true; return render(); }
    if (a === 'focusClose') { focusOpen = false; return render(); }
    if (a === 'pickFTask') { focusSel = { s, l }; return render(); }
    if (a === 'pickFPreset') { focusPreset = +t.dataset.i || 0; return render(); }
    if (a === 'focusBegin') {
      if (!focusSel || !taskOf(focusSel.s, focusSel.l)) return render();
      focusRun = { subjectId: focusSel.s, taskId: focusSel.l, preset: focusPreset, phase: 'focus', endsAt: Date.now() + Scheduler.FOCUS_PRESETS[focusPreset].focusMin * 60000, remainMs: 0, paused: false, cycles: 0 };
      focusOpen = false; persistFocus(); beep(); return render();
    }
    if (a === 'focusNext') {
      if (!focusRun) return render();
      focusRun.phase = 'focus'; focusRun.endsAt = Date.now() + focusMinOf(focusRun) * 60000; focusRun.paused = false;
      persistFocus(); return render();
    }
    if (a === 'focusPause') { if (focusRun && !focusRun.paused) { focusRun.remainMs = Math.max(0, focusRun.endsAt - Date.now()); focusRun.paused = true; persistFocus(); } return render(); }
    if (a === 'focusResume') { if (focusRun && focusRun.paused) { focusRun.endsAt = Date.now() + focusRun.remainMs; focusRun.paused = false; persistFocus(); } return render(); }
    if (a === 'focusStop') {
      if (focusRun && focusRun.phase === 'focus') {
        const remain = focusRun.paused ? focusRun.remainMs : Math.max(0, focusRun.endsAt - Date.now());
        const elapsed = Math.floor((focusMinOf(focusRun) * 60000 - remain) / 60000);
        if (elapsed >= 1) logFocus(focusRun.subjectId, focusRun.taskId, elapsed);
      }
      focusRun = null; focusOpen = false; persistFocus(); return render();
    }
    if (a === 'addCur') { addFromCur(t.dataset.code); return; }
    if (a === 'loadCur') { loadCur(); return; }
    if (a === 'toggleDay') { timeDay = timeDay === +t.dataset.i ? null : +t.dataset.i; return render(); }
    if (a === 'addBlock') {
      const i = +t.dataset.i;
      const kind = $('bk').value, label = $('bl').value.trim();
      const s = tpRead('bs'), e = tpRead('be');
      if (s == null || e == null || s === e) return alert(L().errTime);
      const sm = Scheduler.hmToMin(s), em = Scheduler.hmToMin(e);
      // stage the block: it only counts after "Save day"
      const clashList = Scheduler.blocksForWd(state, i).concat(draftBusy[i] || []);
      if (Scheduler.blockClashes(clashList, sm, em)) return alert(L().errOverlap);
      (draftBusy[i] = draftBusy[i] || []).push({ id: uid(), label, kind, start: s, end: e });
      return render();
    }
    if (a === 'delDraft') { const i = +t.dataset.i; (draftBusy[i] || []).splice(+t.dataset.d, 1); return render(); }
    if (a === 'saveDay') {
      const i = +t.dataset.i;
      if ((draftBusy[i] || []).length) {
        state.busy[i] = (state.busy[i] || []).concat(draftBusy[i]);
        draftBusy[i] = [];
        save(); toast(L().savedOk);
      }
      return render();
    }
    if (a === 'addOff') { const d = $('offDate').value; if (!d) return; if (!(state.blocked || []).includes(d)) { state.blocked.push(d); save(); } return render(); }
    if (a === 'delOff') { state.blocked = (state.blocked || []).filter((d) => d !== t.dataset.d); save(); return render(); }
    if (a === 'delBlock') { const i = +t.dataset.i; state.busy[i] = (state.busy[i] || []).filter((b) => b.id !== t.dataset.b); save(); return render(); }
    if (a === 'addBusyOnce') {
      const d = $('o1Date').value, label = $('o1Label').value.trim();
      const s = tpRead('o1s'), e = tpRead('o1e');
      if (!d) return;
      const sm = Scheduler.hmToMin(s), em = Scheduler.hmToMin(e);
      if (sm == null || em == null || sm === em) return alert(L().errTime);
      if (Scheduler.blockClashes(state.busyOnce[d], sm, em)) return alert(L().errOverlap);
      (state.busyOnce[d] = state.busyOnce[d] || []).push({ id: uid(), label, kind: 'other', start: s, end: e });
      save(); return render();
    }
    if (a === 'delBusyOnce') { const d = t.dataset.d; state.busyOnce[d] = (state.busyOnce[d] || []).filter((b) => b.id !== t.dataset.b); if (!state.busyOnce[d].length) delete state.busyOnce[d]; save(); return render(); }
    if (a === 'addTopic') {
      const sj = subj(s);
      if (!sj) return;
      const tp = Curriculum.topicsFor(sj.name, sj.code)[+t.dataset.i];
      if (!tp) return;
      const task = mkTask(state.lang === 'en' ? tp.en : tp.ar, 'lecture', tp.d, 'est');
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'pickYear') {
      if (OPEN_YEARS.indexOf(+t.dataset.y) === -1) return render(); // locked year
      const nEl = $('oName') || $('pName');
      if (nEl) state.profile.name = nEl.value.trim(); // re-render wipes the input
      state.profile.year = +t.dataset.y; save(); return render();
    }
    if (a === 'onboardStart') {
      const name = ($('oName') || {}).value || '';
      if (!name.trim() || !state.profile.year) return alert(L().needProfile);
      state.profile.name = name.trim();
      onboardStep = 2; timeDay = null;
      save(); return render();
    }
    if (a === 'paceStudy') { state.pace.study = +t.dataset.v; save(); return render(); }
    if (a === 'paceSolve') { state.pace.solve = +t.dataset.v; save(); return render(); }
    if (a === 'paceDone') { onboardStep = 3; return render(); }
    if (a === 'onboardDaysDone') {
      // commit any staged blocks, then finish: official year subjects load themselves
      Object.keys(draftBusy).forEach((i) => { if (draftBusy[i].length) state.busy[i] = (state.busy[i] || []).concat(draftBusy[i]); });
      draftBusy = {};
      state.profile.onboarded = true;
      if (!state.subjects.length) {
        curMissing().forEach((c) => {
          state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
        });
      }
      save(); render();
      return syncLecturesFile(false); // pull the year's lectures file right away
    }
    if (a === 'saveProfile') {
      state.profile.name = ($('pName').value || '').trim();
      state.profile.onboarded = true;
      save(); toast(L().savedOk); return render();
    }
    if (a === 'authLogin') return doAuth('in');
    if (a === 'authSignup') return doAuth('up');
    if (a === 'authSkip') { authSkipped = true; return render(); }
    if (a === 'showAuth') { authSkipped = false; return render(); }
    if (a === 'linkOpen') { linkOpen = true; return render(); }
    if (a === 'linkClose') { linkOpen = false; return render(); }
    if (a === 'linkDo') { doLink(); return; }
    if (a === 'logout') { outAsk = true; return render(); }
    if (a === 'outNo') { outAsk = false; return render(); }
    if (a === 'outYes') { outAsk = false; doLogout(); return; }
    if (a === 'pickAv') { state.profile.avatar = t.dataset.v; save(); return render(); }
    if (a === 'lbJoin') {
      (state.leaderboard = state.leaderboard || { on: true, showName: false }).on = true;
      lbRows = null; save();
      (async () => {
        if (!cloudEnabled() || !fbAuth) return render();
        if (!session) { try { await fbAuth.signInAnonymously(); } catch (e) { return toast(L().lbAnonErr); } }
        await pushLbScore(true); await fetchLbTop(); render(); // v21.1: force the row on join
      })();
      return render();
    }
    if (a === 'lbLeave') {
      if (state.leaderboard) state.leaderboard.on = false;
      lbRows = null;
      if (session && fbDb) { try { lbEntryRef().delete().catch(() => {}); } catch (e) {} }
      save(); return render();
    }
    if (a === 'lbNameToggle') {
      if (!state.leaderboard) state.leaderboard = { on: true, showName: false };
      state.leaderboard.showName = !state.leaderboard.showName;
      save(); pushLbScore(); if (chCode()) pushChScore();
      return render();
    }
    if (a === 'lbTest') {
      (async () => {
        if (!cloudEnabled() || !fbAuth) return toast(L().lbNoCloud);
        toast(L().lbTestWait);
        if (!session) { try { await fbAuth.signInAnonymously(); } catch (e) { return toast(L().lbAnonErr); } }
        if (!state.leaderboard) state.leaderboard = { on: false, showName: false };
        state.leaderboard.on = true; save();
        await pushLbScore(); await fetchLbTop();
        toast(lbWriteErr ? L().lbTestFail + fbErrText(lbWriteErr) : L().lbTestOk);
        render();
      })();
      return;
    }
    if (a === 'chCreate') {
      state.challenge = { code: genChCode() }; chRows = null; save(); render();
      (async () => {
        if (!cloudEnabled() || !fbAuth) return toast(L().chNoNet);
        if (!session) { try { await fbAuth.signInAnonymously(); } catch (e) { return toast(L().lbAnonErr); } }
        await pushChScore(); await fetchCh(); render();
      })();
      return;
    }
    if (a === 'chJoinBtn') {
      const v = String(($('chJoin') || {}).value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length < 4) return toast(L().chNeed);
      state.challenge = { code: v }; chRows = null; save(); render();
      (async () => {
        if (!cloudEnabled() || !fbAuth) return toast(L().chNoNet);
        if (!session) { try { await fbAuth.signInAnonymously(); } catch (e) { return toast(L().lbAnonErr); } }
        await pushChScore(); await fetchCh(); render();
      })();
      return;
    }
    if (a === 'chLeave') {
      const oldCode = chCode();
      state.challenge = { code: '' }; chRows = null; save(); render();
      if (session && fbDb && oldCode) { try { fbDb.collection('challenges').doc(oldCode).collection('entries').doc(session.uid).delete().catch(() => {}); } catch (e) {} }
      return;
    }
    if (a === 'chCopy') {
      const code = chCode();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code);
        else { const el = document.createElement('textarea'); el.value = code; document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove(); }
        toast(L().chCopied);
      } catch (e) { toast(code); }
      return;
    }
    if (a === 'revStart') {
      if (!taskOf(s, l)) return render();
      focusSel = { s, l };
      focusRun = { subjectId: s, taskId: l, preset: 0, customMin: 10, review: true, phase: 'focus', endsAt: Date.now() + 10 * 60000, remainMs: 0, paused: false, cycles: 0 };
      focusOpen = false; persistFocus(); return render();
    }
    if (a === 'revLater') { (state.reviewLog = state.reviewLog || {})[l] = todayStr(); save(); return render(); }
    if (a === 'woDone') { (state.workout.log = state.workout.log || {})[todayStr()] = 1; save(); toast(L().woDoneBtn); return render(); }
    if (a === 'woUndo') { delete (state.workout.log || {})[todayStr()]; save(); return render(); }
    if (a === 'woDay') {
      const wd = +t.dataset.wd;
      const days = Scheduler.workoutDays(state).slice();
      const i = days.indexOf(wd);
      if (i === -1) days.push(wd); else days.splice(i, 1);
      state.workout.days = days.sort((x, y) => x - y);
      syncWorkoutBlocks();
      save(); toast(L().woSaved); return render();
    }
    if (a === 'batchSync') return syncLecturesFile(true);

    if (a === 'toggle') { openSubject = openSubject === s ? null : s; return render(); }
    if (a === 'toggleExam') { openExam = openExam === s ? null : s; return render(); }
    if (a === 'delSubject') { if (!confirm(L().delConfirm)) return; attDeleteMany((m) => m.subjectId === s); state.subjects = state.subjects.filter((x) => x.id !== s); save(); return render(); }
    if (a === 'saveExam') {
      const p = 'e-' + s + '-';
      const date = $(p + 'Date').value;
      if (!date) return alert(L().needExam);
      const time = tpRead(p + 'Time', true) || '';
      if (examInPast(date, time)) return alert(L().examPastErr);
      subj(s).exam = { kind: $(p + 'Kind').value, date, time, nature: $(p + 'Nature').value, covered: +$(p + 'Cov').value || 0, src: '' };
      save(); return render();
    }
    if (a === 'clearExam') { subj(s).exam = null; save(); return render(); }
    if (a === 'pickKind') { taskKind[s] = t.dataset.k; return render(); }
    if (a === 'pickDay') { dayViewDate = (t.dataset.d === todayStr()) ? null : t.dataset.d; return render(); }
    if (a === 'fabAdd') { fabOpen = true; fabKind = 'lecture'; return render(); }
    if (a === 'fabKind') { fabKind = t.dataset.k; return render(); }
    if (a === 'fabClose') { fabOpen = false; return render(); }
    if (a === 'fabAddDo') {
      const sj = subj(($('fabS') || {}).value), title = ($('fabT') || {}).value.trim();
      if (!sj) { fabOpen = false; return render(); }
      if (!title) return alert(L().needTask);
      const df = +($('fabD') || {}).value || 0;
      const task = mkTask(title, fabKind, df || null);
      if (fabKind === 'clinic') task.due = ($('fabDue') || {}).value || null;
      sj.tasks.push(task);
      fabOpen = false; save(); return render();
    }
    if (a === 'tourNext') { tourStep = Math.min(TOUR_TABS.length - 1, tourStep + 1); return render(); }
    if (a === 'tourPrev') { tourStep = Math.max(0, tourStep - 1); return render(); }
    if (a === 'tourEnd') { tourClose(); return render(); }
    if (a === 'tourOpen') { tourStep = 0; return render(); }
    if (a === 'aiT') { aiOpen = aiOpen === l ? null : l; return render(); }
    if (a === 'aiGo') { aiGo(s, l, t.dataset.w); return; }
    if (a === 'attT') { attOpen = attOpen === l ? null : l; attPlay = null; if (attOpen) attRefreshUsage(); return render(); }
    if (a === 'attOpenF') { attOpenFile(t.dataset.f, l); return; }
    if (a === 'attDel') { if (confirm(L().attDelConfirm)) attDelete(t.dataset.f, l); return; }
    if (a === 'noteT') { noteOpen = (noteOpen === l) ? null : l; return render(); }
    if (a === 'remToggle') {
      const rm = state.remind;
      if (!rm.on && 'Notification' in window && Notification.permission === 'default') {
        try { Notification.requestPermission(); } catch (e) { /* ignored */ }
      }
      if (!rm.on && 'Notification' in window && Notification.permission === 'denied') toast(L().remNoPerm);
      rm.on = !rm.on; rm.last = '';
      save(); return render();
    }
    if (a === 'streakRestore') {
      const st = state.streak;
      const mk = todayStr().slice(0, 7);
      if (st.month !== mk) { st.month = mk; st.used = 0; }
      if ((st.used || 0) < 3) {
        st.fills.push(Scheduler.addDays(todayStr(), -1));
        st.used = (st.used || 0) + 1;
        save(); toast(L().streakRestored);
      }
      return render();
    }
    if (a === 'shareProg') { shareProgress(); return; }
    if (a === 'shareSchedImg') { shareScheduleImg(); return; }
    if (a === 'shareSchedLink') { shareScheduleLink(); return; }
    if (a === 'exitShare') { sharedData = null; try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } return render(); }
    if (a === 'addTask') {
      const sj = subj(s), title = $('tt-' + s).value.trim();
      if (!title) return alert(L().needTask);
      const k = taskKind[s] || 'lecture';
      const d = +$('td-' + s).value || 0;
      const task = mkTask(title, k, d || null);
      if (k === 'clinic') task.due = ($('tdue-' + s) || {}).value || null;
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'delTask') { attDeleteMany((m) => m.taskId === l); const sj = subj(s); sj.tasks = sj.tasks.filter((x) => x.id !== l); save(); return render(); }
    if (a === 'done') { const x = taskOf(s, l); if (x) { x.done = true; x.doneAt = todayStr(); } save(); return render(); }
    if (a === 'undone') { const x = taskOf(s, l); if (x) { x.done = false; delete x.doneAt; delete x.confidence; } save(); return render(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && session && Date.now() - lastPull > 30000) loadCloud().then(render);
    if (!document.hidden && canSyncLectures() && Date.now() - (state.batchSync.lastSync || 0) > 30 * 60000) syncLecturesFile(false);
  });

  window.__planner = { endTour: () => { tourClose(); render(); }, get state() { return state; }, loadCur, render, tick, loadCloud, pushCloud, save, get focusRun() { return focusRun; }, get session() { return session; }, batchIdle: () => batchPromise || Promise.resolve(), lbDemo: (rows) => { lbRows = rows; lbError = ''; const el = $('lbList'); if (el) el.innerHTML = lbListHtml(); } };
  render();
  attLoadMeta();
  initCloud();
  if (canSyncLectures()) syncLecturesFile(false);
  setInterval(tick, 500);
})();
</script>
</body>
</html>
