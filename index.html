  // v34: one progress bar per member, the target at the end, my own row marked.
  function chListHtml() {
    if (chErr) return `<div class="muted">${esc(chFailText(chErr))}</div>`;
    if (!chDoc) return `<div class="muted">${esc(L().chWait)}</div>`;
    if (!chRows) return `<div class="muted">${esc(L().chWait)}</div>`;
    const t = Math.max(1, Number(chDoc.target) || 1);
    const uid0 = session && session.uid;
    if (!chRows.length) return `<div class="muted">${esc(L().chWait)}</div>`;
    return chRows.map((r) => {
      const pct = Math.max(0, Math.min(100, Math.round((r.score / t) * 100)));
      return `<div class="chrow${r.id === uid0 ? ' me' : ''}"><span class="avchip">${avatarSvg(r.avatar)}</span><span class="grow"><span class="chnm">${esc(r.name || L().anonName)}${r.id === uid0 ? ` · ${esc(L().lbYou)}` : ''}</span><span class="chbar"><i style="width:${pct}%"></i></span></span><b class="chsc">${r.score} / ${t}</b></div>`;
    }).join('');
  }

  // v23: one path for "a cloud copy arrived" - the first read and every live
  // update go through here, so the merge rules cannot drift apart.
  function applyCloud(cloud) {
    if (!cloud || !cloud.version) return false;
    const merged = (typeof SyncMerge !== 'undefined') ? SyncMerge.merge(state, cloud) : cloud;
    state = Object.assign(empty(), merged);
    normalizeState();
    stateSnap = (typeof SyncMerge !== 'undefined') ? SyncMerge.snapshot(state) : null;
    saveLocal(); setSync('synced');
    // only talk back when this device really had something the cloud did not
    if (typeof SyncMerge !== 'undefined' && SyncMerge.stable(state) !== SyncMerge.stable(cloud)) pushCloud();
    return true;
  }

  async function loadCloud() {
    if (!session || !fbDb) return;
    lastPull = Date.now();
    try {
      const doc = await fbDb.collection('planner_states').doc(session.uid).get();
      const data = doc.exists ? doc.data() : null;
      if (!(data && data.state && data.state.version)) { pushCloud(); return; }
      applyCloud(data.state);
    } catch (e) { setSync('error'); }
  }

  // v23: watch this account's document while the app is open.
  function attachCloud() {
    if (!session || !fbDb) return;
    detachCloud();
    snapPrimed = false;
    try {
      cloudUnsub = fbDb.collection('planner_states').doc(session.uid).onSnapshot((snap) => {
        if (!snap || !snap.exists) return;
        if (!snapPrimed) { snapPrimed = true; return; } // the copy loadCloud already merged
        const data = snap.data() || {};
        if (!data.state || !data.state.version) return;
        if (data.updatedAt && data.updatedAt === lastPushAt) return; // our own write echoing back
        const before = (typeof SyncMerge !== 'undefined') ? SyncMerge.stable(state) : '';
        if (!applyCloud(data.state)) return;
        if (typeof SyncMerge !== 'undefined' && SyncMerge.stable(state) === before) return;
        // never redraw on top of a field the student is typing in
        const el = document.activeElement;
        if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) pendingRender = true; else render();
      }, () => { /* a listener error is not fatal: the 30s foreground pull still works */ });
    } catch (e) { /* offline: stay local */ }
  }

  function detachCloud() {
    if (cloudUnsub) { try { cloudUnsub(); } catch (e) { /* ignore */ } }
    cloudUnsub = null; snapPrimed = false;
  }

  function initCloud() {
    if (!cloudEnabled()) return;
    try {
      window.firebase.initializeApp(FIREBASE_CONFIG);
      fbAuth = window.firebase.auth();
      fbDb = window.firebase.firestore();
      fbAuth.onAuthStateChanged(async (u) => {
        session = u || null;
        if (session) {
          await loadCloud();
          attachCloud();
          pushLbScore(); fetchLbTop(); // v32: always
          fetchCh(); // v36: a stored challenge is checked at start; a stale one is dropped
          try { if (localStorage.getItem(FR_FLAG) === '1' && !fr.loaded) frLoad(); } catch (e) { /* ignore */ }
        } else { detachCloud(); fetchLbTop(); } // v32: read the board even before signing in
        // v21.2: tell them once that an anonymous account does not travel between devices
        if (session && !session.email) {
          try {
            if (!localStorage.getItem(KEY + '.anonNudge')) { localStorage.setItem(KEY + '.anonNudge', '1'); setTimeout(() => toast(L().anonNudge), 1200); }
          } catch (e) { /* ignore */ }
        }

        render();
      });
    } catch (e) { /* offline: stay local */ }
  }

  async function doAuth(mode) {
    const email = $('aEmail').value.trim(), pass = $('aPass').value;
    if (!email || !pass) return alert(L().fillBoth);
    $('authMsg').textContent = L().authWait;
    try {
      if (mode === 'up') await fbAuth.createUserWithEmailAndPassword(email, pass);
      else await fbAuth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged picks the session up, loads cloud state and re-renders
    } catch (e) { $('authMsg').textContent = String(e && e.message || e); }
  }

  // v21.2: keep the anonymous uid and give it an email, so nothing on this device moves
  async function doLink() {
    const email = (($('lkEmail') || {}).value || '').trim();
    const pass = (($('lkPass') || {}).value || '');
    const msg = $('lkMsg');
    const say = (t) => { if (msg) msg.textContent = t; };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say(L().linkNeedEmail);
    if (pass.length < 6) return say(L().linkNeedPass);
    if (!fbAuth || !session) return say(L().linkErr);
    say(L().syncing || '');
    try {
      const cred = window.firebase.auth.EmailAuthProvider.credential(email, pass);
      await session.linkWithCredential(cred);
      session = fbAuth.currentUser || session;
      linkOpen = false; render(); toast(L().linkOk);
    } catch (e) {
      const code = String((e && (e.code || e.message)) || e);
      if (/email-already-in-use|credential-already-in-use|email-exists/i.test(code)) {
        try {
          await fbAuth.signInWithEmailAndPassword(email, pass);
          linkOpen = false; render(); toast(L().linkSwitched);
        } catch (e2) { say(String((e2 && (e2.code || e2.message)) || e2)); }
      } else say(fbErrText(code) || L().linkErr);
    }
  }

  // v21.2: signing out leaves the app like a fresh install. Pending edits are pushed
  // first so an email account keeps them; an anonymous device loses what was never
  // linked to an email, which the confirm card says out loud.
  async function doLogout() {
    try {
      if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
      if (session && fbDb && session.email) { try { await pushCloud(); } catch (e) { /* ignore */ } }
    } catch (e) { /* ignore */ }
    try { if (fbAuth) await fbAuth.signOut(); } catch (e) { /* ignore */ }
    await wipeLocal();
    session = null; authSkipped = false; setSync(''); frReset(); roomAsk = null;
    tab = 'day'; prevTab = 'day'; openSubject = null; fabOpen = false; focusRun = null;
    try { localStorage.removeItem(FKEY); } catch (e) { /* ignore */ }
    attMeta = {}; attOpen = null; attPlay = null; attUsage = null;
    tourDone = false; tourStep = null;
    render();
    toast(L().outDone);
  }

  // Everything this device holds: the saved state, its keys, and the uploaded files.
  async function wipeLocal() {
    try {
      Object.keys(localStorage).forEach((k) => { if (k.indexOf(KEY) === 0) localStorage.removeItem(k); });
      localStorage.removeItem(FKEY);
    } catch (e) { /* ignore */ }
    try {
      if (attDB) { attDB.close(); attDB = null; }
      await new Promise((res) => {
        const rq = indexedDB.deleteDatabase('dental-planner-files');
        rq.onsuccess = res; rq.onerror = res; rq.onblocked = res;
        setTimeout(res, 1500);
      });
    } catch (e) { /* ignore */ }
    state = empty();
    normalizeState();
    try { saveLocal(); } catch (e) { /* ignore */ }
    if (typeof SyncMerge !== 'undefined') stateSnap = SyncMerge.snapshot(state);
  }

  /* ---------------- batch lectures from the year's lectures file ---------------- */
  // Each study year (1..5) has one Google Sheet edited by that year's rep in
  // the normal Sheets grid. A tiny sheets.json shipped next to the app (repo
  // root) maps year -> sheet link or id, so students never paste anything.
  // The app reads the sheet that matches the student's year on every open, on
  // return after 30+ minutes and via the manual button, and runs a FULL sync:
  // new rows are added, changed rows update the task in place (progress kept),
  // rows removed from the sheet delete only the tasks that came from the
  // sheet - the student's own tasks are never touched.
  let batchPromise = null;

  function lecturesYear() {
    const y = state.profile && state.profile.year;
    return y >= 1 && y <= 5 ? y : 0;
  }
  const canSyncLectures = () => !!(state.profile && state.profile.onboarded && lecturesYear() && typeof BatchSync !== 'undefined');

  function batchStatusText() {
    const bs = state.batchSync || {};
    if (bs.error) return bs.error;
    if (!lecturesYear()) return L().batchNoYear;
    if (bs.noSheet) return L().batchNoSheet;
    if (!bs.lastSync) return L().batchNever;
    const d = new Date(bs.lastSync);
    return L().batchLast(fmtClock(d.getHours() * 60 + d.getMinutes())) + ' · ' + L().batchStat(bs.added || 0, bs.updated || 0, bs.removed || 0, bs.total || 0, bs.unmatched || 0);
  }

  function applyLectures(entries) {
    const plan = BatchSync.planFullSync(state.subjects, entries);
    plan.updates.forEach(({ task, entry, key }) => {
      task.batchId = key;
      task.src = 'batch';
      task.title = entry.lecture;
      if (entry.week) task.week = entry.week; else delete task.week;
      if (entry.difficulty && entry.difficulty !== task.difficulty) {
        // Recount hours from the new difficulty only while the task is
        // untouched; once the student put time into it, his hours stay.
        const od = task.difficulty;
        const fresh = !task.done && task.kind !== 'clinic'
          && task.studyH === paceStudyH(od) && task.solveH === paceSolveH(od);
        task.difficulty = entry.difficulty;
        if (fresh) { task.studyH = paceStudyH(entry.difficulty); task.solveH = paceSolveH(entry.difficulty); }
      }
    });
    plan.removals.forEach(({ subjectId, task }) => {
      const sj = subj(subjectId);
      if (sj) sj.tasks = sj.tasks.filter((x) => x.id !== task.id);
    });
    plan.adds.forEach(({ subjectId, key, entry }) => {
      const sj = subj(subjectId);
      if (!sj) return;
      const t = mkTask(entry.lecture, 'lecture', entry.difficulty || null, 'batch');
      t.batchId = key;
      if (entry.week) t.week = entry.week;
      sj.tasks.push(t);
    });
    return plan;
  }

  // v14: sheet-sourced exam dates. A hand-set exam (src '') always wins;
  // a sheet row removed from the tab removes only a sheet-sourced exam.
  function applyExamRows(rows) {
    const today = todayStr();
    const byId = {};
    (rows || []).forEach((r) => {
      const hit = BatchSync.matchSubject(state.subjects, r.subject);
      if (hit) (byId[hit.id] = byId[hit.id] || []).push(r);
    });
    Object.keys(byId).forEach((id) => {
      const sj = subj(id);
      if (!sj || (sj.exam && sj.exam.src !== 'batch')) return;
      const list = byId[id];
      const upcoming = list.filter((r) => r.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
      const pick = upcoming || list.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
      sj.exam = { kind: 'exam', date: pick.date, time: pick.time || '', nature: pick.nature, covered: pick.covered || (sj.exam && sj.exam.covered) || 0, src: 'batch' };
    });
    state.subjects.forEach((sj) => {
      if (sj.exam && sj.exam.src === 'batch' && !byId[sj.id]) sj.exam = null;
    });
  }

  async function fetchText(url, ms) {
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const killer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, ms || 12000) : null;
    let res;
    // no-cache: always revalidate so the rep's edits show up within minutes
    try { res = await fetch(url, ctrl ? { signal: ctrl.signal, cache: 'no-cache' } : { cache: 'no-cache' }); }
    finally { if (killer) clearTimeout(killer); }
    if (!res || !res.ok) { const err = new Error('http'); err.status = res && res.status; throw err; }
    return res.text();
  }

  function syncLecturesFile(manual) {
    if (batchPromise) return batchPromise;
    const bs = state.batchSync;
    const year = lecturesYear();
    if (!year || typeof fetch !== 'function') return Promise.resolve();
    batchPromise = (async () => {
      try {
        // step 1: which sheet belongs to this year (owner keeps sheets.json)
        let manifest = null;
        try { manifest = JSON.parse(await fetchText('sheets.json', 8000)); }
        catch (e) {
          if (e && e.name === 'SyntaxError') { /* broken sheets.json: treat as not set up */ }
          else if (!e || e.status !== 404) throw e; // offline/server trouble is an error, not "no sheet"
        }
        const ref = manifest && typeof manifest === 'object' && (manifest[year] || manifest[String(year)]);
        if (!ref) {
          bs.noSheet = true; bs.error = ''; save();
          if (manual) toast(L().batchNoSheet);
          return;
        }
        const url = BatchSync.normalizeSheetUrl(ref);
        if (!url) { bs.noSheet = false; bs.error = L().batchErrUrl; save(); return; }
        // step 2: the sheet itself as CSV
        const text = await fetchText(url, 12000);
        if (/^\s*<(!doctype|html)/i.test(text.slice(0, 300))) {
          // Google answered with a sign-in page: the sheet is not shared
          bs.noSheet = false; bs.error = L().batchErrShare; save();
          if (manual) toast(L().batchErrShare);
          return;
        }
        const entries = BatchSync.parseSheetRows(BatchSync.parseCSV(text));
        const plan = applyLectures(entries);
        // step 3 (v14, optional tab in the same sheet): exam dates.
        // A missing tab just 404s; that is normal and leaves exams alone.
        try {
          const exText = await fetchText(url + '&sheet=exams', 8000);
          if (!/^\s*<(!doctype|html)/i.test(exText.slice(0, 300))) applyExamRows(BatchSync.parseExamsRows(BatchSync.parseCSV(exText)));
        } catch (e) { /* no exams tab yet */ }
        bs.error = '';
        bs.noSheet = false;
        bs.lastSync = Date.now();
        bs.total = entries.length;
        bs.added = plan.adds.length;
        bs.updated = plan.updates.length;
        bs.removed = plan.removals.length;
        bs.unmatched = plan.unmatched.length;
        save();
        if (manual) toast(L().batchToast(plan.adds.length, plan.updates.length, plan.removals.length));
      } catch (e) {
        bs.noSheet = false;
        bs.error = L().batchErrFetch;
        save();
      }
    })().then(() => { batchPromise = null; render(); });
    return batchPromise;
  }

  /* ---------------- tasks / curriculum ---------------- */
  // v13: task hours come from the student's own pace, not padded defaults.
  // The pace he picks on signup is his average for a typical (medium) lecture;
  // easy tasks scale down a bit and hard ones scale up.
  const PACE_SCALE = [0.75, 1, 1.5]; // by difficulty 1..3
  const paceStudyMin = () => (state.pace && +state.pace.study) || 60;
  const paceSolveMin = () => (state.pace && +state.pace.solve) || 20;
  const paceStudyH = (d) => Math.round(paceStudyMin() * PACE_SCALE[d - 1] / 60 * 4) / 4;
  const paceSolveH = (d) => Math.round(paceSolveMin() * PACE_SCALE[d - 1] / 60 * 4) / 4;

  function mkTask(title, kind, diff, src) {
    const est = Scheduler.estimate(title, kind);
    const d = diff || est.difficulty;
    return {
      id: uid(), kind, title, difficulty: d,
      studyH: kind === 'clinic' ? 0 : paceStudyH(d),
      solveH: kind === 'clinic' ? 0 : paceSolveH(d),
      workH: kind === 'clinic' ? Scheduler.CLINIC_H[d - 1] : 0,
      due: null, done: false, confidence: 0, src: src || '',
    };
  }

  // Official curriculum entries for the student's year that are not added yet.
  const curForYear = () => (yearNum() >= 1 && yearNum() <= 5 ? Curriculum.subjectsForYear(yearNum()) : []);
  const curMissing = () => curForYear().filter((c) => !state.subjects.some((s) => (s.code && s.code === c.code) || Curriculum.find(s.name, s.code) === c));
  // v24: subject names stay in English in both languages (Ahmed's request):
  // the English name, never a literal translation. Lectures/topics are English too.
  const curName = (c) => c.en || c.ar;

  function addFromCur(code) {
    const c = curForYear().find((x) => x.code === code);
    if (!c || state.subjects.some((s) => s.code === code)) return;
    state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    save(); render();
  }

  function loadCur() {
    curMissing().forEach((c) => {
      state.subjects.push({ id: uid(), name: curName(c), code: c.code, icon: c.icon || '', exam: null, tasks: [] });
    });
    save(); render();
  }

  // Estimated topic suggestions for a subject: topics not already among its tasks.
  function topicSugg(sj) {
    const tps = Curriculum.topicsFor(sj.name, sj.code);
    return tps.map((tp, i) => Object.assign({ _i: i }, tp))
      .filter((tp) => !sj.tasks.some((t) => {
        const n = Curriculum.norm(t.title);
        return n === Curriculum.norm(tp.ar) || n === Curriculum.norm(tp.en);
      }));
  }

  const dayLabel = (d, today) => {

  /* ---------------- v24: the student's own plan for a day ----------------

  const PLAN_TXT = {

      suggest: 'اقترح جدول تلقائي', wipe: 'امسح اليوم', suggested: 'اتضاف الاقتراح', suggestNone: 'مفيش اقتراح يتضاف', crowded: (n) => 'اليوم زحمة: ' + n + ' مذاكرة مش لاقيلها مكان أو ساعات المذاكرة خلصت',  overdueTitle: 'كنت حاطط دول امبارح ومخلصتهمش:',

      myDayTag: 'جدولك', autoTag: 'جدول التطبيق', changed: 'اتحفظ',
      noRoom: 'مفيش وقت كفاية في البلوك ده', pickOne: 'اختار التاسك الأول',
    },
    en: {

      noTasks: 'No unfinished tasks in this subject.',

      duration: 'Length', earlier: 'Earlier', later: 'Later', remove: 'Delete block',
      weekTitle: 'Week', weekOverview: 'Week overview',
      planned: 'Planned', tasksLeft: 'Tasks left', examsWeek: 'Exams',
      focusNoPlan: 'Nothing on your plan today. Add some study to your day first.', addToDay: 'Add it myself', movedFrom: 'Moved from', movedTo: 'Moved to', todayWord: 'today',
      suggest: 'Suggest a schedule', wipe: 'Clear the day', suggested: 'Suggestion added', suggestNone: 'Nothing to suggest', crowded: (n) => 'This day is too crowded: ' + n + ' task(s) did not fit (no gap or study limit reached)',  overdueTitle: 'You planned these yesterday and did not finish them:',
      clearDay: 'Start with an empty day', resetDay: "Back to the app's plan", resetDone: "Back to the app's plan",

    },

  const PT = () => PLAN_TXT[state.lang === 'en' ? 'en' : 'ar'];

  let planSheet = null; // { date, mode:'add'|'edit', s, e, i, subId }
  let schedOff = 0; // v25: 0 = yesterday..+5, 1 = the week after
  let schedDate = null; // the day open in the Schedule tab (null = today)

  const pHM = (m) => {
    const x = Math.max(0, Math.round(Number(m) || 0));
    if (x >= 1440) return '24:00';
    return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
  };
  const pMin = (v) => { if (String(v) === '24:00') return 1440; const m = Scheduler.hmToMin(v); return m == null ? null : m; };
  const pDur = (b) => { const a = pMin(b && b.start), z = pMin(b && b.end); return a == null || z == null || z <= a ? 60 : z - a; };
  const dayManual = (d) => !!(state.plans && Object.prototype.hasOwnProperty.call(state.plans, d));

  // What the app itself would plan for that date, as concrete blocks.
  function autoPlanBlocks(d) {
    const now = new Date();
    let r;
    try { r = Scheduler.generate(state, todayStr(), { nowMin: now.getHours() * 60 + now.getMinutes() }); } catch (e) { return []; }
    return r.sessions.filter((x) => x.date === d && x.startMin != null).map((x) => ({
      taskId: x.lectureId || '', subjectId: x.subjectId, type: x.type || 'study',
      start: pHM(x.startMin), end: pHM(Math.min(1440, Math.round(x.endMin))),
    }));
  }

  // The day's blocks: the student's own when he edited that day, else the app's.
  // v29: what the student really put on a day (his own blocks and accepted suggestions).
  // A copy that was moved here from a missed day (has .from) is not counted twice;
  // the original stays on its own day as the record.
  function planStat(d) {
    let min = 0, left = 0, n = 0;
    planBlocks(d).forEach((b) => {
      if (!b || !b.taskId || b.from) return;
      n++; min += pDur(b);
      const t = taskOf(b.subjectId, b.taskId);
      if (t && !t.done) left++;
    });
    return { min, left, n };
  }
  function planBlocks(d) {
    // v25: a day is empty until the student fills it or taps the suggest button
    return dayManual(d) ? (state.plans[d] || []).slice() : [];
  }

  // Freeze a day into state.plans so an edit has something to edit.
  function ensurePlanDay(d) {
    if (!state.plans) state.plans = {};
    if (!dayManual(d)) state.plans[d] = []; // v26: an untouched day is empty (v25 wrongly froze the app's blocks into it)
    return state.plans[d];
  }

  function sortPlan(d) {
    const list = (state.plans || {})[d];
    if (list) list.sort((x, y) => (pMin(x.start) || 0) - (pMin(y.start) || 0));
    return list || [];
  }

  // The day's free time: gaps left by the fixed commitments (sleep, classes, the
  // gym, one-off blocks). The app's study blocks do not close a gap - the student
  // asked to be able to put his own study into his free hours - so adding a block
  // looks for real room inside the window instead (findRoom below).
  // 45 minutes minimum, clamped to "now" for today.
  function freeSlots(d) {
    if ((state.blocked || []).includes(d)) return [];
    const occ = [];
    blocksForDate(d).forEach((b) => { const s = Math.max(0, b.s), e = Math.min(1440, b.e); if (e > s) occ.push([s, e]); });
    occ.sort((a, b) => a[0] - b[0]);
    const merged = [];
    occ.forEach(([s, e]) => {
      const last = merged[merged.length - 1];
      if (last && s <= last[1]) last[1] = Math.max(last[1], e); else merged.push([s, e]);
    });
    let gaps = [];
    let cur = 0;
    merged.forEach(([s, e]) => { if (s - cur >= 45) gaps.push([cur, s]); cur = Math.max(cur, e); });
    if (1440 - cur >= 45) gaps.push([cur, 1440]);
    if (d === todayStr()) {
      const n = new Date();
      const nowMin = n.getHours() * 60 + n.getMinutes();
      gaps = gaps.map(([s, e]) => [Math.max(s, nowMin), e]).filter(([s, e]) => e - s >= 45);
    }
    return gaps;
  }

  // The first stretch of a window that is really free, never overlapping a block
  // already in the day's plan. Falls back to shorter blocks before giving up.
  function findRoom(d, winS, winE, want) {
    const taken = planBlocks(d).map((b) => [pMin(b.start), pMin(b.end)]).filter(([a, z]) => a != null && z != null);
    const tries = [want, 60, 45, 30, 15].filter((m) => m <= Math.max(15, want));
    for (const dur of tries) {
      for (let st = Math.max(0, winS); st + dur <= winE; st += 15) {
        if (!taken.some(([a, z]) => st < z && a < st + dur)) return { s: st, dur };
      }
    }
    return null;
  }

  function planRowHtml(d, b, i) {
    const sj = subj(b.subjectId) || {};
    const t = b.taskId ? taskOf(b.subjectId, b.taskId) : null;
    const title = t ? t.title : (b.title || (b.type === 'review' ? L().generalReview : ''));
    const a = pMin(b.start), z = pMin(b.end);
    return `<div class="sess planline${t && t.done ? ' done' : ''}" style="border-inline-start-color:${colorOfS(sj)}">
      <span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span>
      <div class="grow"><b>${esc(sj.name || '')}</b>${title ? ' - ' + esc(title) : ''}${t && t.done ? ' \u2714' : ''}</div>
      <span class="muted hrs" dir="ltr">${a != null && z != null ? esc(fmtClockRange(a, z)) : ''}</span>
      ${t && !t.done ? `<button class="btn ghost sm" data-act="done" data-s="${b.subjectId}" data-l="${b.taskId}">${esc(L().doneBtn)}</button>` : ''}
      <button class="btn ghost sm" data-act="planEdit" data-d="${d}" data-i="${i}" title="${esc(PT().editTitle)}">\u270E</button>
      <button class="btn ghost sm" data-act="planX" data-d="${d}" data-i="${i}" aria-label="x">\u2715</button></div>`;
  }

  // One chronological timeline for a day: exams, commitments, planned study and
  // a tappable row for every free slot.
  function timelineHtml(d, opts) {
    const today = todayStr();
    const items = [];
    state.subjects.forEach((s) => { const ex = examOf(s); if (ex && ex.date === d) items.push({ m: Scheduler.hmToMin(ex.time) || 0, html: examRowFor(s, ex, today) }); });
    blocksForDate(d).forEach((b) => items.push({ m: b.s, html: busyRow(b) }));
    const pb = planBlocks(d);
    pb.forEach((b, i) => items.push({ m: pMin(b.start) == null ? 1e9 : pMin(b.start), html: planRowHtml(d, b, i) }));
    const readonly = !!(opts && opts.readonly);
    if (!readonly && !(state.blocked || []).includes(d)) {
      const taken = pb.map((b) => [pMin(b.start), pMin(b.end)]).filter(([a, z]) => a != null && z != null).sort((x, y) => x[0] - y[0]);
      const pieces = [];
      freeSlots(d).forEach(([a, z]) => {
        let cur = a;
        taken.forEach(([ta, tz]) => { if (tz <= cur || ta >= z) return; if (ta - cur >= 30) pieces.push([cur, ta]); cur = Math.max(cur, tz); });
        if (z - cur >= 30) pieces.push([cur, z]);
      });
      pieces.forEach(([a, z]) => items.push({
        m: a, html: `<button class="sess freeslot" data-act="planSlot" data-d="${d}" data-s="${a}" data-e="${z}">
          <span class="fsplus">+</span><span class="grow">${esc(PT().freeSlot)}</span><span class="muted hrs" dir="ltr">${esc(fmtClockRange(a, z))}</span></button>`,
      }));
    }
    items.sort((x, y) => x.m - y.m);
    let h = '';
    if (!items.length) h += `<div class="muted" style="padding:6px 2px">${esc((opts && opts.emptyText) || L().noSessDay)}</div>`;
    items.forEach((it) => { h += it.html; });
    return h;
  }

  // v25: suggest button + wipe-the-day X, and the "you planned this yesterday" warning
  function dayControlsHtml(d) {
    if (d < todayStr()) return '';
    const n = planBlocks(d).length;
    return `<div class="row dayctl"><button class="btn grow" data-act="planSuggest" data-d="${d}">\u2728 ${esc(PT().suggest)}</button>
      ${n ? `<button class="btn ghost" data-act="planWipe" data-d="${d}" title="${esc(PT().wipe)}" aria-label="x">\u2715</button>` : ''}</div>`;
  }

  // The task is already on some other day's plan (today or later).
  function plannedElsewhere(sid, tid, d) {
    const today = todayStr();
    return Object.keys(state.plans || {}).some((k) => k !== d && k >= today && (state.plans[k] || []).some((b) => b && b.subjectId === sid && b.taskId === tid));
  }

  // Free windows of a day with the blocks already planned cut out.
  function openWindows(d) {
    const taken = planBlocks(d).map((b) => [pMin(b.start), pMin(b.end)]).filter(([a, z]) => a != null && z != null).sort((x, y) => x[0] - y[0]);
    const out = [];
    freeSlots(d).forEach(([a, z]) => {
      let cur = a;
      taken.forEach(([ta, tz]) => { if (tz <= cur || ta >= z) return; if (ta > cur) out.push([cur, ta]); cur = Math.max(cur, tz); });
      if (z > cur) out.push([cur, z]);
    });
    return out;
  }

  // v26: each suggested task gets its usual time (his pace), whole, never a 15 or 30
  // minute scrap. Tasks already on another day's plan are skipped.
  function planSuggest(d) {
    if (d < todayStr()) return;
    ensurePlanDay(d);
    const have = state.plans[d];
    const taken = {};
    have.forEach((b) => { if (b.taskId) taken[b.subjectId + '|' + b.taskId] = 1; });
    let r = { sessions: [] };
    try { const n = new Date(); r = Scheduler.generate(state, todayStr(), { nowMin: n.getHours() * 60 + n.getMinutes() }); } catch (e) { r = { sessions: [] }; }
    const sess = r.sessions.filter((x) => x.date >= d && x.date <= Scheduler.addDays(d, 6)).sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : (x.startMin || 0) - (y.startMin || 0)));
    const target = Math.round(sess.filter((x) => x.date === d).reduce((a, x) => a + (x.hours || 0), 0) * 60);
    let got = 0, added = 0, skipped = 0;
    const tried = {};
    const capMin = +((state.studyCap || {})[Scheduler.weekday(d)]) || 0;
    const plannedMin = () => have.reduce((a, b) => { const x = pMin(b.start), z = pMin(b.end); return a + (x != null && z != null && z > x ? z - x : 0); }, 0);
    for (const x of sess) {
      if (got >= target) break;
      if (!x.lectureId) continue;
      const key = x.subjectId + '|' + x.lectureId;
      if (taken[key] || tried[key]) continue;
      tried[key] = 1;
      const t = taskOf(x.subjectId, x.lectureId);
      if (!t || t.done || plannedElsewhere(x.subjectId, x.lectureId, d)) continue;
      let dur = Math.min(120, Math.ceil(Scheduler.taskRemainingMin(t) / 15) * 15);
      if (dur < 15) continue;
      if (capMin) {
        const room = capMin - plannedMin();
        if (room < 45 && room < dur) { skipped++; continue; }
        if (dur > room) dur = Math.floor(room / 15) * 15;
        if (dur < 15) { skipped++; continue; }
      }
      const wins = openWindows(d).map(([a, z]) => [Math.ceil(a / 5) * 5, z]).filter(([a, z]) => z > a);
      let win = wins.find(([a, z]) => z - a >= dur);
      if (!win) {
        // no gap holds the whole time: take the biggest gap, only when it covers most of it
        win = wins.slice().sort((x, y) => (y[1] - y[0]) - (x[1] - x[0]))[0];
        if (!win || win[1] - win[0] < 45 || (win[1] - win[0]) < dur * 0.6) { skipped++; continue; }
        dur = Math.floor((win[1] - win[0]) / 15) * 15;
        if (dur < 45) continue;
      }
      const st = win[0];
      have.push({ taskId: x.lectureId, subjectId: x.subjectId, type: x.type || 'study', start: pHM(st), end: pHM(st + dur) });
      taken[key] = 1; got += dur; added++;
    }
    sortPlan(d);
    save(); toast(skipped ? PT().crowded(skipped) : (added ? PT().suggested : PT().suggestNone));
    render();
  }

  // v26: a block that was planned for a day that has passed and was not finished moves
  // to the next day with room (today first). The old block stays on its day as the record.
  function rolloverPlans() {
    const today = todayStr();
    if (!state.plans) return;
    let changed = false;
    Object.keys(state.plans).filter((k) => k < today && k >= Scheduler.addDays(today, -14)).sort().forEach((k) => {
      (state.plans[k] || []).forEach((b) => {
        if (!b || !b.taskId || b.movedTo) return;
        const t = taskOf(b.subjectId, b.taskId);
        if (!t || t.done) return;
        const dur = Math.max(15, pDur(b) || 60);
        const already = Object.keys(state.plans).find((x) => x >= today && (state.plans[x] || []).some((q) => q && q.subjectId === b.subjectId && q.taskId === b.taskId));
        if (already) { b.movedTo = already; changed = true; return; }
        for (let i = 0; i < 7; i++) {
          const d = Scheduler.addDays(today, i);
          const room = openWindows(d).find(([w1, w2]) => Math.ceil(w1 / 5) * 5 + dur <= w2);
          if (!room) continue;
          const st = Math.ceil(room[0] / 5) * 5;
          ensurePlanDay(d);
          state.plans[d].push({ taskId: b.taskId, subjectId: b.subjectId, type: b.type || 'study', start: pHM(st), end: pHM(st + dur), from: k });
          sortPlan(d);
          b.movedTo = d; changed = true; return;
        }
      });
    });
    if (changed) save();
  }

  // v26: tasks he planned for yesterday (or earlier) and did not finish, and where they went.
  function overdueHtml() {
    const today = todayStr();
    const y = Scheduler.addDays(today, -1);
    const fmtD = (d) => (d === today ? PT().todayWord : d.slice(5).replace('-', '/'));
    const seen = {};
    const items = [];
    (dayManual(y) ? state.plans[y] : []).forEach((b) => {
      if (!b || !b.taskId || seen[b.subjectId + '|' + b.taskId]) return;
      const t = taskOf(b.subjectId, b.taskId);
      if (!t || t.done) return;
      seen[b.subjectId + '|' + b.taskId] = 1;
      const sj = subj(b.subjectId) || {};
      items.push(`${sj.name || ''} - ${t.title}${b.movedTo ? ' \u2192 ' + PT().movedTo + ' ' + fmtD(b.movedTo) : ''}`);
    });
    (dayManual(today) ? state.plans[today] : []).forEach((b) => {
      if (!b || !b.taskId || !b.from || b.from >= today || b.from === y || seen[b.subjectId + '|' + b.taskId]) return;
      const t = taskOf(b.subjectId, b.taskId);
      if (!t || t.done) return;
      seen[b.subjectId + '|' + b.taskId] = 1;
      items.push(`${(subj(b.subjectId) || {}).name || ''} - ${t.title} \u2192 ${PT().movedFrom} ${fmtD(b.from)}`);
    });
    if (!items.length) return '';
    return `<div class="card warncard overdue"><b>\u26A0\uFE0F ${esc(PT().overdueTitle)}</b>${items.map((x) => `<div class="muted" style="margin-top:4px">${esc(x)}</div>`).join('')}</div>`;
  }

  function weekOverviewHtml(days) {
    const rows = days.map((d) => {
      const min = planBlocks(d).reduce((a, b) => a + pDur(b), 0);
      const due = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => !t.done && t.due === d).length, 0);
      const ex = state.subjects.filter((s) => { const e2 = examOf(s); return e2 && e2.date === d; });
      return { d, min, due, ex };
    });
    const max = Math.max(1, ...rows.map((r) => r.min));
    const totalMin = rows.reduce((a, r) => a + r.min, 0);

      <span class="tag">${esc(PT().tasksLeft)} ${left}</span>${exN ? `<span class="tag revise">${esc(PT().examsWeek)} ${exN}</span>` : ''}</div>`;
    rows.forEach((r) => {

        <span class="bar slim" style="margin-top:4px"><i style="width:${Math.round(r.min / max * 100)}%"></i></span></span>
        <b class="ssmin">${r.min ? esc(fmtDur(r.min)) : '0'}</b></div>`;
      if (r.ex.length) h += `<div class="warnline">${r.ex.map((s) => esc(s.name)).join(' · ')}</div>`;
    });
    return h + '</div>';
  }

  /* ---- v27: "what's new" entry and the full guide ---- */
  const NEWS_URL = 'https://whatsapp.com/channel/0029VbDge6FISTkOnIbbR11g';
  let guideOpen = false, guideTopic = null;

  const GUIDE = {

  function planSheetHtml() {
    const st = planSheet;
    const d = st.date;
    const list = dayManual(d) ? (state.plans[d] || []) : [];
    const cur = (st.mode === 'edit' && st.i >= 0) ? list[st.i] : null;
    const editing = !!cur;
    const a = editing ? pMin(cur.start) : st.s;
    const z = editing ? pMin(cur.end) : st.e;
    let h = `<div class="overlay"><div class="sheet"><div class="row"><b class="grow" style="font-size:17px">${esc(editing ? PT().editTitle : PT().addTitle)}</b>
      <button class="btn ghost sm" data-act="planClose">\u2715</button></div>
      <div class="muted sml" style="margin:6px 0 10px">${esc(dayLabel(d, todayStr()))}${a != null && z != null ? ' · <span dir="ltr">' + esc(fmtClockRange(a, z)) + '</span>' : ''}</div>`;
    if (editing) {
      h += `<div class="muted sml">${esc(PT().duration)}</div><div class="pick" style="margin:6px 0 10px">${[30, 45, 60, 90, 120].map((m) => `<button class="${pDur(cur) === m ? 'on' : ''}" data-act="planDur" data-min="${m}">${esc(L().fmtM(m))}</button>`).join('')}</div>
        <div class="row" style="margin-bottom:8px"><button class="btn ghost grow" data-act="planUp">\u2191 ${esc(PT().earlier)}</button><button class="btn ghost grow" data-act="planDown">\u2193 ${esc(PT().later)}</button></div>`;
    }
    if (!st.subId) {
      h += `<div class="muted sml" style="margin-bottom:4px">${esc(PT().pickSubject)}</div>`;
      const subs = state.subjects.filter((x) => (x.tasks || []).some((t) => !t.done));
      if (!subs.length) h += `<div class="muted">${esc(PT().noTasks)}</div>`;
      subs.forEach((x) => {
        const n = x.tasks.filter((t) => !t.done).length;
        h += `<button class="pickrow" data-act="planSub" data-sub="${x.id}"><span class="sicon" style="background:${colorOfS(x)}22">${iconOf(x)}</span>
          <span class="grow">${esc(x.name)}</span><span class="muted sml">${n}</span></button>`;
      });
    } else {
      const sj = subj(st.subId) || {};
      h += `<div class="row" style="margin-bottom:4px"><button class="btn ghost sm" data-act="planBack">\u2039</button><b class="grow">${esc(sj.name || '')}</b></div>
        <div class="muted sml" style="margin-bottom:4px">${esc(PT().pickTask)}</div>`;
      const tasks = (sj.tasks || []).filter((t) => !t.done);
      if (!tasks.length) h += `<div class="muted">${esc(PT().noTasks)}</div>`;
      tasks.forEach((t) => {
        const on = editing && cur.taskId === t.id;
        h += `<button class="pickrow${on ? ' on' : ''}" data-act="planTask" data-task="${t.id}"><span class="grow">${esc(t.title)}</span>
          <span class="muted sml">${esc(fmtDur(Scheduler.taskRemainingMin(t)))}</span></button>`;
      });
    }
    if (editing) h += `<div style="margin-top:12px"><button class="btn ghost danger" data-act="planDel" style="width:100%">\uD83D\uDDD1 ${esc(PT().remove)}</button></div>`;
    return h + '</div></div>';
  }

  function planApplyTask(tid) {
    const st = planSheet;
    if (!st) return render();
    const d = st.date;
    const t = taskOf(st.subId, tid);
    if (!t) return render();
    ensurePlanDay(d);
    const list = state.plans[d];
    if (st.mode === 'edit' && st.i >= 0 && list[st.i]) {
      const b = list[st.i];
      b.subjectId = st.subId; b.taskId = tid; b.type = 'study';
      sortPlan(d);
      const idx = list.indexOf(b);
      save(); toast(PT().changed);
      planSheet = { date: d, mode: 'edit', i: idx, subId: st.subId, s: 0, e: 0 };
      return render();
    }
    // a new block: as long as the task needs, as long as the slot allows, at most 60
    const slotMin = Math.max(15, (st.e || 0) - (st.s || 0));
    const rem = Scheduler.taskRemainingMin(t);
    let dur = Math.min(slotMin, rem > 0 ? rem : 60);
    dur = Math.max(15, Math.ceil(dur / 15) * 15);
    const room = findRoom(d, st.s, st.e, dur);
    if (!room) { toast(PT().noRoom); return render(); }
    const block = { taskId: tid, subjectId: st.subId, type: 'study', start: pHM(room.s), end: pHM(room.s + room.dur) };
    list.push(block);
    sortPlan(d);
    save(); toast(PT().changed);
    planSheet = { date: d, mode: 'edit', i: list.indexOf(block), subId: st.subId, s: 0, e: 0 };
    return render();
  }

  function planSetDur(min) {
    const st = planSheet;
    if (!st || st.mode !== 'edit') return render();
    const list = (state.plans || {})[st.date] || [];
    const b = list[st.i];
    if (!b) return render();
    const a = pMin(b.start);
    if (a == null) return render();
    b.end = pHM(a + min);
    sortPlan(st.date);
    save(); toast(PT().changed);
    planSheet = { date: st.date, mode: 'edit', i: list.indexOf(b), subId: st.subId, s: 0, e: 0 };
    return render();
  }

  // Swap a block with the one before/after it: the task moves, the times follow.
  function planMove(dir) {
    const st = planSheet;
    if (!st || st.mode !== 'edit') return render();
    const d = st.date;
    const list = sortPlan(d);
    const i = st.i;
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return render();
    const a = list[i], b = list[j];
    const sa = pMin(a.start), sb = pMin(b.start);
    if (sa == null || sb == null) return render();
    const da = pDur(a), db = pDur(b); // read both lengths before any time moves
    if (dir < 0) {
      // this block takes the earlier start, the other one follows it
      a.start = pHM(sb); a.end = pHM(sb + da);
      b.start = pHM(sb + da); b.end = pHM(sb + da + db);
    } else {
      b.start = pHM(sa); b.end = pHM(sa + db);
      a.start = pHM(sa + db); a.end = pHM(sa + db + da);
    }
    sortPlan(d);
    save(); toast(PT().changed);
    planSheet = { date: d, mode: 'edit', i: list.indexOf(a), subId: st.subId, s: 0, e: 0 };
    return render();
  }

  function planDelete() {
    const st = planSheet;
    if (!st || st.mode !== 'edit') return render();
    const list = (state.plans || {})[st.date] || [];
    if (list[st.i]) list.splice(st.i, 1);
    save(); toast(PT().changed);
    planSheet = null;
    return render();

  function viewDay() {
    const today = todayStr();

    const weekStart = Scheduler.addDays(today, -1); // v25: yesterday, today, then the next five days
    h += '<div class="wkstrip">' + [0, 1, 2, 3, 4, 5, 6].map((i) => {

    const r = Scheduler.generate(state, today, { nowMin: now.getHours() * 60 + now.getMinutes() });
    const stats = Scheduler.focusStats(state.focusLog, today);
    const plannedMin = planBlocks(today).reduce((a, b) => a + pDur(b), 0); // v24: the student's own plan counts
    const doneTasksMin = Math.round(state.subjects.reduce((a, s) => a + s.tasks.reduce((a2, t) =>
      a2 + (t.done && t.doneAt === today ? (t.kind === 'clinic' ? (t.workH || 0) : (t.studyH || 0) + (t.solveH || 0)) : 0), 0), 0) * 60);
    const doneMin = stats.todayMin + doneTasksMin;

      <div class="statcard"><div class="sc-label">${esc(L().statWeekShort)}</div><div class="sc-num">${esc(fmtDur(stats.weekMin))}</div><div class="sc-sub muted">${esc(L().statSessions(stats.sessions))}</div></div>

    if ((state.blocked || []).includes(today)) h += `<div class="card offday">${esc(L().dayOffToday)}</div>`;

    // dark focus card with the start button (like the reference's focus card, simplified)
    h += `<div class="card focuscard"><div class="row"><div class="grow"><div class="fc-title">\uD83C\uDFAF ${esc(L().focusCardTitle)}</div><div class="fc-sub">${esc(L().focusCardSub)}</div></div>

    // v14: tasks finished today stay visible with a check and can be un-done
    const doneToday = [];

    // required tasks
    const open = [];
    state.subjects.forEach((s) => s.tasks.forEach((t) => { if (!t.done) open.push({ s, t, rem: Scheduler.taskRemainingMin(t) }); }));
    open.sort((a, b) => {

    if (!open.length) h += `<div class="muted" style="padding:6px 2px">${esc(L().noOpenTasks)}</div>`;

      `</div><div class="row" style="margin-top:10px"><span class="tag">${esc(L().statToday(fmtDur(stats.todayMin)))}</span><span class="tag">${esc(L().statWeek(fmtDur(stats.weekMin)))}</span><span class="tag">${esc(L().statSessions(stats.sessions))}</span></div></div>`;

  function viewSchedule() {

  // v14: progress dashboard - every number comes from data the app really has
  // (tasks done + focus log); nothing here is estimated or faked.
  // v19: flame streak - a day counts with >=1 lecture done or >=60 study minutes
  function streakCalc(today) {
    const st = state.streak;
    const perDayM = {}, lecDay = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDayM[f.date] = (perDayM[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s2) => s2.tasks.forEach((tk) => {
      if (tk.done && tk.doneAt) {
        perDayM[tk.doneAt] = (perDayM[tk.doneAt] || 0) + Math.round(((tk.studyH || 0) + (tk.solveH || 0) + (tk.workH || 0)) * 60);
        if (tk.kind === 'lecture') lecDay[tk.doneAt] = (lecDay[tk.doneAt] || 0) + 1;
      }
    }));
    const counted = (d) => (lecDay[d] || 0) >= 1 || (perDayM[d] || 0) >= 60 || st.fills.indexOf(d) !== -1;
    let cur = 0;
    for (let d = today; ; d = Scheduler.addDays(d, -1)) {
      if (counted(d)) cur++;
      else if (d === today) continue;
      else break;
    }
    if (cur > (st.best || 0)) st.best = cur;
    const mk = today.slice(0, 7);
    if (st.month !== mk) { st.month = mk; st.used = 0; }
    const left = Math.max(0, 3 - (st.used || 0));
    const y = Scheduler.addDays(today, -1), y2 = Scheduler.addDays(today, -2);
    const canRestore = left > 0 && !counted(y) && counted(y2);
    return { cur, best: st.best || 0, canRestore, left };
  }

  /* ---------------- v20: review queue, workout, subject stats, challenge ---------------- */

  // Lectures finished 3+ days ago (and a week ago) that have not been looked at
  // since. Clinics are not in here, only lecture material.
  function reviewQueue(today) {
    const out = [];
    state.subjects.forEach((s) => (s.tasks || []).forEach((t) => {
      if (!t.done || !t.doneAt || t.kind === 'clinic') return;
      const age = Scheduler.diffDays(t.doneAt, today);
      if (age < 3) return;
      const last = (state.reviewLog || {})[t.id];
      if (last && Scheduler.diffDays(last, today) < 4) return;
      out.push({ s, t, label: age >= 7 ? L().rev7 : L().rev3, age });
    }));
    out.sort((a, b) => b.age - a.age);
    return out.slice(0, 3);
  }

  function reviewCard(today) {
    const q = reviewQueue(today);
    if (!q.length) return '';
    let h = `<div class="card revcard"><b>🔁 ${esc(L().revTitle)}</b><div class="muted" style="margin-top:4px">${esc(L().revSub)}</div>`;

  function workoutCard(today) {
    const wk = Scheduler.workoutWeek(state, today);
    const woToday = Scheduler.isWorkoutDay(state, today);
    if (!woToday && !wk.done) return '';
    const wd0 = Scheduler.weekday(today);
    const start = Scheduler.addDays(today, -((wd0 + 1) % 7));
    let dots = '';
    for (let i = 0; i < 7; i++) {
      const d = Scheduler.addDays(start, i);
      const planned = Scheduler.isWorkoutDay(state, d);
      const done = Scheduler.workoutDone(state, d);
      dots += `<span class="wodot${done ? ' done' : planned ? ' plan' : ''}${d === today ? ' now' : ''}" title="${esc(d)}">${done ? '✓' : esc(L().daysShort[Scheduler.weekday(d)])}</span>`;
    }
    const done = Scheduler.workoutDone(state, today);
    let h = `<div class="card wocard"><div class="row"><div class="grow"><b>💪 ${esc(L().woTitle)}</b>
      <div class="muted sml" style="margin-top:2px">${esc(L().woCount(wk.done, wk.target))}${woToday ? ' · ' + esc(L().woToday) : ''}</div></div>`;
    if (woToday) {
      h += done
        ? `<button class="btn ghost sm" data-act="woUndo">${esc(L().woUndoBtn)}</button>`
        : `<button class="btn sm" data-act="woDone">${esc(L().woDoneBtn)}</button>`;
    }
    h += `</div><div class="wodots">${dots}</div></div>`;
    return h;
  }

  function dashHTML() {
    if (!state.subjects.length) return '';
    const today = todayStr();
    // minutes per day = focus sessions + hours of tasks finished that day
    const perDay = {};
    (state.focusLog || []).forEach((f) => { if (f && f.date) perDay[f.date] = (perDay[f.date] || 0) + (f.minutes || 0); });
    state.subjects.forEach((s) => s.tasks.forEach((t) => {
      if (t.done && t.doneAt) perDay[t.doneAt] = (perDay[t.doneAt] || 0) + Math.round(((t.studyH || 0) + (t.solveH || 0) + (t.workH || 0)) * 60);
    }));
    const last7 = [];
    for (let i = 6; i >= 0; i--) { const d = Scheduler.addDays(today, -i); last7.push({ d, m: perDay[d] || 0 }); }
    const weekMin = last7.reduce((a, x) => a + x.m, 0);
    // planned minutes for the same 7 days, from the generated schedule
    const now = new Date();
    // v29: the plan he made on the timeline (not the old automatic plan)
    const planMin = last7.reduce((a, x) => a + planStat(x.d).min, 0);
    const weekPct = planMin > 0 ? Math.min(100, Math.round(weekMin / planMin * 100)) : (weekMin > 0 ? 100 : 0);
    // readiness: share of all tasks done, and days to the nearest exam
    const totT = state.subjects.reduce((a, s) => a + s.tasks.length, 0);
    const doneT = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done).length, 0);
    const readyPct = totT ? Math.round(doneT / totT * 100) : 0;
    const nx = Scheduler.nextExam(state, today);
    // streak: consecutive studied days, not breaking on a still-young today
    let streak = 0;
    for (let d = today; ; d = Scheduler.addDays(d, -1)) {
      if (perDay[d]) streak++;
      else if (d === today) continue;
      else break;
    }
    const lecDone = state.subjects.reduce((a, s) => a + s.tasks.filter((t) => t.done && t.kind === 'lecture').length, 0);
    const focusMin = (state.focusLog || []).reduce((a, f) => a + (f.minutes || 0), 0);
    // ring geometry
    const RR = 26, CC = 2 * Math.PI * RR;
    const ringOff = (CC * (1 - readyPct / 100)).toFixed(1);
    // last-7-days bar chart (v18: simple bars, today highlighted)
    const W = 300, H = 84, maxM = Math.max(30, ...last7.map((x) => x.m));
    const bw = 26, bgap = (W - 7 * bw) / 6;
    const bars = last7.map((x, i) => {
      const bh = Math.max(3, Math.round((x.m / maxM) * (H - 12)));
      return `<rect x="${Math.round(i * (bw + bgap))}" y="${H - bh}" width="${bw}" height="${bh}" rx="6"${x.d === today ? '' : ' class="dim"'}><title>${x.m}</title></rect>`;
    }).join('');
    // heatmap: last 12 weeks x 7 weekdays
    const todayW = Scheduler.weekday(today);
    let heat = '';
    for (let col = 11; col >= 0; col--) {
      heat += '<div class="hcol">';
      for (let row = 0; row < 7; row++) {
        const d = Scheduler.addDays(today, -(col * 7 + (todayW - row)));
        const future = d > today;
        const m = future ? -1 : (perDay[d] || 0);
        const lv = m < 0 ? 'hx' : m === 0 ? 'h0' : m < 30 ? 'h1' : m < 90 ? 'h2' : 'h3';
        heat += `<i class="hcell ${lv}" title="${d}"></i>`;
      }
      heat += '</div>';
    }
    const ringOffW = (CC * (1 - weekPct / 100)).toFixed(1);
    let h = `<div class="day">${esc(L().dashTitle)}</div>`;
    h += `<div class="dashrow">
      <div class="card dashcard"><div class="muted">${esc(L().dashWeek)}</div>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${RR}" class="ringbg"/><circle cx="32" cy="32" r="${RR}" class="ringfg" style="stroke-dasharray:${CC.toFixed(1)};stroke-dashoffset:${ringOffW}"/><text x="32" y="37" text-anchor="middle" class="ringtxt">${weekPct}%</text></svg>
        <div class="muted sml" style="text-align:center">${esc(fmtDur(weekMin))}${planMin ? ' / ' + esc(fmtDur(planMin)) + ' ' + esc(L().dashPlan) : ''}</div></div>
      <div class="card dashcard"><div class="muted">${esc(L().dashReady)}</div>
        <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${RR}" class="ringbg"/><circle cx="32" cy="32" r="${RR}" class="ringfg" style="stroke-dasharray:${CC.toFixed(1)};stroke-dashoffset:${ringOff}"/><text x="32" y="37" text-anchor="middle" class="ringtxt">${readyPct}%</text></svg>
        <div class="muted sml" style="text-align:center">${doneT}/${totT} ${esc(L().dashTasksDone)}${nx ? ' · ' + esc(L().daysLeft(Scheduler.diffDays(today, nx.date))) : ' · ' + esc(L().dashNoExam)}</div></div>
    </div>`;
    const sk = streakCalc(today);
    h += `<div class="card streakcard"><div class="row"><div class="grow"><span class="sknum">🔥 ${sk.cur}</span> <span class="muted sml">${esc(L().streakDays)} · ${esc(L().streakBest)}: ${sk.best}</span></div>
      ${sk.canRestore
        ? `<div style="text-align:center"><button class="btn sm" data-act="streakRestore">${esc(L().streakRestore)}</button><div class="muted sml" style="margin-top:4px">${esc(L().streakLeft(sk.left))}</div></div>`
        : (sk.left < 3 ? `<span class="muted sml">${esc(L().streakLeft(sk.left))}</span>` : '')}</div></div>`;
    h += `<div class="card tilesrow"><div class="tile"><div class="tnum">${lecDone}</div><div class="muted sml">${esc(L().dashDoneLec)}</div></div>
      <div class="tile"><div class="tnum">${focusMin}</div><div class="muted sml">${esc(L().dashFocusMin)}</div></div>
      <div class="tile"><div class="tnum">${sk.cur}</div><div class="muted sml">${esc(L().dashStreak)}</div></div></div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashLast7)}</div>
      <svg class="barch" viewBox="0 0 ${W} ${H}">${bars}</svg>
      <div class="row" style="justify-content:space-between">${last7.map((x) => `<span class="muted sml">${esc(L().daysShort[Scheduler.weekday(x.d)])}</span>`).join('')}</div></div>`;
    h += `<div class="card"><div class="muted">${esc(L().dashHeat)}</div>
      <div class="heat" dir="ltr">${heat}</div>
      <div class="row" style="justify-content:flex-end;gap:4px;align-items:center;margin-top:6px"><span class="muted sml">${esc(L().dashLess)}</span><i class="hcell h0"></i><i class="hcell h1"></i><i class="hcell h2"></i><i class="hcell h3"></i><span class="muted sml">${esc(L().dashMore)}</span></div></div>`;
    return h;
  }

  /* ---------------- focus mode (pomodoro) ---------------- */

  function logFocus(sid, tid, minutes, am) {
    const t = taskOf(sid, tid);
    if (t) {
      Scheduler.deductFromTask(t, minutes);
      if (Scheduler.taskRemainingMin(t) <= 0) setTimeout(() => toast(L().focusTaskDone), 2400);
    }
    (state.focusLog = state.focusLog || []).push({ id: uid(), taskId: tid, subjectId: sid, date: todayStr(), minutes, am: (am == null ? minutes : Math.max(0, Math.min(minutes, am))), at: Date.now() });
    save();
    toast(L().focusLogged(minutes));
  }

  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      beepCtx = beepCtx || new AC();
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.connect(g); g.connect(beepCtx.destination);
      o.frequency.value = 880; g.gain.value = 0.07;
      o.start(); o.stop(beepCtx.currentTime + 0.35);
    } catch (e) {}
  }

  const mmss = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

  function updateFocusText() {
    const el = $('focusTimer');
    if (el && focusRun) {
      const remain = focusRun.paused ? focusRun.remainMs : (focusRun.endsAt ? focusRun.endsAt - Date.now() : 0);
      el.textContent = focusRun.phase === 'ready' ? '✓' : mmss(remain);
    }
  }

  // v19: fires a local notification once a day, at the chosen time, if the
  // day's goal is not done yet. Works only while the app is open (no server).
  function checkReminder() {
    const rm = state.remind;
    if (!rm || !rm.on) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const key = todayStr();
    if (rm.last === key) return;
    const parts = (rm.time || '20:00').split(':');
    const tMin = (+parts[0]) * 60 + (+parts[1] || 0);
    const nw = new Date();
    if (nw.getHours() * 60 + nw.getMinutes() < tMin) return;
    const ps = planStat(key); // v29: the plan on his timeline
    const planned = ps.min;
    const stats = Scheduler.focusStats(state.focusLog, key);
    const doneT = Math.round(state.subjects.reduce((a, s2) => a + s2.tasks.reduce((a2, tk) =>
      a2 + (tk.done && tk.doneAt === key ? (tk.kind === 'clinic' ? (tk.workH || 0) : (tk.studyH || 0) + (tk.solveH || 0)) : 0), 0), 0) * 60);
    if (ps.n > 0 && ps.left === 0) { rm.last = key; save(); return; } // everything he planned is done
    if (planned > 0 && stats.todayMin + doneT >= planned) { rm.last = key; save(); return; }
    rm.last = key; save();
    try { new Notification(L().remNotifTitle, { body: ps.left ? L().remNotifLeft(ps.left) : L().remNotifBody, icon: 'icon-192.png' }); } catch (e) { /* ignored */ }
  }

  /* ---- v30: the peeking mascot. Decisions live in mascot.js; this part draws it and keeps time.
     Its only setting (how often) is stored on this device under its own key, so nothing in
     the saved planner data or the sync changes. ---- */
  const MASCOT_KEY = 'senny-mascot';
  let mascotDoneAt = 0, mascotLast = 0, mascotRecent = [], mascotHide = null, mascotEl = null, mascotSide = '';
  const mascotOpenedAt = Date.now();
  const mascotFreq = () => { try { const v = JSON.parse(localStorage.getItem(MASCOT_KEY) || '{}'); return v && Mascot.FREQS.includes(v.freq) ? v.freq : 5; } catch (e) { return 5; } };
  function setMascotFreq(m) { try { localStorage.setItem(MASCOT_KEY, JSON.stringify({ freq: m })); } catch (e) { /* ignored */ } mascotLast = Date.now(); if (!m) mascotLeave(); }
  function mascotContext(first) {
    const today = todayStr(), now = new Date();
    const studiedToday = (state.focusLog || []).some((f) => f && f.date === today && (f.minutes || 0) > 0)
      || state.subjects.some((s) => (s.tasks || []).some((t) => t.done && t.doneAt === today));
    let cur = 0; try { cur = streakCalc(today).cur; } catch (e) { cur = 0; }
    const nx = Scheduler.nextExam(state, today);
    const open = [];
    state.subjects.forEach((s) => { if ((s.tasks || []).some((t) => !t.done) && s.name) open.push(s); });
    const pickS = nx && open.find((s) => s.id === nx.subjectId) ? open.find((s) => s.id === nx.subjectId) : open[Math.floor(Math.random() * open.length)];
    return { hour: now.getHours(), first, justDone: Date.now() - mascotDoneAt < 10 * 60000, streak: cur, studiedToday,
      daysToExam: nx ? Scheduler.diffDays(today, nx.date) : null, subject: (nx && nx.name) || (pickS && pickS.name) || '' };
  }
  function mascotBlock() {
    return Mascot.blockedBy({ freq: mascotFreq(), hour: new Date().getHours(), timerRunning: !!focusRun || focusOpen,
      modalOpen: !!document.querySelector('.overlay'), typing: /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || ''),
      hidden: document.hidden, showing: !!mascotEl });
  }
  function mascotTick() {
    if (!state.profile || !state.profile.onboarded) return;
    if (Mascot.due({ now: Date.now(), openedAt: mascotOpenedAt, lastShownAt: mascotLast, freq: mascotFreq() || 5 }) && !mascotBlock()) mascotShow(false);
  }
  function mascotLeave() {
    clearTimeout(mascotHide); mascotHide = null;
    const el = mascotEl; if (!el) return;
    mascotEl = null; el.classList.remove('in');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
  }
  // force = the "try it" button: ignores the timer/night rules because he asked for it
  function mascotShow(force, side) {
    if (mascotEl) mascotLeave();
    if (!force && mascotBlock()) return;
    const first = !mascotLast && !force;
    const ctx = mascotContext(first);
    const pk = Mascot.pick(state.lang, ctx, null, mascotRecent);
    mascotRecent.push(pk.text); if (mascotRecent.length > 10) mascotRecent.shift();
    mascotLast = Date.now();
    const sides = ['r', 'l', 't'];
    const sd = side || sides[Math.floor(Math.random() * 3)];
    mascotSide = sd;
    const el = document.createElement('div');
    el.id = 'mascot'; el.className = 'mascot m-' + sd; el.setAttribute('role', 'status');
    // vertical spot for the side peeks: somewhere in the middle band, away from the header and the bottom bar
    const topPx = Math.round(window.innerHeight * (0.34 + Math.random() * 0.22));
    if (sd !== 't') el.style.top = topPx + 'px';
    else { const hd = document.querySelector('header'); el.style.top = (hd ? Math.round(hd.getBoundingClientRect().bottom) - 4 : 56) + 'px'; el.style.left = Math.round(window.innerWidth * (0.3 + Math.random() * 0.25)) + 'px'; }
    el.innerHTML = `<div class="mbody"><span class="mav">${avatarSvg(state.profile.avatar)}</span><span class="mbub" dir="auto">${esc(pk.text)}</span></div>`;
    el.addEventListener('click', () => { mascotLeave(); });
    document.body.appendChild(el);
    mascotEl = el;
    el.dataset.pool = pk.pool;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    mascotHide = setTimeout(mascotLeave, 10000);
  }

  function tick() {
    const now = Date.now();
    // v23: a change arrived from the other device while a field was focused
    if (pendingRender) {
      const el = document.activeElement;
      if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) { pendingRender = false; render(); return; }
    }
    try { mascotTick(); } catch (e) { /* ignored */ }
    // v31: focus time counts only while the app is open in front of the student
    // (hidden tab or locked screen: no points). A gap larger than 1.5s is never counted.
    if (focusRun && focusRun.phase === 'focus' && !focusRun.paused && focusRun.endsAt) {
      if (document.visibilityState === 'visible') focusRun.activeMs = (focusRun.activeMs || 0) + Math.min(Math.max(0, now - (tick.lastAct || now)), 1500);
      if (!tick.lastPers || now - tick.lastPers > 15000) { tick.lastPers = now; persistFocus(); }
    }
    tick.lastAct = now;
    try { frTick(); } catch (e) { /* ignored */ }
    if (!tick.lastRem || now - tick.lastRem > 30000) { tick.lastRem = now; try { checkReminder(); } catch (e) { /* ignored */ } }
    // keep the header clock fresh and roll the app over to the new day at midnight
    const clk = $('clockLbl');
    if (clk) { const c = clockNow(); if (clk.textContent !== c) clk.textContent = c; }
    if (rollDay()) return; // v35
    if (focusRun && !focusRun.paused && (focusRun.phase === 'focus' || focusRun.phase === 'break') && focusRun.endsAt && now >= focusRun.endsAt) {
      const p = Scheduler.FOCUS_PRESETS[focusRun.preset] || Scheduler.FOCUS_PRESETS[0];
      if (focusRun.phase === 'focus') {
        logFocus(focusRun.subjectId, focusRun.taskId, focusMinOf(focusRun), focusActiveMin(focusRun));
        if (focusRun.review) { (state.reviewLog = state.reviewLog || {})[focusRun.taskId] = todayStr(); save(); }
        focusRun.cycles = (focusRun.cycles || 0) + 1;
        focusRun.phase = 'break';
        focusRun.endsAt = now + p.breakMin * 60000;
        beep();
      } else {
        focusRun.phase = 'ready';
        focusRun.endsAt = 0;
        beep();
      }
      persistFocus();
      render();
    } else {
      if (focusRun) updateFocusText();
      document.querySelectorAll('[data-cd]').forEach((el) => { el.textContent = cdText(+el.dataset.cd); });
    }
  }

  /* ---------------- v21: lecture attachments (files stay on this device, in IndexedDB) ---------------- */
  const ATT_MAX = 50 * 1024 * 1024; // per file
  let attOpen = null, attPlay = null, attMeta = {}, attDB = null, attBusy = false, attUsage = null;
  function attOpenDB() {
    return new Promise((resolve, reject) => {
      if (attDB) return resolve(attDB);
      if (!window.indexedDB) return reject(new Error('no-idb'));
      const rq = indexedDB.open('dental-planner-files', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        const m = db.createObjectStore('meta', { keyPath: 'id' }); m.createIndex('task', 'taskId');
        db.createObjectStore('blobs');
      };
      rq.onsuccess = () => { attDB = rq.result; resolve(attDB); };
      rq.onerror = () => reject(rq.error);
    });
  }
  const idbReq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function attLoadMeta() {
    try {
      const db = await attOpenDB();
      const all = await idbReq(db.transaction('meta').objectStore('meta').getAll());
      attMeta = {};
      all.forEach((m) => (attMeta[m.taskId] = attMeta[m.taskId] || []).push(m));
      render();
    } catch (e) { /* storage unavailable: the button just shows an error when used */ }
  }
  async function attAdd(taskId, subjectId, files) {
    attBusy = true;
    const db = await attOpenDB();
    let tooBig = 0, failed = 0, added = 0;
    for (const f of files) {
      if (f.size > ATT_MAX) { tooBig++; continue; }
      const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const meta = { id, taskId, subjectId, name: f.name || 'file', type: f.type || '', size: f.size, added: Date.now() };
      try {
        await new Promise((res, rej) => {
          const tx = db.transaction(['meta', 'blobs'], 'readwrite');
          tx.objectStore('meta').put(meta); tx.objectStore('blobs').put(f, id);
          tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort'));
        });
        (attMeta[taskId] = attMeta[taskId] || []).push(meta); added++;
      } catch (e) { failed++; }
    }
    attBusy = false;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
    if (tooBig) toast(L().attTooBig(Math.round(ATT_MAX / 1048576)));
    else if (failed) toast(L().attFull);
    attRefreshUsage(); render();
  }
  async function attDelete(id, taskId) {
    try {
      const db = await attOpenDB();
      await new Promise((res, rej) => { const tx = db.transaction(['meta', 'blobs'], 'readwrite'); tx.objectStore('meta').delete(id); tx.objectStore('blobs').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { /* ignore */ }
    attMeta[taskId] = (attMeta[taskId] || []).filter((m) => m.id !== id);
    if (attPlay && attPlay.id === id) { try { URL.revokeObjectURL(attPlay.url); } catch (e) { /* ignore */ } attPlay = null; }
    attRefreshUsage(); render();
  }
  async function attDeleteMany(pred) { // when a lecture or a subject is removed
    const ids = [];
    Object.keys(attMeta).forEach((k) => (attMeta[k] || []).forEach((m) => { if (pred(m)) ids.push(m); }));
    for (const m of ids) await attDelete(m.id, m.taskId);
  }
  async function attOpenFile(id, taskId) {
    const m = (attMeta[taskId] || []).find((x) => x.id === id); if (!m) return;
    let w = null;
    const isMedia = /^(audio|video|image)\//.test(m.type);
    if (!isMedia) { try { w = window.open('', '_blank'); } catch (e) { w = null; } } // opened first so the browser allows it
    try {
      const db = await attOpenDB();
      const blob = await idbReq(db.transaction('blobs').objectStore('blobs').get(id));
      if (!blob) { if (w) w.close(); return toast(L().attMissing); }
      const url = URL.createObjectURL(blob.type ? blob : new Blob([blob], { type: m.type || 'application/octet-stream' }));
      if (isMedia) {
        if (attPlay) { try { URL.revokeObjectURL(attPlay.url); } catch (e) { /* ignore */ } }
        attPlay = { id, url, kind: m.type.split('/')[0] }; return render();
      }
      if (m.type === 'application/pdf' && w) { w.location = url; return; }
      if (w) w.close();
      const a = document.createElement('a'); a.href = url; a.download = m.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { if (w) w.close(); toast(L().attMissing); }
  }
  async function attRefreshUsage() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        const own = Object.keys(attMeta).reduce((a, k) => a + (attMeta[k] || []).reduce((x, m) => x + m.size, 0), 0);
        attUsage = { own, usage: e.usage || 0, quota: e.quota || 0 };
      } else {
        attUsage = { own: Object.keys(attMeta).reduce((a, k) => a + (attMeta[k] || []).reduce((x, m) => x + m.size, 0), 0), usage: 0, quota: 0 };
      }
      const el = document.getElementById('attUsage'); if (el) el.innerHTML = attUsageHtml();
    } catch (e) { /* ignore */ }
  }
  const fmtBytes = (n) => '\u2066' + (n >= 1048576 ? (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB') + '\u2069'; // LTR isolate so the unit stays after the number in Arabic text
  function attUsageHtml() {
    if (!attUsage) return '';
    const u = attUsage;
    const ratio = u.quota ? u.usage / u.quota : 0;
    let h = `<span class="muted sml">${esc(L().attUsage(fmtBytes(u.own)))}${u.quota ? ' · ' + esc(L().attQuota(fmtBytes(Math.max(0, u.quota - u.usage)))) : ''}</span>`;
    if (ratio > 0.8) h += `<div class="warnline">${esc(L().attNearFull)}</div>`;
    return h;
  }
  function attPanel(s, t) {
    const list = attMeta[t.id] || [];

    h += `<label class="btn ghost sm attpick">${esc(L().attAdd)}<input type="file" multiple hidden data-act="attFile" data-s="${s.id}" data-l="${t.id}"></label>`;
    if (!list.length) h += `<div class="muted sml" style="margin-top:6px">${esc(L().attNone)}</div>`;

      h += `<div class="attrow"><span class="grow" dir="auto">${icon} ${esc(m.name)} <span class="muted sml" dir="ltr">${esc(fmtBytes(m.size))}</span></span>

        <button class="btn ghost sm" data-act="attDel" data-l="${t.id}" data-f="${m.id}">${esc(L().attDelBtn)}</button></div>`;
      if (attPlay && attPlay.id === m.id) {
        h += attPlay.kind === 'audio' ? `<audio controls src="${attPlay.url}" style="width:100%;margin:4px 0"></audio>`
          : attPlay.kind === 'video' ? `<video controls playsinline src="${attPlay.url}" style="width:100%;margin:4px 0;border-radius:10px"></video>`
          : `<img src="${attPlay.url}" alt="" style="max-width:100%;margin:4px 0;border-radius:10px">`;
      }
    });
    h += `<div id="attUsage">${attUsageHtml()}</div><div class="muted sml" style="margin-top:4px">${esc(L().attLocalNote)}</div></div>`;
    return h;
  }

      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).catch(() => {}); return true; }

    try {

  // v21: hand a generated image to the share sheet, or download it when sharing is unavailable.
  async function sendBlob(blob, filename, okMsg) {
    if (!blob) return;
    const file = new File([blob], filename, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* the student cancelled */ }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(okMsg);
  }

  // Everything on a day's timeline, in the order it happens.
  function schedItems(date) {
    const out = [];
    blocksForDate(date).forEach((b) => out.push({ m: b.s, time: fmtClockRange(b.s, b.e), subject: b.label || L().kindWord[b.kind] || '', title: '' }));
    planBlocks(date).forEach((b) => {
      const sj = subj(b.subjectId);
      if (!sj) return;
      const t = b.taskId ? taskOf(b.subjectId, b.taskId) : null;
      const a = pMin(b.start), z = pMin(b.end);
      out.push({ m: a == null ? 1e9 : a, time: a != null && z != null ? fmtClockRange(a, z) : '', subject: sj.name, title: t ? t.title : (b.title || (b.type === 'review' ? L().generalReview : '')) });
    });
    out.sort((a, b) => a.m - b.m);
    return out.slice(0, 12);
  }

  function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(str) { return decodeURIComponent(escape(atob(String(str).replace(/-/g, '+').replace(/_/g, '/')))); }

  /* ---------------- overlays ---------------- */

  function overlays() {
    let h = '';
    if (cloudEnabled() && !session && !authSkipped) {
      h += `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().authTitle)}</b>

        <p class="muted sml">${esc(L().authTwoDevices)}</p>

      return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().outConfirmTitle)}</b>
        <p class="muted" style="margin-top:8px">${esc(anon ? L().outConfirmAnon : L().outConfirmAcc)}</p>
        ${anon && hasFiles ? `<p class="muted err">${esc(L().outConfirmFiles)}</p>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn grow danger" data-act="outYes">${esc(L().outConfirm)}</button>

    }
    if (linkOpen) return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().linkTitle)}</b>
      <p class="muted">${esc(L().linkSub)}</p>
      <input id="lkEmail" type="email" placeholder="${esc(L().emailPh)}" dir="ltr">
      <input id="lkPass" type="password" placeholder="${esc(L().passPh)}" dir="ltr">
      <div id="lkMsg" class="muted" style="min-height:18px;margin-top:6px"></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" data-act="linkDo">${esc(L().linkDo)}</button>
      <button class="btn ghost" data-act="linkClose">${esc(L().closeBtn)}</button></div></div></div>`;
    if (tourStep != null) return tourHtml();
    if (fabOpen) {
      const opts = state.subjects.map((s2) => `<option value="${s2.id}">${esc(s2.name)}</option>`).join('');
      return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().addTaskTitle)}</b>
        <div class="muted" style="margin:10px 0 4px">${esc(L().pickSubject)}</div>
        <select id="fabS">${opts}</select>
        <div class="pick" style="margin:8px 0">
          <button class="${fabKind === 'lecture' ? 'on' : ''}" data-act="fabKind" data-k="lecture">📖 ${esc(L().kindLecture)}</button>
          ${clinicAllowed()
            ? `<button class="${fabKind === 'clinic' ? 'on' : ''}" data-act="fabKind" data-k="clinic">🦷 ${esc(L().kindClinic)}</button>`
            : `<button disabled title="${esc(L().clinicLocked)}">🔒 ${esc(L().kindClinic)}</button>`}
        </div>
        <input id="fabT" placeholder="${esc(L().taskTitlePh)}">
        <div class="row" style="margin-top:8px">
          <select id="fabD"><option value="0">${esc(L().estAuto)}</option>
            <option value="1">${esc(L().diff[0])}</option><option value="2">${esc(L().diff[1])}</option><option value="3">${esc(L().diff[2])}</option></select>
          ${fabKind === 'clinic' ? `<input id="fabDue" type="date" title="${esc(L().duePh)}">` : ''}
        </div>
        <div class="row" style="margin-top:12px"><button class="btn grow" data-act="fabAddDo">${esc(L().addTaskBtn)}</button>
        <button class="btn ghost" data-act="fabClose">${esc(L().closeBtn)}</button></div></div></div>`;
