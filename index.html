<style>:root {
  /* dark is the default theme */
  --bg: #0b1416;
  --card: #142226;
  --ink: #e7f1f0;
  --muted: #93aab0;
  --line: #234045;
  --line-soft: #1d3237;
  --soft: #18292e;
  --input-bg: #0f1e22;
  --ghost-bg: #1b3036;
  --ghost-hover: #223b42;
  --nav-bg: rgba(17, 30, 34, 0.86);
  --bar-bg: #1e3439;
  --exam-bg: #2e270f;
  --exam-line: #54481a;
  --warn-bg: linear-gradient(120deg, #2b1717, #2b1d12);
  --warn-line: #4d2622;
  --solve-bg: #0e2c3d;
  --solve-ink: #6cc4ec;
  --done-ink: #5f7d84;
  --primary: #0d9488;
  --primary-d: #0f766e;
  --primary-2: #0284c7;
  --teal-bg: #123f3a;
  --teal-ink: #4fd8c6;
  --amber-bg: #33280f;
  --amber-ink: #e8b954;
  --violet-bg: #241d3d;
  --violet-ink: #b7a3ee;
  --danger: #e06060;
  --danger-bg: #381c1c;
  --danger-ink: #f2a0a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px -14px rgba(0, 0, 0, 0.5);
  --radius: 16px;
}
[data-theme="light"] {
  --bg: #eef4f3;
  --card: #ffffff;
  --ink: #12262b;
  --muted: #5d7379;
  --line: #dce8e6;
  --line-soft: #eef3f2;
  --soft: #f6faf9;
  --input-bg: #fbfdfd;
  --ghost-bg: #eef4f3;
  --ghost-hover: #e3edeb;
  --nav-bg: rgba(255, 255, 255, 0.82);
  --bar-bg: #e4efed;
  --exam-bg: #fffaf0;
  --exam-line: #f5e3b3;
  --warn-bg: linear-gradient(120deg, #fdeeee, #fdf6f0);
  --warn-line: #f0c9c4;
  --solve-bg: #e0f2fe;
  --solve-ink: #075985;
  --done-ink: #8aa0a5;
  --teal-bg: #d7f3ee;
  --teal-ink: #0b6e62;
  --amber-bg: #fdf0d5;
  --amber-ink: #92600a;
  --violet-bg: #ece7fb;
  --violet-ink: #5b3fa8;
  --danger: #d64545;
  --danger-bg: #fdeaea;
  --danger-ink: #a52f2b;
  --shadow: 0 1px 2px rgba(13, 60, 56, 0.06), 0 10px 28px -14px rgba(13, 60, 56, 0.22);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(13, 148, 136, 0.16), transparent 60%),
    radial-gradient(900px 420px at 0% -10%, rgba(2, 132, 199, 0.10), transparent 55%),
    var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: linear-gradient(120deg, var(--primary-d), var(--primary) 55%, var(--primary-2));
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px -10px rgba(13, 60, 56, 0.5);
}
h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
h1 { display: flex; align-items: center; gap: 9px; }
.brand { width: 30px; height: 30px; flex: none; display: inline-flex; }
.brand svg { width: 100%; height: 100%; border-radius: 9px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
.hrow { display: flex; gap: 8px; align-items: center; }
#todayLbl {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#langBtn, #themeBtn, #profileBtn {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  padding: 5px 14px;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
#langBtn:hover, #themeBtn:hover, #profileBtn:hover { background: rgba(255, 255, 255, 0.28); }
#themeBtn { padding: 5px 10px; }
nav {
  display: flex;
  gap: 4px;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 22px;
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  max-width: 540px;
  margin: 0 auto;
  z-index: 30;
  padding: 6px;
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.55);
}
nav button {
  flex: 1;
  padding: 7px 4px;
  border: 0;
  background: none;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 3px;
  transition: background 0.15s, color 0.15s;
}
nav button svg { width: 20px; height: 20px; flex: none; }
main { padding-bottom: 104px; }
#fab {
  position: fixed; bottom: 92px; inset-inline-end: 16px; z-index: 29;
  width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer;
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 22px -8px rgba(13, 148, 136, 0.65);
}
#fab svg { width: 26px; height: 26px; }
.wkstrip { display: flex; gap: 6px; margin: 10px 0 2px; }
.wkcell { flex: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font: inherit; cursor: pointer; }
.wkcell .wkname { font-size: 11px; }
.wkcell .wknum { font-size: 15px; color: var(--text); }
.wkcell.now { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .wkcell.now .wknum { color: var(--primary); font-weight: 800; }
.wkcell.sel { border-color: var(--primary); background: var(--ghost-bg); }
.wkdot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
.wkdot.off { background: transparent; }
.notebox { width: 100%; min-height: 64px; margin: 4px 0 10px; resize: vertical; }
.noteview { font-size: 13px; margin: -2px 0 10px; padding-inline-start: 34px; white-space: pre-wrap; }
.streakcard .sknum { font-size: 22px; font-weight: 800; }
nav button:hover { background: var(--ghost-bg); color: var(--ink); }
nav button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  font-weight: 700;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
/* v21: the floating tab bar sits ~76px tall at the bottom, so the page has to
   end above it or the footer (note + feedback button) hides behind it. */
main { max-width: 780px; margin: 0 auto; padding: 16px 14px 132px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  animation: fadeUp 0.25s ease both;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
input, select, textarea {
  font: inherit;
  padding: 9px 11px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  max-width: 100%;
  background: var(--input-bg);
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.16);
}
textarea { width: 100%; min-height: 74px; resize: vertical; margin: 10px 0; }
input[type="checkbox"] { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }
input[type="date"] { font-variant-numeric: tabular-nums; }
.btn {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 9px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px -5px rgba(13, 148, 136, 0.6);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:active { transform: none; }
.ghost {
  background: var(--ghost-bg);
  color: var(--ink);
  box-shadow: none;
  border: 1px solid var(--line);
  font-weight: 600;
}
.ghost:hover { background: var(--ghost-hover); filter: none; }
button.danger {
  background: var(--danger-bg);
  color: var(--danger-ink);
  box-shadow: none;
  font-weight: 700;
}
button.danger:hover { background: #fbdcdc; filter: none; }
.tag {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--teal-bg);
  color: var(--teal-ink);
  white-space: nowrap;
}
.tag.revise { background: var(--amber-bg); color: var(--amber-ink); }
.tag.review { background: var(--violet-bg); color: var(--violet-ink); }
.warn {
  background: var(--warn-bg);
  border: 1px solid var(--warn-line);
  border-inline-start: 4px solid var(--danger);
  color: var(--danger-ink);
  font-weight: 600;
}
.muted { color: var(--muted); font-size: 13px; }
.bar { height: 9px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #34d399, var(--primary));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.day { font-weight: 800; font-size: 15px; margin: 18px 2px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .muted { font-weight: 600; }
.today { color: var(--primary-d); }
.today::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); align-self: center; }
.sess { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.sess:first-of-type { border-top: 0; }
.sess .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sess b { font-weight: 700; }
.sess .hrs { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lec { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); }
.lec:first-of-type { border-top: 0; }
.lec.done span.t { text-decoration: line-through; color: var(--done-ink); }
.grid7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.grid7 label { font-size: 13px; font-weight: 700; color: var(--muted); }
.grid7 input { margin-top: 5px; width: 100%; }
.empty { text-align: center; padding: 34px 18px; }
.empty .big { font-size: 42px; margin-bottom: 10px; }
.empty p { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
.subj-head b { font-size: 15px; }
.datechip {
  background: var(--ghost-bg);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pcard { border-inline-start: 4px solid var(--primary); }
@media (min-width: 640px) {
  main { padding: 22px 20px 132px; }
  nav { justify-content: center; }
  nav button { flex: 0 1 150px; }
  h1 { font-size: 21px; }
}

/* ---- v3 additions ---- */
.sync { font-size: 12px; font-weight: 700; color: #d7f3ee; min-width: 0; }
.sync.synced { color: #bbf7d0; }
.sync.error { color: #fecaca; }
.batchstatus { font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
.batchstatus.err { color: #fecaca; font-weight: 700; }
.hidden { display: none; }
.checkline { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-weight: 600; font-size: 14px; }
.checkline input { width: 18px; height: 18px; }

.tag.solve { background: var(--solve-bg); color: var(--solve-ink); }
.tag.clinic { background: var(--amber-bg); color: var(--amber-ink); }

.examform { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
.addtask { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin: 10px 0; }
.addtask input { width: 100%; }
.pick { display: flex; gap: 8px; }
.pick button {
  flex: 1; padding: 9px 6px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.pick button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
.pick button:disabled { opacity: 0.55; cursor: not-allowed; }
.estchip {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--teal-bg); color: var(--teal-ink); min-height: 14px;
}
.estchip:empty { display: none; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cell {
  min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--input-bg); padding: 4px 5px; cursor: pointer; position: relative;
  display: flex; flex-direction: column; gap: 2px; transition: border-color 0.12s, background 0.12s;
}
.cell:hover { border-color: var(--primary); }
.cell.out { background: transparent; border: 0; cursor: default; }
.cell.past { opacity: 0.45; }
.cell.sel { border-color: var(--primary); background: var(--teal-bg); box-shadow: 0 0 0 2px rgba(13,148,136,0.25); }
.cell.now .dnum {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff;
  border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
}
.cell.examday { border-color: #f0b429; background: var(--exam-bg); }
.cell .dnum { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cell .exdot { font-size: 10px; line-height: 1; }
.cell .dots { display: flex; gap: 2px; flex-wrap: wrap; }
.cell .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cell .chrs { font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

button.sm { padding: 5px 12px; font-size: 13px; }
.examrow { background: var(--exam-bg); border-radius: 10px; padding: 9px 10px !important; border: 1px solid var(--exam-line) !important; }

.overlay {
  position: fixed; inset: 0; background: rgba(10, 30, 32, 0.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.sheet {
  background: var(--card); border-radius: 20px; padding: 22px 18px; width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px -18px rgba(13, 60, 56, 0.45); animation: fadeUp 0.25s ease both;
}
.sheet input { width: 100%; margin-top: 8px; }
.linklike { background: none; border: 0; color: var(--primary-d); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: underline; }

.yeargrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ypick {
  padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
  font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.ypick.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
.ypick.locked { opacity: 0.45; cursor: not-allowed; }

#toast {
  position: fixed; bottom: 170px; inset-inline: 0; margin: 0 auto; width: fit-content; max-width: 90%;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  transform: translateY(8px); z-index: 60;
}
#toast.show { opacity: 1; transform: none; }

/* subject card header: keep the name on its own line at narrow widths */
.subj-head b { flex: 1 1 100%; margin-bottom: 4px; }
.subj-head .btn { padding: 7px 13px; font-size: 12.5px; }
@media (min-width: 640px) { .subj-head b { flex: 1 1 auto; margin-bottom: 0; } }

/* v5: busy timeline + subject icons */
.sicon {
  width: 30px; height: 30px; border-radius: 10px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; vertical-align: middle;
}
b.subj-head .sicon, .subj-head .sicon { width: 26px; height: 26px; font-size: 15px; margin-inline-end: 2px; }
.sess.busyrow { opacity: 0.85; }
.sess.busyrow .sicon { width: 26px; height: 26px; font-size: 14px; }
.tag.free { background: #e0f2fe; color: #075985; }
.dayhead b { font-size: 15px; }
.addblock { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
.addblock input[type="time"] { padding: 7px 9px; }

/* v4: curriculum + smart warnings */
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: all 0.15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary-d); }
.chip .chipd { color: var(--muted); font-size: 11px; margin-inline-start: 4px; }

/* v6: My Day, focus mode, exam center */

}

/* v9: let long Arabic titles breathe on narrow screens instead of crushing */

/* v14 */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.subjgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.subjcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 12px; text-align: center; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }

.sml { font-size: 12px; }
.dashrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.foot { margin-top: 20px; padding: 14px 0 4px; text-align: center; border-top: 1px solid var(--line-soft); }

a.btn { display: inline-block; text-decoration: none; }
/* v17: avatars + leaderboard */

  flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;

}

}

/* v21: the footer always clears the floating bar and the + button */

/* v21: Ask AI */
.aibox { margin: 4px 0 10px; padding: 12px; border-radius: 14px; background: linear-gradient(135deg, rgba(13,148,136,.16), rgba(99,102,241,.14)); border: 1px solid rgba(13,148,136,.35); }

/* v21: first-run tour */

/* v21.3: the name sits on top with the plain-English descriptor under it */
.brandtxt { display: flex; flex-direction: column; line-height: 1.05; }

   line box and no letter-spacing (spacing breaks the cursive join). */

/* v24: manual planning */
.wkdot.exam { background: var(--danger, #e5484d); }
.sess.freeslot { width: 100%; background: transparent; border: 0; border-top: 1px dashed var(--line); color: var(--muted); font: inherit; text-align: start; cursor: pointer; }

.fsplus { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--primary); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }

.pickrow { display: flex; width: 100%; gap: 10px; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 6px 0; color: var(--text); font: inherit; text-align: start; cursor: pointer; }
.pickrow.on { border-color: var(--primary); background: var(--ghost-bg); }
.planline { }

/* v25 */
.dayctl { gap: 8px; margin: 2px 0 10px; }
.dayctl .btn:not(.ghost) { padding: 10px 12px; }
.dayctl .btn.ghost { min-width: 44px; }

/* v27: guide + what's new */
.newsbar { margin: 8px 0 12px; border-color: var(--primary); }
.newscard { margin-bottom: 10px; }
.sheet.guidesheet { max-height: 92vh; overflow-y: auto; }

.guidep { margin: 0; line-height: 1.75; }
.gtopic.on { border-color: var(--primary); }

/* v30: peeking mascot. Only the mascot itself takes touch; it sits below the bottom bar and the add button. */
.mascot { position: fixed; z-index: 25; pointer-events: auto; cursor: pointer; opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.3,1.1), opacity .3s; -webkit-tap-highlight-color: transparent; max-width: calc(100vw - 8px); }
.mascot .mbody { display: flex; align-items: center; gap: 6px; }
.mascot .mav { width: 64px; flex: 0 0 64px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.mascot .mav svg { width: 100%; height: auto; display: block; }
.mascot .mbub { max-width: 190px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 11px; font-size: 13px; font-weight: 700; line-height: 1.5; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.mascot.m-r { right: 0; transform: translateX(110%); }
.mascot.m-r.in { transform: translateX(-4px); opacity: 1; }
.mascot.m-r .mbody { flex-direction: row-reverse; }
.mascot.m-r .mav { transform: rotate(-12deg); margin-right: -18px; }
.mascot.m-l { left: 0; transform: translateX(-110%); }
.mascot.m-l.in { transform: translateX(4px); opacity: 1; }
.mascot.m-l .mav { transform: rotate(12deg); margin-left: -18px; }
.mascot.m-t { transform: translateY(-110%); }
.mascot.m-t.in { transform: translateY(0); opacity: 1; }
.mascot.m-t .mbody { flex-direction: column; gap: 4px; }

.mascot { direction: ltr; }
html[dir="rtl"] .mascot .mbub { direction: rtl; }

/* v31: friends tab */
nav button { position: relative; min-width: 0; }
nav button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
nav button.dot::after { content: ''; position: absolute; top: 5px; inset-inline-end: 22%; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 2px var(--nav-bg); }

.frask { flex: 1 1 100%; }
.frreq { padding: 8px 0; border-top: 1px solid var(--line); gap: 6px; }

.lblist { margin-top: 8px; }

/* v37.1: Noir Luxe, light effects by default */
/* ============================================================
   سِنّي · Theme C — "Noir Luxe"
   Near-black canvas, slow rotating rim light, hairline gradient
   borders on every card, teal→coral accents.
   ============================================================ */

html { background: #03080a; }

body {
  background:
    radial-gradient(900px 520px at 72% -8%, rgba(13, 148, 136, 0.22), transparent 60%),
    radial-gradient(700px 480px at 6% 8%, rgba(251, 113, 133, 0.12), transparent 58%),
    linear-gradient(180deg, #050e11 0%, #04090b 55%, #020608 100%);
}

/* v37.1: static background painted once on a fixed layer (no blur, no rotation, no fixed attachment) */
body::before {
  content: "";
  position: fixed; inset: 0;
  z-index: 0; pointer-events: none;
  background:
    radial-gradient(70% 38% at 72% 0%, rgba(20, 184, 166, 0.20), transparent 70%),
    radial-gradient(55% 34% at 6% 6%, rgba(251, 113, 133, 0.10), transparent 70%),
    radial-gradient(60% 30% at 100% 100%, rgba(2, 132, 199, 0.08), transparent 70%);
}
/* full effects only: slow drift, transform only, one viewport-sized layer */
html[data-fx="full"] body::before {
  inset: -12%;
  background:
    radial-gradient(closest-side, rgba(20, 184, 166, 0.26), transparent 70%) 70% 14% / 60% 46% no-repeat,
    radial-gradient(closest-side, rgba(251, 113, 133, 0.13), transparent 70%) 6% 20% / 50% 40% no-repeat,
    radial-gradient(closest-side, rgba(2, 132, 199, 0.12), transparent 70%) 90% 88% / 56% 40% no-repeat;
  animation: fxDrift 70s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes fxDrift {
  0%   { transform: translate3d(-2%, -1%, 0); }
  100% { transform: translate3d(2%, 2%, 0); }
}

header, main { position: relative; z-index: 1; }

:root {
  --bg: #04090b;
  --card: #0b1518;
  --ink: #eef7f6;
  --muted: #86999e;
  --line: rgba(255, 255, 255, 0.09);

  --input-bg: rgba(3, 10, 12, 0.85);
  --ghost-bg: rgba(255, 255, 255, 0.05);
  --ghost-hover: rgba(255, 255, 255, 0.09);
  --nav-bg: rgba(7, 15, 17, 0.96);
  --bar-bg: rgba(255, 255, 255, 0.08);
  --exam-bg: rgba(43, 33, 12, 0.6);

  --primary: #14b8a6;
  --primary-d: #0f766e;

}

/* ---- header ---- */
header {
  background: linear-gradient(180deg, rgba(5, 13, 15, 0.98), rgba(4, 10, 12, 0.94));
  border-bottom: 1px solid transparent;
  border-image: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.45), rgba(251, 113, 133, 0.35), transparent) 1;
  box-shadow: 0 8px 16px -12px rgba(0, 0, 0, 0.9);

}

  background: linear-gradient(100deg, #eafffb, #5eead4 48%, #fda4af);

}

/* ---- cards: hairline gradient border ---- */
.card {

  background:
    linear-gradient(180deg, #0c171a, #091114) padding-box,

}

/* ---- bits ---- */
.bar { background: rgba(255, 255, 255, 0.08); }
.bar i { background: linear-gradient(90deg, #5eead4, #14b8a6 55%, #fb7185); }

.pcard { border-inline-start-color: #14b8a6; }

/* ---- light counterpart ---- */
[data-theme="light"] {
  --bg: #f6f8f8;
  --card: #ffffff;

[data-theme="light"] .statcard,

/* v37: tab bar stays at the bottom, clear of the phone's bottom edge */
nav { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30; }

  // 'HH:MM' -> minutes since 00:00; null when the value is not a valid clock time.
  function hmToMin(s) {
    const m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(s || '').trim());
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }

  const fmtMin = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');

  function normBlock(b) {
    const start = hmToMin(b && b.start), end = hmToMin(b && b.end);
    return {
      id: (b && b.id) || '', label: String((b && b.label) || ''),
      kind: ['class', 'gym', 'sleep', 'other'].includes(b && b.kind) ? b.kind : 'other',
      start, end,
    };
  }

  /* ---------------- mandatory daily sleep ---------------- */
  const SLEEP_MIN = 360;            // 6 fixed hours of sleep every day
  const SLEEP_DEFAULT = '23:00';    // default start when the day has no setting (11 PM -> 5 AM)

  // The day's fixed sleep block as a raw block ('HH:MM' strings), or null when
  // the state carries no sleep map (older callers / unit tests).
  function sleepBlock(state, wd) {
    const sl = state && state.sleep;
    if (!sl || typeof sl !== 'object') return null;
    const s = hmToMin(sl[wd]);
    const start = s == null ? hmToMin(SLEEP_DEFAULT) : s;
    return { id: 'sleep-' + wd, label: '', kind: 'sleep', start: fmtMin(start), end: fmtMin((start + SLEEP_MIN) % 1440) };
  }

  // Weekly blocks of a weekday plus the fixed sleep block.
  function blocksForWd(state, wd) {
    const list = (((state || {}).busy || {})[wd] || []).slice();
    const sb = sleepBlock(state, wd);
    if (sb) list.push(sb);
    return list;
  }

  // Busy blocks of one planning day, as [start,end) minutes with sleep-style
  // midnight crossings unrolled (end may exceed 1440).
  function busyOn(state, d) {
    const wd = weekday(d);
    const out = [];
    blocksForWd(state, wd).forEach((raw) => {
      const b = normBlock(raw);
      if (b.start == null || b.end == null) return;
      if (b.start === b.end) return;
      if (b.end > b.start) {
        if (b.end > DAY_MIN) out.push([b.start, b.end]); // entirely after the day boundary
      } else {
        // crosses midnight: the part after midnight belongs to this planning day
        out.push([Math.max(b.start, DAY_MIN), 1440 + b.end]);
      }
    });
    // yesterday's midnight-crossing blocks spill into the start of this day
    const pwd = (wd + 6) % 7;
    blocksForWd(state, pwd).forEach((raw) => {
      const b = normBlock(raw);
      if (b.start == null || b.end == null || b.end >= b.start) return;
      if (b.end > DAY_MIN) out.push([0, b.end]);
    });
    ((state.busyOnce || {})[d] || []).forEach((raw) => {
      const b = normBlock(raw);
      if (b.start == null || b.end == null || b.start === b.end) return;
      if (b.end > b.start) { if (b.end > DAY_MIN) out.push([b.start, b.end]); }
      else out.push([Math.max(b.start, DAY_MIN), 1440 + b.end]);
    });
    out.sort((a, b2) => a[0] - b2[0]);
    const merged = [];
    out.forEach((r) => {
      const last = merged[merged.length - 1];
      if (last && r[0] < last[1]) { if (r[1] > last[1]) last[1] = r[1]; }
      else merged.push(r.slice());
    });
    return merged;
  }

  // Free study windows of one planning day, in order: [start,end) minutes, may exceed 1440.
  function freeWindowsOn(state, d) {
    if ((state.blocked || []).includes(d)) return [];
    const free = [];
    let cur = DAY_MIN;
    busyOn(state, d).forEach(([s, e]) => {
      if (s > cur) free.push([cur, s]);
      if (e > cur) cur = e;
    });
    if (cur < 1440 + DAY_MIN) free.push([cur, 1440 + DAY_MIN]);
    return free;
  }

  function overlapOn(state, d) {
    const raw = [];
    const wd = weekday(d);
    blocksForWd(state, wd).forEach((b) => raw.push(normBlock(b)));
    ((state.busyOnce || {})[d] || []).forEach((b) => raw.push(Object.assign(normBlock(b), { once: true })));
    const bad = [];
    for (let i = 0; i < raw.length; i++) {
      const a = raw[i];
      if (a.start == null || a.end == null) bad.push({ type: 'invalid', block: a });
    }
    const valid = raw.filter((b) => b.start != null && b.end != null && b.start !== b.end);
    for (let i = 0; i < valid.length; i++) for (let j = i + 1; j < valid.length; j++) {
      const a = valid[i], b = valid[j];
      const sameOnce = !!a.once === !!b.once;
      if (!sameOnce) continue;
      if (a.start === b.end || b.start === a.end) continue; // touching is fine
      if (a.start === b.start) bad.push({ type: 'overlap', a, b });
      else if (a.end > a.start && b.end > b.start && a.start < b.end && b.start < a.end) bad.push({ type: 'overlap', a, b });
    }
    return bad;
  }

  // True when [s,e) (minutes, crossing-midnight allowed) overlaps a block list.
  function blockClashes(list, sm, em) {
    const unr2 = (s, e) => (e > s ? [s, e] : [s, e + 1440]);
    const [a0, a1] = unr2(sm, em);
    return (list || []).some((raw) => {
      const b = normBlock(raw);
      if (b.start == null || b.end == null || b.start === b.end) return false;
      const [b0, b1] = unr2(b.start, b.end);
      // compare on the unrolled circle so a post-midnight tail also clashes
      for (const sh of [-1440, 0, 1440]) {
        const c0 = b0 + sh, c1 = b1 + sh;
        if (a0 === c1 || c0 === a1) continue; // touching is fine
        if (a0 < c1 && c0 < a1) return true;
      }
      return false;
    });
  }

  /* ---------------- rule-based difficulty / time estimation ---------------- */

  // Normalize Arabic + Latin text so keyword matching is stable.
  const norm = (s) => String(s || '')
    .toLowerCase()
    .replace(/[ً-ْ]/g, '') // Arabic diacritics
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي');

  const HARD_KW = [
    'anatom', 'nerve', 'nervous', 'plexus', 'surg', 'pharmac', 'pathol', 'biochem',
    'physiol', 'microbi', 'implant', 'endodont', 'orthodont', 'occlus', 'prosthod',
    'periodont', 'maxillofac', 'tumor', 'tumour', 'syndrome', 'trauma', 'radiol',
    'anesthe', 'salivary', 'tmj',
    'تشريح', 'عصب', 'ضفيره', 'جراح', 'ادويه', 'فارماك', 'باثول', 'امراض', 'فسيول',
    'كيمياء حيويه', 'ميكروب', 'زراعه', 'حشو عصب', 'تقويم', 'تركيبات', 'ورم', 'سرطان',
    'متلازم', 'اشعه', 'تخدير', 'لعاب',
  ].map(norm);

  const EASY_KW = [
    'intro', 'overview', 'definit', 'terminolog', 'histor', 'orientation', 'basic',
    'مقدم', 'تعريف', 'تاريخ', 'مصطلح', 'اساسيات', 'نظره عامه',
  ].map(norm);

  const STUDY_H = [1, 2, 3];          // study hours per chapter by difficulty 1..3
  const SOLVE_H = [10, 20, 30].map((m) => m / 60); // solving/question time: 10-30 minutes
  const CLINIC_H = [2, 4, 6];         // clinic/lab work hours

  function estimateDifficulty(title) {
    const t = norm(title);
    if (EASY_KW.some((k) => t.includes(k))) return 1;
    if (HARD_KW.some((k) => t.includes(k))) return 3;
    return 2;
  }

  // kind: 'lecture' (study + solving) or 'clinic' (work only)
  function estimate(title, kind) {
    const d = estimateDifficulty(title);
    if (kind === 'clinic') return { difficulty: d, studyH: 0, solveH: 0, workH: CLINIC_H[d - 1] };
    return { difficulty: d, studyH: STUDY_H[d - 1], solveH: SOLVE_H[d - 1], workH: 0 };
  }

  // Review block before an exam/quiz: scales with covered lectures, capped at 4h.
  function reviewHours(covered) {
    let n = Number(covered) || 0;
    if (n <= 0) n = 1;
    return Math.min(4, Math.max(1.5, Math.round(n * 0.5 / SLOT) * SLOT));
  }

  /* ---------------- shape normalization (v1/v2 -> v3) ---------------- */

  function normSubject(s) {
    const examDate = s.examDate || (s.exam && s.exam.date) || null;
    let covered = s.exam && s.exam.covered ? Number(s.exam.covered) : 0;
    const tasks = s.tasks
      ? s.tasks.map((t) => ({
          id: t.id, title: t.title, kind: t.kind === 'clinic' ? 'clinic' : 'lecture',
          studyH: t.studyH != null ? Number(t.studyH) : (Number(t.hours) || 1),
          solveH: t.kind === 'clinic' ? 0 : (t.solveH != null ? Number(t.solveH) : 0),
          workH: t.kind === 'clinic' ? (t.workH != null ? Number(t.workH) : 2) : 0,
          due: t.due || null, done: !!t.done, confidence: t.confidence || 0,
        }))
      : (s.lectures || []).map((l) => ({
          id: l.id, title: l.title, kind: 'lecture', studyH: Number(l.hours) || 1,
          solveH: 0, workH: 0, due: null, done: !!l.done, confidence: l.confidence || 0,
        }));
    if (!covered) covered = tasks.filter((t) => t.kind === 'lecture').length;
    return { id: s.id, name: s.name, weight: Number(s.weight) || 2, examDate, covered, tasks };
  }

  function capacityOn(state, d) {
    if ((state.blocked || []).includes(d)) return 0;
    // free time is the day (12 AM -> 12 AM) minus busy blocks; the last session
    // of the day ends 30 minutes before the day's edge
    const mins = freeWindowsOn(state, d).reduce((a, [s, e]) => a + Math.max(0, Math.min(e, 1440 + DAY_MIN - BREAK_M) - s), 0);
    return Math.max(0, Math.floor(mins / 60 * 2) / 2);
  }

  // Bookable gaps: [startMin, lengthHours] inside the free windows, trimmed so the
  // last session of the day still ends 30 minutes before the day's edge.
  function gapsOn(state, d) {
    const out = [];
    freeWindowsOn(state, d).forEach(([s, e]) => {
      const end = Math.min(e, 1440 + DAY_MIN - BREAK_M);
      if (end - s >= 60) out.push([s, (end - s) / 60]);
    });
    return out;
  }

  /**
   * state: { subjects:[{id,name, examDate|exam:{date,covered}, weight, lectures|tasks}],
   *          busy:{weekday 0..6: [{id,label,kind,start,end}]},
   *          busyOnce:{date: [block]}, overrides:{date:hours}, blocked:[dates] }
   * Blocks use 'HH:MM'; a block whose end <= start crosses midnight (sleep) and
   * spills into the next day. Study sessions go into the free gaps between blocks
   * with a 30-minute break after every 3 hours of work in a day.
   * Sessions: {date,subjectId,lectureId,title,type,hours,startMin,endMin}
   *   type: study | solve | clinic | revise | examreview | review
   *   startMin/endMin: minutes since 00:00 (endMin may exceed 1440 past midnight)
   */
  function generate(state, today, opts) {
    const nowMin = opts && opts.nowMin != null ? Number(opts.nowMin) : null;
    const subs = (state.subjects || []).map(normSubject);
    const active = subs.filter((s) => (s.examDate ? s.examDate >= today : s.tasks.some((t) => !t.done)));
    if (!active.length) return { sessions: [], deficits: [] };

    let last = today;
    active.forEach((s) => { if (s.examDate && s.examDate >= today && s.examDate > last) last = s.examDate; });
    active.forEach((s) => s.tasks.forEach((t) => { if (t.due && t.due >= today && t.due > last) last = t.due; }));
    if (last === today) last = addDays(today, 15); // no deadlines: plan two weeks ahead
    const days = [];
    for (let d = today; d < last; d = addDays(d, 1)) days.push(d);
    const cap = days.map((d) => capacityOn(state, d));
    const gaps = days.map((d) => gapsOn(state, d).map((g) => g.slice()));
    // today: nothing is booked in time that has already passed
    if (nowMin != null && gaps.length && gaps[0].length) {
      const start = Math.max(DAY_MIN, Math.ceil(nowMin / BREAK_M) * BREAK_M);
      gaps[0].forEach((g) => {
        const end = g[0] + g[1] * 60;
        if (start <= g[0]) return;
        if (start >= end) { g[1] = 0; return; }
        g[1] = (end - start) / 60; g[0] = start;
      });
      gaps[0] = gaps[0].filter((g) => g[1] * 60 >= 60);
      cap[0] = Math.min(cap[0], gaps[0].reduce((a, g) => a + g[1], 0));
    }
    const idx = {}; days.forEach((d, i) => (idx[d] = i));

    const sessions = [];
    const dayAcc = days.map(() => 0); // v16: minutes of work placed on each day since its last break
    // Allocate up to h hours inside ONE gap of day i (a session never spans a busy
    // block): the earliest gap that fits the whole block, else the biggest gap.
    // A 30-minute break is reserved after every 3 hours of work in the day; a
    // piece starting within one slot of the 3-hour mark takes its break first.
    const alloc = (i, h) => {
      let best = -1;
      gaps[i].forEach((g, gi) => {
        if (g[1] < SLOT - 1e-9) return;
        if (best < 0) { best = gi; return; }
        const fits = g[1] >= h - 1e-9, bestFits = gaps[i][best][1] >= h - 1e-9;
        if ((fits && (!bestFits || g[0] < gaps[i][best][0])) || (!fits && !bestFits && g[1] > gaps[i][best][1])) best = gi;
      });
      if (best < 0) return { hours: 0, at: null };
      const g = gaps[i][best];
      // break first when the 3-hour mark is reached or less than one slot away
      const acc = dayAcc[i] % 180;
      if (dayAcc[i] > 0 && (acc < 1e-6 || 180 - acc < SLOT * 60) && g[1] >= h + BREAK_M / 60) {
        g[0] += BREAK_M; g[1] -= BREAK_M / 60; dayAcc[i] = 0;
      }
      const left = dayAcc[i] % 180 < 1e-6 && dayAcc[i] > 0 ? 180 : 180 - (dayAcc[i] % 180);
      const take = Math.min(h, g[1], left / 60);
      if (take <= 1e-9) return { hours: 0, at: null };
      const at = g[0];
      dayAcc[i] += take * 60;
      // reserve the 30-minute break right after a full 3-hour stretch, when the
      // gap continues (at a gap's end the busy block or the night is the break)
      const rest = dayAcc[i] % 180 < 1e-6 && g[1] - take >= BREAK_M / 60 ? BREAK_M : 0;
      g[0] += take * 60 + rest;
      g[1] -= take + rest / 60;
      if (g[1] < SLOT - 1e-9) gaps[i].splice(best, 1);
      return { hours: take, at };
    };
    const push = (date, subjectId, lectureId, title, type, hours, startMin) => {
      const prev = sessions.find((x) => x.date === date && x.subjectId === subjectId && x.lectureId === lectureId && x.type === type &&
        (startMin == null ? x.startMin == null : x.endMin === startMin)); // merge only truly contiguous pieces
      if (prev) { prev.hours += hours; if (startMin != null) prev.endMin += hours * 60; }
      else sessions.push({ date, subjectId, lectureId, title, type, hours, startMin: startMin == null ? null : startMin, endMin: startMin == null ? null : startMin + hours * 60 });
    };

    // 1) reserve one review block on the last open day before each exam/quiz
    active.filter((s) => s.examDate && s.examDate > today)
      .sort((a, b) => a.examDate.localeCompare(b.examDate))
      .forEach((s) => {
        const want = reviewHours(s.covered);
        for (let d = addDays(s.examDate, -1); d >= today; d = addDays(d, -1)) {
          const i = idx[d];
          if (i == null || cap[i] < SLOT) continue;
          const take = Math.min(want, Math.floor(cap[i] / SLOT) * SLOT);
          if (take < SLOT) continue;
          const a = alloc(i, take);
          if (a.hours < SLOT) continue;
          push(d, s.id, null, '', 'examreview', a.hours, a.at);
          cap[i] -= a.hours;
          break;
        }
      });

    // 2) work items: lecture -> study then solving; clinic -> work; low confidence -> revision
    const items = {};
    active.forEach((s) => {
      const list = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) list.push({ t, rem: t.workH || 2, type: 'clinic', due: t.due || s.examDate || null });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) list.push({ t, rem: t.studyH, type: 'study', due: s.examDate });
          if (t.solveH > 0) list.push({ t, rem: t.solveH, type: 'solve', due: s.examDate });
        } else if (t.confidence && t.confidence <= 2) {
          list.push({ t, rem: (t.studyH || 1) * 0.5, type: 'revise', due: s.examDate });
        }
      });
      items[s.id] = list;
    });
    const remaining = (s) => items[s.id].reduce((a, i) => a + i.rem, 0);
    const deadlineOf = (s) => (s.examDate && s.examDate >= today ? s.examDate : last);
    const capBefore = (deadline, fromI) => {
      let c = 0;
      for (let i = fromI; i < days.length && days[i] < deadline; i++) c += cap[i];
      return c;
    };

    days.forEach((d, di) => {
      let slots = Math.round(Math.min(cap[di], gaps[di].reduce((a, g) => a + g[1], 0)) / SLOT);
      const todayH = {}; let lastPick = null;
      while (slots > 0) {
        const open = active.filter((s) => deadlineOf(s) > d);
        const needy = open.filter((s) => items[s.id].some((i) => i.rem > 1e-9 && (!i.due || i.due > d)));
        let pick = null, review = false, capped = false;
        if (needy.length) {
          const score = (s) => s.weight * remaining(s) / Math.max(capBefore(deadlineOf(s), di), SLOT);
          let pool = needy.filter((s) => (todayH[s.id] || 0) < MAX_PER_SUBJECT);
          if (!pool.length) { pool = needy; capped = true; } // everything hit the per-subject cap: keep filling the day
          const sticky = (s) => score(s) * (s.id === lastPick ? 1.25 : 1);
          pool.sort((a, b) => sticky(b) - sticky(a) || deadlineOf(a).localeCompare(deadlineOf(b)));
          pick = pool[0];
        } else if (open.some((s) => s.examDate && s.examDate > d)) {
          pick = open.filter((s) => s.examDate && s.examDate > d).sort((a, b) => a.examDate.localeCompare(b.examDate))[0];
          review = true; // spare time: general review of the nearest exam
        } else break;
        if (!review) {
          const it = items[pick.id].find((i) => i.rem > 1e-9 && (!i.due || i.due > d));
          // one task piece is placed contiguously; a short piece (e.g. 10 min solving) keeps its real length
          const room = Math.min(it.rem, (capped ? it.rem : MAX_PER_SUBJECT - (todayH[pick.id] || 0)), slots * SLOT);
          if (room <= 1e-9) { slots = 0; break; }
          let take = it.rem <= room + 1e-9 ? it.rem : Math.floor(room / SLOT) * SLOT;
          if (take < SLOT) take = Math.min(it.rem, room); // never drop a sub-slot piece
          const a = alloc(di, take);
          if (a.hours <= 1e-9) { slots = 0; break; } // no gap left that fits work + break
          const placed = Math.min(take, a.hours);
          it.rem -= placed;
          push(d, pick.id, it.t.id, it.t.title, it.type, placed, a.at);
          todayH[pick.id] = (todayH[pick.id] || 0) + placed;
          slots -= Math.ceil(placed / SLOT - 1e-9);
        } else {
          // spare-time review: one contiguous chunk so the day view stays readable
          const take = Math.min(slots * SLOT, 4);
          const a = alloc(di, take);
          if (a.hours < SLOT - 1e-9) { slots = 0; break; }
          push(d, pick.id, null, '', 'review', a.hours, a.at);
          slots -= Math.ceil(a.hours / SLOT - 1e-9);
        }
        lastPick = pick.id;
      }
    });

    sessions.sort((a, b) => a.date.localeCompare(b.date) || (a.startMin == null ? 1e9 : a.startMin) - (b.startMin == null ? 1e9 : b.startMin));
    const deficits = active
      .map((s) => ({ subjectId: s.id, hours: Math.max(0, +remaining(s).toFixed(2)) }))
      .filter((x) => x.hours > 1e-9);
    return { sessions, deficits };
  }

  /**
   * Smart overload warnings: for every subject whose work does not fit before its
   * deadline, name the exam date and the specific open tasks in priority order
   * (biggest remaining block first), so the student knows exactly what to start with.
   * Returns [{subjectId, name, examDate, hoursShort, openCount, tasks:[{id,title,hours,type}]}].
   */
  function warnings(state, today) {
    const r = generate(state, today);
    if (!r.deficits.length) return [];
    const byId = {};
    (state.subjects || []).map(normSubject).forEach((s) => { byId[s.id] = s; });
    return r.deficits.map((d) => {
      const s = byId[d.subjectId];
      if (!s) return null;
      const open = [];
      s.tasks.forEach((t) => {
        if (t.kind === 'clinic') {
          if (!t.done) open.push({ id: t.id, title: t.title, hours: t.workH || 2, type: 'clinic' });
          return;
        }
        if (!t.done) {
          if (t.studyH > 0) open.push({ id: t.id, title: t.title, hours: t.studyH, type: 'study' });
          if (t.solveH > 0) open.push({ id: t.id, title: t.title, hours: t.solveH, type: 'solve' });
        } else if (t.confidence && t.confidence <= 2) {
          open.push({ id: t.id, title: t.title, hours: (t.studyH || 1) * 0.5, type: 'revise' });
        }
      });
      open.sort((a, b) => b.hours - a.hours);
      return {
        subjectId: s.id, name: s.name, examDate: s.examDate,
        hoursShort: d.hours, openCount: open.length, tasks: open.slice(0, 5),
      };
    }).filter(Boolean);
  }

  function progress(state, today) {
    return (state.subjects || []).map((raw) => {
      const s = normSubject(raw);
      const total = s.tasks.length;
      const done = s.tasks.filter((t) => t.done).length;
      return {
        subjectId: s.id, name: s.name, total, done,
        pct: total ? Math.round((done / total) * 100) : 0,
        daysLeft: s.examDate ? diffDays(today, s.examDate) : null,
      };
    });
  }


  /* ---------------- v6: focus mode, stats, revision planner ---------------- */

  // Pomodoro presets the student picks from: 25/5 or 50/10 minutes.
  const FOCUS_PRESETS = [
    { focusMin: 25, breakMin: 5 },
    { focusMin: 50, breakMin: 10 },
  ];

  // Remaining work on a task, in minutes (study + solving, or clinic work).
  function taskRemainingMin(task) {
    if (!task) return 0;
    if (task.kind === 'clinic') return Math.max(0, Math.round((Number(task.workH) || 0) * 60));
    return Math.max(0, Math.round(((Number(task.studyH) || 0) + (Number(task.solveH) || 0)) * 60));
  }

  // Deduct focused minutes from a task's remaining hours. Lecture tasks lose study
  // time first, then solving; clinic tasks lose work hours. Never goes below zero.
  // Returns the minutes actually deducted (can be less when the task runs out).
  function deductFromTask(task, minutes) {
    let rem = Math.max(0, Math.round(Number(minutes) || 0));

    const sleep = {}, busy = {}, once = {}, planOut = {}, capOut = {}, fm = {};
    let profile = out.profile, woDays = ((out.workout || {}).days || []), pace = out.pace;
    let lb = out.leaderboard, rem = { on: !!(out.remind || {}).on, time: (out.remind || {}).time || '' };

    keys.forEach((k) => {
      const lv = lf[k], cv = cf[k];
      const lt = Number(ls[k]) || 0, ct = Number(cs[k]) || 0;
      const goneAt = Math.max(Number(lg[k]) || 0, Number(cg[k]) || 0);
      let val;
      if (goneAt && goneAt > Math.max(lt, ct)) val = undefined; // newest thing about this field is a deletion
      else if (lv === undefined) val = cv;
      else if (cv === undefined) val = lv;
      else val = (lt || ct) ? (lt >= ct ? lv : cv) : (lNewer ? lv : cv);
      const stampOf = Math.max(lt, ct);
      if (stampOf) fm[k] = stampOf;
      if (val === undefined) return;
      if (k.indexOf('sl:') === 0) sleep[k.slice(3)] = val;
      else if (k.indexOf('sc:') === 0) capOut[k.slice(3)] = val;
      else if (k.indexOf('bu:') === 0) busy[k.slice(3)] = val;
      else if (k.indexOf('bo:') === 0) once[k.slice(3)] = val;
      else if (k.indexOf('pl:') === 0) planOut[k.slice(3)] = val;
      else if (k === 'wo:days') woDays = val;
      else if (k === 'pr') profile = val;
      else if (k === 'pace') pace = val;
      else if (k === 'lb') lb = val;
      else if (k === 'rem') rem = val;
    });

    out.sleep = sleep;
    out.busy = busy;
    out.busyOnce = once;
    out.plans = planOut;
    out.studyCap = capOut;
    out.profile = profile;
    out.pace = pace;
    out.leaderboard = lb;
    out.workout = Object.assign({}, out.workout || {}, { days: (woDays || []).slice() });
    const lastL = String((local.remind || {}).last || ''), lastC = String((cloud.remind || {}).last || '');
    out.remind = Object.assign({}, out.remind || {}, rem, { last: lastL > lastC ? lastL : lastC });
    out.fm = fm;
    out.goneF = goneUnion(local && local.goneF, cloud && cloud.goneF);
    return out;
  }

  function merge(local, cloud) {
    if (!cloud || !cloud.subjects) return local;
    if (!local) return cloud;
    const lAt = Number(local.savedAt) || 0, cAt = Number(cloud.savedAt) || 0;
    const lNewer = lAt >= cAt;
    const out = clone(lNewer ? local : cloud);

    out.focusLog = unionById(cloud.focusLog, local.focusLog);
    out.gone = goneUnion(cloud.gone, local.gone);
    out.goneS = goneUnion(cloud.goneS, local.goneS);
    /* v23: a day switched off on one device must stay off, but a day switched
       back on must stay on - so each date carries its own add/remove stamp
       instead of a blind union (which resurrected every removed day). Copies
       from before v23 carry no stamps, and for those the union still applies. */
    const bAdd = {}, bRem = {}, allDays = {};
    [local, cloud].forEach((x) => {
      (x.blocked || []).forEach((d) => { allDays[d] = 1; });
      Object.keys(x.blockedAt || {}).forEach((d) => { allDays[d] = 1; bAdd[d] = Math.max(Number(bAdd[d]) || 0, Number(x.blockedAt[d]) || 0); });
      Object.keys(x.unblocked || {}).forEach((d) => { allDays[d] = 1; bRem[d] = Math.max(Number(bRem[d]) || 0, Number(x.unblocked[d]) || 0); });
    });
    out.blocked = Object.keys(allDays).filter((d) => {
      const add = Number(bAdd[d]) || 0, rem = Number(bRem[d]) || 0;
      if (add || rem) return add > rem;
      return (local.blocked || []).indexOf(d) !== -1 || (cloud.blocked || []).indexOf(d) !== -1;
    }).sort();
    out.blockedAt = bAdd;
    out.unblocked = bRem;

    out.subjects = mergeSubjects(cloud.subjects, local.subjects);
    const gone = out.gone, goneS = out.goneS;
    out.subjects = out.subjects.filter((s) => !(goneS[s.id] && goneS[s.id] >= (Number(s.m) || 0)));
    out.subjects.forEach((s) => {
      s.tasks = (s.tasks || []).filter((t) => !(gone[t.id] && gone[t.id] >= (Number(t.m) || 0)));
    });

    out.streak = mergeStreak(local.streak, cloud.streak);

    // workout log: one flag per date, so a union is always safe
    const wl = {}, wc = (cloud.workout || {}).log || {}, wll = (local.workout || {}).log || {};
    Object.keys(wl).forEach((k) => delete wl[k]);
    Object.keys(wc).forEach((k) => { if (wc[k]) wl[k] = 1; });
    Object.keys(wll).forEach((k) => { if (wll[k]) wl[k] = 1; });
    out.workout = Object.assign({}, (lNewer ? local : cloud).workout || {}, { log: wl });

    // review log: keep the most recent review date per task
    const rv = {};
    const rc = local.reviewLog || {}, rd = cloud.reviewLog || {};
    Object.keys(rc).forEach((k) => { rv[k] = rc[k]; });
    Object.keys(rd).forEach((k) => { if (!rv[k] || String(rd[k]) > String(rv[k])) rv[k] = rd[k]; });
    out.reviewLog = rv;

    // v23: sleep, busy days, workout days, profile and the rest, field by field
    mergeFields(local, cloud, out, lNewer);

    // the challenge code should survive even if the other copy has none yet
    const ch = (lNewer ? local : cloud).challenge || { code: '' };
    const other = (lNewer ? cloud : local).challenge || { code: '' };
    out.challenge = (ch && ch.code) ? ch : (other && other.code ? other : ch);

    // the reminder stamp is a date string: the later one wins so it does not re-fire
    const rl = (local.remind || {}).last || '', rcl = (cloud.remind || {}).last || '';
    if (rl > rcl) out.remind = Object.assign({}, out.remind, { last: rl });

    out.savedAt = Math.max(lAt, cAt);
    return out;
  }

  return { snapshot, stamp, merge, stable, taskSig, subjSig, mergeSubjects, fieldMap, mergeFields };
});

    }

    if (!mins.includes(mm)) mins.push(mm);
    return `<span class="tpick" id="${id}">` +
      `<select id="${id}H">${allowEmpty ? '<option value="">--</option>' : ''}${H12.map((h) => `<option value="${h}"${h === h12 ? ' selected' : ''}>${h}</option>`).join('')}</select>` +
      `<span class="tsep muted">:</span>` +
      `<select id="${id}M">${mins.map((m) => `<option value="${m}"${m === mm ? ' selected' : ''}>${m}</option>`).join('')}</select>` +
      `<span class="apseg" id="${id}AP"><button type="button" data-v="AM" class="${ap === 'AM' ? 'on' : ''}">AM</button><button type="button" data-v="PM" class="${ap === 'PM' ? 'on' : ''}">PM</button></span></span>`;
  }
  // 'HH:MM' (24h) from a picker; '' when an optional picker is unset, null when missing.
  function tpRead(id, allowEmpty) {

    if (!hEl || !mEl) return null;

  // Busy blocks to display on a given date (weekly + yesterday's sleep tail + one-offs).
  function blocksForDate(d) {
    const out = [];
    const wd = Scheduler.weekday(d);
    const pushB = (raw, spill) => {
      const b = Scheduler.normBlock(raw);
      if (b.start == null || b.end == null || b.start === b.end) return;
      if (b.end > b.start) { if (!spill && b.end > Scheduler.DAY_MIN) out.push({ label: b.label, kind: b.kind, s: b.start, e: b.end }); }
      else if (spill) { if (b.end > Scheduler.DAY_MIN) out.push({ label: b.label, kind: b.kind, s: 0, e: b.end }); }
      else out.push({ label: b.label, kind: b.kind, s: Math.max(b.start, Scheduler.DAY_MIN), e: 1440 + b.end });

    Scheduler.blocksForWd(state, wd).forEach((b) => pushB(b, false));

      if (n.start != null && n.end != null && n.end < n.start) pushB(b, true);

  // v20: keep one protected workout block on each chosen weekday so the planner
  // puts study around the workout instead of through it. It only adds the block
  // when a slot is actually free, and it is easy to remove from the day editor.
  function syncWorkoutBlocks() {
    const days = Scheduler.workoutDays(state);
    const slots = ['18:00', '19:00', '17:00', '20:00', '16:00'];
    for (let wd = 0; wd < 7; wd++) {
      const list = (state.busy[wd] || []).filter((b) => b && b.id !== 'wo-' + wd);
      let block = null;
      if (days.indexOf(wd) !== -1) {

    const p = frPayload(), k = frKeyOf(p);

    fr.pushKey = k; fr.pushAt = Date.now();
    try { await fbDb.collection('friend_stats').doc(frMe()).set(p); fr.err = ''; }
    catch (e) { fr.pushKey = ''; fr.err = frErrText(e); }
  }
  function frSchedule(ms) { if (!fr.on) return; clearTimeout(fr.pushTimer); fr.pushTimer = setTimeout(() => frPush(), ms || 30000); }
  // called from tick(): a timer start or stop is one small write, never a per-second one
  function frTick() {
    if (!fr.on) return;
    const a = frActiveUntil();
    if (a !== fr.lastActive) { fr.lastActive = a; frSchedule(2500); }
  }
  document.addEventListener('visibilitychange', () => { try { if (fr.on && document.visibilityState === 'hidden') frPush(true); frTick(); } catch (e) { /* ignore */ } });

  function frDetach() {
    if (fr.unsubF) { try { fr.unsubF(); } catch (e) { /* ignore */ } }
    if (fr.unsubC) { try { fr.unsubC(); } catch (e) { /* ignore */ } }
    fr.unsubF = null; fr.unsubC = null; clearTimeout(fr.pushTimer);
  }
  function frReset() {
    frDetach();
    Object.assign(fr, { loaded: false, loading: false, on: false, code: '', share: 'all', list: [], stats: {}, statsAt: 0, statsKey: '', cheers: [], pushKey: '', lastActive: 0, ask: null, msg: '', err: '', username: '', unameCount: 0, unameAsk: false, unameBusy: false, unameErr: '' });
    try { localStorage.removeItem(FR_FLAG); } catch (e) { /* ignore */ }
  }
  function frRefreshUI() {
    const a = $('frReqBox'), b = $('frListBox');
    if (a) a.innerHTML = frReqHtml();
    if (b) b.innerHTML = frListHtml();
    const d = document.querySelector('#tabs button[data-tab="friends"]');
    if (d) d.classList.toggle('dot', frBadge() > 0);
  }
  const frBadge = () => fr.cheers.filter((c) => frIsFriend(c.from)).length + fr.list.filter((f) => f.status === 'pending' && !f.mine).length;
  const frIsFriend = (u) => fr.list.some((f) => f.status === 'accepted' && f.other === u);

  // read my own stats document: it holds my code and sharing choice (so a second device finds them)
  async function frLoad() {
    if (!session || !fbDb || fr.loading) return;
    fr.loading = true;
    try {
      const d = await fbDb.collection('friend_stats').doc(frMe()).get();
      if (d.exists) {
        const v = d.data() || {};
        fr.on = true; fr.code = String(v.code || ''); fr.share = ['all', 'min', 'off'].indexOf(v.share) >= 0 ? v.share : 'all';
        fr.username = String(v.username || ''); fr.unameCount = Number(v.unameCount) || 0; // v32
        try { localStorage.setItem(FR_FLAG, '1'); } catch (e) { /* ignore */ }
        frAttach();
        frSchedule(4000);
      } else fr.on = false;
      fr.err = '';
    } catch (e) { fr.err = frErrText(e); }
    fr.loading = false; fr.loaded = true;
    if (tab === 'friends') render();
  }
  async function frEnable() {
    if (!cloudEnabled() || !fbAuth) return toast(L().frNoNet);
    if (!session) { try { await fbAuth.signInAnonymously(); } catch (e) { return toast(L().lbAnonErr); } }
    fr.busy = true; render();
    let lastErr = null;
    for (let i = 0; i < 6; i++) {
      const code = genChCode();
      try {
        fr.code = code; fr.share = 'all';
        const p = frPayload();
        const b = fbDb.batch();
        b.set(fbDb.collection('friend_stats').doc(frMe()), p);
        b.set(fbDb.collection('friend_codes').doc(code), { uid: frMe(), createdAt: Date.now() });
        await b.commit();
        fr.on = true; fr.loaded = true; fr.pushKey = frKeyOf(p); fr.pushAt = Date.now(); fr.err = '';
        fr.username = ''; fr.unameCount = 0; fr.unameAsk = true; // v32: pick a username first
        try { localStorage.setItem(FR_FLAG, '1'); } catch (e) { /* ignore */ }
        frAttach(); fr.busy = false; return render();
      } catch (e) { lastErr = e; }
    }
    fr.busy = false; fr.code = ''; fr.err = frErrText(lastErr); toast(fr.err); render();
  }
  function frAttach() {
    const me = frMe(); if (!me || !fbDb) return;
    if (!fr.unsubF) {
      fr.unsubF = fbDb.collection('friendships').where('members', 'array-contains', me).limit(80).onSnapshot((snap) => {
        fr.list = snap.docs.map((d) => { const v = d.data() || {}; return { pair: d.id, other: (v.members || []).filter((m) => m !== me)[0] || '', status: v.status, from: v.from, mine: v.from === me, fromCode: String(v.fromCode || '') }; });
        frRefreshUI();
        if (tab === 'friends') frFetchStats();
      }, (e) => { fr.err = frErrText(e); });
    }
    if (!fr.unsubC) {
      fr.unsubC = fbDb.collection('cheers').where('to', '==', me).limit(60).onSnapshot((snap) => {
        fr.cheers = snap.docs.map((d) => Object.assign({ id: d.id }, d.data() || {}));
        const fresh = fr.cheers.filter((c) => !fr.seen[c.id] && frIsFriend(c.from));
        fresh.forEach((c) => { fr.seen[c.id] = 1; });
        if (fresh.length === 1) { const st = fr.stats[fresh[0].from]; toast(L().frCheerGot(st && st.name, fresh[0].kind)); }
        else if (fresh.length > 1) toast(L().frCheerMany(fresh.length));
        frRefreshUI();
      }, () => { /* the cheer box is optional */ });
    }
  }
  // one read per accepted friend, at most every 5 minutes, only while the Friends tab is open
  async function frFetchStats(force) {
    if (!fr.on || !session || !fbDb) return;
    const ids = fr.list.filter((f) => f.status === 'accepted').map((f) => f.other).sort();
    const key = ids.join(',');
    if (!force && key === fr.statsKey && Date.now() - fr.statsAt < 300000) return;
    fr.statsKey = key; fr.statsAt = Date.now();
    await Promise.all(ids.map((u) => fbDb.collection('friend_stats').doc(u).get().then((d) => { fr.stats[u] = d.exists ? d.data() : null; }).catch(() => { /* keep the old one */ })));
    frRefreshUI();
  }
  function frClearCheers() {
    // a cheer is shown once on the Friends tab, then removed
    const mine = fr.cheers.slice();
    mine.forEach((c) => { try { fbDb.collection('cheers').doc(c.id).delete().catch(() => {}); } catch (e) { /* ignore */ } });
  }
  // v32: a friend is added by username (the primary way) or by an old code, which stays
  // as a fallback for anyone who has not chosen a username yet.
  const UNAME_RE = /^[a-z0-9._]{3,16}$/;
  const UNAME_RESERVED = ['admin', 'administrator', 'root', 'system', 'senny', 'support', 'help', 'instinct',
    'official', 'team', 'moderator', 'security', 'firebase', 'test', 'api', 'www', 'mail', 'info', 'contact'];
  const frNormName = (raw) => String(raw || '').trim().replace(/^@+/, '').toLowerCase();

  async function frSendRequest(raw) {
    const v = String(raw || '').trim().replace(/^@+/, '');
    if (!v) return toast(L().frAddNeed);
    if (fr.list.length >= FR_MAX * 2) return toast(L().frFull);
    if (fr.list.filter((f) => f.status === 'accepted').length >= FR_MAX) return toast(L().frFull);
    const low = v.toLowerCase();
    const looksName = UNAME_RE.test(low);
    const looksCode = /^[A-Z2-9]{6}$/.test(v.toUpperCase());
    if (!looksName && !looksCode) return toast(L().frAddNeed);
    try {
      let other = '';
      if (looksName) {
        const u = await fbDb.collection('usernames').doc(low).get();
        if (u.exists) other = String((u.data() || {}).uid || '');
      }
      if (!other && looksCode) {
        const c = await fbDb.collection('friend_codes').doc(v.toUpperCase()).get();
        if (c.exists) other = String((c.data() || {}).uid || '');
      }
      if (!other) return toast(L().frNotFound);
      if (other === frMe()) return toast(L().frSelf);
      const ref = fbDb.collection('friendships').doc(frPair(frMe(), other));
      const ex = await ref.get();
      if (ex.exists) {
        const v2 = ex.data() || {};
        if (v2.status === 'accepted') return toast(L().frAlready);
        if (v2.from === frMe()) return toast(L().frPending);
        await ref.update({ status: 'accepted' }); fr.statsKey = ''; toast(L().frAutoAcc); return;
      }
      const m = [frMe(), other].sort();
      await ref.set({ members: m, status: 'pending', from: frMe(), fromCode: fr.code, createdAt: Date.now() });
      toast(L().frSent);
    } catch (e) { toast(frErrText(e)); }
  }

  // v32: claim a username. One transaction writes the claim document, the stats document and
  // releases the previous name, so two people racing for the same name cannot both win: the
  // second transaction sees the claim and stops.
  async function frSaveUsername(raw) {
    if (!session || !fbDb) return toast(L().frNoNet);
    const name = frNormName(raw);
    if (!UNAME_RE.test(name)) { fr.unameErr = L().unBad; return render(); }
    if (UNAME_RESERVED.indexOf(name) >= 0) { fr.unameErr = L().unReserved; return render(); }
    if (fr.unameCount >= 2) { fr.unameErr = L().unOnce; return render(); }
    if (name === fr.username) { fr.unameAsk = false; fr.unameErr = ''; return render(); }
    fr.unameBusy = true; fr.unameErr = ''; render();
    const wasFirst = !fr.username;
    try {
      const claimRef = fbDb.collection('usernames').doc(name);
      const meRef = fbDb.collection('friend_stats').doc(frMe());
      const old = fr.username;
      await fbDb.runTransaction(async (tx) => {
        const claim = await tx.get(claimRef);
        if (claim.exists && String((claim.data() || {}).uid || '') !== frMe()) { const e = new Error('taken'); e.code = 'un/taken'; throw e; }
        const snap = await tx.get(meRef);
        const cur = snap.exists ? (snap.data() || {}) : {};
        const count = Number(cur.unameCount) || 0;
        if (count >= 2) { const e = new Error('once'); e.code = 'un/once'; throw e; }
        const p = Object.assign({}, frPayload(), { username: name, unameCount: count + 1, updatedAt: Date.now() });
        if (old && old !== name) tx.delete(fbDb.collection('usernames').doc(old));
        tx.set(claimRef, { uid: frMe(), createdAt: Date.now() });
        tx.set(meRef, p);
        fr.unameCount = count + 1;
      });
      fr.username = name; fr.unameAsk = false; fr.pushKey = frKeyOf(frPayload()); fr.pushAt = Date.now();
      toast(wasFirst ? L().unSaved : L().unChanged);
    } catch (e) {
      const code = String((e && e.code) || '');
      fr.unameErr = code === 'un/taken' ? L().unTaken : (code === 'un/once' ? L().unOnce : frErrText(e));
    }
    fr.unameBusy = false; render();
  }

  async function frAccept(pair) {
    if (fr.list.filter((f) => f.status === 'accepted').length >= FR_MAX) return toast(L().frFull);
    try { await fbDb.collection('friendships').doc(pair).update({ status: 'accepted' }); fr.statsKey = ''; toast(L().frAccepted); } catch (e) { toast(frErrText(e)); }
  }
  async function frDelete(pair) { try { await fbDb.collection('friendships').doc(pair).delete(); fr.statsKey = ''; } catch (e) { toast(frErrText(e)); } }
  async function frCheer(u, kind) {
    if (!frIsFriend(u)) return;
    if (Date.now() - (fr.cheerAt[u] || 0) < 60000) return toast(L().frCheerWait);
    fr.cheerAt[u] = Date.now();
    try {
      await fbDb.collection('cheers').doc(u + '_' + frMe()).set({ to: u, from: frMe(), kind: kind === 'fire' ? 'fire' : 'clap', at: window.firebase.firestore.FieldValue.serverTimestamp() });
      toast(L().frCheerSent);
    } catch (e) { toast(/permission|denied/i.test(String((e && e.code) || e)) ? L().frCheerWait : frErrText(e)); }
  }
  async function frSetShare(mode) {
    if (['all', 'min', 'off'].indexOf(mode) < 0) return;
    fr.share = mode; render(); await frPush(true);
  }

  // ----- Friends tab -----
  function frStale(st) {
    if (!st) return null;
    const today = todayStr(), wk = Scheduler.boardWeekKey();
    return { name: String(st.name || ''), avatar: st.avatar, share: st.share || 'all', todayMin: st.day === today ? (st.todayMin || 0) : 0,
      weekMin: st.week === wk ? (st.weekMin || 0) : 0, streak: st.streak, points: st.week === wk ? st.points : (st.points != null ? 0 : undefined),
      study: st.week === wk ? (st.study || 0) : 0, task: st.week === wk ? (st.task || 0) : 0,
      active: (st.activeUntil || 0) > Date.now() && st.share === 'all' };
  }
  function frUnameHtml() {

    if (me && !asking) {
      h += `<div class="muted sml" style="margin-top:4px">${esc(L().unYours)}</div>

        <div class="muted sml" style="margin-top:6px">${esc(L().unLegacy(fr.code))}</div></div>`;

      <div class="row" style="margin-top:8px"><input id="unName" class="grow" dir="ltr" maxlength="16" placeholder="${esc(L().unPh)}" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="btn" data-act="unSave"${fr.unameBusy ? ' disabled' : ''}>${esc(L().unSave)}</button></div>

  function frReqHtml() {

  }
  // v32: friend tiles (design B) with the details from design A. The avatar sits inside a

    flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.4 2.4c.4 3.2-1.7 4.7-3 6.3-1.3 1.7-2.2 3.2-2.2 5.3a4.9 4.9 0 0 0 9.8 0c0-1.7-.6-3-1.5-4.2.2 1.7-.7 2.8-1.7 2.8-1.1 0-1.9-1-1.9-2.4 0-2.7 1.2-4.7.5-7.8z"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.4l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.9l6.1-.9z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 12.6l4.4 4.4 9.9-9.9"/></svg>',

  // v34: no weekly goal ring any more. The avatar stands on its own, and in paused mode

  function frRingHtml(st) {
    return `<div class="frring plain"><span class="frrav">${avatarSvg(st ? st.avatar : 'av01')}</span></div>`;
  }
  function frTileHtml(f) {
    const st = frStale(fr.stats[f.other]);

  function frListHtml() {

  function friendsTop() {
    const ws = Scheduler.weekScore(state, todayStr());
    return `<div class="card"><b>⭐ ${esc(L().ptsTitle)}</b>
      <div style="margin-top:6px"><b>${esc(L().ptsWeek(ws.minutes, ws.study, ws.taskPts, ws.score))}</b></div>
      <div class="muted sml" style="margin-top:6px">${esc(L().ptsHow)}</div>
      <div class="muted sml" style="margin-top:6px">${esc(L().ptsHonest)}</div></div>`;
  }
  function friendsSection() {
    if (!cloudEnabled()) return `<div class="card"><b>👫 ${esc(L().frTitle)}</b><div class="muted" style="margin-top:6px">${esc(L().frNoNet)}</div></div>`;
    const head = `<div class="card"><b>👫 ${esc(L().frTitle)}</b><div class="muted" style="margin-top:4px">${esc(L().frIntro)}</div>`;
    if (!session || (fr.loaded && !fr.on) || (session && !fr.loaded && !fr.loading && fr.err)) {
      return head + `<div class="muted sml" style="margin-top:8px">${esc(L().frEnableSub)}</div>${fr.err ? `<div class="muted err" style="margin-top:6px">${esc(fr.err)}</div>` : ''}
        <div style="margin-top:10px"><button class="btn" data-act="frEnable"${fr.busy ? ' disabled' : ''}>${esc(L().frEnable)}</button></div></div>`;
    }
    if (!fr.loaded) return head + `<div class="muted" style="margin-top:8px">${esc(L().frLoading)}</div></div>`;
    let h = head + frUnameHtml() + `<div class="row" style="margin-top:12px"><input id="frAdd" class="grow" placeholder="${esc(L().frAddPh)}" dir="ltr" maxlength="17" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="btn" data-act="frAddBtn">${esc(L().frAddBtn)}</button></div></div>`;
    h += `<div id="frReqBox">${frReqHtml()}</div>`;
    h += `<div class="card"><div class="row"><b class="grow">${FR_PEOPLE} ${esc(L().frListTitle)}</b><button class="btn ghost sm" data-act="frRefresh">${esc(L().frRefresh)}</button></div>
      <div class="muted sml" style="margin:2px 0 8px">${esc(L().frSortNote)}</div><div id="frListBox">${frListHtml()}</div></div>`;
    const pv = [['all', L().frPrivAll, L().frPrivAllD], ['min', L().frPrivMin, L().frPrivMinD], ['off', L().frPrivOff, L().frPrivOffD]];
    h += `<div class="card"><b>🔒 ${esc(L().frPrivTitle)}</b>
      <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">${pv.map((x) => `<button class="btn ${fr.share === x[0] ? '' : 'ghost'} sm grow" data-act="frShareSet" data-m="${x[0]}">${esc(x[1])}</button>`).join('')}</div>
      <div class="muted sml" style="margin-top:8px">${esc(pv.filter((x) => x[0] === fr.share)[0][2])}</div>
      <div class="muted sml" style="margin-top:6px">${esc(L().frPrivNote)}</div></div>`;
    return h;
  }
  function viewFriends() {
    return leaderboardCard() + friendsSection() + friendsTop() + challengeCard(); // v32: the board leads, as in the approved design
  }

  // a friendly line for a Firebase error code, without dumping raw internals
  function fbErrText(code) {
    if (!code) return '';
    if (/permission|denied|insufficient/i.test(code)) return L().lbPermErr;
    if (/network|unavailable|offline/i.test(code)) return L().lbNoCloud;
    if (/auth|operation-not-allowed/i.test(code)) return L().lbAnonErr;
    return String(code).slice(0, 60);
  }

  // v35: a challenge write refused by the server almost always means the new rules are not published yet
  function chFailText(e) {
    const m = String((e && (e.code || e.message)) || e);
    if (/permission|denied|insufficient/i.test(m)) return L().chRulesErr;
    return fbErrText(m);
  }

  function lbRowHtml(r, i, me, pts) {
    const nm = r.name ? `<span class="lbname">${esc(r.name)}</span>` : `<span class="lbname muted">${esc(L().anonName)}</span>`;
    return `<div class="row lbrow${me ? ' me' : ''}" style="margin-top:6px"><span class="lbrank">${i + 1}</span><span class="avchip">${avatarSvg(r.avatar)}</span><span class="grow">${nm}${me ? `<span class="muted"> · ${esc(L().lbYou)}</span>` : ''}</span><b>${r.score} ${esc(pts)}</b></div>`;
  }

  // v32: the public board (design A). The top three stand on a gold, silver and bronze
  // podium with a crown on the first, ranks 4 to 6 are a list, and the student's own card
  // says how many points separate them from the person just above.
  const LB_CROWN = '<svg viewBox="0 0 24 16" aria-hidden="true"><path d="M2.2 13.6h19.6l-1.7-9-4.7 3.7L12 2.2 8.6 8.3 3.9 4.6z" fill="#facc15" stroke="#a16207" stroke-width="1.1" stroke-linejoin="round"/><circle cx="12" cy="12" r="1" fill="#ef4444"/></svg>';
  const lbName = (r) => (r && r.name ? String(r.name) : L().anonName);

  // v34: the board carries two point types. Every row shows the study points (clock) and the
  // task points (check) next to the total, and the student's own card does the same.
  function lbListHtml() {
    if (lbReadErr) return `<div class="muted">${esc(fbErrText(lbReadErr))}</div>`;
    if (lbWriteErr) return `<div class="muted err">${esc(L().lbWriteFail)} ${esc(fbErrText(lbWriteErr))}</div>`;
    if (!lbRows) return `<div class="muted">${esc(L().lbWait)}</div>`;

    const uid0 = session && session.uid;

    const rows = lbRows.slice(0, 10);

    const pts2 = (r) => `<span class="lbpts"><span class="lbpt" title="${esc(L().lbStudyPts)}">${FR_ICON.clock}${r.study || 0}</span><span class="lbpt" title="${esc(L().lbTaskPts)}">${FR_ICON.check}${r.task || 0}</span></span>`;
    let h = '<div class="lbpodium">';
    [2, 1, 3].forEach((place) => {
      const r = top[place - 1];

      h += `<div class="lbp p${place}${isMe(r) ? ' me' : ''}"><span class="lbcrown">${place === 1 ? LB_CROWN : ''}</span><span class="lbpav">${avatarSvg(r.avatar)}</span><span class="lbpnm${r.name ? '' : ' muted'}">${esc(lbName(r))}${tag(r)}</span><span class="lbpsc">${r.score}</span>${pts2(r)}<span class="lbstair">${place}</span></div>`;
    });
    h += '</div>';
    if (rest.length) {
      h += '<div class="lblist">' + rest.map((r, i) => `<div class="lblrow${isMe(r) ? ' me' : ''}"><span class="lbrk">${i + 4}</span><span class="avchip">${avatarSvg(r.avatar)}</span><span class="grow lbnm">${esc(lbName(r))}${tag(r)}</span>${pts2(r)}<b class="lbsc">${r.score}</b></div>`).join('') + '</div>';
    }
    if (uid0) {
      const ws = Scheduler.weekScore(state, todayStr());
      const my = ws.score;
      const at = rows.findIndex(isMe);
      const first = String((state.profile.name || '').trim().split(/\s+/)[0] || '');
      const named = !!(state.leaderboard && state.leaderboard.showName) && !!first;
      let sub;
      if (at === 0) sub = L().lbYouFirst;
      else if (at > 0) sub = L().lbNeedNext(Math.max(1, rows[at - 1].score - my + 1), lbName(rows[at - 1]));
      else {
        const need = (rows[rows.length - 1].score || 0) - my + 1;
        sub = need > 0 ? L().lbNeedTen(need) : L().lbOutTen;
      }
