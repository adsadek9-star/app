<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root {
  --bg: #eef4f3;
  --card: #ffffff;
  --ink: #12262b;
  --muted: #5d7379;
  --line: #dce8e6;
  --primary: #0d9488;
  --primary-d: #0f766e;
  --primary-2: #0284c7;
  --teal-bg: #d7f3ee;
  --teal-ink: #0b6e62;
  --amber-bg: #fdf0d5;
  --amber-ink: #92600a;
  --violet-bg: #ece7fb;
  --violet-ink: #5b3fa8;
  --danger: #d64545;
  --danger-bg: #fdeaea;
  --danger-ink: #a52f2b;
  --shadow: 0 1px 2px rgba(13, 60, 56, 0.06), 0 10px 28px -14px rgba(13, 60, 56, 0.22);
  --radius: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", "Cairo", system-ui, "Segoe UI", Tahoma, sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(13, 148, 136, 0.10), transparent 60%),
    radial-gradient(900px 420px at 0% -10%, rgba(2, 132, 199, 0.10), transparent 55%),
    var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: linear-gradient(120deg, var(--primary-d), var(--primary) 55%, var(--primary-2));
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px -10px rgba(13, 60, 56, 0.5);
}
h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
.hrow { display: flex; gap: 8px; align-items: center; }
#todayLbl {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#langBtn {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  padding: 5px 14px;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
#langBtn:hover { background: rgba(255, 255, 255, 0.28); }
nav {
  display: flex;
  gap: 4px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 6px;
}
nav button {
  flex: 1;
  padding: 9px 4px;
  border: 0;
  background: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-radius: 12px;
  transition: background 0.15s, color 0.15s;
}
nav button:hover { background: #eef4f3; color: var(--ink); }
nav button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  font-weight: 700;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
main { max-width: 780px; margin: 0 auto; padding: 16px 14px 40px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  animation: fadeUp 0.25s ease both;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
input, select, textarea {
  font: inherit;
  padding: 9px 11px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  max-width: 100%;
  background: #fbfdfd;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.16);
}
textarea { width: 100%; min-height: 74px; resize: vertical; margin: 10px 0; }
input[type="checkbox"] { accent-color: var(--primary); width: 18px; height: 18px; cursor: pointer; }
input[type="date"] { font-variant-numeric: tabular-nums; }
button.btn {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 9px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px -5px rgba(13, 148, 136, 0.6);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}
button.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
button.btn:active { transform: none; }
button.ghost {
  background: #eef4f3;
  color: var(--ink);
  box-shadow: none;
  border: 1px solid var(--line);
  font-weight: 600;
}
button.ghost:hover { background: #e3edeb; filter: none; }
button.danger {
  background: var(--danger-bg);
  color: var(--danger-ink);
  box-shadow: none;
  font-weight: 700;
}
button.danger:hover { background: #fbdcdc; filter: none; }
.tag {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--teal-bg);
  color: var(--teal-ink);
  white-space: nowrap;
}
.tag.revise { background: var(--amber-bg); color: var(--amber-ink); }
.tag.review { background: var(--violet-bg); color: var(--violet-ink); }
.warn {
  background: linear-gradient(120deg, #fdeeee, #fdf6f0);
  border: 1px solid #f0c9c4;
  border-inline-start: 4px solid var(--danger);
  color: var(--danger-ink);
  font-weight: 600;
}
.muted { color: var(--muted); font-size: 13px; }
.bar { height: 9px; background: #e4efed; border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #34d399, var(--primary));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.day { font-weight: 800; font-size: 15px; margin: 18px 2px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .muted { font-weight: 600; }
.today { color: var(--primary-d); }
.today::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); align-self: center; }
.sess { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #eef3f2; }
.sess:first-of-type { border-top: 0; }
.sess .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sess b { font-weight: 700; }
.sess .hrs { font-variant-numeric: tabular-nums; white-space: nowrap; }
.lec { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid #f0f5f4; }
.lec:first-of-type { border-top: 0; }
.lec.done span.t { text-decoration: line-through; color: #8aa0a5; }
.grid7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.grid7 label { font-size: 13px; font-weight: 700; color: var(--muted); }
.grid7 input { margin-top: 5px; width: 100%; }
.empty { text-align: center; padding: 34px 18px; }
.empty .big { font-size: 42px; margin-bottom: 10px; }
.empty p { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
.subj-head b { font-size: 15px; }
.datechip {
  background: #eef4f3;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pcard { border-inline-start: 4px solid var(--primary); }
@media (min-width: 640px) {
  main { padding: 22px 20px 48px; }
  nav { justify-content: center; }
  nav button { flex: 0 1 150px; }
  h1 { font-size: 21px; }
}

/* ---- v3 additions ---- */
.sync { font-size: 12px; font-weight: 700; color: #d7f3ee; min-width: 0; }
.sync.synced { color: #bbf7d0; }
.sync.error { color: #fecaca; }
.hidden { display: none; }
.checkline { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-weight: 600; font-size: 14px; }
.checkline input { width: 18px; height: 18px; }

.tag.solve { background: #e0f2fe; color: #075985; }
.tag.clinic { background: #fdf0d5; color: #92600a; }

.examform { background: #f6faf9; border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; }
.addtask { background: #f6faf9; border: 1px dashed var(--line); border-radius: 12px; padding: 10px; margin: 10px 0; }
.addtask input { width: 100%; }
.pick { display: flex; gap: 8px; }
.pick button {
  flex: 1; padding: 9px 6px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #fff; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.pick button.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}
.pick button:disabled { opacity: 0.55; cursor: not-allowed; }
.estchip {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  background: var(--teal-bg); color: var(--teal-ink); min-height: 14px;
}
.estchip:empty { display: none; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; }
.cell {
  min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line);
  background: #fbfdfd; padding: 4px 5px; cursor: pointer; position: relative;
  display: flex; flex-direction: column; gap: 2px; transition: border-color 0.12s, background 0.12s;
}
.cell:hover { border-color: var(--primary); }
.cell.out { background: transparent; border: 0; cursor: default; }
.cell.past { opacity: 0.45; }
.cell.sel { border-color: var(--primary); background: var(--teal-bg); box-shadow: 0 0 0 2px rgba(13,148,136,0.25); }
.cell.now .dnum {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff;
  border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
}
.cell.examday { border-color: #f0b429; background: #fffaf0; }
.cell .dnum { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cell .exdot { font-size: 10px; line-height: 1; }
.cell .dots { display: flex; gap: 2px; flex-wrap: wrap; }
.cell .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.cell .chrs { font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

button.sm { padding: 5px 12px; font-size: 13px; }
.examrow { background: #fffaf0; border-radius: 10px; padding: 9px 10px !important; border: 1px solid #f5e3b3 !important; }

.overlay {
  position: fixed; inset: 0; background: rgba(10, 30, 32, 0.55);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.sheet {
  background: #fff; border-radius: 20px; padding: 22px 18px; width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px -18px rgba(13, 60, 56, 0.45); animation: fadeUp 0.25s ease both;
}
.sheet input { width: 100%; margin-top: 8px; }
.linklike { background: none; border: 0; color: var(--primary-d); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: underline; }

.yeargrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ypick {
  padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff;
  font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.ypick.on {
  background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px -4px rgba(13, 148, 136, 0.55);
}

#toast {
  position: fixed; bottom: 18px; inset-inline: 0; margin: 0 auto; width: fit-content; max-width: 90%;
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  transform: translateY(8px); z-index: 60;
}
#toast.show { opacity: 1; transform: none; }

/* subject card header: keep the name on its own line at narrow widths */
.subj-head b { flex: 1 1 100%; margin-bottom: 4px; }
.subj-head .btn { padding: 7px 13px; font-size: 12.5px; }
@media (min-width: 640px) { .subj-head b { flex: 1 1 auto; margin-bottom: 0; } }

/* v4: curriculum + smart warnings */
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
  padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: all 0.15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary-d); }
.chip .chipd { color: var(--muted); font-size: 11px; margin-inline-start: 4px; }
.warnlist { margin: 8px 0 0; padding-inline-start: 20px; }
.warnlist li { margin-top: 3px; font-size: 13.5px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<header>
  <h1 id="appTitle">🦷 Dental Planner</h1>
  <div class="hrow">
    <span id="syncLbl" class="sync"></span>
    <div id="todayLbl"></div>
    <button id="langBtn" type="button" data-act="lang">English</button>
  </div>
</header>
<nav id="tabs">
  <button data-tab="schedule" class="on">الجدول</button>
  <button data-tab="subjects">المواد</button>
  <button data-tab="time">وقتي</button>
  <button data-tab="progress">التقدم</button>
  <button data-tab="profile">حسابي</button>
</nav>
<main id="view"></main>
<div id="overlays"></div>
<div id="toast"></div>

  const PALETTE = ['#0d9488', '#7c3aed', '#ea580c', '#0284c7', '#db2777', '#65a30d', '#d97706', '#dc2626'];
  const colorOf = (id) => {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const $ = (id) => document.getElementById(id);

  const empty = () => ({
    version: 3, lang: 'ar',
    profile: { name: '', year: null, onboarded: false },
    availability: [2, 2, 2, 2, 2, 2, 2],
    overrides: {}, blocked: [], subjects: [], savedAt: 0,
  });

  function migrate(old) {
    const st = empty();
    st.lang = old.lang === 'en' ? 'en' : 'ar';
    if (Array.isArray(old.availability) && old.availability.length === 7) st.availability = old.availability.map((x) => Math.max(0, Number(x) || 0));
    st.overrides = old.overrides || {};
    st.blocked = old.blocked || [];
    st.subjects = (old.subjects || []).map((s) => ({
      id: s.id || uid(), name: s.name || '?',
      exam: s.examDate ? { kind: 'exam', date: s.examDate, time: '', nature: 'theory', covered: (s.lectures || []).length } : null,
      tasks: (s.lectures || []).map((l) => ({
        id: l.id || uid(), kind: 'lecture', title: l.title || '?', difficulty: 2,
        studyH: Number(l.hours) || 1, solveH: 0.5, workH: 0,
        due: null, done: !!l.done, confidence: l.confidence || 0,
      })),
    }));
    return st;
  }

  let state;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(empty(), JSON.parse(raw));
    else {
      state = empty();
      for (const k of OLD_KEYS) {
        const o = localStorage.getItem(k);
        if (o) { try { state = migrate(JSON.parse(o)); } catch (e) {} break; }
      }
    }
  } catch (e) { state = empty(); }
  if (!state.profile) state.profile = { name: '', year: null, onboarded: false };
  const saveLocal = () => localStorage.setItem(KEY, JSON.stringify(state));

  let tab = 'schedule', openSubject = null, openExam = null, taskKind = {}, authSkipped = false, toastTimer = null;
  let calCursor = todayStr().slice(0, 7);
  let selDay = todayStr();

  const L = () => I18N[state.lang === 'en' ? 'en' : 'ar'];
  const subj = (id) => state.subjects.find((s) => s.id === id);
  const taskOf = (sid, tid) => { const s = subj(sid); return s && s.tasks.find((t) => t.id === tid); };
  const yearNum = () => Number(state.profile.year) || 0;
  const clinicAllowed = () => yearNum() >= 4;
  const examOf = (s) => (s.exam && s.exam.date ? s.exam : null);
  const fmtHTxt = (h) => L().fmtH(Math.round(h * 2) / 2);

  /* ---------------- cloud (Firebase Auth + Firestore) ---------------- */
  let fbAuth = null, fbDb = null, session = null, pushTimer = null, lastPull = 0, syncState = '';
  const cloudEnabled = () => !!(FIREBASE_CONFIG.apiKey && window.firebase && window.firebase.initializeApp);
  const setSync = (s) => { syncState = s; const el = $('syncLbl'); if (el) { el.textContent = s ? ({ syncing: L().syncing, synced: L().synced, error: L().syncErr }[s]) : ''; el.className = 'sync ' + s; } };

  function save() {
    state.savedAt = Date.now();
    saveLocal();
    if (session && fbDb) {
      setSync('syncing');
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushCloud, 1200);
    }
  }

  async function pushCloud() {
    if (!session || !fbDb) return;
    try {
      await fbDb.collection('planner_states').doc(session.uid).set({ state, updatedAt: Date.now() });
      setSync('synced');
    } catch (e) { setSync('error'); }
  }

  async function loadCloud() {
    if (!session || !fbDb) return;
    lastPull = Date.now();
    try {
      const doc = await fbDb.collection('planner_states').doc(session.uid).get();
      const data = doc.exists ? doc.data() : null;
      if (data && data.state && data.state.version) {
        const cloudAt = Number(data.updatedAt) || 0;
        if (!state.savedAt || cloudAt > state.savedAt) {
          state = Object.assign(empty(), data.state);
          if (!state.profile) state.profile = { name: '', year: null, onboarded: false };
          saveLocal(); setSync('synced');
        } else pushCloud();
      } else pushCloud();
    } catch (e) { setSync('error'); }
  }

  function initCloud() {
    if (!cloudEnabled()) return;
    try {
      window.firebase.initializeApp(FIREBASE_CONFIG);
      fbAuth = window.firebase.auth();
      fbDb = window.firebase.firestore();
      fbAuth.onAuthStateChanged(async (u) => {
        session = u || null;
        if (session) await loadCloud();
        render();
      });
    } catch (e) { /* offline: stay local */ }
  }

  async function doAuth(mode) {
    const email = $('aEmail').value.trim(), pass = $('aPass').value;
    if (!email || !pass) return alert(L().fillBoth);
    $('authMsg').textContent = L().authWait;
    try {
      if (mode === 'up') await fbAuth.createUserWithEmailAndPassword(email, pass);
      else await fbAuth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged picks the session up, loads cloud state and re-renders
    } catch (e) { $('authMsg').textContent = String(e && e.message || e); }
  }

  async function doLogout() {
    try { if (fbAuth) await fbAuth.signOut(); } catch (e) {}
    session = null; authSkipped = false; setSync(''); render();
  }

  /* ---------------- tasks / curriculum ---------------- */
  function mkTask(title, kind, diff, src) {
    const est = Scheduler.estimate(title, kind);
    const d = diff || est.difficulty;
    return {
      id: uid(), kind, title, difficulty: d,
      studyH: kind === 'clinic' ? 0 : Scheduler.STUDY_H[d - 1],
      solveH: kind === 'clinic' ? 0 : Scheduler.SOLVE_H[d - 1],
      workH: kind === 'clinic' ? Scheduler.CLINIC_H[d - 1] : 0,
      due: null, done: false, confidence: 0, src: src || '',
    };
  }

  // Official curriculum entries for the student's year that are not added yet.
  const curForYear = () => (yearNum() >= 1 && yearNum() <= 5 ? Curriculum.subjectsForYear(yearNum()) : []);
  const curMissing = () => curForYear().filter((c) => !state.subjects.some((s) => (s.code && s.code === c.code) || Curriculum.find(s.name, s.code) === c));
  const curName = (c) => (state.lang === 'en' ? c.en : c.ar);

  function addFromCur(code) {
    const c = curForYear().find((x) => x.code === code);
    if (!c || state.subjects.some((s) => s.code === code)) return;
    state.subjects.push({ id: uid(), name: curName(c), code: c.code, exam: null, tasks: [] });
    save(); render();
  }

  function loadCur() {
    curMissing().forEach((c) => {
      state.subjects.push({ id: uid(), name: curName(c), code: c.code, exam: null, tasks: [] });
    });
    save(); render();
  }

  // Estimated topic suggestions for a subject: topics not already among its tasks.
  function topicSugg(sj) {
    const tps = Curriculum.topicsFor(sj.name, sj.code);
    return tps.map((tp, i) => Object.assign({ _i: i }, tp))
      .filter((tp) => !sj.tasks.some((t) => {
        const n = Curriculum.norm(t.title);
        return n === Curriculum.norm(tp.ar) || n === Curriculum.norm(tp.en);
      }));
  }

  const dayLabel = (d, today) => {
    const diff = Scheduler.diffDays(today, d);
    return (diff === 0 ? L().today : diff === 1 ? L().tomorrow : L().days[Scheduler.weekday(d)]) + ' ' + d.slice(5).replace('-', '/');
  };

  function toast(msg) {
    let el = $('toast');
    el.textContent = msg; el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2200);
  }

  const sessionTag = (s) =>
    s.type === 'solve' ? `<span class="tag solve">${esc(L().tagSolve)}</span>`
    : s.type === 'revise' ? `<span class="tag revise">${esc(L().tagRevise)}</span>`
    : s.type === 'review' ? `<span class="tag review">${esc(L().tagReview)}</span>`
    : s.type === 'examreview' ? `<span class="tag review">${esc(L().tagExamReview)}</span>`
    : s.type === 'clinic' ? `<span class="tag clinic">${esc(L().tagClinic)}</span>` : '';

  function sessionRow(s, sj) {
    const title = s.type === 'review' ? L().generalReview : s.type === 'examreview' ? L().examReviewTitle : s.title;
    const doneable = s.lectureId && (s.type === 'study' || s.type === 'solve' || s.type === 'clinic');
    return `<div class="sess"><i class="dot" style="background:${colorOf(sj.id)}"></i><div class="grow"><b>${esc(sj.name)}</b> - ${esc(title)} ${sessionTag(s)}</div><span class="muted hrs">${fmtHTxt(s.hours)}</span>` +
      (doneable ? `<button class="btn ghost" data-act="done" data-s="${sj.id}" data-l="${s.lectureId}">${esc(L().doneBtn)}</button>` : '') + '</div>';
  }

  /* ---------------- views ---------------- */

  function viewSchedule() {
    const today = todayStr();
    $('todayLbl').textContent = today;
    let h = `<div class="row" style="margin-bottom:12px"><button class="btn grow" data-act="gen">🗓️ ${esc(L().genBtn)}</button>` +
      (state.subjects.length || !curForYear().length ? '' : ` <button class="btn ghost" data-act="loadCur">${esc(L().loadCurBtn)}</button>`) + '</div>';
    if (!state.subjects.length) return h + `<div class="card empty"><div class="big">🦷</div><p>${esc(L().noPlan)}</p></div>`;

    Scheduler.warnings(state, today).forEach((w) => {
      const head = w.examDate && w.examDate >= today
        ? L().warnExam(w.name, w.examDate, Scheduler.diffDays(today, w.examDate), fmtHTxt(w.hoursShort))
        : L().warnNoDate(w.name, fmtHTxt(w.hoursShort));
      h += `<div class="card warn"><div>${esc(head)}</div><ol class="warnlist">` +
        w.tasks.slice(0, 3).map((t, i) => `<li>${esc(L().warnTask(i + 1, t.title, fmtHTxt(t.hours)))}</li>`).join('') +
        (w.openCount > 3 ? `<li class="muted">${esc(L().warnMore(w.openCount - 3))}</li>` : '') + '</ol></div>';
    });

    const r = Scheduler.generate(state, today);

    const byDay = {}; r.sessions.forEach((s) => (byDay[s.date] = byDay[s.date] || []).push(s));
    const examsByDay = {};
    state.subjects.forEach((s) => { const ex = examOf(s); if (ex) examsByDay[ex.date] = examsByDay[ex.date] || { subject: s, exam: ex }; });

    // calendar card
    const [cy, cm] = calCursor.split('-').map(Number);
    const first = calCursor + '-01';
    const dim = new Date(cy, cm, 0).getDate();
    const startWd = Scheduler.weekday(first);
    h += `<div class="card"><div class="cal-head"><button class="btn ghost sm" data-act="calPrev">‹</button>
      <b class="grow" style="text-align:center">${esc(L().months[cm - 1])} ${cy}</b>
      <button class="btn ghost sm" data-act="calToday">${esc(L().today)}</button>
      <button class="btn ghost sm" data-act="calNext">›</button></div><div class="cal">`;
    L().daysShort.forEach((d) => { h += `<div class="cal-wd">${esc(d)}</div>`; });
    for (let i = 0; i < startWd; i++) h += '<div class="cell out"></div>';
    for (let dnum = 1; dnum <= dim; dnum++) {
      const d = calCursor + '-' + String(dnum).padStart(2, '0');
      const sess = byDay[d] || [];
      const isExam = examsByDay[d];
      const cls = 'cell' + (d === selDay ? ' sel' : '') + (d === today ? ' now' : '') + (d < today ? ' past' : '') + (isExam ? ' examday' : '');
      const dots = sess.slice(0, 4).map((s) => `<i style="background:${colorOf(s.subjectId)}"></i>`).join('');
      const tot = sess.reduce((a, s) => a + s.hours, 0);
      h += `<div class="${cls}" data-act="calDay" data-d="${d}"><span class="dnum">${dnum}</span>` +
        (isExam ? '<span class="exdot">📝</span>' : '') +
        (dots ? `<span class="dots">${dots}</span>` : '') +
        (tot ? `<span class="chrs">${fmtHTxt(tot)}</span>` : '') + '</div>';
    }
    h += '</div></div>';

    // selected day sessions
    h += `<div class="day ${selDay === today ? 'today' : ''}">${dayLabel(selDay, today)}</div><div class="card">`;
    const sels = (byDay[selDay] || []);
    if (examsByDay[selDay]) {
      const e = examsByDay[selDay];
      h += `<div class="sess examrow"><div class="grow">📝 <b>${esc(e.subject.name)}</b> - ${esc(L().examLine(e.exam.kind, e.exam.date, e.exam.time, L().natureWord[e.exam.nature] || e.exam.nature))}</div></div>`;
    }
    if (!sels.length && !examsByDay[selDay]) h += `<div class="muted" style="padding:6px 2px">${esc(L().noSessDay)}</div>`;
    sels.forEach((s) => { const sj = subj(s.subjectId); if (sj) h += sessionRow(s, sj); });
    h += '</div>';

    // upcoming exams
    const ups = state.subjects.filter((s) => examOf(s) && s.exam.date >= today)
      .sort((a, b) => a.exam.date.localeCompare(b.exam.date)).slice(0, 5);
    if (ups.length) {
      h += `<div class="day">${esc(L().upcomingExams)}</div>`;
      ups.forEach((s) => {
        const ex = s.exam, dl = Scheduler.diffDays(today, ex.date);
        h += `<div class="card pcard" style="border-inline-start-color:${colorOf(s.id)}"><div class="row"><i class="dot" style="background:${colorOf(s.id)}"></i>
          <div class="grow"><b>${esc(s.name)}</b><div class="muted">${esc(L().examLine(ex.kind, ex.date, ex.time, L().natureWord[ex.nature] || ex.nature))}${ex.covered ? ' · ' + esc(L().coveredShort(ex.covered)) : ''}</div></div>
          <span class="tag">${esc(L().daysLeft(dl))}</span></div></div>`;
      });
    }
    return h;
  }

  function examForm(s, prefix) {
    const ex = examOf(s) || { kind: 'exam', date: '', time: '', nature: 'theory', covered: (s.tasks || []).filter((t) => t.kind === 'lecture').length };
    return `<div class="examform">
      <div class="row"><select id="${prefix}Kind">
        <option value="exam" ${ex.kind === 'exam' ? 'selected' : ''}>${esc(L().kindExam)}</option>
        <option value="quiz" ${ex.kind === 'quiz' ? 'selected' : ''}>${esc(L().kindQuiz)}</option></select>
      <select id="${prefix}Nature">
        <option value="theory" ${ex.nature === 'theory' ? 'selected' : ''}>${esc(L().natureTheory)}</option>
        <option value="practical" ${ex.nature === 'practical' ? 'selected' : ''}>${esc(L().naturePractical)}</option></select>
      <input id="${prefix}Cov" type="number" min="1" max="60" placeholder="${esc(L().coveredPh)}" value="${ex.covered || ''}" style="width:110px"></div>
      <div class="row" style="margin-top:8px"><input id="${prefix}Date" type="date" value="${esc(ex.date || '')}" class="grow"><input id="${prefix}Time" type="time" value="${esc(ex.time || '')}">
      <button class="btn" data-act="saveExam" data-s="${s.id}">${esc(L().saveBtn)}</button></div></div>`;
  }

  function viewSubjects() {
    let h = '';
    const missing = curMissing();
    if (curForYear().length) {
      h += `<div class="card"><b>${esc(L().curTitle)}</b><div class="muted" style="margin-top:4px">${esc(L().curSub)}</div>`;
      if (!missing.length) h += `<div class="muted" style="margin-top:8px">${esc(L().curAllAdded)}</div>`;
      missing.forEach((c) => {
        h += `<div class="row" style="margin-top:8px"><i class="dot" style="background:${colorOf(c.code)}"></i>
          <span class="grow"><b>${esc(curName(c))}</b> <span class="muted">${esc(L().diff[c.diff - 1])} · ${esc(L().estBadge)}</span></span>
          <button class="btn sm" data-act="addCur" data-code="${esc(c.code)}">${esc(L().addCurBtn)}</button></div>`;
      });
      if (missing.length > 1) h += `<div style="margin-top:10px"><button class="btn ghost" data-act="loadCur">${esc(L().loadCurBtn)}</button></div>`;
      h += '</div>';
    }
    h += `<div class="card"><b>${esc(L().addSubjectTitle)}</b>
      <div class="row" style="margin-top:8px"><input id="nName" placeholder="${esc(L().subjNamePh)}" class="grow">
      <button class="btn" data-act="addSubject">${esc(L().addBtn)}</button></div>
      <label class="checkline"><input type="checkbox" id="nHasExam"> ${esc(L().hasExamQ)}</label>
      <div id="nExamBox" class="hidden"><div class="row" style="margin-top:6px">
        <select id="nKind"><option value="exam">${esc(L().kindExam)}</option><option value="quiz">${esc(L().kindQuiz)}</option></select>
        <select id="nNature"><option value="theory">${esc(L().natureTheory)}</option><option value="practical">${esc(L().naturePractical)}</option></select>
        <input id="nCov" type="number" min="1" max="60" placeholder="${esc(L().coveredPh)}" style="width:110px"></div>
        <div class="row" style="margin-top:8px"><input id="nDate" type="date" class="grow"><input id="nTime" type="time"></div></div></div>`;

    state.subjects.forEach((s) => {
      const open = openSubject === s.id, exOpen = openExam === s.id, ex = examOf(s);
      h += `<div class="card pcard" style="border-inline-start-color:${colorOf(s.id)}"><div class="row subj-head">
        <b class="grow">${esc(s.name)}</b>
        ${ex ? `<span class="datechip">${esc(ex.date)}${ex.time ? ' ' + esc(ex.time) : ''}</span>` : `<span class="muted">${esc(L().noExamYet)}</span>`}
        <button class="btn ghost" data-act="toggleExam" data-s="${s.id}">${exOpen ? esc(L().closeBtn) : esc(L().editExam)}</button>
        <button class="btn ghost" data-act="toggle" data-s="${s.id}">${open ? esc(L().closeBtn) : esc(L().tasksBtn(s.tasks.length))}</button>
        <button class="btn danger" data-act="delSubject" data-s="${s.id}">${esc(L().delBtn)}</button></div>`;
      if (ex) h += `<div class="muted" style="margin:2px 0 6px">${esc(L().examLine(ex.kind, ex.date, ex.time, L().natureWord[ex.nature] || ex.nature))}${ex.covered ? ' · ' + esc(L().coveredShort(ex.covered)) : ''}</div>`;
      if (exOpen) {
        h += examForm(s, 'e-' + s.id + '-');
        if (ex) h += `<button class="btn ghost" data-act="clearExam" data-s="${s.id}" style="margin-top:6px">${esc(L().clearExam)}</button>`;
      }
      if (open) {
        const k = taskKind[s.id] || 'lecture';
        h += `<div class="addtask"><b>${esc(L().addTaskTitle)}</b>
          <div class="pick" style="margin:8px 0">
            <button class="${k === 'lecture' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="lecture">📖 ${esc(L().kindLecture)}</button>
            ${clinicAllowed()
              ? `<button class="${k === 'clinic' ? 'on' : ''}" data-act="pickKind" data-s="${s.id}" data-k="clinic">🦷 ${esc(L().kindClinic)}</button>`
              : `<button disabled title="${esc(L().clinicLocked)}">🔒 ${esc(L().kindClinic)}</button>`}
          </div>
          ${clinicAllowed() ? '' : `<div class="muted" style="margin-bottom:6px">${esc(L().clinicLocked)}</div>`}
          <input id="tt-${s.id}" placeholder="${esc(L().taskTitlePh)}" data-est="${s.id}">
          <div class="row" style="margin-top:8px">
            <span id="est-${s.id}" class="estchip"></span>
            <select id="td-${s.id}" data-act="tdiff" data-s="${s.id}"><option value="0">${esc(L().estAuto)}</option>
              <option value="1">${esc(L().diff[0])}</option><option value="2">${esc(L().diff[1])}</option><option value="3">${esc(L().diff[2])}</option></select>
            ${k === 'clinic' ? `<input id="tdue-${s.id}" type="date" title="${esc(L().duePh)}">` : ''}
            <button class="btn" data-act="addTask" data-s="${s.id}">${esc(L().addTaskBtn)}</button></div>`;
        const sugg = k === 'lecture' ? topicSugg(s).slice(0, 8) : [];
        if (sugg.length) {
          h += `<div class="muted" style="margin-top:8px">${esc(L().topicsTitle)}</div><div class="chips">` +
            sugg.map((tp) => `<button class="chip" data-act="addTopic" data-s="${s.id}" data-i="${tp._i}">${esc(state.lang === 'en' ? tp.en : tp.ar)} <span class="chipd">${esc(L().diff[tp.d - 1])}</span></button>`).join('') +
            '</div>';
        }
        h += '</div>';
        s.tasks.forEach((t) => {
          const estTxt = (t.kind === 'clinic'
            ? L().estClinic(L().diff[t.difficulty - 1] || '', fmtHTxt(t.workH))
            : L().estLec(L().diff[t.difficulty - 1] || '', fmtHTxt(t.studyH), L().fmtM(Math.round(t.solveH * 60)))) +
            (t.src === 'est' ? ' · ' + L().estBadge : '');
          h += `<div class="lec ${t.done ? 'done' : ''}"><input type="checkbox" data-act="check" data-s="${s.id}" data-l="${t.id}" ${t.done ? 'checked' : ''}>
            <span class="t grow">${t.kind === 'clinic' ? '🦷 ' : '📖 '}${esc(t.title)}<br><span class="muted">${esc(estTxt)}</span></span>
            ${t.done && t.kind === 'lecture' ? `<select data-act="conf" data-s="${s.id}" data-l="${t.id}"><option value="0">${esc(L().confPh)}</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${t.confidence === n ? 'selected' : ''}>${n}/5</option>`).join('')}</select>` : ''}
            <button class="btn ghost" data-act="delTask" data-s="${s.id}" data-l="${t.id}">x</button></div>`;
        });
      }
      h += '</div>';
    });
    return h;
  }

  function viewTime() {
    let h = `<div class="card"><b>${esc(L().availTitle)}</b><div class="grid7" style="margin-top:10px">`;
    L().days.forEach((n, i) => { h += `<label>${n}<input type="number" min="0" max="16" step="0.5" data-act="avail" data-i="${i}" value="${state.availability[i]}"></label>`; });
    h += `</div></div><div class="card"><b>${esc(L().overrideTitle)}</b><div class="row" style="margin-top:10px"><input id="oDate" type="date"><input id="oHours" type="number" min="0" step="0.5" placeholder="${esc(L().hoursPh)}" style="width:160px"><button class="btn" data-act="addOverride">${esc(L().saveBtn)}</button></div>`;
    Object.keys(state.overrides).sort().forEach((d) => { h += `<div class="row" style="margin-top:8px"><span class="grow">${d}: ${fmtHTxt(state.overrides[d])}</span><button class="btn ghost" data-act="delOverride" data-d="${d}">x</button></div>`; });
    return h + '</div>';
  }

  function viewProgress() {
    const today = todayStr();
    if (!state.subjects.length) return `<div class="card empty"><div class="big">📚</div><p>${esc(L().addFirst)}</p></div>`;
    return Scheduler.progress(state, today).sort((a, b) => (a.daysLeft == null ? 9e9 : a.daysLeft) - (b.daysLeft == null ? 9e9 : b.daysLeft)).map((p) =>
      `<div class="card pcard" style="border-inline-start-color:${colorOf(p.subjectId)}"><div class="row"><b class="grow">${esc(p.name)}</b>
      <span class="tag">${p.daysLeft == null ? esc(L().noExamProgress) : p.daysLeft < 0 ? esc(L().examPassed) : esc(L().daysLeft(p.daysLeft))}</span></div>
      <div class="bar"><i style="width:${p.pct}%"></i></div><div class="muted">${esc(L().taskCount(p.done, p.total, p.pct))}</div></div>`).join('');
  }

  function viewProfile() {
    const p = state.profile;
    let h = `<div class="card"><b>${esc(L().profileTitle)}</b>
      <div class="row" style="margin-top:10px"><label class="muted">${esc(L().nameLbl)}</label><input id="pName" class="grow" value="${esc(p.name || '')}"></div>
      <div style="margin-top:10px"><label class="muted">${esc(L().yearLbl)}</label><div class="yeargrid" style="margin-top:6px">`;
    L().years.forEach((y, i) => { h += `<button class="ypick ${p.year === i + 1 ? 'on' : ''}" data-act="pickYear" data-y="${i + 1}">${esc(y)}</button>`; });
    h += `</div></div>
      <div class="row" style="margin-top:10px"><label class="muted">${esc(L().uniLbl)}</label><span class="grow"><b>${esc(UNI[state.lang === 'en' ? 'en' : 'ar'])}</b></span></div>
      <div style="margin-top:10px"><button class="btn" data-act="saveProfile">${esc(L().saveBtn)}</button></div></div>`;
    h += `<div class="card"><b>${esc(L().accountSec)}</b>`;
    if (!cloudEnabled()) h += `<p class="muted" style="margin:8px 0 0">${esc(L().localMode)}</p>`;
    else if (session) h += `<div class="row" style="margin-top:8px"><span class="grow">${esc(session.email || '')} <span class="sync ${syncState}">${syncState === 'synced' ? '☁️ ' + esc(L().synced) : syncState === 'syncing' ? esc(L().syncing) : syncState === 'error' ? esc(L().syncErr) : ''}</span></span><button class="btn ghost" data-act="logout">${esc(L().logoutBtn)}</button></div>`;
    else h += `<p class="muted" style="margin:8px 0 6px">${esc(L().authSub)}</p><button class="btn" data-act="showAuth">${esc(L().authTitle)}</button>`;
    return h + '</div>';
  }

  /* ---------------- overlays ---------------- */

  function overlays() {
    let h = '';
    if (cloudEnabled() && !session && !authSkipped) {
      h += `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().authTitle)}</b>
        <p class="muted">${esc(L().authSub)}</p>
        <input id="aEmail" type="email" placeholder="${esc(L().emailPh)}" dir="ltr">
        <input id="aPass" type="password" placeholder="${esc(L().passPh)}" dir="ltr">
        <div id="authMsg" class="muted" style="min-height:18px;margin-top:6px"></div>
        <div class="row" style="margin-top:8px"><button class="btn grow" data-act="authLogin">${esc(L().loginBtn)}</button>
        <button class="btn ghost grow" data-act="authSignup">${esc(L().signupBtn)}</button></div>
        <div style="text-align:center;margin-top:10px"><button class="linklike" data-act="authSkip">${esc(L().skipBtn)}</button></div></div></div>`;
      return h;
    }
    if (!state.profile.onboarded) {
      h += `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().welcomeTitle)}</b>
        <p class="muted">${esc(L().welcomeSub)}</p>
        <input id="oName" placeholder="${esc(L().yourNamePh)}" value="${esc(state.profile.name || '')}">
        <div class="muted" style="margin:10px 0 6px">${esc(L().pickYear)}</div>
        <div class="yeargrid">`;
      L().years.forEach((y, i) => { h += `<button class="ypick ${state.profile.year === i + 1 ? 'on' : ''}" data-act="pickYear" data-y="${i + 1}">${esc(y)}</button>`; });
      h += `</div><div class="muted" style="margin-top:10px">${esc(L().uniLbl)}: <b>${esc(UNI[state.lang === 'en' ? 'en' : 'ar'])}</b></div>
        <div style="margin-top:12px"><button class="btn" data-act="onboardStart" style="width:100%">${esc(L().startBtn)}</button></div></div></div>`;
    }
    return h;
  }

  /* ---------------- chrome / render ---------------- */

  function applyChrome() {
    const l = L();
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'ar';
    document.documentElement.dir = l.dir;
    $('appTitle').textContent = l.appTitle;
    $('langBtn').textContent = l.langBtn;
    document.querySelectorAll('#tabs button').forEach((b) => { b.textContent = l.tabs[b.dataset.tab]; });
  }

  function render() {
    applyChrome();
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    $('view').innerHTML = { schedule: viewSchedule, subjects: viewSubjects, time: viewTime, progress: viewProgress, profile: viewProfile }[tab]();
    $('overlays').innerHTML = overlays();
  }

  const shiftCal = (n) => {
    let [y, m] = calCursor.split('-').map(Number);
    m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
    calCursor = y + '-' + String(m).padStart(2, '0');
  };

  function estChipText(sid) {
    const title = ($('tt-' + sid) || {}).value || '';
    const k = taskKind[sid] || 'lecture';
    if (!title.trim()) return '';
    const sel = $('td-' + sid);
    const d = sel && +sel.value ? +sel.value : Scheduler.estimateDifficulty(title);
    if (k === 'clinic') return L().estClinic(L().diff[d - 1], fmtHTxt(Scheduler.CLINIC_H[d - 1]));
    return L().estLec(L().diff[d - 1], fmtHTxt(Scheduler.STUDY_H[d - 1]), L().fmtM(Math.round(Scheduler.SOLVE_H[d - 1] * 60)));
  }

  /* ---------------- events ---------------- */

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.est) { const el = $('est-' + t.dataset.est); if (el) el.textContent = estChipText(t.dataset.est); }
    if (t.id === 'nHasExam') $('nExamBox').classList.toggle('hidden', !t.checked);
  });

  document.addEventListener('change', (e) => {
    const t = e.target, a = t.dataset && t.dataset.act;
    if (t.id === 'nHasExam') { $('nExamBox').classList.toggle('hidden', !t.checked); return; }
    if (!a) return;
    if (a === 'check') { const x = taskOf(t.dataset.s, t.dataset.l); x.done = t.checked; if (!t.checked) x.confidence = 0; }
    else if (a === 'conf') taskOf(t.dataset.s, t.dataset.l).confidence = +t.value;
    else if (a === 'avail') { const v = parseFloat(t.value); state.availability[+t.dataset.i] = v >= 0 ? v : 0; }
    else if (a === 'tdiff') { /* difficulty select re-renders chip */ const el = $('est-' + t.dataset.s); if (el) el.textContent = estChipText(t.dataset.s); return; }
    else return;
    save(); render();
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    const a = t.dataset.act, s = t.dataset.s, l = t.dataset.l;

    if (a === 'lang') { state.lang = state.lang === 'en' ? 'ar' : 'en'; save(); return render(); }
    if (a === 'gen') { selDay = todayStr(); calCursor = selDay.slice(0, 7); render(); return toast(L().madePlan); }
    if (a === 'calPrev') { shiftCal(-1); return render(); }
    if (a === 'calNext') { shiftCal(1); return render(); }
    if (a === 'calToday') { calCursor = todayStr().slice(0, 7); selDay = todayStr(); return render(); }
    if (a === 'calDay') { selDay = t.dataset.d; return render(); }
    if (a === 'addCur') { addFromCur(t.dataset.code); return; }
    if (a === 'loadCur') { loadCur(); return; }
    if (a === 'addTopic') {
      const sj = subj(s);
      if (!sj) return;
      const tp = Curriculum.topicsFor(sj.name, sj.code)[+t.dataset.i];
      if (!tp) return;
      const task = mkTask(state.lang === 'en' ? tp.en : tp.ar, 'lecture', tp.d, 'est');
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'pickYear') {
      const nEl = $('oName') || $('pName');
      if (nEl) state.profile.name = nEl.value.trim(); // re-render wipes the input
      state.profile.year = +t.dataset.y; save(); return render();
    }
    if (a === 'onboardStart') {
      const name = ($('oName') || {}).value || '';
      if (!name.trim() || !state.profile.year) return alert(L().needProfile);
      state.profile.name = name.trim(); state.profile.onboarded = true;
      save(); return render();
    }
    if (a === 'saveProfile') {
      state.profile.name = ($('pName').value || '').trim();
      state.profile.onboarded = true;
      save(); toast(L().savedOk); return render();
    }
    if (a === 'authLogin') return doAuth('in');
    if (a === 'authSignup') return doAuth('up');
    if (a === 'authSkip') { authSkipped = true; return render(); }
    if (a === 'showAuth') { authSkipped = false; return render(); }
    if (a === 'logout') return doLogout();

    if (a === 'addSubject') {
      const name = $('nName').value.trim();
      if (!name) return alert(L().needName);
      const hasExam = $('nHasExam').checked;
      let exam = null;
      if (hasExam) {
        const date = $('nDate').value;
        if (!date) return alert(L().needExam);
        exam = { kind: $('nKind').value, date, time: $('nTime').value || '', nature: $('nNature').value, covered: +$('nCov').value || 0 };
      }
      state.subjects.push({ id: uid(), name, exam, tasks: [] });
      save(); return render();
    }
    if (a === 'toggle') { openSubject = openSubject === s ? null : s; return render(); }
    if (a === 'toggleExam') { openExam = openExam === s ? null : s; return render(); }
    if (a === 'delSubject') { if (!confirm(L().delConfirm)) return; state.subjects = state.subjects.filter((x) => x.id !== s); save(); return render(); }
    if (a === 'saveExam') {
      const p = 'e-' + s + '-';
      const date = $(p + 'Date').value;
      if (!date) return alert(L().needExam);
      subj(s).exam = { kind: $(p + 'Kind').value, date, time: $(p + 'Time').value || '', nature: $(p + 'Nature').value, covered: +$(p + 'Cov').value || 0 };
      save(); return render();
    }
    if (a === 'clearExam') { subj(s).exam = null; save(); return render(); }
    if (a === 'pickKind') { taskKind[s] = t.dataset.k; return render(); }
    if (a === 'addTask') {
      const sj = subj(s), title = $('tt-' + s).value.trim();
      if (!title) return alert(L().needTask);
      const k = taskKind[s] || 'lecture';
      const d = +$('td-' + s).value || 0;
      const task = mkTask(title, k, d || null);
      if (k === 'clinic') task.due = ($('tdue-' + s) || {}).value || null;
      sj.tasks.push(task);
      save(); return render();
    }
    if (a === 'delTask') { const sj = subj(s); sj.tasks = sj.tasks.filter((x) => x.id !== l); save(); return render(); }
    if (a === 'done') { const x = taskOf(s, l); if (x) x.done = true; save(); return render(); }
    if (a === 'addOverride') { const d = $('oDate').value, hv = $('oHours').value; if (!d || hv === '') return; state.overrides[d] = Math.max(0, +hv); save(); return render(); }
    if (a === 'delOverride') { delete state.overrides[t.dataset.d]; save(); return render(); }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && session && Date.now() - lastPull > 30000) loadCloud().then(render);
  });

  window.__planner = { get state() { return state; }, loadCur, render, get session() { return session; } };
  render();
