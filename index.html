    if (!state.profile.onboarded) {
      if (onboardStep === 3) {
        return `<div class="overlay"><div class="sheet wide"><b style="font-size:17px">${esc(L().onboardDaysTitle)}</b>
          <p class="muted">${esc(L().onboardDaysSub)}</p>` + daysEditorHTML() +
          `<div style="margin-top:12px"><button class="btn" data-act="onboardDaysDone" style="width:100%">${esc(L().onboardDaysBtn)}</button></div>
          <div style="text-align:center;margin-top:8px"><button class="linklike" data-act="onboardDaysDone">${esc(L().onboardDaysSkip)}</button></div></div></div>`;
      }
      if (onboardStep === 2) {
        return `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().onboardPaceTitle)}</b>
          <p class="muted">${esc(L().onboardPaceSub)}</p>` + paceChipsHTML() +
          `<div style="margin-top:12px"><button class="btn" data-act="paceDone" style="width:100%">${esc(L().paceBtn)}</button></div>
          <div style="text-align:center;margin-top:8px"><button class="linklike" data-act="paceDone">${esc(L().paceSkip)}</button></div></div></div>`;
      }
      h += `<div class="overlay"><div class="sheet"><b style="font-size:17px">${esc(L().welcomeTitle)}</b>
        <p class="muted">${esc(L().welcomeSub)}</p>
        <input id="oName" placeholder="${esc(L().yourNamePh)}" value="${esc(state.profile.name || '')}">
        <div class="muted" style="margin:10px 0 6px">${esc(L().pickYear)}</div>
        <div class="yeargrid">`;
      L().years.forEach((y, i) => {
        const locked = OPEN_YEARS.indexOf(i + 1) === -1;
        h += `<button class="ypick ${state.profile.year === i + 1 ? 'on' : ''}${locked ? ' locked' : ''}" data-act="pickYear" data-y="${i + 1}"${locked ? ' disabled' : ''}>${locked ? '🔒 ' : ''}${esc(y)}</button>`;
      });
      h += `</div>${OPEN_YEARS.length < L().years.length ? `<div class="muted" style="margin-top:6px">${esc(L().yearLockNote)}</div>` : ''}<div class="muted" style="margin-top:10px">${esc(L().uniLbl)}: <b>${esc(UNI[state.lang === 'en' ? 'en' : 'ar'])}</b></div>
        <div style="margin-top:12px"><button class="btn" data-act="onboardStart" style="width:100%">${esc(L().startBtn)}</button></div></div></div>`;
      return h;
    }
    if (focusRun) {
      const t = taskOf(focusRun.subjectId, focusRun.taskId);
      const sj = subj(focusRun.subjectId);
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>
        <div class="muted" style="margin-top:4px">${sj ? esc(sj.name) + (t ? ' - ' : '') : ''}${t ? esc(t.title) : ''}</div>
        <div class="fphase"><span class="tag" id="focusPhase">${esc(focusRun.phase === 'focus' ? L().focusPhaseFocus : focusRun.phase === 'break' ? L().focusPhaseBreak : L().focusPhaseReady)}</span>
        <span class="muted">${esc(L().focusCycles(focusRun.cycles || 0))}</span></div>
        <div class="ftimer" id="focusTimer" dir="ltr">--:--</div>
        <div class="row" style="margin-top:12px">`;
      if (focusRun.phase === 'ready') h += `<button class="btn grow" data-act="focusNext">${esc(L().focusNext)}</button>`;
      else if (focusRun.paused) h += `<button class="btn grow" data-act="focusResume">${esc(L().focusResume)}</button>`;
      else h += `<button class="btn ghost grow" data-act="focusPause">${esc(L().focusPause)}</button>`;
      h += `<button class="btn danger" data-act="focusStop">${esc(L().focusStop)}</button></div></div></div>`;
    } else if (focusOpen) {
      // v26: only what is on today's plan (in plan order); a task he picked with its own play button stays in the list
      const open = [];
      const seenF = {};
      const addF = (sid, tid) => {
        const sj = subj(sid), t = sj && taskOf(sid, tid);
        if (!t || t.done || seenF[sid + '|' + tid]) return;
        seenF[sid + '|' + tid] = 1;
        open.push({ sj, t, rem: Scheduler.taskRemainingMin(t) });
      };
      planBlocks(todayStr()).slice().sort((a, b) => (pMin(a.start) || 0) - (pMin(b.start) || 0)).forEach((b) => { if (b.taskId) addF(b.subjectId, b.taskId); });
      if (focusSel) addF(focusSel.s, focusSel.l);
      if (open.length && !(focusSel && taskOf(focusSel.s, focusSel.l) && !taskOf(focusSel.s, focusSel.l).done)) focusSel = { s: open[0].sj.id, l: open[0].t.id };
      h += `<div class="overlay"><div class="sheet focus"><b style="font-size:17px">${esc(L().focusTitle)}</b>`;
      if (!open.length) {
        h += `<p class="muted">${esc(PT().focusNoPlan)}</p>
          <div class="row" style="margin-top:12px;gap:8px"><button class="btn grow" data-act="planSuggest" data-d="${todayStr()}">\u2728 ${esc(PT().suggest)}</button>
          <button class="btn ghost grow" data-act="focusAddPlan">${esc(PT().addToDay)}</button></div>
          <div style="margin-top:8px"><button class="btn ghost" data-act="focusClose" style="width:100%">${esc(L().focusCancel)}</button></div>`;
      } else {
        h += `<div class="muted" style="margin:8px 0 6px">${esc(L().focusPickTask)}</div><div class="ftasks">` +
          open.slice(0, 8).map(({ sj, t, rem }) => `<button class="ftask ${focusSel && focusSel.l === t.id ? 'on' : ''}" data-act="pickFTask" data-s="${sj.id}" data-l="${t.id}">
            <span class="sicon" style="background:${colorOfS(sj)}22">${iconOf(sj)}</span>
            <span class="grow"><b>${esc(t.title)}</b><br><span class="muted">${esc(sj.name)} · ${fmtDur(rem)}</span></span></button>`).join('') + '</div>';
        h += `<div class="muted" style="margin:10px 0 6px">${esc(L().focusPickPreset)}</div><div class="pick">` +
          Scheduler.FOCUS_PRESETS.map((pr, i) => `<button class="${focusPreset === i ? 'on' : ''}" data-act="pickFPreset" data-i="${i}">🍅 ${esc(L().presetLabel(pr.focusMin, pr.breakMin))}</button>`).join('') + '</div>';
        h += `<div class="row" style="margin-top:12px"><button class="btn grow" data-act="focusBegin">${esc(L().focusBegin)}</button>
          <button class="btn ghost" data-act="focusClose">${esc(L().focusCancel)}</button></div>`;
      }
      h += '</div></div>';
    }
    return h;
  }

  /* ---------------- chrome / render ---------------- */

  // v37.1: 'light' (default, cheap) or 'full' (slow animated background)
  const FX_KEY = 'senny.fx';
  const fxMode = () => { try { return localStorage.getItem(FX_KEY) === 'full' ? 'full' : 'light'; } catch (e) { return 'light'; } };
  function applyChrome() {
    const l = L();
    document.documentElement.lang = state.lang === 'en' ? 'en' : 'ar';
    document.documentElement.dir = l.dir;
    document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : '';
    document.documentElement.dataset.fx = fxMode(); // v37.1
    $('appTitle').textContent = l.appTitle;
    $('langBtn').textContent = l.langBtn;
    $('themeBtn').textContent = state.theme === 'light' ? '☾' : '☀';
    const TAB_ICON = {
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/></svg>',
      schedule: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      exams: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.2V2.8h6v1.4M9 13l2.3 2.3L15.8 10.8"/></svg>',
      subjects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2C6.7 4.1 9.3 4.1 12 5.7c2.7-1.6 5.3-1.6 8-.5v13c-2.7-1.1-5.3-1.1-8 .5-2.7-1.6-5.3-1.6-8-.5z"/><path d="M12 5.7v13"/></svg>',
      friends: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.2 19.5c.4-3.3 2.8-5.3 5.8-5.3s5.4 2 5.8 5.3"/><circle cx="17.2" cy="9.5" r="2.5"/><path d="M16.5 14.4c2.6-.2 4.5 1.4 4.9 4.3"/></svg>',
    };
    document.querySelectorAll('#tabs button').forEach((b) => { b.innerHTML = (TAB_ICON[b.dataset.tab] || '') + '<span>' + esc(l.tabs[b.dataset.tab]) + '</span>'; });
  }

  function render() {
    if (tourStep == null && state.profile.onboarded && !tourDone && !sharedData && !(cloudEnabled() && !session && !authSkipped)) tourStep = 0; // v21 first-run tour
    if (tourStep != null) tab = TOUR_TABS[tourStep];
    if (focusRun && !taskOf(focusRun.subjectId, focusRun.taskId)) { focusRun = null; persistFocus(); }
    if (!sharedData && state.subjects.length) rolloverPlans(); // v26
    applyChrome();
    const nowD = new Date();
    const hd = state.lang === 'en'
      ? L().days[nowD.getDay()] + ', ' + L().months[nowD.getMonth()] + ' ' + nowD.getDate()
      : L().days[nowD.getDay()] + '\u060c ' + nowD.getDate() + ' ' + L().months[nowD.getMonth()];
    $('todayLbl').innerHTML = `<span>${esc(hd)}</span> \u00b7 <span id="clockLbl" dir="ltr">${esc(clockNow())}</span>`;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    try { const fd = document.querySelector('#tabs button[data-tab="friends"]'); if (fd) fd.classList.toggle('dot', frBadge() > 0); } catch (e) { /* ignore */ }
    const fab = $('fab'); if (fab) fab.style.display = sharedData ? 'none' : ((tab === 'day' || tab === 'subjects') && state.profile.onboarded && state.subjects.length) ? 'flex' : 'none';
    const pb = $('profileBtn'); if (pb) pb.innerHTML = avatarSvg(state.profile.avatar) || '👤'; // v17: the chosen avatar rides in the header
    $('view').innerHTML = sharedData ? sharedView() : { day: viewDay, schedule: viewSchedule, exams: viewExams, subjects: viewSubjects, profile: viewProfile, friends: viewFriends }[tab]() + footerHtml();
    $('overlays').innerHTML = sharedData ? '' : overlays();
    if (focusRun) updateFocusText();
    // v17/v20: refresh the board and the challenge whenever the profile shows and they are stale
    if (tab === 'friends' && fbDb) {
      if (session && !fr.loaded && !fr.loading) frLoad();
      if (fr.on) { frAttach(); frFetchStats(); if (fr.cheers.length) { frClearCheers(); } }
      if (Date.now() - lbFetchedAt > 300000) fetchLbTop(); // v21.1: was 60s; v32: always
      if (chCode() && Date.now() - chFetchedAt > 300000) fetchCh(); // v21.1: was 60s
      if (session && fbDb && Date.now() - chInviteAt > 120000) chLoadInvite(); // v34: a challenge invitation
    }
  }

  // v16: every tab ends with the unofficial-site note; the suggestions button
  // shows only once FEEDBACK_URL is filled in.
  function footerHtml() {
    const link = FEEDBACK_URL ? ` <a class="btn ghost sm" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">${esc(L().footSuggest)}</a>` : '';
    return `<div class="foot"><div class="muted">${esc(L().footNote)}</div>${link}</div>`;
  }

  function estChipText(sid) {
    const title = ($('tt-' + sid) || {}).value || '';
    const k = taskKind[sid] || 'lecture';
    if (!title.trim()) return '';
    const sel = $('td-' + sid);
    const d = sel && +sel.value ? +sel.value : Scheduler.estimateDifficulty(title);
    if (k === 'clinic') return L().estClinic(L().diff[d - 1], fmtHTxt(Scheduler.CLINIC_H[d - 1]));
    return L().estLec(L().diff[d - 1], fmtHTxt(paceStudyH(d)), L().fmtM(Math.round(paceSolveH(d) * 60)));
  }

  /* ---------------- events ---------------- */

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.est) { const el = $('est-' + t.dataset.est); if (el) el.textContent = estChipText(t.dataset.est); }
  });

  document.addEventListener('change', (e) => {
    const t = e.target, a = t.dataset && t.dataset.act;
    const mSl = /^sl(\d)(H|M)$/.exec(t.id || '');
    if (mSl) { commitSleep(+mSl[1]); return; }
    if (a === 'attFile') { const fl = Array.from(t.files || []); t.value = ''; if (fl.length) attAdd(t.dataset.l, t.dataset.s, fl).catch(() => toast(L().attFull)); return; }
    if (!a) return;
    if (a === 'check') { const x = taskOf(t.dataset.s, t.dataset.l); x.done = t.checked; if (t.checked) { x.doneAt = todayStr(); if (!x.ptsAt) x.ptsAt = todayStr(); mascotDoneAt = Date.now(); } else { x.confidence = 0; delete x.doneAt; } }
    else if (a === 'conf') taskOf(t.dataset.s, t.dataset.l).confidence = +t.value;
    else if (a === 'tdiff') { /* difficulty select re-renders chip */ const el = $('est-' + t.dataset.s); if (el) el.textContent = estChipText(t.dataset.s); return; }
    else if (a === 'note') { const tk = taskOf(t.dataset.s, t.dataset.l); if (tk) tk.note = t.value; }
    else if (a === 'cap') { const v = +t.value || 0; state.studyCap = state.studyCap || {}; if (v) state.studyCap[t.dataset.i] = v; else delete state.studyCap[t.dataset.i]; }
    else if (a === 'remTime') { state.remind.time = t.value || '20:00'; state.remind.last = ''; }
    else return;
    save(); render();
  });

  document.addEventListener('click', (e) => {
    const apb = e.target.closest('.apseg button');
    if (apb) {
      apb.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === apb));
      const mAp = /^sl(\d)AP$/.exec(apb.parentElement.id || '');
      if (mAp) commitSleep(+mAp[1]);
      return;
    }
    const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { if (t.dataset.tab === 'subjects') openSubject = null; tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
    const a = t.dataset.act, s = t.dataset.s, l = t.dataset.l;

    if (a === 'lang') { state.lang = state.lang === 'en' ? 'ar' : 'en'; save({ local: true }); return render(); }
    if (a === 'theme') { state.theme = state.theme === 'light' ? 'dark' : 'light'; save({ local: true }); return render(); }
    if (a === 'openProfile') { prevTab = tab === 'profile' ? prevTab : tab; tab = 'profile'; return render(); }
    if (a === 'backFromProfile') { tab = prevTab || 'day'; return render(); }
    if (a === 'focusOpen') { focusOpen = true; return render(); }
    if (a === 'focusTask') { focusSel = { s, l }; focusOpen = true; return render(); }
    if (a === 'focusAddPlan') { focusOpen = false; tab = 'schedule'; schedOff = 0; schedDate = todayStr(); window.scrollTo(0, 0); return render(); }
    if (a === 'focusClose') { focusOpen = false; return render(); }
    if (a === 'pickFTask') { focusSel = { s, l }; return render(); }
    if (a === 'pickFPreset') { focusPreset = +t.dataset.i || 0; return render(); }
    if (a === 'focusBegin') {
      if (!focusSel || !taskOf(focusSel.s, focusSel.l)) return render();
      focusRun = { subjectId: focusSel.s, taskId: focusSel.l, preset: focusPreset, phase: 'focus', endsAt: Date.now() + Scheduler.FOCUS_PRESETS[focusPreset].focusMin * 60000, remainMs: 0, paused: false, cycles: 0, activeMs: 0 };
      focusOpen = false; persistFocus(); beep(); return render();
    }
    if (a === 'focusNext') {
      if (!focusRun) return render();
      focusRun.phase = 'focus'; focusRun.endsAt = Date.now() + focusMinOf(focusRun) * 60000; focusRun.paused = false; focusRun.activeMs = 0;
      persistFocus(); return render();
    }
    if (a === 'focusPause') { if (focusRun && !focusRun.paused) { focusRun.remainMs = Math.max(0, focusRun.endsAt - Date.now()); focusRun.paused = true; persistFocus(); } return render(); }
    if (a === 'focusResume') { if (focusRun && focusRun.paused) { focusRun.endsAt = Date.now() + focusRun.remainMs; focusRun.paused = false; persistFocus(); } return render(); }
    if (a === 'focusStop') {
      if (focusRun && focusRun.phase === 'focus') {
        const remain = focusRun.paused ? focusRun.remainMs : Math.max(0, focusRun.endsAt - Date.now());
        const elapsed = Math.floor((focusMinOf(focusRun) * 60000 - remain) / 60000);
        if (elapsed >= 1) logFocus(focusRun.subjectId, focusRun.taskId, elapsed, focusActiveMin(focusRun));
      }
      focusRun = null; focusOpen = false; persistFocus(); return render();
    }
    if (a === 'addCur') { addFromCur(t.dataset.code); return; }
    if (a === 'loadCur') { loadCur(); return; }
    if (a === 'mascotFreq') { setMascotFreq(+t.dataset.m); return render(); }
    if (a === 'mascotTry') { mascotShow(true); return; }
    if (a === 'toggleDay') { timeDay = timeDay === +t.dataset.i ? null : +t.dataset.i; return render(); }
    if (a === 'addBlock') {
      const i = +t.dataset.i;
      const kind = $('bk').value, label = $('bl').value.trim();
      const s = tpRead('bs'), e = tpRead('be');
      if (s == null || e == null || s === e) return alert(L().errTime);
      const sm = Scheduler.hmToMin(s), em = Scheduler.hmToMin(e);
      // stage the block: it only counts after "Save day"
      const clashList = Scheduler.blocksForWd(state, i).concat(draftBusy[i] || []);
      if (Scheduler.blockClashes(clashList, sm, em)) return alert(L().errOverlap);
      (draftBusy[i] = draftBusy[i] || []).push({ id: uid(), label, kind, start: s, end: e });
      return render();
    }
    if (a === 'collApply') {
      const s0 = tpRead('cs'), e0 = tpRead('ce');
      if (s0 == null || e0 == null || s0 === e0) return alert(L().errTime);
      const sm = Scheduler.hmToMin(s0), em = Scheduler.hmToMin(e0);
      let n = 0, any = false;
      for (let k = 0; k < 7; k++) {
